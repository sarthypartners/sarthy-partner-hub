n    <rect x=\"855\" y=\"135\" width=\"115\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"912\" y=\"156\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Feeds Section B below -</text>\n    <text x=\"912\" y=\"168\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">the Referring Partner Lifecycle</text>\n\n    <text x=\"15\" y=\"242\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Receiving</text>\n    <text x=\"15\" y=\"255\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Partner</text>\n    <rect x=\"155\" y=\"215\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"222\" y=\"234\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Chosen but not told (A), not</text>\n    <text x=\"222\" y=\"246\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">yet known (B), or is the one</text>\n    <text x=\"222\" y=\"258\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">who proposes directly (C)</text>\n    <rect x=\"295\" y=\"215\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"362\" y=\"236\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Notified immediately; admin</text>\n    <text x=\"362\" y=\"248\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">validates before reaching out</text>\n    <rect x=\"435\" y=\"215\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"502\" y=\"234\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Gives or refuses consent</text>\n    <text x=\"502\" y=\"246\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">when admin reaches out &#8212;</text>\n    <text x=\"502\" y=\"258\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">no deadline either way</text>\n    <rect x=\"575\" y=\"215\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"642\" y=\"230\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Does the actual work; must</text>\n    <text x=\"642\" y=\"241\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">supply proof (agreement +</text>\n    <text x=\"642\" y=\"252\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">first payment) to confirm it</text>\n    <rect x=\"715\" y=\"215\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"782\" y=\"230\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Reports deal value; owns</text>\n    <text x=\"782\" y=\"241\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">the client outright once the</text>\n    <text x=\"782\" y=\"252\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">1-year window closes</text>\n    <rect x=\"855\" y=\"215\" width=\"115\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"912\" y=\"236\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Feeds Section C below -</text>\n    <text x=\"912\" y=\"248\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">the Receiving Partner Lifecycle</text>\n\n    <rect x=\"10\" y=\"292\" width=\"14\" height=\"14\" rx=\"3\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"30\" y=\"303\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Confirmed gap &#8212; checked directly against the Communication Template Library / Data Dictionary</text>\n    <rect x=\"10\" y=\"311\" width=\"14\" height=\"14\" rx=\"3\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"30\" y=\"322\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Open question, not a confirmed gap</text>\n    <rect x=\"500\" y=\"292\" width=\"14\" height=\"14\" rx=\"3\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"520\" y=\"303\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Already well covered</text>\n  </g>\n</svg>\n\n<h2>What this reveals</h2>\n<p>Looking at any one lane alone, the design holds together. Lining up all three at once surfaces three findings worth confirming with Sarthy before designing engagement fixes:</p>\n\n<div class=\"example-box\">\n<strong>Finding 1 (narrower since the connection-flow rewrite) - a consent decision, once made, still isn't communicated to the referring partner.</strong>\n<p style=\"margin:8px 0 0;\">This finding has changed since Partnership SOP v1.0 Section 7 and the Lead state machine were rewritten around the confirmed <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a>. The failure mode this finding originally centered on - a lead quietly timing out with no message to anyone - no longer exists: there's no more auto-expiry of any kind, and every request now becomes visible to all relevant parties immediately, as a faded, FYI-only \"Introduced\" entry (see that document for why the visibility is deliberately inactive rather than full notice). What's left, checked directly against the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>'s message triggers, is smaller but still real: once admin's consent conversation concludes - whether the receiving partner (or, in directions A and C, the startup) gives or refuses consent - only template 3 exists, and it's addressed to the receiving partner only. Nobody currently tells the referring partner which way it went, or that it resolved at all, beyond the faded FYI entry they could already see for themselves. (The existing internal Associate nudge, template 4, remains wired to a separate, later stall point - a lead that's been Acknowledged and then goes quiet during the actual work - and is unaffected by any of this.)</p>\n</div>\n\n<div class=\"example-box\">\n<strong>Finding 2 - there's no message for the moment a referral actually pays off.</strong>\n<p style=\"margin:8px 0 0;\">The Communication Template Library has a reminder before the acknowledgment window closes (template 2) and an annual referral-fee payout notice many months later (template 10). Nothing sits between them. The moment a referring partner's lead actually converts and 909 credits land in their wallet - arguably the single most motivating event in the whole credit system - currently has no defined message of its own.</p>\n</div>\n\n<div class=\"example-box\">\n<strong>Finding 3 - the startup's own repeat engagement isn't tracked anywhere.</strong>\n<p style=\"margin:8px 0 0;\">The <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> tracks a partner's activity in detail - <code>giving_pattern</code>, <code>last_lead_shared_date</code>, dormancy status. Nothing equivalent exists for a startup. If a startup that came through once needs a different kind of service later, whether it comes back through the same referring partner, self-serves again through Path B, or just leaves the ecosystem entirely isn't something any document currently answers or measures. Section D below is a first, deliberately unconfirmed attempt at naming what that would even look like.</p>\n</div>\n\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">These are observations from lining up existing, already-confirmed rules against each other - not new rules, and not confirmed defects. Worth raising with Sarthy directly rather than assumed either way.</p>\n\n<h2>Stage by stage, in full</h2>\n<table class=\"dtable\">\n<tr><th>Stage</th><th>Startup</th><th>Referring partner</th><th>Receiving partner</th><th>Friction / open question</th></tr>\n<tr>\n<td>1. Origination</td>\n<td>Brought in by a referring partner (direction A), browses and self-selects a partner itself (direction B), or is approached directly by a receiving partner (direction C)</td>\n<td>In direction A, chooses a specific receiving partner directly. In direction B, brings the startup in without choosing one. Not involved in direction C</td>\n<td>In direction A, already chosen but not yet notified. In direction B, not yet known - depends on the startup's own choice next. In direction C, is the one who initiates, by proposing directly to the startup</td>\n<td>None identified - all three directions are clearly defined in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a></td>\n</tr>\n<tr>\n<td>2. Submitted &amp; Introduced</td>\n<td>Sees the request the moment it's Introduced, as a faded, FYI-only entry - visible, but nothing to act on yet. No visibility into admin's validation step behind it, and no clock or deadline exists to watch</td>\n<td>Can still cancel any time before Acknowledged; after that, sees the same faded FYI entry everyone else does, with no further defined update</td>\n<td>Sees the same faded, FYI-only Introduced entry immediately; admin validates in the background, then reaches out directly - no clock, no deadline</td>\n<td>No clocks exist anymore to have visibility into. The gap now is narrower: none of the three parties gets a message confirming when validation finished or when admin reached out (see Finding 1)</td>\n</tr>\n<tr>\n<td>3. Validate &amp; Acknowledge</td>\n<td>In directions A and C, is asked directly for its own consent by admin - a real, required approval, not just notice. Has no way to tell from the outside when that conversation happens, only that it eventually resolves to Acknowledged or Rejected</td>\n<td>Gets nothing either way once admin's consent conversation concludes - not on approval, not on refusal (see Finding 1, now narrower)</td>\n<td>Gives or refuses consent when admin reaches out - no self-service, no deadline. Consent given moves the lead to Acknowledged (999 deducted); consent refused moves it to Rejected (nothing deducted). Nothing here times out on its own</td>\n<td>Finding 1 (narrower than before) - the referring partner still gets no message on the outcome. The old silent-timeout failure mode this finding also described no longer exists, since nothing auto-finalizes anymore</td>\n</tr>\n<tr>\n<td>4. In Progress &amp; Converted</td>\n<td>Working directly with the receiving partner; Sarthy is largely out of the picture except for the eventual conversion confirmation</td>\n<td>No update during the work itself, and no message exists for the moment conversion is confirmed and 909 credits land (see Finding 2)</td>\n<td>Does the actual work; must supply proof - a signed agreement plus first payment - before Sarthy will confirm the conversion</td>\n<td>Finding 2 - the single most motivating moment in the credit system has no message of its own</td>\n</tr>\n<tr>\n<td>5. Deal Closure &amp; Referral Fee</td>\n<td>Now a client of the receiving partner; not tracked by Sarthy directly at this stage, beyond the deal record itself</td>\n<td>10% of first-year invoiced value accrues, minus Sarthy's 9% cut; paid out once annually - the one moment in this whole map that already has a defined, working notice (template 10)</td>\n<td>Reports deal value and duration; owns the client relationship outright once the 1-year referral-fee window closes, with no further obligation back to the referrer</td>\n<td>None identified - this stage is well covered</td>\n</tr>\n<tr>\n<td>6. Repeat or Dormancy</td>\n<td>If a future need comes up, whether it comes back through this same referring partner, self-serves again, or leaves the ecosystem for good isn't tracked or measured anywhere (see Finding 3, and the proposed Section D below)</td>\n<td>Feeds directly into this document's Referring Partner Lifecycle section (Active Participation, Risk Zone, and Dormancy stages), below</td>\n<td>Same as the referring partner - governed by their own status and <code>giving_pattern</code> in the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a></td>\n<td>Finding 3 - no equivalent of the partner-side activity tracking exists for the startup</td>\n</tr>\n</table>\n\n<h2>Built from</h2>\n<p>This map doesn't introduce any new rule. Every stage traces back to something already confirmed elsewhere: the Lead state machine in the <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a>, the 3-direction connection flow and admin-mediated consent process in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a> (described in more detail in the confirmed <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a>), the entity relationships in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>, and the message inventory in the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>. The three findings above come only from placing those existing facts side by side - Finding 1 has been narrowed to match the confirmed rewrite; Findings 2 and 3 are unaffected by it.</p>\n\n<h2>What comes next</h2>\n<p>This section is diagnostic, not prescriptive - it maps where engagement currently breaks down, without yet proposing what should replace the gaps. Designing the actual fixes (new message templates, a startup-facing retention signal, or something else) is deliberately a separate, later step, once these three findings are confirmed rather than assumed.</p>\n\n<h2>B. Referring Partner Lifecycle</h2>\n<div class=\"pending-box\" style=\"text-align:left;\">\nSections B and C describe the same underlying partner account lifecycle - the same eight stages, the same mechanics (account status, wallet trend, dormancy rules). They're split into two sections because a partner's day-to-day experience genuinely differs in a few concrete places - most clearly, whether \"first activity\" means submitting a lead or receiving one. Everywhere else, the two sections say the same thing in the same words on purpose, not by oversight. This is the full detail behind <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> #14.\n</div>\n\n<svg viewBox=\"0 0 780 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:700px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowJM-refer\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"10\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"95\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">1. Awareness</text>\n    <text x=\"95\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">no single channel</text>\n\n    <line x1=\"180\" y1=\"39\" x2=\"205\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"210\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"295\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">2. Evaluation</text>\n    <text x=\"295\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">informal judgment call</text>\n\n    <line x1=\"380\" y1=\"39\" x2=\"405\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"410\" y=\"15\" width=\"180\" height=\"48\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"500\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">3. Agreement &amp; Payment</text>\n    <text x=\"500\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">well-defined, no issue</text>\n\n    <line x1=\"590\" y1=\"39\" x2=\"615\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"600\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"685\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">4. First Lead Sent</text>\n    <text x=\"685\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">the biggest gap today</text>\n\n    <line x1=\"685\" y1=\"63\" x2=\"685\" y2=\"95\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"600\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"685\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">5. Active Participation</text>\n    <text x=\"685\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">infrequent, not sustained</text>\n\n    <line x1=\"600\" y1=\"121\" x2=\"575\" y2=\"121\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"400\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"485\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">6. Steady State</text>\n    <text x=\"485\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">tends toward Giver</text>\n\n    <line x1=\"400\" y1=\"121\" x2=\"375\" y2=\"121\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"200\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"285\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">7. Risk Zone</text>\n    <text x=\"285\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">At-Risk outreach must catch this</text>\n\n    <line x1=\"245\" y1=\"145\" x2=\"150\" y2=\"180\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n    <line x1=\"325\" y1=\"145\" x2=\"420\" y2=\"180\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-refer)\"/>\n\n    <rect x=\"55\" y=\"182\" width=\"190\" height=\"50\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"150\" y=\"203\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">8a. Reactivation</text>\n    <text x=\"150\" y=\"218\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">no process exists yet</text>\n\n    <rect x=\"425\" y=\"182\" width=\"210\" height=\"50\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"530\" y=\"203\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">8b. Formal Dormancy</text>\n    <text x=\"530\" y=\"218\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">whether it's communicated clearly is untested</text>\n\n    <text x=\"150\" y=\"248\" text-anchor=\"middle\" fill=\"var(--green)\" font-size=\"10.5\">&#8634; re-engages &#8594; back to Stage 5</text>\n\n    <text x=\"10\" y=\"280\" fill=\"var(--ink-faint)\" font-size=\"10\">Red = the clearest, highest-friction gaps today. Amber = a real open question or a point that needs active management. Green = already working, no issue found.</text>\n  </g>\n</svg>\n\n<table class=\"dtable\">\n<tr><th>Stage</th><th>What happens</th><th>Where friction likely shows up</th></tr>\n<tr><td>1. Awareness</td><td>Partner hears about the program via LinkedIn, a mailer, the WhatsApp community, or a direct approach</td><td>No consistent inbound channel - depends entirely on who's reaching out that week</td></tr>\n<tr><td>2. Evaluation</td><td>Sarthy reviews the company profile, holds a discovery call, reads fit against service relevance, client diversity, professional standing, and a first Giver/Taker impression</td><td>Informal, conversation-based judgment - no written checklist yet</td></tr>\n<tr><td>3. Agreement & Payment</td><td>Referral agreement signed digitally, programme fee paid (\u20b9999+GST or $49), 999 opening credits granted</td><td>None currently identified - this step is well-defined</td></tr>\n<tr><td>4. First Lead Sent</td><td>Partner submits their first lead to another partner - this is the make-or-break moment for habit formation as a referrer</td><td>The single biggest gap today for referring activity - most partners never submit a first lead in practice (\"Part of Platform\" is empty for most)</td></tr>\n<tr><td>5. Active Participation</td><td>Regularly submitting leads to other partners, wallet moving outward, Sarthy team checking in per SOP #15</td><td>Even the few partners who do submit show infrequent activity, not sustained habit</td></tr>\n<tr><td>6. Steady State</td><td>Partner settles into a Giver, Balanced, or Taker pattern (see Segmentation Framework) - a partner mostly in the referring role tends toward Giver, though the role played on one deal and the giving_pattern trend read across many deals aren't the same thing</td><td>No current data on how long this takes or what triggers the split</td></tr>\n<tr><td>7. Risk Zone</td><td>Wallet trending negative, declines mounting, or activity slowing toward the 3-month dormancy line</td><td>This is exactly where At-Risk-status outreach (Segmentation Framework) needs to intervene, before Stage 8</td></tr>\n<tr><td>8a. Reactivation</td><td>A partner who went quiet re-engages, usually after direct outreach</td><td>No process exists yet - this is SOP #17's remaining open piece</td></tr>\n<tr><td>8b. Formal Dormancy</td><td>3 months with no shared lead - removed from public listing, blocked from receiving new leads (SOP #21)</td><td>Whether this actually gets communicated clearly to the partner, or just happens silently, is untested</td></tr>\n</table>\n\n<h2>C. Receiving Partner Lifecycle</h2>\n<p style=\"font-size:12.5px;color:var(--ink-faint);margin:-0.5rem 0 1.25rem;\">Same underlying lifecycle as Section B, from the other side - see the callout at the top of Section B for why both are kept as separate sections.</p>\n\n<svg viewBox=\"0 0 780 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:700px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowJM-receive\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"10\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"95\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">1. Awareness</text>\n    <text x=\"95\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">no single channel</text>\n\n    <line x1=\"180\" y1=\"39\" x2=\"205\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"210\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"295\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">2. Evaluation</text>\n    <text x=\"295\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">informal judgment call</text>\n\n    <line x1=\"380\" y1=\"39\" x2=\"405\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"410\" y=\"15\" width=\"180\" height=\"48\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"500\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">3. Agreement &amp; Payment</text>\n    <text x=\"500\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">well-defined, no issue</text>\n\n    <line x1=\"590\" y1=\"39\" x2=\"615\" y2=\"39\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"600\" y=\"15\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"685\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">4. First Lead Received</text>\n    <text x=\"685\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">the biggest gap today</text>\n\n    <line x1=\"685\" y1=\"63\" x2=\"685\" y2=\"95\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"600\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"685\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">5. Active Participation</text>\n    <text x=\"685\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">infrequent, not sustained</text>\n\n    <line x1=\"600\" y1=\"121\" x2=\"575\" y2=\"121\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"400\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"485\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">6. Steady State</text>\n    <text x=\"485\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">tends toward Taker</text>\n\n    <line x1=\"400\" y1=\"121\" x2=\"375\" y2=\"121\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"200\" y=\"97\" width=\"170\" height=\"48\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"285\" y=\"117\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">7. Risk Zone</text>\n    <text x=\"285\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">At-Risk outreach must catch this</text>\n\n    <line x1=\"245\" y1=\"145\" x2=\"150\" y2=\"180\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n    <line x1=\"325\" y1=\"145\" x2=\"420\" y2=\"180\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowJM-receive)\"/>\n\n    <rect x=\"55\" y=\"182\" width=\"190\" height=\"50\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"150\" y=\"203\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">8a. Reactivation</text>\n    <text x=\"150\" y=\"218\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">no process exists yet</text>\n\n    <rect x=\"425\" y=\"182\" width=\"210\" height=\"50\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"530\" y=\"203\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">8b. Formal Dormancy</text>\n    <text x=\"530\" y=\"218\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">whether it's communicated clearly is untested</text>\n\n    <text x=\"150\" y=\"248\" text-anchor=\"middle\" fill=\"var(--green)\" font-size=\"10.5\">&#8634; re-engages &#8594; back to Stage 5</text>\n\n    <text x=\"10\" y=\"280\" fill=\"var(--ink-faint)\" font-size=\"10\">Red = the clearest, highest-friction gaps today. Amber = a real open question or a point that needs active management. Green = already working, no issue found.</text>\n  </g>\n</svg>\n\n<table class=\"dtable\">\n<tr><th>Stage</th><th>What happens</th><th>Where friction likely shows up</th></tr>\n<tr><td>1. Awareness</td><td>Partner hears about the program via LinkedIn, a mailer, the WhatsApp community, or a direct approach</td><td>No consistent inbound channel - depends entirely on who's reaching out that week</td></tr>\n<tr><td>2. Evaluation</td><td>Sarthy reviews the company profile, holds a discovery call, reads fit against service relevance, client diversity, professional standing, and a first Giver/Taker impression</td><td>Informal, conversation-based judgment - no written checklist yet</td></tr>\n<tr><td>3. Agreement & Payment</td><td>Referral agreement signed digitally, programme fee paid (\u20b9999+GST or $49), 999 opening credits granted</td><td>None currently identified - this step is well-defined</td></tr>\n<tr><td>4. First Lead Received</td><td>Partner receives their first lead from another partner - this is the make-or-break moment for habit formation as a receiver</td><td>The single biggest gap today for receiving activity - most partners never receive and work a first lead in practice (\"Part of Platform\" is empty for most)</td></tr>\n<tr><td>5. Active Participation</td><td>Regularly receiving and working leads from other partners, wallet moving inward, Sarthy team checking in per SOP #15</td><td>Even the few partners who do receive show infrequent activity, not sustained habit</td></tr>\n<tr><td>6. Steady State</td><td>Partner settles into a Giver, Balanced, or Taker pattern (see Segmentation Framework) - a partner mostly in the receiving role tends toward Taker, though the role played on one deal and the giving_pattern trend read across many deals aren't the same thing</td><td>No current data on how long this takes or what triggers the split</td></tr>\n<tr><td>7. Risk Zone</td><td>Wallet trending negative, declines mounting, or activity slowing toward the 3-month dormancy line</td><td>This is exactly where At-Risk-status outreach (Segmentation Framework) needs to intervene, before Stage 8</td></tr>\n<tr><td>8a. Reactivation</td><td>A partner who went quiet re-engages, usually after direct outreach</td><td>No process exists yet - this is SOP #17's remaining open piece</td></tr>\n<tr><td>8b. Formal Dormancy</td><td>3 months with no shared lead - removed from public listing, blocked from receiving new leads (SOP #21)</td><td>Whether this actually gets communicated clearly to the partner, or just happens silently, is untested</td></tr>\n</table>\n\n<h2>What the interview guide should validate</h2>\n<p>Sections B and C are built from documented rules, not direct partner testimony. The <a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">Alpha Partner Interview Guide</a> exists specifically to check whether Stage 4 and 5 actually feel this way to a real partner, or whether the friction sits somewhere these sections haven't captured yet.</p>\n\n<h2>D. Startup Lifecycle <span class=\"status-pill badge-pending\">Proposed - not yet validated</span></h2>\n<div class=\"pending-box\" style=\"text-align:left;\">\n<strong>This section is new content, not migrated from any existing hub document.</strong> Nothing in the hub today defines a startup's own lifecycle across time, separate from any single referral - Section A only follows one startup through one referral. The four stages below are reasoned by analogy to Section A and to the Referring/Receiving Partner Lifecycles, directly answering Finding 3 (\"the startup's own repeat engagement isn't tracked anywhere\") - they are not sourced from a confirmed Sarthy rule, and shouldn't be treated as fact until checked against real startup behaviour or confirmed with Sarthy.\n</div>\n\n<table class=\"dtable\">\n<tr><th>Stage</th><th>What happens</th><th>Status</th></tr>\n<tr><td>1. First Contact</td><td>The startup is introduced into the ecosystem for the first time, through any of the 3 directions described in Section A</td><td>Matches Section A, Stage 1 - well defined</td></tr>\n<tr><td>2. Engaged</td><td>Actively working with a receiving partner on this specific need</td><td>Matches Section A, Stages 3-4 - well defined</td></tr>\n<tr><td>3. Converted</td><td>The deal closes; the startup becomes the receiving partner's own client</td><td>Matches Section A, Stage 5 - well defined</td></tr>\n<tr><td>4. Open Question - what happens next</td><td>Does the startup return through the same referring partner for a future need? Self-serve again through Path B? Get referred elsewhere? Leave the ecosystem entirely? No hub document currently answers or measures any of this</td><td><span class=\"status-pill badge-pending\">Untracked - see Finding 3</span></td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">If this gets developed further, Finding 3 in Section A is the natural anchor - once there's a real answer to Stage 4, this section should stop being \"proposed\" and start citing whatever mechanism actually answers it.</p>\n"}, {"id": "comms-library", "content_file": "comms-library.html", "cat": "Process Documents", "status": "draft", "version": "1.5", "updated": "Rewrote Templates 2 and 3 to remove the retired 7-day acknowledgment window - Template 2 is now a no-fixed-deadline consent follow-up, Template 3 is a consent-refusal confirmation.", "type": "Internal", "title": "Communication Template Library", "desc": "Ready-made messages for WhatsApp, email, and phone calls", "html": "<p class=\"callout\">Ready-to-use messages, each tied to a specific trigger already defined in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a>. Keep them short and warm - these are meant to sound like a person checking in, not a system notification.</p>\n\n<h2>1. Welcome message (on wallet activation)</h2>\n<p><em>Trigger: SOP #5, immediately after fee payment and credit grant</em></p>\n<blockquote>\"Welcome to the Sarthy partner network! Your account's live and you've got 999 credits to start. The easiest way to get value fast: send us your first lead, or let us know what kind of leads you're hoping to receive. We'll check in soon to help you get going.\"</blockquote>\n\n<h2>2. Consent follow-up (no fixed window)</h2>\n<p><em>Trigger: SOP #7, at admin's discretion, when a consent conversation has been pending a while with no response. There's no fixed deadline behind this anymore - the old 7-day acknowledgment window and its day-5 reminder were retired when the connection flow moved to admin-mediated consent (see the confirmed <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a>). This message exists precisely because \"no deadline\" still needs a way to avoid quietly sitting forever - see the open operational-backlog risk noted there.</em></p>\n<blockquote>\"Quick nudge - we reached out a few days ago about a lead and haven't heard back. Let us know if you're able to hop on a short call, even if the answer ends up being a pass.\"</blockquote>\n\n<h2>3. Consent refusal confirmation</h2>\n<p><em>Trigger: SOP #7, when the receiving partner refuses consent during admin's outreach - whenever that happens, since there's no window to refuse \"within\" anymore</em></p>\n<blockquote>\"No problem - we've noted that this one wasn't a fit. No credit deduction on your end. We'll keep sending relevant leads your way.\"</blockquote>\n\n<h2>4. Stall check-in (admin-facing, internal)</h2>\n<p><em>Trigger: SOP #7, when a lead crosses the 1-week acknowledged-but-no-update line</em></p>\n<blockquote>Internal note template for the Associate: \"Lead [ID] acknowledged by [Partner] on [date], no update since. Reach out directly to confirm status before flagging as disputed.\"</blockquote>\n\n<h2>5. Dormancy warning (approaching 3 months)</h2>\n<p><em>Trigger: SOP #21, roughly 2 weeks before the dormancy line</em></p>\n<blockquote>\"We noticed it's been a while since your last referral - just checking in before anything changes on your account. Is there anything blocking you from sending a lead, or can we help you find one worth referring?\"</blockquote>\n\n<h2>6. Dormant status notification</h2>\n<p><em>Trigger: SOP #21, on crossing 3 months inactive</em></p>\n<blockquote>\"Your account's moved to inactive status after 3 months without a referral, so you're currently off the public partner listing and won't receive new leads. This isn't permanent - reach out any time and we'll get you reactivated.\"</blockquote>\n\n<h2>7. Reactivation outreach</h2>\n<p><em>Trigger: dormant-partner win-back campaign, SOP #17</em></p>\n<blockquote>\"It's been a bit since we've connected - wanted to check in and see how things are going on your end. A lot has changed in the partner program since you were last active, including [specific update]. Worth a quick call to catch up?\"</blockquote>\n\n<h2>8. Monthly engagement check-in</h2>\n<p><em>Trigger: SOP #15, ongoing cadence</em></p>\n<blockquote>\"Monthly check-in - how's the partner program working for you lately? Any leads you're sitting on that we could help move, or types of leads you'd like to see more of?\"</blockquote>\n\n<h2>9. Dispute acknowledgment</h2>\n<p><em>Trigger: SOP #9, within 24 hours of a dispute being raised</em></p>\n<blockquote>\"We've received your dispute on [lead/conversion ID] and are looking into it now - you'll hear back from us within 24 hours with next steps.\"</blockquote>\n\n<h2>10. Annual referral fee payout notice</h2>\n<p><em>Trigger: SOP #20, March 31st settlement</em></p>\n<blockquote>\"Your annual referral fee payout for [year] is ready - [amount] based on deals closed through your referrals this year. Details and payout timing below.\"</blockquote>\n\n<h2>11. Existing partner transition notice</h2>\n<p><em>Trigger: a partner who signed under the original flat 10% referral model, before this new dual-track system existed. Not a new-partner onboarding message - a genuine explanation of what's changed for them.</em></p>\n<blockquote>\"Since you joined, we've redesigned how the partner program works - you can now earn credits by referring leads directly to other partners too, not just from Sarthy. Nothing about your existing arrangement is changing without your agreement first - we'll walk you through exactly what's new and get your sign-off before anything about your account changes.\"</blockquote>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">Note: this message assumes existing partners need a new or amended agreement before moving to the new model. See the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a>'s legal review item - don't send this at scale until that's confirmed.</p>\n"}, {"id": "graduation-criteria", "content_file": "graduation-criteria.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.8", "updated": "Restored the Feeds Into section pointing to Migration Wave Plan - un-decommissioned.", "type": "Internal", "title": "Alpha to Beta Graduation Criteria", "desc": "The targets we need to hit before opening the app to more partners", "html": "<p class=\"callout\">The targets to hit before opening the platform beyond the current small Alpha group. Anchored to the one real target Sarthy has already set (SOP #18). A few supporting criteria make sure \"10 active partners\" means genuinely active - not just signed up.</p>\n\n<h2>Sarthy's confirmed target</h2>\n<p><strong>At least 10 active partners within 2 weeks of the app being fully live</strong> - not the current early-testing state.</p>\n\n<h2>Supporting criteria - proposed, to make \"active\" mean something real</h2>\n<ul>\n<li>Each of the 10 must have completed at least one full lead cycle - they submitted or received a lead that reached acknowledgment, not just logged in once.</li>\n<li>No partner among the 10 should be sitting at the -2,997 freeze threshold. A technically \"active\" account that's actually stuck doesn't count.</li>\n<li>At least one dispute or edge case - a decline, a stall, a rejection - should have been handled through the real process, not just simulated. This proves the guardrails actually work under real conditions.</li>\n<li>The duplicate-lead detection and admin-mediated consent mechanics (BRD #5) should be confirmed working, not just specified.</li>\n</ul>\n<p><strong>Note on \"full lead cycle\":</strong> here it specifically means reaching acknowledgment - a deliberately lighter bar than the conversion-based cycle described in the SOP (Sections 6, 7, 9). The point at this stage is proving the mechanics work end to end quickly, not requiring an actual paid deal. Real conversions are what the KPI reporting in SOP Section 19 tracks over the longer term.</p>\n\n<h2>What happens if the 2-week window is missed</h2>\n<p>Not currently defined by Sarthy - worth raising directly rather than assuming. Does the target simply extend? Or does it trigger a review of what's not working in onboarding?</p>\n\n<h2>Feeds into</h2>\n<p>The <a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Migration Wave Plan</a> - though migration itself is now a deferred, post-build activity, not something being actively sequenced right now. Wave 2 shouldn't begin until these criteria are genuinely met, but that document's own Wave 2 section currently gates on a different set of conditions (legal review, fee-split math) rather than referencing these criteria directly - a real disconnect, left unreconciled on purpose until migration planning actually resumes.</p>\n"}, {"id": "data-dictionary", "content_file": "data-dictionary.html", "cat": "Technical Documents", "status": "draft", "version": "2.9", "updated": "Lead table extended: request_direction, visibility_state, per-party consent fields; lead_status enum drops Unresolved.", "type": "Internal", "title": "Data Dictionary / SSOT Schema", "desc": "One clear definition for every piece of partner data we track", "html": "<p class=\"callout\">One shared definition for every piece of partner data this program touches - so \"status,\" \"balance,\" or \"active\" means exactly the same thing whether it's in a conversation, a spreadsheet, or eventually the app itself. Every field traces back to a specific <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> section.</p>\n\n<svg viewBox=\"0 0 760 285\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowED\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"280\" y=\"10\" width=\"200\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"380\" y=\"38\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Partner</text>\n\n    <line x1=\"380\" y1=\"56\" x2=\"380\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n    <text x=\"470\" y=\"82\" fill=\"var(--ink-faint)\" font-size=\"9.5\">1 wallet per partner</text>\n\n    <rect x=\"280\" y=\"100\" width=\"200\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"380\" y=\"128\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Credit Wallet</text>\n\n    <line x1=\"480\" y1=\"33\" x2=\"500\" y2=\"33\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"33\" x2=\"500\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"127\" x2=\"530\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <rect x=\"535\" y=\"100\" width=\"210\" height=\"54\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"640\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Lead</text>\n\n    <line x1=\"640\" y1=\"154\" x2=\"640\" y2=\"195\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n    <text x=\"655\" y=\"178\" fill=\"var(--ink-faint)\" font-size=\"9.5\">1:1, once Converted</text>\n\n    <rect x=\"535\" y=\"197\" width=\"210\" height=\"50\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"640\" y=\"227\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Deal</text>\n\n    <line x1=\"535\" y1=\"220\" x2=\"490\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <line x1=\"535\" y1=\"127\" x2=\"505\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"505\" y1=\"127\" x2=\"505\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"505\" y1=\"220\" x2=\"490\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <rect x=\"280\" y=\"197\" width=\"200\" height=\"50\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"380\" y=\"227\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Dispute</text>\n\n    <text x=\"380\" y=\"262\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">A partner can appear on a Lead up to 3 ways &#8212; as the referring, originating, and/or receiving partner.</text>\n    <text x=\"380\" y=\"277\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">Every dispute links to a lead_id or a deal_id &#8212; never something invented outside these five tables.</text>\n  </g>\n</svg>\n\n<h2>Partner</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>partner_id</td><td>Text</td><td>Unique identifier, assigned at onboarding</td><td>SOP #5</td></tr>\n<tr><td>programme</td><td>India / International</td><td>Locked permanently at sign-up, never changes</td><td>SOP #5</td></tr>\n<tr><td>status</td><td>Applicant / Active / At-Risk / Dormant / Frozen / Exited</td><td>See the status definitions below - controls what the account can do on the platform</td><td>SOP #5, #8, #21</td></tr>\n<tr><td>onboarding_notes</td><td>Free text</td><td>Discovery-call read on service relevance, client diversity, professional standing, initial Giver/Taker impression</td><td>SOP #5, #11</td></tr>\n<tr><td>giving_pattern</td><td>Giver / Balanced / Taker</td><td>Only meaningful when status is Active - recalculated from wallet trend, not set manually. Deliberately separate vocabulary from status, so the two never get confused - see the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a></td><td>Segmentation Framework</td></tr>\n<tr><td>last_lead_shared_date</td><td>Date</td><td>Drives the 3-month dormancy calculation</td><td>SOP #21</td></tr>\n</table>\n\n<h2>Status definitions - precise, not casual</h2>\n<table class=\"dtable\">\n<tr><th>Status</th><th>Means exactly this</th></tr>\n<tr><td>Applicant</td><td>Applied, not yet through evaluation or fee payment</td></tr>\n<tr><td>Active</td><td>Onboarded, wallet balance above -2,997, has shared at least one lead in the last 3 months</td></tr>\n<tr><td>At-Risk</td><td>Active, but balance at or below <strong>-1,500</strong> (roughly halfway to the -2,997 freeze floor), or 4+ consecutive declines flagged. <strong>Confirmed: this is purely a flag, not a restriction</strong> - an At-Risk partner keeps every privilege of an Active account and can still send and receive leads normally. The only actual effect is getting bumped to the top of the Associate's outreach priority (see the Segmentation Framework). Deliberately different from <code>giving_pattern</code>=Taker, which is a longer-term behavioral trend, not a threshold. The two are related - a sustained Taker pattern will often eventually cross -1,500 - but don't have to fire together. A single bad stretch of received leads can trigger At-Risk on an otherwise healthy Giver, and a slow long-term Taker with a big starting buffer can stay well clear of -1,500 for a long time.</td></tr>\n<tr><td>Dormant</td><td>3+ months with no lead shared - removed from public listing, blocked from receiving new leads, but not frozen for balance reasons</td></tr>\n<tr><td>Frozen</td><td>Balance has hit -2,997 - blocked from receiving new leads until topped up to +999. Distinct from Dormant, and a partner could technically be both. <strong>If both apply:</strong> pay the top-up first, then send a lead. The top-up clears Frozen status. Sending a lead is what clears Dormant.</td></tr>\n<tr><td>Exited</td><td>Account closed, by the partner's choice or Sarthy's, per the guardrails in SOP #13</td></tr>\n</table>\n\n<h2>Credit Wallet</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>balance</td><td>Integer (can be negative)</td><td>Current credit balance, floor -2,997, no upper cap</td><td>SOP #6, #8</td></tr>\n<tr><td>paid_credits</td><td>Integer</td><td>Portion of balance that came from real payment - never expires</td><td>SOP #6</td></tr>\n<tr><td>goodwill_credits</td><td>Integer, with expiry_date</td><td>Portion issued by Sarthy as a coupon - expires 30 days from issue</td><td>SOP #6</td></tr>\n<tr><td>ledger_entry</td><td>Record: amount, reason, timestamp</td><td>Every single add or deduction, permanently logged - reasons: fee_payment, lead_received, conversion_earned, topup, withdrawal</td><td>SOP #6, #7</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the balance-threshold diagram in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a> for how the -2,997 floor and the -1,500 At-Risk line sit relative to each other.</p>\n\n<h2>Lead</h2>\n<p><strong>Extended once the <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> was confirmed</strong> - new fields for request direction, visibility, and per-party consent; <code>lead_status</code>'s enum drops <code>Unresolved</code>, since nothing about a Lead auto-finalizes any more.</p>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>lead_id</td><td>Text</td><td>Unique identifier</td><td>SOP #7</td></tr>\n<tr><td>request_direction</td><td>A (direct referral) / B (startup self-selects) / C (receiving partner proposes)</td><td>Which of the 3 ways this connection started - determines who the required requested parties are</td><td>SOP #7</td></tr>\n<tr><td>referring_partner_id</td><td>Reference</td><td>Who submitted it - set in direction A (direct referral). Blank in directions B and C</td><td>SOP #7</td></tr>\n<tr><td>originating_partner_id</td><td>Reference (can be Sarthy)</td><td>Who originally brought this startup into Sarthy's ecosystem - always set, across all 3 directions. Equal to referring_partner_id in direction A. This is who earns the lead-share credit and the deal-closure fee, not necessarily the receiving partner. If no partner brought the startup in, this is Sarthy itself</td><td>SOP #7</td></tr>\n<tr><td>receiving_partner_id</td><td>Reference</td><td>Who it's introduced to - chosen by the referring partner (direction A), by the startup itself (direction B), or is the partner proposing the connection (direction C)</td><td>SOP #7</td></tr>\n<tr><td>lead_status</td><td>Submitted / Introduced / Validated / Acknowledged / In Progress / Converted / Rejected</td><td>See stage definitions - matches the BRD #5 pipeline exactly. Note the order: Introduced (immediate, faded visibility) now comes before Validated (admin's sanity check), reversed from the pipeline's old order</td><td>SOP #7, BRD #5</td></tr>\n<tr><td>visibility_state</td><td>Faded / Active</td><td>Faded from Introduced until admin approves at Acknowledged (or the request is Rejected) - controls whether the entry is shown as FYI-only or as a real, actionable connection</td><td>SOP #7</td></tr>\n<tr><td>receiving_partner_consent, startup_consent</td><td>Pending / Given / Refused</td><td>Per-party consent status. startup_consent is only required (not left blank/N-A) in directions A and C; direction B treats the startup's own request as its consent</td><td>SOP #7</td></tr>\n<tr><td>submitted_at, validated_at, acknowledged_at, resolved_at</td><td>Timestamps</td><td>submitted_at also marks the moment lead_status becomes Introduced, since that now happens immediately. No field here drives an auto-finalization window any more - the old 1-week acknowledgment/rejection window is retired</td><td>SOP #7</td></tr>\n<tr><td>duplicate_flag</td><td>Boolean</td><td>Set automatically at upload if it matches an existing lead</td><td>SOP #7, BRD #5</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the 3-directions table in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a> for how originating_partner_id gets set in each direction.</p>\n\n<h2>Deal (post-closure)</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>deal_id</td><td>Text</td><td>Unique identifier, linked to the originating lead_id</td><td>SOP #20</td></tr>\n<tr><td>deal_value, deal_duration</td><td>Currency, months</td><td>Reported by the receiving partner on closure. deal_duration determines whether the 12-month proration rule applies (SOP #20) - if the engagement runs longer than a year, only the value invoiced in year one counts toward the referral fee</td><td>SOP #20</td></tr>\n<tr><td>referral_fee_entitlement</td><td>Currency</td><td>10% of deal_value, before Sarthy's cut</td><td>SOP #20</td></tr>\n<tr><td>referral_fee_net</td><td>Currency</td><td>91% of the entitlement - what the referring partner actually accrues</td><td>SOP #20</td></tr>\n<tr><td>first_engagement_date</td><td>Date</td><td>Starts the 1-year entitlement window</td><td>SOP #20</td></tr>\n<tr><td>payout_status</td><td>Accruing / Paid</td><td>Paid only at the annual March 31st settlement</td><td>SOP #20</td></tr>\n</table>\n\n<h2>Dispute</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>dispute_id</td><td>Text</td><td>Unique identifier, linked to a lead_id or deal_id</td><td>SOP #9</td></tr>\n<tr><td>raised_at</td><td>Timestamp</td><td>Starts the 24-hour admin-response clock</td><td>SOP #9</td></tr>\n<tr><td>evidence_notes</td><td>Free text</td><td>Includes startup-confirmation input where used - mechanism still being designed, see BRD #11</td><td>SOP #7, BRD #11</td></tr>\n<tr><td>resolution</td><td>Upheld / Reversed</td><td>Admin's call for routine disputes - final. Any dispute can escalate to Sarthy leadership - no fixed value threshold, admin decides case by case, per SOP #9</td><td>SOP #9</td></tr>\n</table>\n\n<h2>What this document deliberately doesn't cover yet</h2>\n<p>Gamification fields for the dormancy/activity system (SOP #21) aren't defined here since that mechanic itself isn't designed yet. This dictionary gets extended, not rewritten, whenever a new SOP section resolves - see the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">dependency map</a>.</p>\n"}, {"id": "interim-system", "content_file": "interim-system.html", "cat": "Process Documents", "status": "draft", "version": "2.4", "updated": "Added a cross-link to the Data Dictionary's new entity-relationship diagram", "type": "Internal", "title": "Interim Operating System", "desc": "A simple working tool to manage partners until the platform is ready", "html": "<p class=\"callout\">A simple working tool for the Lead and Associate to actually run day-to-day operations on, until the real platform matures enough to handle it. Built directly on the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>'s field definitions - not a separate, invented structure.</p>\n\n<h2>What this replaces</h2>\n<p>The old Growth Partnerships tracker - 16 tabs, inconsistent columns, different team members' shorthand scattered across years. This is one clean structure instead, using the fields already defined in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>.</p>\n\n<h2>Migrating existing records - treated exactly like a new partner addition</h2>\n<p>This isn't a special process with its own rules. A migrated partner follows the exact same onboarding treatment as a brand-new signup (<a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 5</a>). The bulk-import spreadsheet is just the mechanical way their existing record gets typed in - not a different set of business rules. There's no special \"migrated\" status category, so nothing about migration can ever conflict with how the Segmentation Framework treats a partner.</p>\n<table class=\"dtable\">\n<tr><th>Column</th><th>Source</th></tr>\n<tr><td>partner_id</td><td>Assign fresh, or reuse the existing code (e.g. SPA001) if still meaningful</td></tr>\n<tr><td>programme</td><td>India or International - from the original signed agreement</td></tr>\n<tr><td>status</td><td>Whatever a brand-new partner would get on completing onboarding - not defaulted to Dormant or At-Risk just because they're a migration. If they're not actually active on the platform yet, that's the same as any newly onboarded partner who hasn't logged in yet - normal, not a special case.</td></tr>\n<tr><td>giving_pattern</td><td>Blank initially, same as any new partner - it's calculated from real wallet activity, which nobody has on day one regardless of whether they're new or migrated</td></tr>\n<tr><td>last_lead_shared_date</td><td>Blank, same as a new partner - old-tracker call history doesn't carry over as platform activity</td></tr>\n</table>\n<p>Practical effect: a migrated partner becomes Wave-1-eligible the same way any partner does - by actually building real activity after joining, not by anything special about having been imported. See the Segmentation Framework's outreach table for how that plays out once they're in.</p>\n\n<h2>Core structure - one table per entity</h2>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the entity-relationship diagram in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> for how these five tables reference each other.</p>\n<table class=\"dtable\">\n<tr><th>Table</th><th>One row per...</th><th>Key fields (see Data Dictionary for full list)</th></tr>\n<tr><td>Partners</td><td>partner</td><td>partner_id, programme, status, giving_pattern, last_lead_shared_date</td></tr>\n<tr><td>Leads</td><td>lead</td><td>lead_id, referring/receiving partner, lead_status, timestamps</td></tr>\n<tr><td>Deals</td><td>closed deal</td><td>deal_id, deal_value, referral_fee_net, payout_status</td></tr>\n<tr><td>Wallet Ledger</td><td>credit transaction</td><td>partner_id, amount, reason, timestamp</td></tr>\n<tr><td>Disputes</td><td>dispute</td><td>dispute_id, raised_at, resolution</td></tr>\n</table>\n<p>No partner or lead should exist in more than one place - if it's not in these five tables, it isn't tracked. That's the entire point of replacing the old tracker.</p>\n\n<h2>The Associate's daily call queue</h2>\n<p>Not a separate table - a filtered view of the Partners table, ordered by the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>'s combined status + giving_pattern table:</p>\n<ol>\n<li><strong>status = At-Risk</strong> first - highest priority, most time-sensitive</li>\n<li><strong>status = Dormant</strong> next, but only this week's batch - selected on a <strong>rotating weekly quota</strong>, so every dormant partner eventually gets called rather than the same few being picked repeatedly or the list being worked by feel</li>\n<li><strong>status = Active, giving_pattern = Taker</strong> - medium-high touch, before they slide into At-Risk</li>\n<li><strong>status = Active, giving_pattern = Balanced</strong> - standard monthly rotation</li>\n<li><strong>status = Active, giving_pattern = Giver</strong> - lowest priority for calls, light touch, mostly automated messages from the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a></li>\n</ol>\n<p>Each call logged with: date, partner_id, outcome (reached / no answer / rescheduled), and a free-text note - this becomes the historical record the old tracker's scattered comment columns used to (badly) serve.</p>\n\n<h2>What this tool is not</h2>\n<p>It doesn't replace the eventual app - it's scaffolding for the gap between now and whenever the real platform can do this natively. When the <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Business Requirements Document</a>'s features actually exist in the live product, this tool gets retired, not maintained in parallel.</p>\n\n<h2>Where this actually lives</h2>\n<p>A lightweight spreadsheet or simple tool (e.g. Airtable) is enough - the point is the structure above, not the software. Building actual automation here isn't necessary yet. Consistency of the five tables is what matters.</p>\n"}, {"id": "engagement-strategy", "content_file": "engagement-strategy.html", "cat": "Process Documents", "status": "draft", "version": "1.2", "updated": "Updated for the 3-direction connection flow - startup messaging scope widened from Path B only to directions B and C; Finding-1-closing row and matrix rows updated to match the retired acknowledgment window.", "type": "Internal", "title": "Engagement Strategy Framework", "desc": "A reusable matrix - role, stage, objective, channel, trigger, owner, status - built from the Combined Journey Map's 3 findings, designed so a future role (like Investors) can be added by extending it rather than rewriting it", "html": "<p class=\"callout\">This is the framework, not the finished plan. It takes the three gaps the <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> found and turns them into a reusable structure for deciding who gets engaged, when, how, and by whom - built so a future role (an investor, for instance) can be added later by extending the structure, not rewriting it. The actual message wording, any new tracked field, and any new SOP clause are deliberately left for the next round, once this shape has been reviewed.</p>\n\n<h2>The pattern, not just the plan</h2>\n<p>The Startup, the Referring Partner, and the Receiving Partner can share one timeline in the User Journey Map because they genuinely live through the same lead, stage for stage. That won't be true of every role this program adds later. An investor, for example, wouldn't experience \"Origination\" or \"Acknowledge\" at all - they'd have their own entirely different stages (something closer to sourcing, diligence, commitment, and portfolio support). So the reusable part of this framework isn't the six Lead stages. It's the idea that <strong>every role gets its own timeline of stages, and every stage of every role's timeline gets the same five questions asked of it.</strong></p>\n\n<svg viewBox=\"0 0 760 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowES\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"10\" y=\"15\" width=\"220\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"120\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Startup / Referring / Receiving</text>\n    <text x=\"120\" y=\"50\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">share the Lead's own 6-stage timeline</text>\n\n    <rect x=\"10\" y=\"150\" width=\"220\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\" stroke-dasharray=\"4,3\"/>\n    <text x=\"120\" y=\"170\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">A future role, e.g. Investor</text>\n    <text x=\"120\" y=\"185\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">gets its own, different timeline</text>\n\n    <line x1=\"230\" y1=\"40\" x2=\"255\" y2=\"40\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"230\" y1=\"175\" x2=\"255\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"255\" y1=\"40\" x2=\"255\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"255\" y1=\"107\" x2=\"290\" y2=\"107\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowES)\"/>\n\n    <rect x=\"295\" y=\"60\" width=\"270\" height=\"95\" rx=\"8\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <text x=\"430\" y=\"80\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">The same 5 questions, every time</text>\n    <text x=\"430\" y=\"100\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">Engagement objective &#183; Channel</text>\n    <text x=\"430\" y=\"115\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">Trigger &#183; Owner &#183; Status</text>\n    <text x=\"430\" y=\"135\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">(this part is what actually generalizes)</text>\n\n    <line x1=\"565\" y1=\"107\" x2=\"600\" y2=\"107\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowES)\"/>\n    <rect x=\"605\" y=\"75\" width=\"145\" height=\"65\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"677\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">One matrix row</text>\n    <text x=\"677\" y=\"113\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">per role, per stage</text>\n    <text x=\"677\" y=\"128\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">- add rows, not rebuilds</text>\n\n    <text x=\"10\" y=\"220\" fill=\"var(--ink-faint)\" font-size=\"10\">Today's matrix below only fills in the top box. Adding Investors later means writing their own timeline</text>\n    <text x=\"10\" y=\"233\" fill=\"var(--ink-faint)\" font-size=\"10\">and filling in the same 5 columns against it - not touching this structure.</text>\n  </g>\n</svg>\n\n<h2>The five constant columns</h2>\n<table class=\"dtable\">\n<tr><th>Column</th><th>What it captures</th></tr>\n<tr><td>Engagement objective</td><td>What this role should feel or do at this exact point - the outcome a touchpoint here is actually for, not just an event being logged</td></tr>\n<tr><td>Channel</td><td>How it reaches them - WhatsApp, email, an in-app notice, a phone call, or none yet</td></tr>\n<tr><td>Trigger</td><td>The specific, already-defined event that fires it - never a vague \"periodically,\" always tied to a real SOP rule or state change</td></tr>\n<tr><td>Owner</td><td>Who's responsible for it firing - the system automatically, the Associate personally, or admin discretion</td></tr>\n<tr><td>Status</td><td><span class=\"status-pill badge-done\">Existing</span> - already built, in the Communication Template Library or elsewhere, and working today. <span class=\"status-pill badge-draft\">Proposed</span> - this framework's suggestion, not yet built anywhere. Not marked at all where a role genuinely has no touchpoint at that stage.</td></tr>\n</table>\n\n<h2>Resolved: startup messaging is scoped to directions B and C, for now</h2>\n<p>Every <span class=\"status-pill badge-draft\">Proposed</span> row in the Startup column below traced back to one root cause, not six separate ones: <strong>no startup-facing channel exists anywhere in this hub today.</strong> All 11 templates in the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> are addressed to a partner or to the internal Associate - none are written to a startup. Checked against the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> before deciding what to do about it: the Lead table has no field for a startup's email, phone, or name anywhere. Section 7's \"a real point of contact\" is a validation rule the referring partner must satisfy in direction A, not data the system stores. That means a direction-A startup - who never touches anything Sarthy-owned - can't be messaged at all today, not without deliberately adding a new contact field and capturing it at submission, which is a real scope increase, not a messaging decision. Directions B and C are different: both require the startup to have a logged-in identity in the self-service product - to self-select a partner in B, or to receive and give the real consent admin now requires of it in C - so a channel already exists there for both, just undocumented until now.</p>\n<p>There's a relationship question underneath the technical one, too. <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Section 20 is explicit that once the referral-fee window closes, the receiving partner \"owns the client relationship outright, with no further obligation back to the referrer.\" Sarthy messaging a startup directly - especially in direction A, where the receiving partner may reasonably see that startup as entirely their own client - risks looking like Sarthy inserting itself into a relationship it's already agreed belongs to the partner.</p>\n<p><strong>Resolved: proposed startup messages below apply to directions B and C only</strong>, delivered inside the self-service product a direction-B or direction-C startup is already logged into. Direction A stays unmessaged - not because it's a lower priority, but because there's currently no channel and no captured contact detail to use one with. Adding a direction-A contact field is a separate, deliberate decision for later, not a byproduct of this framework.</p>\n\n<h2>This round's matrix - the 3 roles who share the Lead's timeline</h2>\n<table class=\"dtable\">\n<tr><th>Stage</th><th>Role</th><th>Engagement objective</th><th>Channel</th><th>Trigger</th><th>Owner</th><th>Status</th></tr>\n\n<tr><td>1. Origination</td><td>Startup</td><td>Confident, well-oriented start on first login to the self-service product</td><td>Self-service portal (directions B and C)</td><td>On first login, directions B and C</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directions B and C only; direction A has no channel to the startup at all</td></tr>\n<tr><td>1. Origination</td><td>Referring partner</td><td>Confirm the submission was received and explain what happens next</td><td>Existing partner channel</td><td>On lead submission</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - no template covers this moment; template 1 is onboarding, not submission</td></tr>\n<tr><td>1. Origination</td><td>Receiving partner</td><td>Not yet applicable in directions A or B - not notified (A) or not yet known (B). Is the initiating party in direction C</td><td>-</td><td>-</td><td>-</td><td>Not applicable in A/B; direction C's own initiation isn't covered by any message trigger yet - a gap worth flagging, not designed in this round</td></tr>\n\n<tr><td>2. Submitted &amp; Introduced</td><td>Startup</td><td>Reduce the anxiety of a black box they can't see into</td><td>Self-service portal (directions B and C)</td><td>On Introduced, directions B and C</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directions B and C only</td></tr>\n<tr><td>2. Submitted &amp; Introduced</td><td>Referring partner</td><td>Confirm the lead reached Introduced and is now out of their hands</td><td>Existing partner channel</td><td>On Introduced</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span></td></tr>\n<tr><td>2. Submitted &amp; Introduced</td><td>Receiving partner</td><td>Prompt a response to admin's consent conversation, without a fixed deadline</td><td>WhatsApp / email</td><td>When a consent conversation has been pending a while, at admin's discretion - there's no fixed window anymore</td><td>System / Admin</td><td><span class=\"status-pill badge-done\">Existing</span> - template 2 (rewritten; no longer tied to a fixed window)</td></tr>\n\n<tr><td>3. Validate &amp; Acknowledge</td><td>Startup</td><td>Mirror the outcome - Acknowledged or Rejected - inside the portal (Finding 1, directions B and C only). In directions A and C, also where the startup's own required consent happens</td><td>Self-service portal (directions B and C)</td><td>On Acknowledged or Rejected, directions B and C only</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directions B and C only; direction A startups still get no visibility at all</td></tr>\n<tr><td>3. Validate &amp; Acknowledge</td><td>Referring partner</td><td>Close their own loop on what happened to the lead they submitted</td><td>Existing partner channel</td><td>On Acknowledged or on Rejected - whichever occurs</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directly closes Finding 1 (now narrower, see User Journey Map)</td></tr>\n<tr><td>3. Validate &amp; Acknowledge</td><td>Receiving partner</td><td>Confirm the outcome once admin's consent conversation concludes</td><td>WhatsApp / email</td><td>On consent refused (existing); on consent given (no message defined)</td><td>System</td><td><span class=\"status-pill badge-done\">Existing</span> for consent refusal (template 3) - gap for consent given</td></tr>\n\n<tr><td>4. In Progress &amp; Converted</td><td>Startup</td><td>None defined - Sarthy has no visibility or touchpoint here by design</td><td>-</td><td>-</td><td>-</td><td>Not applicable - the receiving partner owns this relationship now</td></tr>\n<tr><td>4. In Progress &amp; Converted</td><td>Referring partner</td><td>Mark the single most motivating moment in the whole credit system - the instant their lead converts and credit lands</td><td>Existing partner channel</td><td>On admin confirming conversion</td><td>System</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directly closes Finding 2</td></tr>\n<tr><td>4. In Progress &amp; Converted</td><td>Receiving partner</td><td>None defined - no check-in during active work</td><td>-</td><td>-</td><td>-</td><td><span class=\"status-pill badge-draft\">Proposed</span> (optional - lower priority than the other gaps here)</td></tr>\n\n<tr><td>5. Deal Closure &amp; Referral Fee</td><td>Startup</td><td>Not tracked by Sarthy at this stage - now the receiving partner's client</td><td>-</td><td>-</td><td>-</td><td>Not applicable</td></tr>\n<tr><td>5. Deal Closure &amp; Referral Fee</td><td>Referring partner</td><td>Confirm the annual referral-fee payout</td><td>Email</td><td>March 31st settlement</td><td>System</td><td><span class=\"status-pill badge-done\">Existing</span> - template 10, the one stage already well covered</td></tr>\n<tr><td>5. Deal Closure &amp; Referral Fee</td><td>Receiving partner</td><td>None defined - no confirmation once they report deal value</td><td>-</td><td>-</td><td>-</td><td><span class=\"status-pill badge-draft\">Proposed</span> (optional)</td></tr>\n\n<tr><td>6. Repeat or Dormancy</td><td>Startup</td><td>No equivalent yet of the partner-side activity tracking (Finding 3) - whether they'd return isn't measured at all</td><td>Self-service portal, once a signal exists (directions B and C)</td><td>-</td><td>-</td><td><span class=\"status-pill badge-draft\">Proposed</span> - directions B and C only; still blocked on a new tracking signal, see below</td></tr>\n<tr><td>6. Repeat or Dormancy</td><td>Referring partner</td><td>Standard relationship-management cadence, prioritized by status and giving_pattern</td><td>WhatsApp / email / call</td><td>Monthly cadence; dormancy warning at ~2.5 months; reactivation once dormant</td><td>Associate</td><td><span class=\"status-pill badge-done\">Existing</span> - templates 5, 6, 7, 8, and the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>'s outreach-priority table</td></tr>\n<tr><td>6. Repeat or Dormancy</td><td>Receiving partner</td><td>Same standing cadence - governed by their own status and giving_pattern, same as any partner</td><td>WhatsApp / email / call</td><td>Same as above</td><td>Associate</td><td><span class=\"status-pill badge-done\">Existing</span> - same templates and framework apply</td></tr>\n</table>\n\n<h2>Where this closes the three findings</h2>\n<p><strong>Finding 1</strong> (now narrower since the connection-flow rewrite: a consent decision, once made, still isn't communicated to the referring partner - the old silent-timeout failure mode is retired along with the auto-expiry rule) is addressed by one proposed row: a message to the referring partner on either Validate &amp; Acknowledge-stage outcome - Acknowledged or Rejected - one trigger with two possible outcomes, not three.</p>\n<p><strong>Finding 2</strong> (no message for the moment credit actually lands) is addressed by one proposed row: a message to the referring partner the moment admin confirms conversion, distinct from both the existing pre-acknowledgment reminder and the much-later annual payout notice.</p>\n<p><strong>Finding 3</strong> (a startup's repeat engagement isn't tracked) is the one gap this framework can name but not close by itself. A message can't be designed for an event nothing currently detects - this needs a tracked signal on the startup side first (something like the partner-side <code>last_lead_shared_date</code> and <code>giving_pattern</code>, but for a startup returning or leaving), which is a <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> change, not a messaging one. Given the directions B/C-only scope decided above, that signal only needs to exist for direction B and C startups, whose activity already runs through the self-service product - not a new field on direction-A leads, which stay out of scope entirely. Flagged here as the first thing the next round needs to define, before any Stage 6 startup message can be written.</p>\n\n<h2>Extending this to a new role later - e.g. Investors</h2>\n<p>Worth showing this actually generalizes, not just claiming it does - but this example is illustrative only. No investor process exists anywhere else in this hub yet, so nothing below is a real proposal, only a demonstration of the pattern holding up outside the Lead's own timeline.</p>\n<table class=\"dtable\">\n<tr><th>Stage (Investor's own timeline, hypothetical)</th><th>Engagement objective</th><th>Channel</th><th>Trigger</th><th>Owner</th><th>Status</th></tr>\n<tr><td>Sourcing</td><td>Confirm interest was received and set expectations on timeline</td><td>Email</td><td>On first outreach or inbound interest</td><td>Associate</td><td>Illustrative only</td></tr>\n<tr><td>Diligence</td><td>Keep them warm during a process that can run long</td><td>Email / call</td><td>Periodic cadence during active diligence</td><td>Associate</td><td>Illustrative only</td></tr>\
