n<tr><td>Post-investment</td><td>Ongoing portfolio visibility</td><td>Email / report</td><td>Reporting cadence, once defined</td><td>Admin</td><td>Illustrative only</td></tr>\n</table>\n<p>None of an investor's stages match the Lead's six - and that's the point. Adding this role for real would mean someone deliberately defining that timeline and filling in these five columns against it, the same exercise done above for the current three roles. Nothing about today's matrix would need to change to make room for it.</p>\n\n<h2>What this round deliberately leaves out</h2>\n<p>This document defines the shape - which role, which stage, which objective, which gap. It doesn't yet contain the actual message wording for any <span class=\"status-pill badge-draft\">Proposed</span> row, and it doesn't yet add the new Data Dictionary field Finding 3 needs. Those are real, concrete next steps, not open-ended - specifically: draft wording for the 4 clearly-scoped partner-facing proposed messages (Stage 1 and 2 referring-partner confirmations, the Stage 3 outcome message, and the Stage 4 conversion message), draft wording for the 3 direction B/C-only startup messages now that the channel question is resolved, and define the direction B/C activity signal Finding 3 needs. Direction-A startup messaging stays explicitly out of scope until a contact field is deliberately added later - a decision for another day, not an oversight in this one. Once drafted, these go directly into the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>, the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>, and <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> directly, marked draft until confirmed - the same way every other drafted rule in this hub already works, not as a separate proposal layer.</p>\n\n<h2>Built from</h2>\n<p>Every row above traces back to something already confirmed elsewhere: the three findings and the shared timeline in the <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a>, the real trigger list in the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>, the outreach-priority logic in the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>, and the standing engagement cadence already described in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Sections 15, 17, and 21. Section 21's note that gamification \"still needs a real design pass\" is a natural future home inside this same framework, once the basics above are confirmed - not tackled in this round.</p>\n"}, {"id": "glossary", "content_file": "glossary.html", "cat": "Glossary", "status": "done", "version": "1.4", "updated": "Fixed accepted to acknowledged in the two reward tracks table, for consistency with the rest of the hub's terminology.", "type": "Both", "title": "Glossary", "desc": "Quick definitions for terms used across the hub - the 999-credit meanings, status vs giving_pattern, the two reward tracks", "html": "<p class=\"callout\">Terms used across the hub that don't explain themselves on first read. Each links to where the full detail actually lives.</p>\n\n<h2>The four meanings of \"999\"</h2>\n<p>The same number is deliberately reused for four different things - see the full worked example in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 6</a>.</p>\n<table class=\"dtable\">\n<tr><th>Context</th><th>What it means</th></tr>\n<tr><td>Joining bonus</td><td><span class=\"amt-pos\">+999</span> credits granted when a partner pays the entry fee</td></tr>\n<tr><td>Cost to receive a lead</td><td><span class=\"amt-neg\">-999</span> credits deducted when a partner acknowledges a lead</td></tr>\n<tr><td>Conversion reward</td><td><span class=\"amt-pos\">+909</span> credits (999 minus the 9% fee) when a referred lead converts</td></tr>\n<tr><td>Negative-balance basis</td><td>The -2,997 freeze floor is exactly 999 \u00d7 3</td></tr>\n</table>\n\n<h2>Giver, Taker, Balanced (giving_pattern)</h2>\n<p>Describes a partner's behavior: whether their wallet trends up (Giver), stays roughly even (Balanced - the default for most partners), or trends down (Taker). This only matters when an account's status is Active. See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 11</a> and the full <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>.</p>\n\n<h2>Status (Applicant / Active / At-Risk / Dormant / Frozen / Exited)</h2>\n<p>Describes what a partner's <em>account can actually do</em> on the platform - a completely different, deliberately non-overlapping concept from giving_pattern above. Full definitions in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>.</p>\n\n<h2>The two reward tracks</h2>\n<table class=\"dtable\">\n<tr><th></th><th>Lead-share credit</th><th>Deal-closure referral fee</th></tr>\n<tr><td>Triggered by</td><td>A lead being referred and acknowledged</td><td>A lead becoming a real signed deal</td></tr>\n<tr><td>Amount</td><td>999 credits, minus 9% fee</td><td>10% of first-year invoiced value, minus 9% of that 10%</td></tr>\n<tr><td>Paid</td><td>At the moment of conversion</td><td>Once annually, March 31st</td></tr>\n<tr><td>Detail</td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Sections 5-10</a></td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 20</a></td></tr>\n</table>\n\n<h2>The 9% facilitation fee</h2>\n<p>One consistent principle applied to every value transfer between partners - whether that's a 999-credit lead-share reward or the 10% deal-closure entitlement. Same rate, same logic, two different bases.</p>\n\n<h2>Status pill colours</h2>\n<p><strong>The colour is only half the information - always read the text next to it too.</strong> Two sections can both show the amber \"Draft\" colour and still mean very different things: one might read \"drafted, all six specified\" (fully written, just waiting on a signature), another \"drafted, exchange rate source still open\" (a specific number could still change). The colour shows the broad category. The words show exactly what's actually still open, if anything.</p>\n<table class=\"dtable\">\n<tr><th>Colour</th><th>Broad meaning</th></tr>\n<tr><td><span class=\"badge badge-done\">Confirmed</span></td><td>Settled, not just Sarthy leadership's word but reflected consistently across the hub</td></tr>\n<tr><td><span class=\"badge badge-draft\">Draft</span></td><td>Written and specific, but still a working assumption pending Sarthy's formal sign-off - the accompanying text says exactly what, if anything, is still unresolved</td></tr>\n<tr><td><span class=\"badge badge-pending\">Pending</span></td><td>Not written yet</td></tr>\n</table>\n\n<h2>Lead / Admin / Associate</h2>\n<p><strong>Lead</strong> is the Project Lead role - responsible for strategy, documentation, Sarthy reporting, and spec authorship.</p>\n<p><strong>Associate</strong> handles calls, data entry, and first-line follow-up.</p>\n<p><strong>Admin</strong> is Sarthy's operational role inside the SOP's rules - validating leads, confirming conversions, resolving disputes. This is not the same as \"Lead\" above. It's a role Sarthy's own team occupies.</p>\n\n<h2>deal_duration and the 12-month proration rule</h2>\n<p>If an engagement runs longer than 12 months, only what's invoiced in the first 12 months counts toward the referrer's entitlement - not the full multi-year contract value. See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 20</a> for the worked example.</p>\n"}, {"id": "action-tracker", "content_file": "action-tracker.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.9", "updated": "Restored the Migration Wave Plan row and critical-path diagram box text - un-decommissioned.", "type": "Both", "title": "Action Item & Blocker Tracker", "desc": "Real-world action items blocking progress, with a dependency chain showing what unlocks what", "html": "<p class=\"callout\">Real-world action items that block progress - distinct from documentation gaps in the Gap & Risk Register. These need a person to actually do something outside this hub (a legal review, a phone call, a decision), not a content edit. Colour shows status. The chain below shows what's actually blocking what, so it's visible how stuck the project is at a glance.</p>\n\n<h2>Critical path - what's blocking what</h2>\n<svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrow3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"255\" y=\"10\" width=\"190\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"350\" y=\"36\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">Real Sarthy meeting</text>\n\n    <line x1=\"350\" y1=\"54\" x2=\"350\" y2=\"78\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"20\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"95\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Legal review of</text>\n    <text x=\"95\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">existing contracts</text>\n\n    <rect x=\"192\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"267\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Regulatory review</text>\n    <text x=\"267\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">(RBI/PPI, TDS)</text>\n    <text x=\"267\" y=\"138\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"8\">blocks wallet launch &amp; payouts</text>\n    <text x=\"267\" y=\"147\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"8\">- a separate track, not shown here</text>\n\n    <rect x=\"364\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"439\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Portal access</text>\n    <text x=\"439\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">from Sarthy</text>\n\n    <rect x=\"536\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"611\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Payment gateway</text>\n    <text x=\"611\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">+ e-sign selection</text>\n\n    <line x1=\"95\" y1=\"124\" x2=\"95\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"20\" y=\"152\" width=\"330\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"185\" y=\"170\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Data migration - template built,</text>\n    <text x=\"185\" y=\"184\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">then old records imported</text>\n\n    <line x1=\"439\" y1=\"124\" x2=\"439\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n    <line x1=\"611\" y1=\"124\" x2=\"611\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"364\" y=\"152\" width=\"322\" height=\"44\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"525\" y=\"170\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Migration Wave Plan +</text>\n    <text x=\"525\" y=\"184\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Low-Level System Spec</text>\n\n    <line x1=\"185\" y1=\"196\" x2=\"350\" y2=\"230\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n    <line x1=\"525\" y1=\"196\" x2=\"400\" y2=\"230\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"220\" y=\"232\" width=\"260\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"350\" y=\"252\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Real Phase 5 rollout -</text>\n    <text x=\"350\" y=\"267\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">actual partners onboarded</text>\n\n    <text x=\"20\" y=\"315\" fill=\"var(--ink-faint)\" font-size=\"10\">Red = blocked, needs external action. Amber = in progress or partially unblocked. Grey = downstream, waiting on the above.</text>\n  </g>\n</svg>\n\n<h2>Full tracker</h2>\n<table class=\"dtable\">\n<tr><th>Item</th><th>Owner</th><th>Status</th><th>Blocks</th></tr>\n<tr><td>Legal review and amendment - the 9% fee now applies to all partners including Partner 1.0-era agreements. Any agreement that doesn't support this needs amending</td><td>Sarthy legal</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Migrating any real partner to the new model</td></tr>\n<tr><td>Document every partner still under a Partner 1.0-era agreement, for reference during the amendment process</td><td>Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>The legal review above - can't amend agreements without knowing who holds them</td></tr>\n<tr><td>Regulatory review - does the credit wallet trigger RBI/PPI obligations? TDS on referral payouts?</td><td>Sarthy finance/legal</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Public launch of the wallet, first annual payout</td></tr>\n<tr><td>Real Sarthy meeting to confirm remaining working assumptions</td><td>Lead</td><td><span class=\"badge badge-pending\">Not scheduled</span></td><td>Everything still marked \"pending Sarthy sign-off\" across the hub</td></tr>\n<tr><td>Portal access (admin + partner login, tracker edit rights)</td><td>Sarthy</td><td><span class=\"badge badge-draft\">Waiting</span></td><td>Real feature inventory, BRD gap-mapping against the actual Alpha build</td></tr>\n<tr><td>Data migration template - column format for the old tracker's records</td><td>Lead</td><td><span class=\"badge badge-draft\">In progress</span></td><td>Actually importing historical partner data</td></tr>\n<tr><td>Data migration - populate the template with real records</td><td>Lead / Associate</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Real Phase 5 rollout using actual history</td></tr>\n<tr><td>Payment gateway selection (fee collection, withdrawal payouts)</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>BRD Sections 3, 7, 10 - can't be built without this</td></tr>\n<tr><td>E-signature provider selection</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>BRD Section 9's digital-signature requirement</td></tr>\n<tr><td>Real Alpha partner interviews actually conducted</td><td>Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Validating requirements against real partner experience, not just SOP rules</td></tr>\n<tr><td>Migration Wave Plan drafted</td><td>Lead</td><td><span class=\"badge badge-done\">Done</span></td><td>Real rollout sequencing</td></tr>\n<tr><td>Low-Level System Specification drafted</td><td>Lead</td><td><span class=\"badge badge-done\">Done</span></td><td>Actual development starting</td></tr>\n<tr><td>Sarthy to designate a specific named person/role for formal BRD sign-off (process itself is resolved - written approval required, informal agreement isn't enough)</td><td>Sarthy leadership</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Development starting at all</td></tr>\n<tr><td>Development budget and resourcing confirmed with Sarthy</td><td>Sarthy + Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Any real development timeline commitment</td></tr>\n<tr><td>Confirm real priority for the startup self-service product (BRD Section 5) - currently assumed Phase 2, not confirmed</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Whether this ships alongside the MVP or after it</td></tr>\n</table>\n"}, {"id": "history", "content_file": "history.html", "cat": "Archives", "status": "draft", "version": "1.8", "updated": "Corrected the retirement note - Migration Wave Plan was un-decommissioned; only the Gantt view stays retired.", "type": "Internal", "title": "Design History & Decisions", "desc": "The why and the used-to-be behind decisions in the hub - kept separate so other pages can stay focused on what is true today", "html": "<p class=\"callout\">This page holds the \"why\" and the \"what it used to be\" - the history behind decisions in the hub. The other 25 pages describe what's true today. This page is where that older context lives instead, so it doesn't get in the way of a reader just trying to find out the current rule.</p>\n\n<h2>Why Partnership SOP v1.0 absorbed Sarthy's Playbook 2.0</h2>\n<p>Sarthy had already written a detailed design document called Playbook 2.0. It covered years of their own thinking on the credit system, the referral flow, and the rules against abuse.</p>\n<p>Early in this project, that document sat outside the hub as a separate reference. Partnership SOP v1.0 only pointed to it.</p>\n<p>Later, this was judged to create a real risk: two documents describing the same rules, with no guarantee they'd stay in sync. So every real piece of Playbook 2.0 was rewritten into Partnership SOP v1.0, section by section. Playbook 2.0 is now retired. Nothing about the program lives there that isn't also in the SOP.</p>\n\n<h2>Why Sarthy's original Playbook 1.0 was never absorbed</h2>\n<p>Playbook 1.0 was Sarthy's very first version of the program, from 2023-24. It was much simpler than Playbook 2.0 - mostly just a flat 10% referral fee, no credit wallet. Almost everything worth knowing from it is already captured in the Current-State Assessment's history section, so it was never pulled into the SOP the way Playbook 2.0 was.</p>\n\n<h2>Why the Master Execution Sequence's item 11 covers four different things</h2>\n<p>Item 11 used to be four separate items on the list: a new onboarding process, an engagement plan, a reactivation plan, and an escalation SOP. They were merged into one item. All four were always meant to become sections inside Partnership SOP v1.0, not standalone documents - keeping them as four separate to-do items was creating duplicate work.</p>\n\n<h2>Why two documents in the hub aren't numbered on the Sequence page</h2>\n<p>The Glossary and the Action Item & Blocker Tracker don't have numbers on the Master Execution Sequence page. That's not a gap - they simply weren't part of the original plan. Both came out of later requests as the hub grew.</p>\n\n<h2>Why the Gantt view was retired</h2>\n<p>The Project Plan (Gantt View) duplicated the Roadmap's own phase timeline - the two disagreed on Phase 2/3/4 durations by about a week each, and reconciling them would have added a second source of truth for the same information rather than removing one. Its other real content, a \"what's actually still ahead\" list, already substantially duplicated the Action Item & Blocker Tracker. Cut in favor of keeping the Roadmap as the single timeline view - it now carries a status column (Done / In Progress / Not started) so nothing about real-world progress was lost.</p>\n<p><strong>The Migration Wave Plan was briefly retired the same way, then restored.</strong> The original reasoning still stands as a real, unreconciled issue - its \"Wave 2\" gate (special-agreement partners) doesn't match the Graduation Criteria's own readiness gate, despite the dependency map implying they're linked - but the document itself holds real wave-sequencing data needed for actual post-launch migration work, so removing it outright went too far. It's back, still marked as a deferred, post-build activity rather than something being actively maintained pre-build, with the Wave 2 mismatch flagged rather than fixed. See the Version History for the exact sequence of that decision and reversal.</p>\n\n<h2>Why the Partner Journey Map was folded into the User Journey Map</h2>\n<p>The hub used to carry two journey documents that sounded similar but covered different ground: the Partner Journey Map followed one partner's own account lifecycle (Awareness through Dormancy), while the Combined Journey Map followed one referral across all three parties at once (Origination through Deal Closure). They weren't duplicates of each other - but keeping them as two separately-numbered documents was creating exactly the confusion their similar names suggested.</p>\n<p>They're now one document, the <strong>User Journey Map</strong>, in four sections: the Referral Timeline (the old Combined Journey Map, essentially unchanged), a Referring Partner Lifecycle and a Receiving Partner Lifecycle (both built from the old Partner Journey Map's single lifecycle, deliberately duplicated by role at the Lead's request), and a new Startup Lifecycle, explicitly marked proposed and unvalidated since no hub document had ever defined one before.</p>\n<p>Worth being honest about one trade-off here: the Referring and Receiving Partner Lifecycle sections describe mostly the same underlying mechanics - the same eight stages, the same account-status rules - presented twice under different role labels. A handful of stages (most clearly, whether \"first activity\" means submitting a lead or receiving one) do genuinely differ by role and are written that way; the rest are intentionally identical rather than artificially varied. This was a deliberate choice to organize the document by role for readability, not a claim that a referring partner's core lifecycle mechanics are actually different from a receiving partner's.</p>\n\n<h2>Why the partner network changed from a one-way referral model</h2>\n<p>The first version of the partner program (2023-24) only flowed one way. Sarthy referred startups to partners. Partners never referred business to each other.</p>\n<p>The redesign turned this into a network where any partner can refer to, and receive from, any other partner - with Sarthy tracking it all.</p>\n<table class=\"dtable\">\n<tr><th>What changed</th><th>First version</th><th>Current design</th></tr>\n<tr><td>Structure</td><td>Sarthy to partner only</td><td>Any partner to any partner, with Sarthy tracking everything</td></tr>\n<tr><td>Cost to join</td><td>Free</td><td>\u20b9999 (India) or $49 (international)</td></tr>\n<tr><td>Credit wallet</td><td>None</td><td>Starts with 999 credits, earned and spent through referrals</td></tr>\n<tr><td>How partners earn</td><td>Only from their own client work</td><td>Credits for every referral that converts, plus their own client work</td></tr>\n<tr><td>Cost of receiving a lead</td><td>None</td><td>999 credits deducted per lead received</td></tr>\n<tr><td>Accountability</td><td>Signed agreement only</td><td>Signed agreement plus a tracked credit wallet and conversion record</td></tr>\n</table>\n<p>In one line: in the old model, a partner was a vendor. In the current design, a partner is a node in a shared network, where everyone has something to gain and something to manage.</p>\n\n<h2>Why membership has no fixed cycle</h2>\n<p>Sarthy's original design was built around cycles - a membership period that ended in a settlement event. This SOP made a deliberate change: membership is now ongoing, with no cycle and no forced end date. A partner joins once and stays a member indefinitely.</p>\n\n<h2>Why the Segmentation Framework changed from 5 tiers to 2 fields</h2>\n<p>The Segmentation Framework used to be a single 5-tier list. It reused words like \"At-Risk\" and \"Dormant\" - the same words already meaning something different in the Data Dictionary's account status field. A reader seeing \"At-Risk\" in a spreadsheet couldn't tell whether it meant the segmentation tier or the account status.</p>\n<p>It was redesigned into two separate fields with no overlapping words: <code>status</code> (what the account can do) and <code>giving_pattern</code> (how the partner behaves, only meaningful when status is Active).</p>\n"}, {"id": "low-level-spec", "content_file": "low-level-spec.html", "cat": "Technical Documents", "status": "draft", "version": "1.2", "updated": "Lead state machine rewritten: Introduced now fires immediately (faded/FYI), Acknowledged now reached via admin-mediated consent, auto-finalization and Unresolved retired.", "type": "Internal", "title": "Low-Level System Specification", "desc": "The detailed technical spec, built from the approved BRD", "html": "<p class=\"callout\">This is the technical detail layer beneath the BRD - written to be technology-neutral, so it stays useful whether this gets built on Replit, migrated elsewhere later, or handed to a different team entirely. It doesn't restate what the BRD or Data Dictionary already cover - it adds the things only a precise technical spec needs: exact state transitions, exact formulas, and defined operations with clear inputs, outputs, and conditions.</p>\n\n<h2>How this relates to the other technical documents</h2>\n<ul>\n<li>The <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">BRD</a> is the source of truth for what the system must do. This document doesn't override it.</li>\n<li>The <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> is the source of truth for field names, types, and meanings. This document builds on it, doesn't repeat it.</li>\n<li>Anyone building this on Replit specifically should also read the <a href=\"#\" onclick=\"showDoc('replit-build-brief');return false;\" class=\"xlink\">Replit Build Brief</a> - that document is the platform-specific companion to this one.</li>\n</ul>\n\n<h2>Lead state machine</h2>\n<p><strong>Rewritten once the <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> was confirmed.</strong> Two states and two operations changed meaning, not just gained a new case: <code>Introduced</code> now fires immediately on submission (visible to all relevant parties, faded/FYI-only) instead of after validation; <code>Acknowledged</code> is now reached through admin taking consent from the requested part(y/ies), not the receiving partner self-servicing an accept in the app. The old 7-day self-service window and its automatic finalization at hour 168 are retired entirely - nothing in this state machine times out on its own any more. <code>Unresolved</code> is no longer a reachable state.</p>\n<svg viewBox=\"0 0 830 235\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:760px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowLS\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"10.5\">\n    <rect x=\"10\" y=\"20\" width=\"105\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"62\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Submitted</text>\n\n    <line x1=\"115\" y1=\"43\" x2=\"135\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"140\" y=\"20\" width=\"115\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n    <text x=\"197\" y=\"40\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-weight=\"500\" font-size=\"10.5\">Introduced</text>\n    <text x=\"197\" y=\"54\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"8.5\">faded, visible to all - FYI only</text>\n\n    <line x1=\"255\" y1=\"43\" x2=\"275\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"280\" y=\"20\" width=\"105\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"332\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Validated</text>\n\n    <line x1=\"385\" y1=\"43\" x2=\"405\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"410\" y=\"20\" width=\"130\" height=\"46\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <text x=\"475\" y=\"42\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Acknowledged</text>\n    <text x=\"475\" y=\"56\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">consent taken, -999 deducted</text>\n\n    <line x1=\"540\" y1=\"43\" x2=\"560\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"565\" y=\"20\" width=\"115\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"622\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">In Progress</text>\n\n    <line x1=\"680\" y1=\"43\" x2=\"700\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"705\" y=\"20\" width=\"115\" height=\"46\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"762\" y=\"42\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Converted</text>\n    <text x=\"762\" y=\"56\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">referrer +909</text>\n\n    <line x1=\"62\" y1=\"66\" x2=\"62\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" marker-end=\"url(#arrowLS)\"/>\n    <rect x=\"10\" y=\"152\" width=\"105\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\" stroke-dasharray=\"3,2\"/>\n    <text x=\"62\" y=\"176\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-weight=\"600\" font-size=\"10.5\">Cancelled</text>\n    <text x=\"62\" y=\"212\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">initiating party withdraws,</text>\n    <text x=\"62\" y=\"223\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">any time before Acknowledged</text>\n\n    <line x1=\"475\" y1=\"66\" x2=\"475\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n    <rect x=\"400\" y=\"152\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"475\" y=\"176\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Rejected</text>\n    <text x=\"475\" y=\"212\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">consent refused, at any point</text>\n    <text x=\"475\" y=\"223\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">&#8212; no deduction ever happened</text>\n\n    <line x1=\"600\" y1=\"66\" x2=\"600\" y2=\"120\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"600\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" marker-end=\"url(#arrowLS)\"/>\n    <text x=\"600\" y=\"113\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">later dispute upheld &#8594; +999 refunded</text>\n  </g>\n</svg>\n<table class=\"dtable\">\n<tr><th>From</th><th>Event</th><th>To</th><th>Side effects</th></tr>\n<tr><td>(none)</td><td>Initiating party submits (any of the 3 directions - see Playbook \u00a77)</td><td>Submitted</td><td>Duplicate check runs immediately, at upload</td></tr>\n<tr><td>Submitted</td><td>System makes it visible to all relevant parties</td><td>Introduced</td><td>Faded, FYI-only entry - nothing actionable yet, no deduction</td></tr>\n<tr><td>Introduced</td><td>Admin runs the sanity check (account standing, not a duplicate, responsible use)</td><td>Validated</td><td>No fixed deadline - a soft target of 5 working days, not an auto-trigger</td></tr>\n<tr><td>Validated</td><td>Admin takes consent from the requested part(y/ies) and approves</td><td>Acknowledged</td><td><span class=\"amt-neg\">-999</span> credits deducted from receiving partner, immediately</td></tr>\n<tr><td>Introduced or Validated</td><td>Initiating party cancels</td><td>(deleted)</td><td>No deduction ever happened - nothing to reverse</td></tr>\n<tr><td>Introduced or Validated</td><td>A requested party refuses consent</td><td>Rejected</td><td>No deduction (none happened yet)</td></tr>\n<tr><td>Acknowledged</td><td>Work begins</td><td>In Progress</td><td>None</td></tr>\n<tr><td>In Progress</td><td>Admin confirms conversion</td><td>Converted</td><td>Referring/originating partner credited <span class=\"amt-pos\">+909</span> (999 minus 9%)</td></tr>\n<tr><td>In Progress or Acknowledged</td><td>Dispute raised, admin reverses</td><td>Rejected</td><td><span class=\"amt-pos\">+999</span> credits refunded to receiving partner (full reversal)</td></tr>\n</table>\n<p>Re-referral: a Rejected lead can be resubmitted to a different partner (new Lead record, new lifecycle). Same-service-type overlap is now a flag rather than a block - more than one open request can exist on the same startup with similar-type receiving partners at once. <strong>Still open, not yet answered:</strong> when one converts to Acknowledged, do the startup's other open requests to similar-type partners auto-close, or stay open? Needs a decision before this is built - see the <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> page.</p>\n\n<h2>Partner status state machine</h2>\n<table class=\"dtable\">\n<tr><th>From</th><th>Event</th><th>To</th><th>Notes</th></tr>\n<tr><td>(none)</td><td>Applies, not yet evaluated</td><td>Applicant</td><td></td></tr>\n<tr><td>Applicant</td><td>Fee paid, wallet activated</td><td>Active</td><td>Wallet opens at <span class=\"amt-pos\">+999</span></td></tr>\n<tr><td>Active</td><td>Balance drops to -1,500 or below, OR 4+ consecutive declines</td><td>At-Risk</td><td>Flag only - every Active privilege continues unchanged</td></tr>\n<tr><td>Active or At-Risk</td><td>Balance hits -2,997</td><td>Frozen</td><td>Independent trigger from At-Risk - can happen with or without At-Risk first</td></tr>\n<tr><td>Active or At-Risk</td><td>3 consecutive months with no lead shared</td><td>Dormant</td><td>Independent trigger from Frozen - a partner can be Dormant and Frozen simultaneously</td></tr>\n<tr><td>Frozen</td><td>Top-up paid (4x entry fee)</td><td>Active (or At-Risk, if the -1,500 condition still applies post-top-up)</td><td>Balance moves from -2,997 to exactly +999</td></tr>\n<tr><td>Dormant</td><td>Partner sends a lead</td><td>Active (or At-Risk/Frozen if those conditions independently apply)</td><td>If both Dormant and Frozen apply, top-up must happen first, then the lead - see Data Dictionary</td></tr>\n<tr><td>Any</td><td>Partner or Sarthy closes the account</td><td>Exited</td><td>Terminal state</td></tr>\n</table>\n\n<h2>Core operations</h2>\n<p>Defined independent of any specific framework or API style - inputs, what changes, and what must be true before/after.</p>\n<table class=\"dtable\">\n<tr><th>Operation</th><th>Preconditions</th><th>Effect</th><th>Postconditions</th></tr>\n<tr><td>SubmitLead</td><td>Initiating partner isn't Exited. Dormant partners specifically can and must be able to do this - it's their documented recovery path. Lead isn't a duplicate. <strong>Not yet answered anywhere in the source material:</strong> whether a Frozen partner can submit/refer a lead, since Frozen is specifically about receiving. Worth confirming before building rather than assuming.</td><td>Creates Lead record with its direction (A/B/C - see Playbook \u00a77), status Submitted</td><td>Immediately moves to Introduced (visible to all relevant parties, faded/FYI-only) - duplicate flag set if a match is found</td></tr>\n<tr><td>ValidateRequest</td><td>Lead status is Introduced.</td><td>Admin runs the sanity check: requesting party's account in good standing, not a duplicate of one already open, requesting party using the feature responsibly</td><td>Lead status becomes Validated. No fixed deadline enforced by the system - 5 working days is a service target, not a trigger</td></tr>\n<tr><td>TakeConsentAndApprove</td><td>Lead status is Validated. All required requested parties for this direction have given consent (receiving partner always; the startup too, in directions A and C - see Playbook \u00a77). Receiving partner is Active or At-Risk (not Frozen or Dormant).</td><td>Deducts 999 from receiving partner's wallet</td><td>Lead status becomes Acknowledged. Wallet balance re-evaluated for At-Risk/Frozen status</td></tr>\n<tr><td>RefuseConsent</td><td>Lead status is Introduced or Validated. Any required requested party declines.</td><td>None - no deduction has happened yet</td><td>Lead status becomes Rejected</td></tr>\n<tr><td>ConfirmConversion</td><td>Lead status is In Progress. Admin has proof (signed agreement + first payment).</td><td>Credits referring partner 909 (999 minus 9%)</td><td>Lead status becomes Converted. Referring partner's wallet balance re-evaluated</td></tr>\n<tr><td>RequestWithdrawal</td><td>Partner status is Active. Balance above 999 (the reserve).</td><td>Converts the withdrawable portion to real currency at the current RBI reference rate</td><td>Wallet balance reduced by the withdrawn amount, floor stays at 999</td></tr>\n<tr><td>RecordDealClosure</td><td>A Lead exists with status Converted.</td><td>Creates a Deal record linked to the Lead. Applies the 12-month proration rule if deal_duration exceeds 12 months.</td><td>referral_fee_entitlement and referral_fee_net calculated (see formulas below)</td></tr>\n<tr><td>RaiseDispute</td><td>Within 14 days of the decision being disputed.</td><td>Starts the 24-hour admin-response clock. Triggers admin notification (popup + email).</td><td>Dispute record created, status Raised</td></tr>\n</table>\n\n<h2>Formulas</h2>\n<table class=\"dtable\">\n<tr><th>What</th><th>Formula</th></tr>\n<tr><td>Conversion reward, net to referring partner</td><td>999 \u00d7 (1 - 0.09) = 909</td></tr>\n<tr><td>Negative balance freeze floor</td><td>-2,997 (exactly -999 \u00d7 3)</td></tr>\n<tr><td>At-Risk threshold</td><td>-1,500 (roughly half of -2,997)</td></tr>\n<tr><td>Top-up amount and effect</td><td>Entry fee \u00d7 4 (\u20b93,996 or $196) adds 3,996 credits. Always moves balance from exactly -2,997 to exactly +999.</td></tr>\n<tr><td>Deal-closure referral fee entitlement</td><td>10% of the applicable deal value (see proration rule below)</td></tr>\n<tr><td>Deal-closure referral fee, net to referring partner</td><td>entitlement \u00d7 0.91 (Sarthy takes 9% of the 10%)</td></tr>\n<tr><td>12-month proration rule</td><td>If deal_duration \u2264 12 months, use the full deal_value. If deal_duration > 12 months, use only the value invoiced in the first 12 months - not the full multi-year contract value.</td></tr>\n<tr><td>Goodwill credit expiry</td><td>issue_date + 30 days. Paid credits never expire.</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the balance-threshold diagram in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a> for how the freeze floor and the At-Risk line sit relative to each other.</p>\n\n<h2>Validation and edge-case rules</h2>\n<ul>\n<li><strong>Duplicate detection:</strong> runs at the moment of upload, before the lead reaches admin - not a background job that runs later.</li>\n<li><strong>Consent-refusal counting:</strong> 4 consecutive refusals for the same receiving partner (not 4 total, not 4 in a rolling window) flags the partner to admin. The count resets on any acceptance.</li>\n<li><strong>No acknowledgment window:</strong> retired along with the old self-service accept/decline. A Lead can sit at Introduced or Validated indefinitely - nothing about it finalizes automatically at any hour count. It only changes state when admin actively approves or a requested party refuses consent.</li>\n<li><strong>Dispute window:</strong> 14 days from the decision being disputed, in writing. Admin response target: 24 hours from that point. Unaffected by the acknowledgment-window retirement above - this is the separate, still-active window for disputing a conversion decision (Section 9 of the Playbook), not the old lead-acceptance window.</li>\n<li><strong>At-Risk and Frozen are independent triggers</strong> - evaluate both conditions separately on every wallet-affecting event, don't treat one as implying the other.</li>\n</ul>\n"}, {"id": "replit-build-brief", "content_file": "replit-build-brief.html", "cat": "Technical Documents", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Replit Build Brief", "desc": "Platform-specific companion to the Low-Level Spec - build order, lock-in risks, and human-review checkpoints for building on Replit", "html": "<p class=\"callout\">The platform-specific companion to the Low-Level Spec, written for whoever actually builds this on Replit. It doesn't repeat the business rules or data model - those live in the BRD, the Data Dictionary, and the Low-Level Spec. This document only adds what's specific to building on Replit: the technical choices to make deliberately, the build order that matches how Replit Agent actually works, and where a human needs to check the output rather than trust it.</p>\n\n<h2>Two choices to make deliberately, not by default</h2>\n<p>Replit Agent defaults to its own built-in services for storage and login. They work well inside Replit, but create real lock-in - and this system handles real financial data, with a regulatory review already pending on the Action Tracker. Don't accept the defaults here:</p>\n<ul>\n<li><strong>Database:</strong> use standard PostgreSQL, not Replit's built-in database. When the agent suggests its own, redirect it explicitly.</li>\n<li><strong>Authentication:</strong> use a standard library (Passport.js, Auth.js, or similar), not Replit's built-in auth. Same reason - portability matters more than convenience here.</li>\n</ul>\n<p>Everything else Replit scaffolds automatically (hosting, deployment, the dev environment itself) is fine to accept as-is - the lock-in risk is specifically in these two choices.</p>\n\n<h2>Build order</h2>\n<p>Matches the BRD's MVP tagging - build and stabilize the MVP-tagged sections first, treat Phase 2 as genuinely separate follow-up work rather than one combined spec. AI-generated code is well-documented to not scale cleanly past MVP-sized scope, so this isn't just a sequencing preference.</p>\n<ol>\n<li>Core data model - Partner, Credit Wallet, Lead (BRD Sections 3, 4, 5)</li>\n<li>Lead flow and acknowledgment (BRD Section 5, using the Low-Level Spec's Lead state machine directly)</li>\n<li>Conversion, disputes, and withdrawal (BRD Sections 6, 7)</li>\n<li>Post-closure referral fee tracking (BRD Section 8)</li>\n<li>Negative balances and the freeze/top-up mechanic (BRD Section 10)</li>\n<li>Integration requirements - payment gateway, e-signature (BRD Section 14) - these usually need to exist before the flows above can be tested end to end for real</li>\n<li>Everything tagged Phase 2 - gamification, full automation of notifications, pattern-detection reporting</li>\n</ol>\n\n<h2>What to feed the agent for each phase</h2>\n<p>A good Replit Agent prompt reads like a short product brief, not a raw requirements dump. For each phase above: pull the relevant BRD section's \"must\" statements directly, reference the Low-Level Spec's state machine and formulas for that area, and use the Playbook's worked examples as literal test cases to check the output against once built.</p>\n\n<h2>Where a human has to check the output, not just trust it</h2>\n<ul>\n<li><strong>Every financial calculation</strong> - the 9% fee, the 12-month proration, the negative-balance freeze math. Verify against the Low-Level Spec's formulas and the Playbook's worked examples line by line, not just \"does it look reasonable.\"</li>\n<li><strong>The Lead and Partner state machines</strong> - confirm every transition in the Low-Level Spec's tables is actually implemented, including the ones that are easy to skip (like a Dormant partner being able to submit a lead as their recovery path).</li>\n<li><strong>Before any major change,</strong> use Replit's checkpoint feature - there are documented cases of the agent deleting working code while attempting a fix.</li>\n</ul>\n\n<h2>Cost awareness</h2>\n<p>Replit Agent uses effort-based, credit-metered pricing - cost isn't fixed per feature. Worth tracking actual spend against the still-unconfirmed <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">development budget</a> as building progresses, not just at the end.</p>\n"}, {"id": "reporting-dashboard", "content_file": "reporting-dashboard.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Both", "title": "Reporting Dashboard", "desc": "A simple view of progress, measured against Sarthy's own KPIs", "html": "<p class=\"callout\">A simple view of progress, measured directly against Sarthy's own scorecard - not a new set of metrics invented separately. Until a real connected dashboard exists, this same structure works as a manual monthly report, built from the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>'s tables.</p>\n\n<div class=\"gantt\">\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Finding & signing partners (20%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:20%;\">20%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Supporting startups (40%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:40%;\">40%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Match-Making (30%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:30%;\">30%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Research & reporting (10%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:10%;\">10%</div></div>\n</div>\n</div>\n<p style=\"font-size:12.5px;color:var(--ink-faint);margin:-0.5rem 0 1.5rem;\">These bars show Sarthy's fixed scorecard weights, not live performance - once real numbers exist, each category gets its own actual result, not just its weight.</p>\n\n<h2>What each category actually reports on</h2>\n<p>Every measure below is already defined in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 19</a> - this table just adds where the number comes from.</p>\n<table class=\"dtable\">\n<tr><th>Category</th><th>Measure</th><th>Data source</th></tr>\n<tr><td rowspan=\"3\">Finding & signing partners</td><td>New partners signed and onboarded per month</td><td>Partners table - count by onboarding date</td></tr>\n<tr><td>Time from first contact to signed agreement</td><td>Not currently tracked - needs a contact-date field added</td></tr>\n<tr><td>Share of newly signed partners who reach real activity, not just a signature</td><td>Partners table - status vs. onboarding date, directly targets the \"Part of Platform\" gap</td></tr>\n<tr><td rowspan=\"3\">Supporting startups</td><td>Call volume - startup calls and check-ins per month</td><td>Not currently tracked - needs a startup-contact log, separate from the partner call queue</td></tr>\n<tr><td>Outcomes - startups actually matched, not just contacted</td><td>Leads table - startups with at least one Introduced lead</td></tr>\n<tr><td>Startup feedback captured</td><td>Not currently tracked - no mechanism exists yet</td></tr>\n<tr><td rowspan=\"4\">Match-Making</td><td>Leads matched per month</td><td>Leads table - count by month, status Introduced or later</td></tr>\n<tr><td>Time from submission to match, vs. the 5-day target</td><td>Leads table - submitted_at to introduced timestamp</td></tr>\n<tr><td>Share validated vs. rejected or stalled</td><td>Leads table - lead_status distribution</td></tr>\n<tr><td>Spread of matches across the partner base</td><td>Leads table - distinct receiving_partner_id count vs. total leads</td></tr>\n<tr><td rowspan=\"2\">Research & reporting</td><td>Monthly report on activity trends</td><td>This dashboard itself, once populated</td></tr>\n<tr><td>Written recommendations and whether they're acted on</td><td>Not currently tracked - needs a simple recommendations log</td></tr>\n</table>\n\n<h2>What's missing before this can actually run</h2>\n<p>Half the measures above have a real data source already. The other half need something built first - most of it small:</p>\n<ul>\n<li>A contact-date field on the Partner record, to measure time-to-signature</li>\n<li>A startup-contact log, separate from the existing partner call queue in the Interim Operating System</li>\n<li>A lightweight recommendations log - even a simple running list would satisfy this for now</li>\n</ul>\n\n<h2>Cadence</h2>\n<p>Monthly, at minimum - matching the existing BRD requirement. Nothing here needs to be real-time; a month-old number is still useful for spotting a trend, which is what this is actually for.</p>\n"}, {"id": "migration-wave-plan", "content_file": "migration-wave-plan.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.2", "updated": "Restored after briefly being decommissioned - the Lead determined it holds real data needed for post-launch migration planning. Gantt stays decommissioned; only this one came back.", "type": "Both", "title": "Migration Wave Plan", "desc": "The order in which partner groups move onto the platform", "html": "<p class=\"callout\">The actual sequence for moving partners onto the real platform - both the existing signed partners from before, and the 25+ new applicants already waiting for access. Builds directly on the Segmentation Framework, the Graduation Criteria, and the Interim Operating System's decision to treat migration exactly like new-partner onboarding.</p>\n\n<div class=\"pending-box\" style=\"text-align:left;\">\n<strong>Restored after briefly being decommissioned:</strong> this document was cut, then restored - the Lead determined it holds real data needed for post-launch migration work and shouldn't be lost. Migration itself is still a deferred, post-build activity, not something being actively sequenced right now, and this document isn't part of the Technical Build Specification going to the development team - it's kept here as ready reference for whoever runs migration once the platform is actually built and live. One known, still-open item: this document's Wave 2 gate (legal review, fee-split math) and the <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Graduation Criteria</a>'s own readiness gate don't currently reference each other, despite the dependency map once implying they were linked - left unreconciled on purpose until migration planning actually resumes, not before.\n</div>\n\n<h2>Before any wave starts</h2>\n<p>These are real blockers, not just a checklist - see the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item & Blocker Tracker</a> for current status on each:</p>\n<ul>\n<li>The data migration spreadsheet template is built and populated with real records</li>\n<li>Legal review of existing Partner 1.0-era agreements has at least started - Wave 2 specifically can't proceed without it</li>\n<li>Portal access confirmed, so the real feature inventory exists and matches what this plan assumes is buildable</li>\n</ul>\n\n<h2>Wave 0 - Pilot</h2>\n<p><strong>Who:</strong> 2-3 of the current Alpha users who already show some real usage, not zero activity.</p>\n<p><strong>Why first:</strong> lowest risk - these partners are already somewhat familiar with the platform, so problems surface here before a wider group sees them. This is the seed group working toward Sarthy's real target in the <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Graduation Criteria</a>.</p>\n\n<h2>Wave 1 - Core rollout, toward the 10-partner target</h2>\n<p><strong>Who:</strong> existing partners on the standard 10% agreement (no special exceptions), plus new applicants who complete onboarding cleanly. This is the bulk of the push toward Sarthy's confirmed target of 10 active partners within 2 weeks of full launch.</p>\n<p><strong>Selection order within the wave:</strong> pre-migration, there's no real giving_pattern data to sort by - every migrated partner starts blank, same as a new signup (see the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>). Until real activity accrues, use whatever engagement signal exists in the old tracker - a partner with some history of referring or receiving under the old system is a safer early pick than one with none at all.</p>\n<p><strong>New applicants:</strong> the 25+ already waiting for access fold into this same wave's cadence, going through standard onboarding (<a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 5</a>) rather than a separate track.</p>\n\n<h2>Wave 2 - Special-agreement partners</h2>\n<p><strong>Who:</strong> the known signed exceptions from the Current-State Assessment - a reverse 60/40 profit-sharing arrangement, a flat \u20b910,000-per-trial bonus, and a tiered 15%/20% commission structure.</p>\n<p><strong>Why held back:</strong> the 9% facilitation fee now applies to every partner, including these - but exactly how a 9% cut interacts with a 60/40 split or a flat bonus rather than a percentage isn't worked out yet. Moving too fast here risks getting the math wrong on exactly the agreements that already have real, signed money terms.</p>\n\n<h2>Wave 3 - Reactivating long-inactive partners</h2>\n<p><strong>Who:</strong> partners from the old system with no recent activity at all - not just \"Part of Platform\" blank, but genuinely dormant.</p>\n<p><strong>How:</strong> this isn't really a migration wave so much as a reactivation campaign - use the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">reactivation outreach template</a> and the rotating weekly quota already defined in the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>, rather than a one-time push.</p>\n\n<h2>Pacing</h2>\n<p>A proposed starting point, not a fixed rule: a handful of partners at a time, not a bulk import all at once. With a two-person team running this manually through the Interim Operating System, moving faster than that risks quality dropping - a bad first experience for a migrated partner is harder to undo than a slower start. Worth revisiting once Wave 0 shows how much time each migration genuinely takes.</p>\n"}];

into the current rules. Phase 0 Discussion Doc updated to point to each recorded assumption rather than showing stale fully-open questions."}, {"date": "v6.1", "title": "Money mechanics tightened up", "desc": "Corrected the 9% fee to apply at credit-transfer time (on conversion), not at withdrawal - flows through Sections 6, 7, 8, and 10 consistently. Programme switching locked permanently at sign-up. Goodwill/coupon credits now expire at exactly 30 days. Negative balance can run to -3,000 before the account freezes, requiring replenishment to +999 to unfreeze. Credit count resolved as currency-neutral - 999 never reprices; real currency only enters at the point of withdrawal, using that day's live exchange rate."}, {"date": "v6.2", "title": "Lead-tracking windows, rollout target, and admin ownership confirmed", "desc": "Acknowledgment window set to 3 days, stall window to 1 week (Section 7) - what happens at a stall is still open, re-clarified with the Lead. Section 18 now has Sarthy's real rollout target: 10 active partners within 2 weeks of full launch. Current-State Assessment refined to note existing Alpha users are infrequent, not active. Phase 0 doc updated: dispute handling and bug/feature routing both go to admin, with follow-up detail still needed on each. Feature inventory (live vs. planned) deferred as an action item pending portal access, not guessed at."}, {"date": "v7.0", "title": "Business Requirements Document drafted; more money mechanics closed", "desc": "Pulled the BRD forward in the sequence and drafted its first version - a full To-Be requirements list built directly from Partnership SOP v1.0, organized by module, with an open-decisions log carried forward. Resolved: 9% fee charged once at transfer, not again at withdrawal. Negative-balance top-up priced at 3x entry fee (2,997 credits) - flagged a real numbers gap at the -3,000 floor rather than smoothing over it. Dispute SLA set to 24-hour admin response. Stall-handling recorded as an open proposal (admin discretion plus startup confirmation as evidence), not a final decision. Clarified the 9% fee's relationship to the older 10% direct referral-fee flow, left open. Broadened the dependency map so the BRD is checked against any SOP change, not just confirmations."}, {"date": "v8.0", "title": "Second reward track discovered and documented - deal-closure referral fee", "desc": "The Lead clarified there are two separate reward systems: the 999-point lead-share credit (Sections 5-10) and a previously-undocumented 10% deal-closure referral fee, paid annually, with a 1-year tail. Added as new Section 20 (referral fee) and Section 21 (dormancy rule - 3 months inactive), pushing FAQ to 22 and Closing to 23. This resolved the oldest open question in the project: the 9% facilitation fee applies to both tracks, on the 10% entitlement for referral fees. Fixed a real inconsistency: Sections 15 and 17 had empty placeholders while their actual content had been written into Section 7 - moved it to the right place. Corrected the negative-balance numbers (-2,997 floor, 4x999 top-up) which now land exactly on +999, fixing the math gap flagged two rounds ago. Simplified the acknowledgment/stall system from two separate windows (3 days, 1 week) to one unified 1-week window. Updated the BRD to match throughout, adding its own new Sections 8-9 for the same two topics."}, {"date": "v9.0", "title": "Five documents drafted in one push - Gap & Risk Register, Segmentation, Journey Map, Comms Library, Graduation Criteria", "desc": "Per the Lead's decision to keep building rather than wait on the Sarthy meeting. Fixed a real bookkeeping gap along the way: Partner Journey Map had been referenced throughout the hub since the very beginning but was never actually added to the queued list - added retroactively before drafting it. Partnership SOP v1.0 Sections 11, 14, 16, 17, and 18 all updated from pending placeholders or generic mentions to real links, now that the documents they were waiting on exist. 14 of 19 total documents now drafted."}, {"date": "v9.1", "title": "Data Dictionary drafted", "desc": "Defined every entity used across the SOP and BRD - Partner, Credit Wallet, Lead, Deal, Dispute - with precise status definitions (the difference between At-Risk, Dormant, and Frozen matters and wasn't spelled out clearly before). 15 of 19 documents now drafted. Pacing deliberately from here rather than drafting the remaining four in one push."}, {"date": "v10.0", "title": "Switched to a collapsible left sidebar", "desc": "Replaced the two-tier top navigation with a left sidebar where each category expands and collapses independently - handles the growing document count (19 total now) much better than wrapping tabs. The category containing whatever document is open stays expanded automatically; others start collapsed. Tooltips now appear to the side instead of below, to fit the narrower layout."}, {"date": "v10.1", "title": "Sidebar now hover-out, with a pin option", "desc": "The sidebar tucks away to a thin 14px edge strip by default and slides fully into view on hover - no longer takes up permanent screen width. Added a pin button (top of the sidebar) for anyone who wants it to stay open without holding the mouse there. On mobile/touch screens, where hover doesn't apply, it falls back to the normal static stacked layout instead."}, {"date": "v10.2", "title": "Sidebar back to static, always-visible", "desc": "Reverted from the hover-out drawer to a fixed-width sidebar sitting permanently alongside the content - no longer needs a hover or a pin button. Category expand/collapse behavior stays the same."}, {"date": "v10.4", "title": "Category document lists now permanently expanded", "desc": "Removed the click-to-expand/collapse behavior entirely - every category's document list stays visible at all times, no toggling."}, {"date": "v11.0", "title": "Content cleanup - redundancy and staleness pass", "desc": "Reviewed all 16 documents for redundant and stale content. Fixed: guide.html's navigation instructions described the old top-nav interface, not the current static sidebar. Phase 0 doc trimmed 59% (1011 to 416 words) - most of it was resolved items now fully duplicated in the SOP; also caught two genuinely stale items (currency conversion and programme switching were marked 'still open' but had actually been resolved rounds ago). Sequence page dropped its redundant status column (the sidebar's dots already show this) and fixed a stale entry claiming SOP sections were still queued when they'd been written. Deliverables Register trimmed a redundant intro explanation. BRD's matchmaking bullet trimmed to a link instead of re-explaining. Checked and ruled out: Current-State vs Playbook history tables looked duplicate but serve different purposes (evidence vs. rules comparison) - kept both. BRD's overall density was reviewed and found appropriately lean, not bloated as initially estimated from word count alone."}, {"date": "v12.0", "title": "Partnership SOP restructured for readability", "desc": "Applied all 5 simplification directions to the flagship document. Added a ~250-word Quick Summary block at the top. Removed repeated inline hedge phrases ('working assumption, pending Sarthy sign-off') throughout - the status pill already conveys this, so it no longer needed restating in nearly every paragraph. Consolidated scattered mid-section open items into one clear note at the end of each affected section, instead of interleaved with the rules themselves. Cut audit-trail commentary that had crept into reader-facing prose (e.g. 'unlike the earlier version of this rule', 'this resolves one of the oldest open questions') - that belongs in the changelog, not the rulebook. Added a hand-built SVG diagram for the Section 7 lead lifecycle. Net result: 4,461 words to 3,352 - a 25% reduction despite adding the new summary block and diagram."}, {"date": "v13.0", "title": "All 11 findings from the manual review report resolved", " urrent-State Assessment, Communication Template Library, Data Dictionary mentioned as plain text in gap-register.html, guide.html, playbook.html, interim-system.html, and segmentation.html) - all fixed."}, {"date": "v14.0", "title": "Readability improvements, phase 1 of 2", "desc": "Added a jump-to-section table of contents at the top of Partnership SOP (23 sections now have real anchor links). Introduced colour-coded amounts throughout - green for credits in, red for deductions, amber for Sarthy's fee - applied to the wallet table, the credit rules, and the referral-fee math. Added two new worked examples (hitting and recovering from the credit freeze; a real \u20b95L deal walked through the referral-fee split) using a new 'example' box style, visually distinct from the existing 'still open' and 'key context' boxes. Converted the six credit rules and the FAQ from lists/paragraphs into tables for faster scanning. Phase 2 (diagrams, glossary page, search, Gantt chart page) to follow as a separate checkpoint."}, {"date": "v15.0", "title": "Glossary added, search/filter added to sidebar", "desc": "New Glossary page under Start Here - defines the four meanings of 999, giving_pattern vs status, the two reward tracks, the 9% fee principle, status pill colours, and role definitions, each linking back to full detail. Added a live search box at the top of the sidebar - typing filters both category and document lists in real time, matching against title and description text. Search term persists as you navigate between documents."}, {"date": "v16.0", "title": "Readability improvements, phase 2 complete - diagrams and project plan", "desc": "Added two more hand-built SVG diagrams: the referral-fee split (Section 20 - a visual waterfall of the 10% entitlement splitting into Sarthy's 9% and the referrer's 91%), and a partner account-status state diagram (Segmentation Framework - showing how Active leads to At-Risk, Dormant, and Frozen, and the recovery paths back to Active, including the combined-state rule). Added a new Project Plan (Gantt View) page under Strategic Planning - a CSS-based horizontal timeline of all 6 roadmap phases, honestly distinguishing documentation-complete from real-world rollout-not-yet-started, using relative week numbers since real calendar dates were never tracked. This completes both phases of the readability improvement effort requested."}, {"date": "v17.0", "title": "Action Item & Blocker Tracker added, requirements-gathering gaps plugged", "desc": "Did a reviewer-style pass on requirements-gathering completeness before the BRD - found 12 real gaps, verified each against actual file content (dropped 3 initial suspicions that turned out to be false positives). New Action Item & Blocker Tracker page (Tracking & Governance) - a dependency-chain diagram plus full table showing what real-world action items (legal review, regulatory review, data migration, payment gateway selection) are blocking what, colour-coded by status. Data migration approach decided: bulk spreadsheet import with a predefined column format matching the Data Dictionary's Partner fields - documented in the Interim Operating System. Gap & Risk Register updated with the 3 critical findings, linked to the new tracker rather than duplicated."}, {"date": "v18.0", "title": "All 12 requirements-gathering gaps closed or properly tracked", "desc": "BRD now tags every section MVP or Phase 2 (12 sections tagged, a few split where the basic version is MVP but full automation can wait) - defines what's essential for a real first launch. Added a Non-Functional Requirements section (baseline security/privacy, no formal uptime SLA yet, per the Lead's decision). Added acceptance criteria for the four requirements most likely to be interpreted differently by different developers (duplicate detection, acknowledgment/stall timing, the -2,997 freeze boundary, 12-month proration). Formalized Integration Requirements as its own section. Sign-off process resolved - written approval from a specifically named Sarthy person/role is required; who that person is remains the one open item. Added an existing-partner transition message template to the Comms Library. This closes the reviewer-style requirements-gathering pass in full - 7 items genuinely resolved with real content, 5 properly tracked as action items that need real-world action, not a documentation fix."}, {"date": "v18.1", "title": "Dependency map rewritten - was significantly stale, not just missing 2 rows", "desc": "Claude Code flagged the Action Item Tracker was missing from meta/dependency-map.md and fixed it directly in the last commit - good catch. Checking further revealed the whole file had drifted badly: it still referenced old section names (\"\u00a74 Commercial Mechanics\", \"\u00a711 Escalation SOP\", \"\u00a713 KPI Framework\") and appendix labels (\"Appendix A/B/D\") that don't match the SOP's current 23-section structure, and still listed \"Escalation & Dispute SOP\" and \"Dormant-Partner Reactivation Process\" as separate documents even though those were merged into the SOP many rounds ago. Rewrote the file entirely against current reality. Also synced guide.html's hub-facing dependency table, which was mostly current but missing the same three new documents (Glossary, Gantt, Action Tracker) and one stale section title. This reflects a real process gap - the dependency-map protocol wasn't followed consistently across several rounds of adding new documents; worth treating as a standing commit-blocking check going forward, not a one-time fix."}, {"date": "v19.0", "title": "All 5 findings from the second manual review resolved", "desc": "Verified all 5 findings against actual file content before fixing - all confirmed real. Fixed: (1) Migration Wave Plan contradiction resolved by simplifying migration to follow identical rules as new-partner onboarding - no special 'migrated' status category means nothing to conflict with the Segmentation Framework's normal logic. (2) Section 19 was only explaining 2 of the 4 KPI categories it claimed to cover - added measures for 'finding and signing up partners' and 'supporting startups'. (3) At-Risk given a specific numeric threshold (-1,500) distinct from Taker's pattern-based definition, with a worked example showing they don't have to fire together. (4) Confirmed and made explicit that At-Risk is purely an outreach-priority flag - full Active privileges continue unchanged. (5) Glossary's status pill explanation fixed to clarify the accompanying text (not just colour) carries the real distinction between two same-coloured sections."}, {"date": "v19.1", "title": "Replaced \u00a7 with # for section references across the hub", "desc": "Style correction - every instance of \u00a7N (Gap & Risk Register, Data Dictionary, Journey Map, Segmentation Framework, Comms Library, Graduation Criteria, and meta/dependency-map.md - 80 instances total) now reads #N instead. Partnership SOP itself already spelled out 'Section N' in full, so this brings everything else in line with a single consistent convention rather than three different ways of referencing the same thing."}, {"date": "v20.0", "title": "Comprehensive self-review across all 19 documents", "desc": "Systematic integrity pass, same methodology as the two manual reviews, applied to the whole hub. Numbers audit: verified -2,997/-1,500/+3,996 math, KPI weights (20/40/30/10), the 1-week acknowledgment window, 4+ decline threshold, 30-day coupon expiry, 5-working-day validation, the 10%/91%/9.1% referral split, and the 10-partners/2-weeks rollout target - all consistent everywhere they're mentioned, no contradictions found. Ran a script checking every showDoc() link resolves to a real document - zero broken links. Ran a second script checking every document title for unlinked plain-text mentions across all other documents - found ~15 genuine misses (mostly opening callouts, the highest-value place to link) and fixed them; correctly identified
