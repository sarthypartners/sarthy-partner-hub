 before flagging as disputed.\"</blockquote>\n\n<h2>5. Dormancy warning (approaching 3 months)</h2>\n<p><em>Trigger: SOP #21, roughly 2 weeks before the dormancy line</em></p>\n<blockquote>\"We noticed it's been a while since your last referral - just checking in before anything changes on your account. Is there anything blocking you from sending a lead, or can we help you find one worth referring?\"</blockquote>\n\n<h2>6. Dormant status notification</h2>\n<p><em>Trigger: SOP #21, on crossing 3 months inactive</em></p>\n<blockquote>\"Your account's moved to inactive status after 3 months without a referral, so you're currently off the public partner listing and won't receive new leads. This isn't permanent - reach out any time and we'll get you reactivated.\"</blockquote>\n\n<h2>7. Reactivation outreach</h2>\n<p><em>Trigger: dormant-partner win-back campaign, SOP #17</em></p>\n<blockquote>\"It's been a bit since we've connected - wanted to check in and see how things are going on your end. A lot has changed in the partner program since you were last active, including [specific update]. Worth a quick call to catch up?\"</blockquote>\n\n<h2>8. Monthly engagement check-in</h2>\n<p><em>Trigger: SOP #15, ongoing cadence</em></p>\n<blockquote>\"Monthly check-in - how's the partner program working for you lately? Any leads you're sitting on that we could help move, or types of leads you'd like to see more of?\"</blockquote>\n\n<h2>9. Dispute acknowledgment</h2>\n<p><em>Trigger: SOP #9, within 24 hours of a dispute being raised</em></p>\n<blockquote>\"We've received your dispute on [lead/conversion ID] and are looking into it now - you'll hear back from us within 24 hours with next steps.\"</blockquote>\n\n<h2>10. Annual referral fee payout notice</h2>\n<p><em>Trigger: SOP #20, March 31st settlement</em></p>\n<blockquote>\"Your annual referral fee payout for [year] is ready - [amount] based on deals closed through your referrals this year. Details and payout timing below.\"</blockquote>\n\n<h2>11. Existing partner transition notice</h2>\n<p><em>Trigger: a partner who signed under the original flat 10% referral model, before this new dual-track system existed. Not a new-partner onboarding message - a genuine explanation of what's changed for them.</em></p>\n<blockquote>\"Since you joined, we've redesigned how the partner program works - you can now earn credits by referring leads directly to other partners too, not just from Sarthy. Nothing about your existing arrangement is changing without your agreement first - we'll walk you through exactly what's new and get your sign-off before anything about your account changes.\"</blockquote>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">Note: this message assumes existing partners need a new or amended agreement before moving to the new model. See the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a>'s legal review item - don't send this at scale until that's confirmed.</p>\n"}, {"id": "graduation-criteria", "content_file": "graduation-criteria.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.4", "updated": "Linked/updated now that Migration Wave Plan is drafted", "type": "Internal", "title": "Alpha to Beta Graduation Criteria", "desc": "The targets we need to hit before opening the app to more partners", "html": "<p class=\"callout\">The targets to hit before opening the platform beyond the current small Alpha group. Anchored to the one real target Sarthy has already set (SOP #18). A few supporting criteria make sure \"10 active partners\" means genuinely active - not just signed up.</p>\n\n<h2>Sarthy's confirmed target</h2>\n<p><strong>At least 10 active partners within 2 weeks of the app being fully live</strong> - not the current early-testing state.</p>\n\n<h2>Supporting criteria - proposed, to make \"active\" mean something real</h2>\n<ul>\n<li>Each of the 10 must have completed at least one full lead cycle - they submitted or received a lead that reached acknowledgment, not just logged in once.</li>\n<li>No partner among the 10 should be sitting at the -2,997 freeze threshold. A technically \"active\" account that's actually stuck doesn't count.</li>\n<li>At least one dispute or edge case - a decline, a stall, a rejection - should have been handled through the real process, not just simulated. This proves the guardrails actually work under real conditions.</li>\n<li>The duplicate-lead detection and acknowledgment-window mechanics (BRD #5) should be confirmed working, not just specified.</li>\n</ul>\n<p><strong>Note on \"full lead cycle\":</strong> here it specifically means reaching acknowledgment - a deliberately lighter bar than the conversion-based cycle described in the SOP (Sections 6, 7, 9). The point at this stage is proving the mechanics work end to end quickly, not requiring an actual paid deal. Real conversions are what the KPI reporting in SOP Section 19 tracks over the longer term.</p>\n\n<h2>What happens if the 2-week window is missed</h2>\n<p>Not currently defined by Sarthy - worth raising directly rather than assuming. Does the target simply extend? Or does it trigger a review of what's not working in onboarding?</p>\n\n<h2>Feeds into</h2>\n<p>The <a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Migration Wave Plan</a>. Wave 2 shouldn't begin until these criteria are genuinely met - not just when 2 weeks have passed on the calendar.</p>\n"}, {"id": "data-dictionary", "content_file": "data-dictionary.html", "cat": "Operational Tools", "status": "draft", "version": "2.8", "updated": "Added an entity-relationship diagram plus cross-links to two Playbook diagrams", "type": "Internal", "title": "Data Dictionary / SSOT Schema", "desc": "One clear definition for every piece of partner data we track", "html": "<p class=\"callout\">One shared definition for every piece of partner data this program touches - so \"status,\" \"balance,\" or \"active\" means exactly the same thing whether it's in a conversation, a spreadsheet, or eventually the app itself. Every field traces back to a specific <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> section.</p>\n\n<svg viewBox=\"0 0 760 285\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:680px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowED\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"280\" y=\"10\" width=\"200\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"380\" y=\"38\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Partner</text>\n\n    <line x1=\"380\" y1=\"56\" x2=\"380\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n    <text x=\"470\" y=\"82\" fill=\"var(--ink-faint)\" font-size=\"9.5\">1 wallet per partner</text>\n\n    <rect x=\"280\" y=\"100\" width=\"200\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"380\" y=\"128\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Credit Wallet</text>\n\n    <line x1=\"480\" y1=\"33\" x2=\"500\" y2=\"33\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"33\" x2=\"500\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"127\" x2=\"530\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <rect x=\"535\" y=\"100\" width=\"210\" height=\"54\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"640\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Lead</text>\n\n    <line x1=\"640\" y1=\"154\" x2=\"640\" y2=\"195\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n    <text x=\"655\" y=\"178\" fill=\"var(--ink-faint)\" font-size=\"9.5\">1:1, once Converted</text>\n\n    <rect x=\"535\" y=\"197\" width=\"210\" height=\"50\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"640\" y=\"227\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Deal</text>\n\n    <line x1=\"535\" y1=\"220\" x2=\"490\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <line x1=\"535\" y1=\"127\" x2=\"505\" y2=\"127\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"505\" y1=\"127\" x2=\"505\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"505\" y1=\"220\" x2=\"490\" y2=\"220\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowED)\"/>\n\n    <rect x=\"280\" y=\"197\" width=\"200\" height=\"50\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"380\" y=\"227\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"12\">Dispute</text>\n\n    <text x=\"380\" y=\"262\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">A partner can appear on a Lead up to 3 ways &#8212; as the referring, originating, and/or receiving partner.</text>\n    <text x=\"380\" y=\"277\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">Every dispute links to a lead_id or a deal_id &#8212; never something invented outside these five tables.</text>\n  </g>\n</svg>\n\n<h2>Partner</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>partner_id</td><td>Text</td><td>Unique identifier, assigned at onboarding</td><td>SOP #5</td></tr>\n<tr><td>programme</td><td>India / International</td><td>Locked permanently at sign-up, never changes</td><td>SOP #5</td></tr>\n<tr><td>status</td><td>Applicant / Active / At-Risk / Dormant / Frozen / Exited</td><td>See the status definitions below - controls what the account can do on the platform</td><td>SOP #5, #8, #21</td></tr>\n<tr><td>onboarding_notes</td><td>Free text</td><td>Discovery-call read on service relevance, client diversity, professional standing, initial Giver/Taker impression</td><td>SOP #5, #11</td></tr>\n<tr><td>giving_pattern</td><td>Giver / Balanced / Taker</td><td>Only meaningful when status is Active - recalculated from wallet trend, not set manually. Deliberately separate vocabulary from status, so the two never get confused - see the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a></td><td>Segmentation Framework</td></tr>\n<tr><td>last_lead_shared_date</td><td>Date</td><td>Drives the 3-month dormancy calculation</td><td>SOP #21</td></tr>\n</table>\n\n<h2>Status definitions - precise, not casual</h2>\n<table class=\"dtable\">\n<tr><th>Status</th><th>Means exactly this</th></tr>\n<tr><td>Applicant</td><td>Applied, not yet through evaluation or fee payment</td></tr>\n<tr><td>Active</td><td>Onboarded, wallet balance above -2,997, has shared at least one lead in the last 3 months</td></tr>\n<tr><td>At-Risk</td><td>Active, but balance at or below <strong>-1,500</strong> (roughly halfway to the -2,997 freeze floor), or 4+ consecutive declines flagged. <strong>Confirmed: this is purely a flag, not a restriction</strong> - an At-Risk partner keeps every privilege of an Active account and can still send and receive leads normally. The only actual effect is getting bumped to the top of the Associate's outreach priority (see the Segmentation Framework). Deliberately different from <code>giving_pattern</code>=Taker, which is a longer-term behavioral trend, not a threshold. The two are related - a sustained Taker pattern will often eventually cross -1,500 - but don't have to fire together. A single bad stretch of received leads can trigger At-Risk on an otherwise healthy Giver, and a slow long-term Taker with a big starting buffer can stay well clear of -1,500 for a long time.</td></tr>\n<tr><td>Dormant</td><td>3+ months with no lead shared - removed from public listing, blocked from receiving new leads, but not frozen for balance reasons</td></tr>\n<tr><td>Frozen</td><td>Balance has hit -2,997 - blocked from receiving new leads until topped up to +999. Distinct from Dormant, and a partner could technically be both. <strong>If both apply:</strong> pay the top-up first, then send a lead. The top-up clears Frozen status. Sending a lead is what clears Dormant.</td></tr>\n<tr><td>Exited</td><td>Account closed, by the partner's choice or Sarthy's, per the guardrails in SOP #13</td></tr>\n</table>\n\n<h2>Credit Wallet</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>balance</td><td>Integer (can be negative)</td><td>Current credit balance, floor -2,997, no upper cap</td><td>SOP #6, #8</td></tr>\n<tr><td>paid_credits</td><td>Integer</td><td>Portion of balance that came from real payment - never expires</td><td>SOP #6</td></tr>\n<tr><td>goodwill_credits</td><td>Integer, with expiry_date</td><td>Portion issued by Sarthy as a coupon - expires 30 days from issue</td><td>SOP #6</td></tr>\n<tr><td>ledger_entry</td><td>Record: amount, reason, timestamp</td><td>Every single add or deduction, permanently logged - reasons: fee_payment, lead_received, conversion_earned, topup, withdrawal</td><td>SOP #6, #7</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the balance-threshold diagram in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a> for how the -2,997 floor and the -1,500 At-Risk line sit relative to each other.</p>\n\n<h2>Lead</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>lead_id</td><td>Text</td><td>Unique identifier</td><td>SOP #7</td></tr>\n<tr><td>referring_partner_id</td><td>Reference</td><td>Who submitted it - only set in Path A (direct referral). Blank in Path B (startup self-selected)</td><td>SOP #7</td></tr>\n<tr><td>originating_partner_id</td><td>Reference (can be Sarthy)</td><td>Who originally brought this startup into Sarthy's ecosystem - always set, in both Path A and Path B. Equal to referring_partner_id in Path A. This is who earns the lead-share credit and the deal-closure fee, not necessarily the receiving partner. If no partner brought the startup in, this is Sarthy itself</td><td>SOP #7</td></tr>\n<tr><td>receiving_partner_id</td><td>Reference</td><td>Who it's introduced to - chosen by the referring partner (Path A) or by the startup itself via the self-service product (Path B)</td><td>SOP #7</td></tr>\n<tr><td>lead_status</td><td>Submitted / Validated / Introduced / Acknowledged / In Progress / Converted / Rejected / Unresolved</td><td>See stage definitions - matches the BRD #5 pipeline exactly</td><td>SOP #7, BRD #5</td></tr>\n<tr><td>submitted_at, acknowledged_at, resolved_at</td><td>Timestamps</td><td>Used to calculate the 5-working-day validation window and the 1-week acknowledgment/rejection window</td><td>SOP #7</td></tr>\n<tr><td>duplicate_flag</td><td>Boolean</td><td>Set automatically at upload if it matches an existing lead</td><td>SOP #7, BRD #5</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the Path A / Path B diagram in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a> for how originating_partner_id gets set differently in each path.</p>\n\n<h2>Deal (post-closure)</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>deal_id</td><td>Text</td><td>Unique identifier, linked to the originating lead_id</td><td>SOP #20</td></tr>\n<tr><td>deal_value, deal_duration</td><td>Currency, months</td><td>Reported by the receiving partner on closure. deal_duration determines whether the 12-month proration rule applies (SOP #20) - if the engagement runs longer than a year, only the value invoiced in year one counts toward the referral fee</td><td>SOP #20</td></tr>\n<tr><td>referral_fee_entitlement</td><td>Currency</td><td>10% of deal_value, before Sarthy's cut</td><td>SOP #20</td></tr>\n<tr><td>referral_fee_net</td><td>Currency</td><td>91% of the entitlement - what the referring partner actually accrues</td><td>SOP #20</td></tr>\n<tr><td>first_engagement_date</td><td>Date</td><td>Starts the 1-year entitlement window</td><td>SOP #20</td></tr>\n<tr><td>payout_status</td><td>Accruing / Paid</td><td>Paid only at the annual March 31st settlement</td><td>SOP #20</td></tr>\n</table>\n\n<h2>Dispute</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>dispute_id</td><td>Text</td><td>Unique identifier, linked to a lead_id or deal_id</td><td>SOP #9</td></tr>\n<tr><td>raised_at</td><td>Timestamp</td><td>Starts the 24-hour admin-response clock</td><td>SOP #9</td></tr>\n<tr><td>evidence_notes</td><td>Free text</td><td>Includes startup-confirmation input where used - mechanism still being designed, see BRD #11</td><td>SOP #7, BRD #11</td></tr>\n<tr><td>resolution</td><td>Upheld / Reversed</td><td>Admin's call for routine disputes - final. Any dispute can escalate to Sarthy leadership - no fixed value threshold, admin decides case by case, per SOP #9</td><td>SOP #9</td></tr>\n</table>\n\n<h2>What this document deliberately doesn't cover yet</h2>\n<p>Gamification fields for the dormancy/activity system (SOP #21) aren't defined here since that mechanic itself isn't designed yet. This dictionary gets extended, not rewritten, whenever a new SOP section resolves - see the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">dependency map</a>.</p>\n"}, {"id": "interim-system", "content_file": "interim-system.html", "cat": "Operational Tools", "status": "draft", "version": "2.4", "updated": "Added a cross-link to the Data Dictionary's new entity-relationship diagram", "type": "Internal", "title": "Interim Operating System", "desc": "A simple working tool to manage partners until the platform is ready", "html": "<p class=\"callout\">A simple working tool for the Lead and Associate to actually run day-to-day operations on, until the real platform matures enough to handle it. Built directly on the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>'s field definitions - not a separate, invented structure.</p>\n\n<h2>What this replaces</h2>\n<p>The old Growth Partnerships tracker - 16 tabs, inconsistent columns, different team members' shorthand scattered across years. This is one clean structure instead, using the fields already defined in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>.</p>\n\n<h2>Migrating existing records - treated exactly like a new partner addition</h2>\n<p>This isn't a special process with its own rules. A migrated partner follows the exact same onboarding treatment as a brand-new signup (<a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 5</a>). The bulk-import spreadsheet is just the mechanical way their existing record gets typed in - not a different set of business rules. There's no special \"migrated\" status category, so nothing about migration can ever conflict with how the Segmentation Framework treats a partner.</p>\n<table class=\"dtable\">\n<tr><th>Column</th><th>Source</th></tr>\n<tr><td>partner_id</td><td>Assign fresh, or reuse the existing code (e.g. SPA001) if still meaningful</td></tr>\n<tr><td>programme</td><td>India or International - from the original signed agreement</td></tr>\n<tr><td>status</td><td>Whatever a brand-new partner would get on completing onboarding - not defaulted to Dormant or At-Risk just because they're a migration. If they're not actually active on the platform yet, that's the same as any newly onboarded partner who hasn't logged in yet - normal, not a special case.</td></tr>\n<tr><td>giving_pattern</td><td>Blank initially, same as any new partner - it's calculated from real wallet activity, which nobody has on day one regardless of whether they're new or migrated</td></tr>\n<tr><td>last_lead_shared_date</td><td>Blank, same as a new partner - old-tracker call history doesn't carry over as platform activity</td></tr>\n</table>\n<p>Practical effect: a migrated partner becomes Wave-1-eligible the same way any partner does - by actually building real activity after joining, not by anything special about having been imported. See the Segmentation Framework's outreach table for how that plays out once they're in.</p>\n\n<h2>Core structure - one table per entity</h2>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the entity-relationship diagram in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> for how these five tables reference each other.</p>\n<table class=\"dtable\">\n<tr><th>Table</th><th>One row per...</th><th>Key fields (see Data Dictionary for full list)</th></tr>\n<tr><td>Partners</td><td>partner</td><td>partner_id, programme, status, giving_pattern, last_lead_shared_date</td></tr>\n<tr><td>Leads</td><td>lead</td><td>lead_id, referring/receiving partner, lead_status, timestamps</td></tr>\n<tr><td>Deals</td><td>closed deal</td><td>deal_id, deal_value, referral_fee_net, payout_status</td></tr>\n<tr><td>Wallet Ledger</td><td>credit transaction</td><td>partner_id, amount, reason, timestamp</td></tr>\n<tr><td>Disputes</td><td>dispute</td><td>dispute_id, raised_at, resolution</td></tr>\n</table>\n<p>No partner or lead should exist in more than one place - if it's not in these five tables, it isn't tracked. That's the entire point of replacing the old tracker.</p>\n\n<h2>The Associate's daily call queue</h2>\n<p>Not a separate table - a filtered view of the Partners table, ordered by the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>'s combined status + giving_pattern table:</p>\n<ol>\n<li><strong>status = At-Risk</strong> first - highest priority, most time-sensitive</li>\n<li><strong>status = Dormant</strong> next, but only this week's batch - selected on a <strong>rotating weekly quota</strong>, so every dormant partner eventually gets called rather than the same few being picked repeatedly or the list being worked by feel</li>\n<li><strong>status = Active, giving_pattern = Taker</strong> - medium-high touch, before they slide into At-Risk</li>\n<li><strong>status = Active, giving_pattern = Balanced</strong> - standard monthly rotation</li>\n<li><strong>status = Active, giving_pattern = Giver</strong> - lowest priority for calls, light touch, mostly automated messages from the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a></li>\n</ol>\n<p>Each call logged with: date, partner_id, outcome (reached / no answer / rescheduled), and a free-text note - this becomes the historical record the old tracker's scattered comment columns used to (badly) serve.</p>\n\n<h2>What this tool is not</h2>\n<p>It doesn't replace the eventual app - it's scaffolding for the gap between now and whenever the real platform can do this natively. When the <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Business Requirements Document</a>'s features actually exist in the live product, this tool gets retired, not maintained in parallel.</p>\n\n<h2>Where this actually lives</h2>\n<p>A lightweight spreadsheet or simple tool (e.g. Airtable) is enough - the point is the structure above, not the software. Building actual automation here isn't necessary yet. Consistency of the five tables is what matters.</p>\n"}, {"id": "glossary", "content_file": "glossary.html", "cat": "Start Here", "status": "done", "version": "1.3", "updated": "Removed talking-document voice - Lead definition no longer assumes the reader is the Lead", "type": "Both", "title": "Glossary", "desc": "Quick definitions for terms used across the hub - the 999-credit meanings, status vs giving_pattern, the two reward tracks", "html": "<p class=\"callout\">Terms used across the hub that don't explain themselves on first read. Each links to where the full detail actually lives.</p>\n\n<h2>The four meanings of \"999\"</h2>\n<p>The same number is deliberately reused for four different things - see the full worked example in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 6</a>.</p>\n<table class=\"dtable\">\n<tr><th>Context</th><th>What it means</th></tr>\n<tr><td>Joining bonus</td><td><span class=\"amt-pos\">+999</span> credits granted when a partner pays the entry fee</td></tr>\n<tr><td>Cost to receive a lead</td><td><span class=\"amt-neg\">-999</span> credits deducted when a partner acknowledges a lead</td></tr>\n<tr><td>Conversion reward</td><td><span class=\"amt-pos\">+909</span> credits (999 minus the 9% fee) when a referred lead converts</td></tr>\n<tr><td>Negative-balance basis</td><td>The -2,997 freeze floor is exactly 999 \u00d7 3</td></tr>\n</table>\n\n<h2>Giver, Taker, Balanced (giving_pattern)</h2>\n<p>Describes a partner's behavior: whether their wallet trends up (Giver), stays roughly even (Balanced - the default for most partners), or trends down (Taker). This only matters when an account's status is Active. See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 11</a> and the full <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>.</p>\n\n<h2>Status (Applicant / Active / At-Risk / Dormant / Frozen / Exited)</h2>\n<p>Describes what a partner's <em>account can actually do</em> on the platform - a completely different, deliberately non-overlapping concept from giving_pattern above. Full definitions in the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>.</p>\n\n<h2>The two reward tracks</h2>\n<table class=\"dtable\">\n<tr><th></th><th>Lead-share credit</th><th>Deal-closure referral fee</th></tr>\n<tr><td>Triggered by</td><td>A lead being referred and accepted</td><td>A lead becoming a real signed deal</td></tr>\n<tr><td>Amount</td><td>999 credits, minus 9% fee</td><td>10% of first-year invoiced value, minus 9% of that 10%</td></tr>\n<tr><td>Paid</td><td>At the moment of conversion</td><td>Once annually, March 31st</td></tr>\n<tr><td>Detail</td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Sections 5-10</a></td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 20</a></td></tr>\n</table>\n\n<h2>The 9% facilitation fee</h2>\n<p>One consistent principle applied to every value transfer between partners - whether that's a 999-credit lead-share reward or the 10% deal-closure entitlement. Same rate, same logic, two different bases.</p>\n\n<h2>Status pill colours</h2>\n<p><strong>The colour is only half the information - always read the text next to it too.</strong> Two sections can both show the amber \"Draft\" colour and still mean very different things: one might read \"drafted, all six specified\" (fully written, just waiting on a signature), another \"drafted, exchange rate source still open\" (a specific number could still change). The colour shows the broad category. The words show exactly what's actually still open, if anything.</p>\n<table class=\"dtable\">\n<tr><th>Colour</th><th>Broad meaning</th></tr>\n<tr><td><span class=\"badge badge-done\">Confirmed</span></td><td>Settled, not just Sarthy leadership's word but reflected consistently across the hub</td></tr>\n<tr><td><span class=\"badge badge-draft\">Draft</span></td><td>Written and specific, but still a working assumption pending Sarthy's formal sign-off - the accompanying text says exactly what, if anything, is still unresolved</td></tr>\n<tr><td><span class=\"badge badge-pending\">Pending</span></td><td>Not written yet</td></tr>\n</table>\n\n<h2>Lead / Admin / Associate</h2>\n<p><strong>Lead</strong> is the Project Lead role - responsible for strategy, documentation, Sarthy reporting, and spec authorship.</p>\n<p><strong>Associate</strong> handles calls, data entry, and first-line follow-up.</p>\n<p><strong>Admin</strong> is Sarthy's operational role inside the SOP's rules - validating leads, confirming conversions, resolving disputes. This is not the same as \"Lead\" above. It's a role Sarthy's own team occupies.</p>\n\n<h2>deal_duration and the 12-month proration rule</h2>\n<p>If an engagement runs longer than 12 months, only what's invoiced in the first 12 months counts toward the referrer's entitlement - not the full multi-year contract value. See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 20</a> for the worked example.</p>\n"}, {"id": "gantt", "content_file": "gantt.html", "cat": "Strategic Planning", "status": "draft", "version": "1.5", "updated": "Updated for Reporting Dashboard drafting", "type": "Both", "title": "Project Plan (Gantt View)", "desc": "Visual timeline of the roadmap phases - for discussion with Sarthy leadership", "html": "<p class=\"callout\">A visual view of the roadmap, for discussion with Sarthy leadership. Uses relative week numbers, not calendar dates, since real dates were never tracked separately. See the note on what \"done\" means before sharing this. For the real-world blockers behind why Phase 5 hasn't started, see the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item & Blocker Tracker</a>.</p>\n\n<div class=\"pending-box\" style=\"text-align:left;\">\n<strong>Read this before presenting it to anyone:</strong> \"Done\" below means <em>documentation and design work complete</em> - the SOP is written, the requirements exist, the process is defined. It does <strong>not</strong> mean partners have actually been onboarded in the real world yet - that's Phase 5, and it's genuinely not started. Don't let this chart imply more real-world progress than has actually happened.\n</div>\n\n<div class=\"gantt\">\n<div class=\"gantt-axis\"><span>Wk 1</span><span style=\"margin-left:60px;\">Wk 4</span><span style=\"margin-left:60px;\">Wk 8</span><span style=\"margin-left:60px;\">Wk 12</span><span style=\"margin-left:60px;\">Wk 16+</span></div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 0 - Foundational Alignment</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-done\" style=\"left:0%;width:12.5%;\">Done</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 1 - Documentation Layer</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-done\" style=\"left:0%;width:31.25%;\">Done</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 3 - Interim Operating System</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-done\" style=\"left:12.5%;width:18.75%;\">Done</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 2 - Process Redesign</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-done\" style=\"left:18.75%;width:18.75%;\">Done</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 4 - BRD for the Marketplace</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-done\" style=\"left:31.25%;width:25%;\">Done</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 5 - Rollout & Migration</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-todo\" style=\"left:43.75%;width:56.25%;\">Not started</div></div>\n</div>\n\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Phase 6 - Governance & Cadence</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:100%;\">Ongoing</div></div>\n</div>\n</div>\n\n<h2>What's actually still ahead</h2>\n<table class=\"dtable\">\n<tr><th>Item</th><th>Status</th></tr>\n<tr><td>Real Sarthy meeting to confirm the remaining open decisions</td><td>Not scheduled</td></tr>\n<tr><td>Portal access, to build the real feature inventory</td><td>Waiting on access</td></tr>\n<tr><td>Migration Wave Plan (which partners move onto the app, in what order)</td><td>Drafted</td></tr>\n<tr><td>Low-Level System Specification (the actual technical handoff to developers)</td><td>Drafted</td></tr>\n<tr><td>Replit Build Brief (platform-specific companion, build order and lock-in risks)</td><td>Drafted</td></tr>\n<tr><td>Reporting Dashboard</td><td>Drafted</td></tr>\n<tr><td>Actual partner onboarding onto the platform - the real Phase 5 work</td><td>Not started</td></tr>\n</table>\n\n<h2>A note on the timeline itself</h2>\n<p>These week numbers were the original planning estimates, not tracked calendar dates. The actual work happened across many iterative sessions, not a strict week-by-week schedule. If real calendar dates would be more useful for a specific management conversation, this chart can be rebuilt against an actual start date - just needs that date confirmed first.</p>\n"}, {"id": "action-tracker", "content_file": "action-tracker.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.6", "updated": "Updated for Low-Level Spec / Replit Build Brief drafting", "type": "Both", "title": "Action Item & Blocker Tracker", "desc": "Real-world action items blocking progress, with a dependency chain showing what unlocks what", "html": "<p class=\"callout\">Real-world action items that block progress - distinct from documentation gaps in the Gap & Risk Register. These need a person to actually do something outside this hub (a legal review, a phone call, a decision), not a content edit. Colour shows status. The chain below shows what's actually blocking what, so it's visible how stuck the project is at a glance.</p>\n\n<h2>Critical path - what's blocking what</h2>\n<svg viewBox=\"0 0 700 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrow3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"255\" y=\"10\" width=\"190\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"350\" y=\"36\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11.5\">Real Sarthy meeting</text>\n\n    <line x1=\"350\" y1=\"54\" x2=\"350\" y2=\"78\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"20\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"95\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Legal review of</text>\n    <text x=\"95\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">existing contracts</text>\n\n    <rect x=\"192\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"267\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Regulatory review</text>\n    <text x=\"267\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">(RBI/PPI, TDS)</text>\n\n    <rect x=\"364\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"439\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Portal access</text>\n    <text x=\"439\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">from Sarthy</text>\n\n    <rect x=\"536\" y=\"80\" width=\"150\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"611\" y=\"98\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Payment gateway</text>\n    <text x=\"611\" y=\"112\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">+ e-sign selection</text>\n\n    <line x1=\"95\" y1=\"124\" x2=\"95\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n    <line x1=\"267\" y1=\"124\" x2=\"200\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"20\" y=\"152\" width=\"330\" height=\"44\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"185\" y=\"170\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Data migration - template built,</text>\n    <text x=\"185\" y=\"184\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">then old records imported</text>\n\n    <line x1=\"439\" y1=\"124\" x2=\"439\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"364\" y=\"152\" width=\"322\" height=\"44\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"525\" y=\"170\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Migration Wave Plan +</text>\n    <text x=\"525\" y=\"184\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Low-Level System Spec</text>\n\n    <line x1=\"185\" y1=\"196\" x2=\"350\" y2=\"230\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n    <line x1=\"525\" y1=\"196\" x2=\"400\" y2=\"230\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow3)\"/>\n\n    <rect x=\"220\" y=\"232\" width=\"260\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"350\" y=\"252\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Real Phase 5 rollout -</text>\n    <text x=\"350\" y=\"267\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">actual partners onboarded</text>\n\n    <text x=\"20\" y=\"315\" fill=\"var(--ink-faint)\" font-size=\"10\">Red = blocked, needs external action. Amber = in progress or partially unblocked. Grey = downstream, waiting on the above.</text>\n  </g>\n</svg>\n\n<h2>Full tracker</h2>\n<table class=\"dtable\">\n<tr><th>Item</th><th>Owner</th><th>Status</th><th>Blocks</th></tr>\n<tr><td>Legal review and amendment - the 9% fee now applies to all partners including Partner 1.0-era agreements. Any agreement that doesn't support this needs amending</td><td>Sarthy legal</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Migrating any real partner to the new model</td></tr>\n<tr><td>Document every partner still under a Partner 1.0-era agreement, for reference during the amendment process</td><td>Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>The legal review above - can't amend agreements without knowing who holds them</td></tr>\n<tr><td>Regulatory review - does the credit wallet trigger RBI/PPI obligations? TDS on referral payouts?</td><td>Sarthy finance/legal</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Public launch of the wallet, first annual payout</td></tr>\n<tr><td>Real Sarthy meeting to confirm remaining working assumptions</td><td>Lead</td><td><span class=\"badge badge-pending\">Not scheduled</span></td><td>Everything still marked \"pending Sarthy sign-off\" across the hub</td></tr>\n<tr><td>Portal access (admin + partner login, tracker edit rights)</td><td>Sarthy</td><td><span class=\"badge badge-draft\">Waiting</span></td><td>Real feature inventory, BRD gap-mapping against the actual Alpha build</td></tr>\n<tr><td>Data migration template - column format for the old tracker's records</td><td>Lead</td><td><span class=\"badge badge-draft\">In progress</span></td><td>Actually importing historical partner data</td></tr>\n<tr><td>Data migration - populate the template with real records</td><td>Lead / Associate</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Real Phase 5 rollout using actual history</td></tr>\n<tr><td>Payment gateway selection (fee collection, withdrawal payouts)</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>BRD Sections 3, 7, 10 - can't be built without this</td></tr>\n<tr><td>E-signature provider selection</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>BRD Section 9's digital-signature requirement</td></tr>\n<tr><td>Real Alpha partner interviews actually conducted</td><td>Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Validating requirements against real partner experience, not just SOP rules</td></tr>\n<tr><td>Migration Wave Plan drafted</td><td>Lead</td><td><span class=\"badge badge-done\">Done</span></td><td>Real rollout sequencing</td></tr>\n<tr><td>Low-Level System Specification drafted</td><td>Lead</td><td><span class=\"badge badge-done\">Done</span></td><td>Actual development starting</td></tr>\n<tr><td>Sarthy to designate a specific named person/role for formal BRD sign-off (process itself is resolved - written approval required, informal agreement isn't enough)</td><td>Sarthy leadership</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Development starting at all</td></tr>\n<tr><td>Development budget and resourcing confirmed with Sarthy</td><td>Sarthy + Lead</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Any real development timeline commitment</td></tr>\n<tr><td>Confirm real priority for the startup self-service product (BRD Section 5) - currently assumed Phase 2, not confirmed</td><td>Lead + Sarthy</td><td><span class=\"badge badge-pending\">Not started</span></td><td>Whether this ships alongside the MVP or after it</td></tr>\n</table>\n"}, {"id": "history", "content_file": "history.html", "cat": "Start Here", "status": "draft", "version": "1.5", "updated": "Fixed 1 instance of we", "type": "Internal", "title": "Design History & Decisions", "desc": "The why and the used-to-be behind decisions in the hub - kept separate so other pages can stay focused on what is true today", "html": "<p class=\"callout\">This page holds the \"why\" and the \"what it used to be\" - the history behind decisions in the hub. The other 18 pages describe what's true today. This page is where that older context lives instead, so it doesn't get in the way of a reader just trying to find out the current rule.</p>\n\n<h2>Why Partnership SOP v1.0 absorbed Sarthy's Playbook 2.0</h2>\n<p>Sarthy had already written a detailed design document called Playbook 2.0. It covered years of their own thinking on the credit system, the referral flow, and the rules against abuse.</p>\n<p>Early in this project, that document sat outside the hub as a separate reference. Partnership SOP v1.0 only pointed to it.</p>\n<p>Later, this was judged to create a real risk: two documents describing the same rules, with no guarantee they'd stay in sync. So every real piece of Playbook 2.0 was rewritten into Partnership SOP v1.0, section by section. Playbook 2.0 is now retired. Nothing about the program lives there that isn't also in the SOP.</p>\n\n<h2>Why Sarthy's original Playbook 1.0 was never absorbed</h2>\n<p>Playbook 1.0 was Sarthy's very first version of the program, from 2023-24. It was much simpler than Playbook 2.0 - mostly just a flat 10% referral fee, no credit wallet. Almost everything worth knowing from it is already captured in the Current-State Assessment's history section, so it was never pulled into the SOP the way Playbook 2.0 was.</p>\n\n<h2>Why the Master Execution Sequence's item 11 covers four different things</h2>\n<p>Item 11 used to be four separate items on the list: a new onboarding process, an engagement plan, a reactivation plan, and an escalation SOP. They were merged into one item. All four were always meant to become sections inside Partnership SOP v1.0, not standalone documents - keeping them as four separate to-do items was creating duplicate work.</p>\n\n<h2>Why three documents in the hub aren't numbered on the Sequence page</h2>\n<p>The Glossary, the Project Plan (Gantt View), and the Action Item & Blocker Tracker don't have numbers on the Master Execution Sequence page. That's not a gap - they simply weren't part of the original plan. All three came out of later requests as the hub grew.</p>\n\n<h2>Why the partner network changed from a one-way referral model</h2>\n<p>The first version of the partner program (2023-24) only flowed one way. Sarthy referred startups to partners. Partners never referred business to each other.</p>\n<p>The redesign turned this into a network where any partner can refer to, and receive from, any other partner - with Sarthy tracking it all.</p>\n<table class=\"dtable\">\n<tr><th>What changed</th><th>First version</th><th>Current design</th></tr>\n<tr><td>Structure</td><td>Sarthy to partner only</td><td>Any partner to any partner, with Sarthy tracking everything</td></tr>\n<tr><td>Cost to join</td><td>Free</td><td>\u20b9999 (India) or $49 (international)</td></tr>\n<tr><td>Credit wallet</td><td>None</td><td>Starts with 999 credits, earned and spent through referrals</td></tr>\n<tr><td>How partners earn</td><td>Only from their own client work</td><td>Credits for every referral that converts, plus their own client work</td></tr>\n<tr><td>Cost of receiving a lead</td><td>None</td><td>999 credits deducted per lead received</td></tr>\n<tr><td>Accountability</td><td>Signed agreement only</td><td>Signed agreement plus a tracked credit wallet and conversion record</td></tr>\n</table>\n<p>In one line: in the old model, a partner was a vendor. In the current design, a partner is a node in a shared network, where everyone has something to gain and something to manage.</p>\n\n<h2>Why membership has no fixed cycle</h2>\n<p>Sarthy's original design was built around cycles - a membership period that ended in a settlement event. This SOP made a deliberate change: membership is now ongoing, with no cycle and no forced end date. A partner joins once and stays a member indefinitely.</p>\n\n<h2>Why the Segmentation Framework changed from 5 tiers to 2 fields</h2>\n<p>The Segmentation Framework used to be a single 5-tier list. It reused words like \"At-Risk\" and \"Dormant\" - the same words already meaning something different in the Data Dictionary's account status field. A reader seeing \"At-Risk\" in a spreadsheet couldn't tell whether it meant the segmentation tier or the account status.</p>\n<p>It was redesigned into two separate fields with no overlapping words: <code>status</code> (what the account can do) and <code>giving_pattern</code> (how the partner behaves, only meaningful when status is Active).</p>\n"}, {"id": "migration-wave-plan", "content_file": "migration-wave-plan.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Both", "title": "Migration Wave Plan", "desc": "The order in which partner groups move onto the platform", "html": "<p class=\"callout\">The actual sequence for moving partners onto the real platform - both the existing signed partners from before, and the 25+ new applicants already waiting for access. Builds directly on the Segmentation Framework, the Graduation Criteria, and the Interim Operating System's decision to treat migration exactly like new-partner onboarding.</p>\n\n<h2>Before any wave starts</h2>\n<p>These are real blockers, not just a checklist - see the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item & Blocker Tracker</a> for current status on each:</p>\n<ul>\n<li>The data migration spreadsheet template is built and populated with real records</li>\n<li>Legal review of existing Partner 1.0-era agreements has at least started - Wave 2 specifically can't proceed without it</li>\n<li>Portal access confirmed, so the real feature inventory exists and matches what this plan assumes is buildable</li>\n</ul>\n\n<h2>Wave 0 - Pilot</h2>\n<p><strong>Who:</strong> 2-3 of the current Alpha users who already show some real usage, not zero activity.</p>\n<p><strong>Why first:</strong> lowest risk - these partners are already somewhat familiar with the platform, so problems surface here before a wider group sees them. This is the seed group working toward Sarthy's real target in the <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Graduation Criteria</a>.</p>\n\n<h2>Wave 1 - Core rollout, toward the 10-partner target</h2>\n<p><strong>Who:</strong> existing partners on the standard 10% agreement (no special exceptions), plus new applicants who complete onboarding cleanly. This is the bulk of the push toward Sarthy's confirmed target of 10 active partners within 2 weeks of full launch.</p>\n<p><strong>Selection order within the wave:</strong> pre-migration, there's no real giving_pattern data to sort by - every migrated partner starts blank, same as a new signup (see the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>). Until real activity accrues, use whatever engagement signal exists in the old tracker - a partner with some history of referring or receiving under the old system is a safer early pick than one with none at all.</p>\n<p><strong>New applicants:</strong> the 25+ already waiting for access fold into this same wave's cadence, going through standard onboarding (<a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 5</a>) rather than a separate track.</p>\n\n<h2>Wave 2 - Special-agreement partners</h2>\n<p><strong>Who:</strong> the known signed exceptions from the Current-State Assessment - a reverse 60/40 profit-sharing arrangement, a flat \u20b910,000-per-trial bonus, and a tiered 15%/20% commission structure.</p>\n<p><strong>Why held back:</strong> the 9% facilitation fee now applies to every partner, including these - but exactly how a 9% cut interacts with a 60/40 split or a flat bonus rather than a percentage isn't worked out yet. Moving too fast here risks getting the math wrong on exactly the agreements that already have real, signed money terms.</p>\n\n<h2>Wave 3 - Reactivating long-inactive partners</h2>\n<p><strong>Who:</strong> partners from the old system with no recent activity at all - not just \"Part of Platform\" blank, but genuinely dormant.</p>\n<p><strong>How:</strong> this isn't really a migration wave so much as a reactivation campaign - use the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">reactivation outreach template</a> and the rotating weekly quota already defined in the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>, rather than a one-time push.</p>\n\n<h2>Pacing</h2>\n<p>A proposed starting point, not a fixed rule: a handful of partners at a time, not a bulk import all at once. With a two-person team running this manually through the Interim Operating System, moving faster than that risks quality dropping - a bad first experience for a migrated partner is harder to undo than a slower start. Worth revisiting once Wave 0 shows how much time each migration genuinely takes.</p>\n"}, {"id": "low-level-spec", "content_file": "low-level-spec.html", "cat": "Technical Handoff", "status": "draft", "version": "1.1", "updated": "Added the full Lead state machine diagram and a cross-link to the Playbook's wallet-threshold diagram", "type": "Internal", "title": "Low-Level System Specification", "desc": "The detailed technical spec, built from the approved BRD", "html": "<p class=\"callout\">This is the technical detail layer beneath the BRD - written to be technology-neutral, so it stays useful whether this gets built on Replit, migrated elsewhere later, or handed to a different team entirely. It doesn't restate what the BRD or Data Dictionary already cover - it adds the things only a precise technical spec needs: exact state transitions, exact formulas, and defined operations with clear inputs, outputs, and conditions.</p>\n\n<h2>How this relates to the other technical documents</h2>\n<ul>\n<li>The <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">BRD</a> is the source of truth for what the system must do. This document doesn't override it.</li>\n<li>The <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> is the source of truth for field names, types, and meanings. This document builds on it, doesn't repeat it.</li>\n<li>Anyone building this on Replit specifically should also read the Replit Build Brief, once drafted - that document is the platform-specific companion to this one.</li>\n</ul>\n\n<h2>Lead state machine</h2>\n<svg viewBox=\"0 0 830 235\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:760px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowLS\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"10.5\">\n    <rect x=\"10\" y=\"20\" width=\"110\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"65\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Submitted</text>\n\n    <line x1=\"120\" y1=\"43\" x2=\"140\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"145\" y=\"20\" width=\"110\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"200\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Validated</text>\n\n    <line x1=\"255\" y1=\"43\" x2=\"275\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"280\" y=\"20\" width=\"110\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"335\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Introduced</text>\n\n    <line x1=\"390\" y1=\"43\" x2=\"410\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"415\" y=\"20\" width=\"125\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"477\" y=\"42\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Acknowledged</text>\n    <text x=\"477\" y=\"56\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">-999 deducted</text>\n\n    <line x1=\"540\" y1=\"43\" x2=\"560\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"565\" y=\"20\" width=\"115\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"622\" y=\"47\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">In Progress</text>\n\n    <line x1=\"680\" y1=\"43\" x2=\"700\" y2=\"43\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n\n    <rect x=\"705\" y=\"20\" width=\"115\" height=\"46\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"762\" y=\"42\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Converted</text>\n    <text x=\"762\" y=\"56\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">referrer +909</text>\n\n    <line x1=\"65\" y1=\"66\" x2=\"65\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" marker-end=\"url(#arrowLS)\"/>\n    <rect x=\"10\" y=\"152\" width=\"110\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\" stroke-dasharray=\"3,2\"/>\n    <text x=\"65\" y=\"176\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-weight=\"600\" font-size=\"10.5\">Cancelled</text>\n    <text x=\"65\" y=\"212\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">referrer withdraws</text>\n    <text x=\"65\" y=\"223\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">before it's introduced</text>\n\n    <line x1=\"315\" y1=\"66\" x2=\"315\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n    <rect x=\"240\" y=\"152\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"315\" y=\"176\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Rejected</text>\n    <text x=\"315\" y=\"212\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">explicit decline within 1 week</text>\n    <text x=\"315\" y=\"223\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">&#8212; no deduction ever happened</text>\n\n    <line x1=\"355\" y1=\"66\" x2=\"355\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"355\" y1=\"100\" x2=\"545\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"545\" y1=\"100\" x2=\"545\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowLS)\"/>\n    <text x=\"450\" y=\"93\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">1 week passes, no action</text>\n    <rect x=\"470\" y=\"152\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"545\" y=\"176\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Unresolved</text>\n    <text x=\"545\" y=\"215\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">also no deduction &#8212; closed, not disputed</text>\n\n    <line x1=\"600\" y1=\"66\" x2=\"600\" y2=\"120\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"600\" y1=\"120\" x2=\"390\" y2=\"120\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" marker-end=\"url(#arrowLS)\"/>\n    <text x=\"600\" y=\"113\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">dispute upheld past the window &#8594; +999 refunded</text>\n  </g>\n</svg>\n<table class=\"dtable\">\n<tr><th>From</th><th>Event</th><th>To</th><th>Side effects</th></tr>\n<tr><td>(none)</td><td>Referring partner submits</td><td>Submitted</td><td>Duplicate check runs immediately, at upload</td></tr>\n<tr><td>Submitted</td><td>Admin validates (within 5 working days)</td><td>Validated</td><td>None</td></tr>\n<tr><td>Submitted</td><td>Referring partner cancels</td><td>(deleted)</td><td>No deduction ever happened - nothing to reverse</td></tr>\n<tr><td>Validated</td><td>System introduces to receiving partner</td><td>Introduced</td><td>1-week acknowledgment clock starts</td></tr>\n<tr><td>Introduced</td><td>Receiving partner acknowledges</td><td>Acknowledged</td><td><span class=\"amt-neg\">-999</span> credits deducted from receiving partner, immediately</td></tr>\n<tr><td>Introduced</td><td>Receiving partner explicitly rejects, within 1 week</td><td>Rejected</td><td>No deduction (none happened yet)</td></tr>\n<tr><td>Introduced</td><td>1 week passes, no action taken</td><td>Unresolved</td><td>No deduction (none happened yet) - lead is simply closed, not disputed</td></tr>\n<tr><td>Acknowledged</td><td>Work begins</td><td>In Progress</td><td>None</td></tr>\n<tr><td>In Progress</td><td>Admin confirms conversion</td><td>Converted</td><td>Referring partner credited <span class=\"amt-pos\">+909</span> (999 minus 9%)</td></tr>\n<tr><td>In Progress or Acknowledged</td><td>Dispute raised, past 1-week window, admin reverses</td><td>Rejected</td><td><span class=\"amt-pos\">+999</span> credits refunded to receiving partner (full reversal)</td></tr>\n</table>\n<p>Re-referral: a Rejected or Unresolved lead can be resubmitted to a different partner (new Lead record, new lifecycle) - never simultaneously to two partners offering the same service type.</p>\n\n<h2>Partner status state machine</h2>\n<table class=\"dtable\">\n<tr><th>From</th><th>Event</th><th>To</th><th>Notes</th></tr>\n<tr><td>(none)</td><td>Applies, not yet evaluated</td><td>Applicant</td><td></td></tr>\n<tr><td>Applicant</td><td>Fee paid, wallet activated</td><td>Active</td><td>Wallet opens at <span class=\"amt-pos\">+999</span></td></tr>\n<tr><td>Active</td><td>Balance drops to -1,500 or below, OR 4+ consecutive declines</td><td>At-Risk</td><td>Flag only - every Active privilege continues unchanged</td></tr>\n<tr><td>Active or At-Risk</td><td>Balance hits -2,997</td><td>Frozen</td><td>Independent trigger from At-Risk - can happen with or without At-Risk first</td></tr>\n<tr><td>Active or At-Risk</td><td>3 consecutive months with no lead shared</td><td>Dormant</td><td>Independent trigger from Frozen - a partner can be Dormant and Frozen simultaneously</td></tr>\n<tr><td>Frozen</td><td>Top-up paid (4x entry fee)</td><td>Active (or At-Risk, if the -1,500 condition still applies post-top-up)</td><td>Balance moves from -2,997 to exactly +999</td></tr>\n<tr><td>Dormant</td><td>Partner sends a lead</td><td>Active (or At-Risk/Frozen if those conditions independently apply)</td><td>If both Dormant and Frozen apply, top-up must happen first, then the lead - see Data Dictionary</td></tr>\n<tr><td>Any</td><td>Partner or Sarthy closes the account</td><td>Exited</td><td>Terminal state</td></tr>\n</table>\n\n<h2>Core operations</h2>\n<p>Defined independent of any specific framework or API style - inputs, what changes, and what must be true before/after.</p>\n<table class=\"dtable\">\n<tr><th>Operation</th><th>Preconditions</th><th>Effect</th><th>Postconditions</th></tr>\n<tr><td>SubmitLead</td><td>Referring partner isn't Exited. Dormant partners specifically can and must be able to do this - it's their documented recovery path. Lead isn't a duplicate. <strong>Not yet answered anywhere in the source material:</strong> whether a Frozen partner can submit/refer a lead, since Frozen is specifically about receiving. Worth confirming before building rather than assuming.</td><td>Creates Lead record, status Submitted</td><td>Duplicate flag set if a match is found</td></tr>\n<tr><td>AcknowledgeLead</td><td>Lead status is Introduced. Receiving partner is Active or At-Risk (not Frozen or Dormant).</td><td>Deducts 999 from receiving partner's wallet</td><td>Lead status becomes Acknowledged. Wallet balance re-evaluated for At-Risk/Frozen status</td></tr>\n<tr><td>ConfirmConversion</td><td>Lead status is In Progress. Admin has proof (signed agreement + first payment).</td><td>Credits referring partner 909 (999 minus 9%)</td><td>Lead status becomes Converted. Referring partner's wallet balance re-evaluated</td></tr>\n<tr><td>RequestWithdrawal</td><td>Partner status is Active. Balance above 999 (the reserve).</td><td>Converts the withdrawable portion to real currency at the current RBI reference rate</td><td>Wallet balance reduced by the withdrawn amount, floor stays at 999</td></tr>\n<tr><td>RecordDealClosure</td><td>A Lead exists with status Converted.</td><td>Creates a Deal record linked to the Lead. Applies the 12-month proration rule if deal_duration exceeds 12 months.</td><td>referral_fee_entitlement and referral_fee_net calculated (see formulas below)</td></tr>\n<tr><td>RaiseDispute</td><td>Within 14 days of the decision being disputed.</td><td>Starts the 24-hour admin-response clock. Triggers admin notification (popup + email).</td><td>Dispute record created, status Raised</td></tr>\n</table>\n\n<h2>Formulas</h2>\n<table class=\"dtable\">\n<tr><th>What</th><th>Formula</th></tr>\n<tr><td>Conversion reward, net to referring partner</td><td>999 \u00d7 (1 - 0.09) = 909</td></tr>\n<tr><td>Negative balance freeze floor</td><td>-2,997 (exactly -999 \u00d7 3)</td></tr>\n<tr><td>At-Risk threshold</td><td>-1,500 (roughly half of -2,997)</td></tr>\n<tr><td>Top-up amount and effect</td><td>Entry fee \u00d7 4 (\u20b93,996 or $196) adds 3,996 credits. Always moves balance from exactly -2,997 to exactly +999.</td></tr>\n<tr><td>Deal-closure referral fee entitlement</td><td>10% of the applicable deal value (see proration rule below)</td></tr>\n<tr><td>Deal-closure referral fee, net to referring partner</td><td>entitlement \u00d7 0.91 (Sarthy takes 9% of the 10%)</td></tr>\n<tr><td>12-month proration rule</td><td>If deal_duration \u2264 12 months, use the full deal_value. If deal_duration > 12 months, use only the value invoiced in the first 12 months - not the full multi-year contract value.</td></tr>\n<tr><td>Goodwill credit expiry</td><td>issue_date + 30 days. Paid credits never expire.</td></tr>\n</table>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">See the balance-threshold diagram in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a> for how the freeze floor and the At-Risk line sit relative to each other.</p>\n\n<h2>Validation and edge-case rules</h2>\n<ul>\n<li><strong>Duplicate detection:</strong> runs at the moment of upload, before the lead reaches admin - not a background job that runs later.</li>\n<li><strong>Decline counting:</strong> 4 consecutive declines (not 4 total, not 4 in a rolling window) flags the partner to admin. The count resets on any acceptance.</li>\n<li><strong>Acknowledgment window:</strong> exactly 168 hours (7 days) from the Introduced timestamp. Finalization at hour 168 is automatic, not admin-triggered.</li>\n<li><strong>Dispute window:</strong> 14 days from the decision being disputed, in writing. Admin response target: 24 hours from that point.</li>\n<li><strong>At-Risk and Frozen are independent triggers</strong> - evaluate both conditions separately on every wallet-affecting event, don't treat one as implying the other.</li>\n</ul>\n"}, {"id": "replit-build-brief", "content_file": "replit-build-brief.html", "cat": "Technical Handoff", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Replit Build Brief", "desc": "Platform-specific companion to the Low-Level Spec - build order, lock-in risks, and human-review checkpoints for building on Replit", "html": "<p class=\"callout\">The platform-specific companion to the Low-Level Spec, written for whoever actually builds this on Replit. It doesn't repeat the business rules or data model - those live in the BRD, the Data Dictionary, and the Low-Level Spec. This document only adds what's specific to building on Replit: the technical choices to make deliberately, the build order that matches how Replit Agent actually works, and where a human needs to check the output rather than trust it.</p>\n\n<h2>Two choices to make deliberately, not by default</h2>\n<p>Replit Agent defaults to its own built-in services for storage and login. They work well inside Replit, but create real lock-in - and this system handles real financial data, with a regulatory review already pending on the Action Tracker. Don't accept the defaults here:</p>\n<ul>\n<li><strong>Database:</strong> use standard PostgreSQL, not Replit's built-in database. When the agent suggests its own, redirect it explicitly.</li>\n<li><strong>Authentication:</strong> use a standard library (Passport.js, Auth.js, or similar), not Replit's built-in auth. Same reason - portability matters more than convenience here.</li>\n</ul>\n<p>Everything else Replit scaffolds automatically (hosting, deployment, the dev environment itself) is fine to accept as-is - the lock-in risk is specifically in these two choices.</p>\n\n<h2>Build order</h2>\n<p>Matches the BRD's MVP tagging - build and stabilize the MVP-tagged sections first, treat Phase 2 as genuinely separate follow-up work rather than one combined spec. AI-generated code is well-documented to not scale cleanly past MVP-sized scope, so this isn't just a sequencing preference.</p>\n<ol>\n<li>Core data model - Partner, Credit Wallet, Lead (BRD Sections 3, 4, 5)</li>\n<li>Lead flow and acknowledgment (BRD Section 5, using the Low-Level Spec's Lead state machine directly)</li>\n<li>Conversion, disputes, and withdrawal (BRD Sections 6, 7)</li>\n<li>Post-closure referral fee tracking (BRD Section 8)</li>\n<li>Negative balances and the freeze/top-up mechanic (BRD Section 10)</li>\n<li>Integration requirements - payment gateway, e-signature (BRD Section 14) - these usually need to exist before the flows above can be tested end to end for real</li>\n<li>Everything tagged Phase 2 - gamification, full automation of notifications, pattern-detection reporting</li>\n</ol>\n\n<h2>What to feed the agent for each phase</h2>\n<p>A good Replit Agent prompt reads like a short product brief, not a raw requirements dump. For each phase above: pull the relevant BRD section's \"must\" statements directly, reference the Low-Level Spec's state machine and formulas for that area, and use the Playbook's worked examples as literal test cases to check the output against once built.</p>\n\n<h2>Where a human has to check the output, not just trust it</h2>\n<ul>\n<li><strong>Every financial calculation</strong> - the 9% fee, the 12-month proration, the negative-balance freeze math. Verify against the Low-Level Spec's formulas and the Playbook's worked examples line by line, not just \"does it look reasonable.\"</li>\n<li><strong>The Lead and Partner state machines</strong> - confirm every transition in the Low-Level Spec's tables is actually implemented, including the ones that are easy to skip (like a Dormant partner being able to submit a lead as their recovery path).</li>\n<li><strong>Before any major change,</strong> use Replit's checkpoint feature - there are documented cases of the agent deleting working code while attempting a fix.</li>\n</ul>\n\n<h2>Cost awareness</h2>\n<p>Replit Agent uses effort-based, credit-metered pricing - cost isn't fixed per feature. Worth tracking actual spend against the still-unconfirmed <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">development budget</a> as building progresses, not just at the end.</p>\n"}, {"id": "reporting-dashboard", "content_file": "reporting-dashboard.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Both", "title": "Reporting Dashboard", "desc": "A simple view of progress, measured against Sarthy's own KPIs", "html": "<p class=\"callout\">A simple view of progress, measured directly against Sarthy's own scorecard - not a new set of metrics invented separately. Until a real connected dashboard exists, this same structure works as a manual monthly report, built from the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>'s tables.</p>\n\n<div class=\"gantt\">\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Finding & signing partners (20%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:20%;\">20%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Supporting startups (40%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:40%;\">40%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Match-Making (30%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:30%;\">30%</div></div>\n</div>\n<div class=\"gantt-row\">\n  <div class=\"gantt-label\">Research & reporting (10%)</div>\n  <div class=\"gantt-track\"><div class=\"gantt-bar gantt-progress\" style=\"left:0%;width:10%;\">10%</div></div>\n</div>\n</div>\n<p style=\"font-size:12.5px;color:var(--ink-faint);margin:-0.5rem 0 1.5rem;\">These bars show Sarthy's fixed scorecard weights, not live performance - once real numbers exist, each category gets its own actual result, not just its weight.</p>\n\n<h2>What each category actually reports on</h2>\n<p>Every measure below is already defined in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 19</a> - this table just adds where the number comes from.</p>\n<table class=\"dtable\">\n<tr><th>Category</th><th>Measure</th><th>Data source</th></tr>\n<tr><td rowspan=\"3\">Finding & signing partners</td><td>New partners signed and onboarded per month</td><td>Partners table - count by onboarding date</td></tr>\n<tr><td>Time from first contact to signed agreement</td><td>Not currently tracked - needs a contact-date field added</td></tr>\n<tr><td>Share of newly signed partners who reach real activity, not just a signature</td><td>Partners table - status vs. onboarding date, directly targets the \"Part of Platform\" gap</td></tr>\n<tr><td rowspan=\"3\">Supporting startups</td><td>Call volume - startup calls and check-ins per month</td><td>Not currently tracked - needs a startup-contact log, separate from the partner call queue</td></tr>\n<tr><td>Outcomes - startups actually matched, not just contacted</td><td>Leads table - startups with at least one Introduced lead</td></tr>\n<tr><td>Startup feedback captured</td><td>Not currently tracked - no mechanism exists yet</td></tr>\n<tr><td rowspan=\"4\">Match-Making</td><td>Leads matched per month</td><td>Leads table - count by month, status Introduced or later</td></tr>\n<tr><td>Time from submission to match, vs. the 5-day target</td><td>Leads table - submitted_at to introduced timestamp</td></tr>\n<tr><td>Share validated vs. rejected or stalled</td><td>Leads table - lead_status distribution</td></tr>\n<tr><td>Spread of matches across the partner base</td><td>Leads table - distinct receiving_partner_id count vs. total leads</td></tr>\n<tr><td rowspan=\"2\">Research & reporting</td><td>Monthly report on activity trends</td><td>This dashboard itself, once populated</td></tr>\n<tr><td>Written recommendations and whether they're acted on</td><td>Not currently tracked - needs a simple recommendations log</td></tr>\n</table>\n\n<h2>What's missing before this can actually run</h2>\n<p>Half the measures above have a real data source already. The other half need something built first - most of it small:</p>\n<ul>\n<li>A contact-date field on the Partner record, to measure time-to-signature</li>\n<li>A startup-contact log, separate from the existing partner call queue in the Interim Operating System</li>\n<li>A lightweight recommendations log - even a simple running list would satisfy this for now</li>\n</ul>\n\n<h2>Cadence</h2>\n<p>Monthly, at minimum - matching the existing BRD requirement. Nothing here needs to be real-time; a month-old number is still useful for spotting a trend, which is what this is actually for.</p>\n"}];
