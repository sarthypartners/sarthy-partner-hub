g\" only ever means someone has expressed interest - it never means the connection exists yet. Every party involved can see that a request exists from the moment it's made, but only as a faded, FYI-only entry with nothing to act on - see below for what changes once admin has looked at it. Showing it at all, even in this inactive form, is deliberate: seeing a live request tends to nudge people to be more responsive and engaged on their own, before admin ever steps in - and it gives admin a shared reference point to open the sanity-check conversation with, instead of surprising the requested party cold. Being listed as a \"requested party\" means the same thing for whoever holds that role, startup included: real, required consent, not just a courtesy notice. That's confirmed explicitly for the referring-partner-initiated flow, where the startup is a requested party alongside the receiving partner - the first place in the SOP where a startup is formally asked to approve something, rather than only ever being the subject of someone else's decision.</p>\n\n<h2>The common approval process, step by step</h2>\n<svg viewBox=\"0 0 820 350\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:760px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowCR\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"10\" y=\"15\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"85\" y=\"35\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Startup requests</text>\n    <text x=\"85\" y=\"49\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">a receiving partner</text>\n\n    <rect x=\"10\" y=\"72\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"85\" y=\"92\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Referring partner</text>\n    <text x=\"85\" y=\"106\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">recommends a connection</text>\n\n    <rect x=\"10\" y=\"129\" width=\"150\" height=\"46\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"85\" y=\"149\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Receiving partner</text>\n    <text x=\"85\" y=\"163\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">proposes to a startup</text>\n\n    <line x1=\"160\" y1=\"38\" x2=\"220\" y2=\"90\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"160\" y1=\"95\" x2=\"220\" y2=\"95\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"160\" y1=\"152\" x2=\"220\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n    <line x1=\"220\" y1=\"90\" x2=\"220\" y2=\"100\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n\n    <rect x=\"225\" y=\"70\" width=\"160\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n    <text x=\"305\" y=\"90\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-weight=\"500\" font-size=\"11\">Visible to all parties</text>\n    <text x=\"305\" y=\"105\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">faded - FYI only, no action yet</text>\n\n    <line x1=\"385\" y1=\"95\" x2=\"415\" y2=\"95\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n\n    <rect x=\"420\" y=\"70\" width=\"150\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"495\" y=\"90\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">First sanity check</text>\n    <text x=\"495\" y=\"105\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">is this request real and valid</text>\n\n    <line x1=\"570\" y1=\"95\" x2=\"600\" y2=\"95\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n\n    <rect x=\"605\" y=\"70\" width=\"205\" height=\"50\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <text x=\"707\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Admin activates it</text>\n    <text x=\"707\" y=\"103\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">takes consent from requested party</text>\n\n    <line x1=\"707\" y1=\"120\" x2=\"707\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"150\" x2=\"707\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"500\" y1=\"150\" x2=\"500\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n    <line x1=\"707\" y1=\"150\" x2=\"707\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrowCR)\"/>\n\n    <rect x=\"415\" y=\"177\" width=\"170\" height=\"56\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"500\" y=\"200\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Consent refused</text>\n    <text x=\"500\" y=\"216\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">admin rejects, closed</text>\n    <text x=\"500\" y=\"228\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">no deduction to anyone</text>\n\n    <rect x=\"622\" y=\"177\" width=\"170\" height=\"56\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"707\" y=\"197\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Consent given</text>\n    <text x=\"707\" y=\"212\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">admin approves, parties</text>\n    <text x=\"707\" y=\"224\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">connected, 999 deducted</text>\n\n    <text x=\"10\" y=\"270\" fill=\"var(--ink-faint)\" font-size=\"10\">Referring partner (where one exists) sees the faded entry from the moment it's made, same as everyone else - never asked for approval, in any of the 3 flows.</text>\n    <text x=\"10\" y=\"285\" fill=\"var(--ink-faint)\" font-size=\"10\">Same-service-type overlap (SOP #7's existing guardrail) is now shown to the receiving partner as a flag, not used to block the request.</text>\n    <text x=\"10\" y=\"300\" fill=\"var(--ink-faint)\" font-size=\"10\">The 999-credit deduction always lands on the receiving partner, and always fires at admin approval - the new equivalent of today's \"Acknowledged.\"</text>\n  </g>\n</svg>\n\n<h2>What's genuinely new here, versus what stays the same</h2>\n<table class=\"dtable\">\n<tr><th>Rule</th><th>What changes</th></tr>\n<tr><td>Who can start a connection</td><td>New: a receiving partner can now propose to a startup directly. Today's SOP only lets a referring partner or the startup itself choose.</td></tr>\n<tr><td>Visibility before approval</td><td>New: every party involved can see that a request exists from the moment it's made - but only as a faded, FYI-only entry with nothing to act on, until admin runs the sanity check and activates it. Today's Path A/B have no equivalent \"quiet\" stage - the receiving partner is notified the moment a lead is Introduced, and it's actionable immediately.</td></tr>\n<tr><td>The referring partner's role</td><td>Changed: explicitly no veto in any of the 3 flows - sees the faded request from the moment it's made, like every other party, but is never asked to approve or block it. Today's SOP doesn't have to address this directly, since the referring partner already makes the choice in Path A.</td></tr>\n<tr><td>Same-service-type overlap</td><td>Loosened: today this blocks a lead from going to two same-type partners at once. Here, the receiving partner is shown the overlap and can still choose to proceed - the block becomes a flag.</td></tr>\n<tr><td>999-credit deduction</td><td>Stays: still charged to the receiving partner. Moves: fires at admin approval instead of at the receiving partner's own acknowledgment - the same underlying moment, generalized so it works for all 3 directions, including one where the receiving partner never formally \"acknowledges\" anything the old way.</td></tr>\n<tr><td>Who earns the lead-share credit and referral fee</td><td>Stays, extended: the startup's original referring/originating partner keeps both, regardless of which of the 3 flows produced the eventual connection - the same principle <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Section 7 already established for Path B, just applied consistently to this third direction too.</td></tr>\n</table>\n\n<h2>How this would map onto today's Lead lifecycle</h2>\n<p>Confirmed: \"admin approves\" is now the equivalent of \"Acknowledged\" in the <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level Spec</a>'s Lead state machine - the 999-credit deduction fires there, exactly like today, just triggered by admin's decision instead of the receiving partner's own action. \"Consent refused\" is the equivalent of \"Rejected\" - no deduction, same as today. Everything downstream of that point - In Progress, Converted, the referral fee, disputes - stays exactly as already defined; this only changes how a Lead gets from nothing to Introduced-and-Acknowledged, not what happens after.</p>\n\n<h2>Resolved: the 4 open questions from the first draft</h2>\n<p>Answered directly with Sarthy leadership before this design was folded into the SOP, Low-Level Spec, and Data Dictionary:</p>\n<ul>\n<li><strong>Startup consent, formally - resolved: yes, real consent is required.</strong> In the referring-partner-initiated flow, the startup is a requested party in exactly the sense the receiving partner is - actual approval, not just being kept informed.</li>\n<li><strong>What the \"sanity check\" actually checks - resolved: three things.</strong> The requesting party's account is in good standing; the request isn't a duplicate of one already open between the same pair; and the requesting party is using the feature responsibly - not, for instance, working through the partner or startup list to harvest bulk contact details rather than genuinely pursuing a connection. That third check is a judgment call for admin, not something a system rule can fully automate on its own - worth watching once this is live, and worth admin having a simple way to flag a pattern of misuse.</li>\n<li><strong>How long a request can sit open - resolved: no automatic expiry.</strong> Unlike Lead validation (5 working days) or acknowledgment (7 days), an open connection request has no timeout - it stays open until admin acts, however long that takes. Flagging this plainly as an operational risk rather than glossing over it: with no SLA built into the rule itself, the size of the open-request backlog becomes purely a function of how fast admin works through the queue, with nothing in the system forcing a decision either way.</li>\n<li><strong>Multiple open requests on the same startup - resolved: yes, more than one can stay open at once.</strong> Since the same-service-type rule is a flag rather than a block at the request stage, two similar receiving partners can each have an open request to the same startup at the same time - the startup keeps its options rather than the system forcing an early choice.</li>\n</ul>\n<p>One new question this resolution raises, not yet answered: when one of those open requests converts into an actual connection, do the startup's other open requests to similar-type partners close automatically, or stay open until someone acts on them too? The same-service-type guardrail was loosened to a flag at the request stage, but Partnership SOP v1.0 Section 7's underlying rule against serving a startup through two same-type partners at once presumably still applies once a connection is actually live, not just requested. Worth a direct answer before this reaches a developer as a build spec, since it decides what the system needs to do automatically the moment admin approves one of the open requests.</p>\n\n<h2>What changed as a result</h2>\n<p>With all 4 original open questions resolved, this is no longer a standalone proposal. <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Section 7 now describes this 3-flow model directly, replacing the old Path A/Path B-only description. The <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level Spec</a>'s Lead state machine now includes the request-visibility states (faded/FYI, then active) and treats admin approval as the trigger for the 999-credit deduction, generalized across all 3 directions. The <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>'s Lead table carries the new fields this needs - request direction, visibility state, and consent status per party. The <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">BRD</a> reflects the 3-flow model in its requirements. This page remains in the hub as the detailed walkthrough and the record of why each design decision was made the way it was - the 4 documents above are now where the actual rules live day to day.</p>\n\n<h2>Built from</h2>\n<p>The originating-partner reward-continuity rule extends the principle already confirmed in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Section 7 for Path B. The referral-fee mechanics referenced stay exactly as defined in Section 20. The Lead-lifecycle mapping is checked against the <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level Spec</a>'s state machine. This connects directly to Stage 1 (Origination) of the <a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a> and the <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> it was built from - now confirmed, this replaces how Stage 1 actually happens for all three roles.</p>\n"}, {"id": "phase0", "content_file": "phase0.html", "cat": "Business Documents", "status": "done", "version": "2.5", "updated": "Reclassified the 2 still-open money-mechanics bullets as resolved-but-traceable - both already stated confirmed answers and were contradicting the page's own only-genuinely-open framing.", "type": "Sarthy-facing", "title": "Phase 0 Discussion Doc", "desc": "Questions to go through with Sarthy before we start building anything", "html": "<p class=\"callout\">Most of what started as open questions here has since been resolved and now lives fully in Partnership SOP v1.0 - see its Version History for the full record. This document only holds what's genuinely still unresolved, plus the access checklist.</p>\n\n<h2>Resolved, kept here only for traceability - money mechanics</h2>\n<p>Both items below already have a confirmed answer elsewhere in the hub - they're listed here only because they started life as open questions on this page, not because either is still open.</p>\n<ul>\n  <li>Top-up pricing for a frozen negative balance is confirmed: the -2,997 floor and 4x999 top-up (SOP Section 8).</li>\n  <li>The 9% fee timing question is confirmed, and resolved differently than the original question assumed: the fee is taken once, at the point credit transfers on conversion - not at withdrawal, and not split into \"before/after deductions\" or \"request vs. processing\" (SOP Section 10).</li>\n</ul>\n\n<h2>Still open - the app itself</h2>\n<ul>\n  <li><strong>Action item, not yet done:</strong> a real feature inventory of what's live in the current Alpha build versus only planned - the Lead has agreed to build this once there's portal access, rather than guess at it.</li>\n  <li>Bug and feature-request routing goes to the admin, who decides where things go from there - but the actual downstream destinations (engineering, product, elsewhere) still aren't mapped out.</li>\n</ul>\n\n<h2>Access still needed</h2>\n<ul>\n  <li>A login to sarthy.vip, both as an admin and as a regular partner, to see how it actually works</li>\n  <li>The shared folder with all the signed partner agreements</li>\n  <li>Edit access to the partner tracking spreadsheet</li>\n  <li>Access to whatever email or WhatsApp Business account is used to reach out to partners</li>\n  <li>A list of the current early users, with contact details</li>\n</ul>\n"}, {"id": "deliverables", "content_file": "deliverables.html", "cat": "Tracking & Governance", "status": "done", "version": "1.8", "updated": "Restored the Migration Wave Plan bullet - un-decommissioned.", "type": "Internal", "title": "Deliverables Register", "desc": "A list of every document in this project and what each one is for", "html": "<p class=\"callout\">A simple list of every document in this project - who it's for, and where it's meant to live.</p>\n\n<h2>Documents that will eventually go to Sarthy</h2>\n<ul>\n  <li><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a>, once every section is finished - this is now the primary document Sarthy would review</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 questions</a>, once Sarthy has answered them</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">list of problems found</a>, with suggested fixes</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">requirements document</a> for the marketplace app, written for their developers - first draft done, still needs gap-mapping against the real Alpha build</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">detailed technical spec</a> that follows from that requirements document</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('replit-build-brief');return false;\" class=\"xlink\">Replit Build Brief</a> - the build-ready reference for the development team, kept in sync with the technical spec</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">targets for moving from early testing to a full launch</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">plan for which partner groups move onto the app, and in what order</a>, once migration planning resumes</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">action item and blocker tracker</a> - the legal, regulatory, and resourcing items genuinely need Sarthy's involvement to close</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('glossary');return false;\" class=\"xlink\">glossary</a>, so Sarthy doesn't need to have read every document to follow the specific vocabulary</li>\n</ul>\n\n<h2>Documents that stay just between the Lead and Associate</h2>\n<ul>\n  <li>The overall <a href=\"#\" onclick=\"showDoc('roadmap');return false;\" class=\"xlink\">project plan</a> and the <a href=\"#\" onclick=\"showDoc('sequence');return false;\" class=\"xlink\">working to-do list</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">guide for interviewing early app users</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">write-up of how things work today</a> (Sarthy could see this if they want, but it's mainly our own reference)</li>\n  <li>The shared <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">definition of what each piece of partner data means</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">simple working system</a> used day to day</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> (which now also covers the referring and receiving partner lifecycles, plus a proposed startup lifecycle - formerly two separate documents, merged into one) and <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a> - kept as their own analytical documents, feeding conclusions into <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> rather than being folded in</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a> built from the User Journey Map's findings</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> - a detailed, confirmed walkthrough of the same connection rule Partnership SOP v1.0 Section 7 states more briefly</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">ready-made messages</a> for calls and follow-ups</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('reporting-dashboard');return false;\" class=\"xlink\">simple dashboard</a> used to track progress</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a> page, for why things are built the way they are</li>\n</ul>\n"}, {"id": "interview-guide", "content_file": "interview-guide.html", "cat": "Process Documents", "status": "done", "version": "1.2", "updated": "Fixed 1 instance in the meta-instruction callout", "type": "Internal", "title": "Alpha Partner Interview Guide", "desc": "Questions to ask the first live partners, to learn what's working", "html": "<p class=\"callout\">Use this every time you talk to one of the current early app users. Keep it like a real conversation, not a form you're reading out loud. The goal is honest detail, not fast answers.</p>\n\n<h2>Before you call</h2>\n<ul>\n<li>If you can, check what they've actually done in the app - when they last logged in, how many leads they've sent or received.</li>\n<li>Know which program they're in (India or international) and how long they've been signed up, so you're not asking them to repeat things they've already told us.</li>\n</ul>\n\n<h2>How to open the call</h2>\n<p>\"We're improving how the partner app works, and you're one of the few people actually using it right now - so what you tell us matters more than most feedback we get. Nothing you say changes your standing with Sarthy. We just want the honest picture of what's working and what isn't.\"</p>\n\n<h2>Questions about how they use it</h2>\n<ul>\n<li>Tell me about the last time you opened the app. What were you trying to do?</li>\n<li>What do you actually use it for today - checking leads, sending referrals, checking your balance, something else?</li>\n<li>Is there anything you'd expect to be able to do in the app that you're still doing over WhatsApp, email, or a phone call instead?</li>\n</ul>\n\n<h2>Questions about what's frustrating</h2>\n<ul>\n<li>Tell me about a time something in the app confused you or didn't work how you expected.</li>\n<li>Has a lead or referral ever felt unclear or unfair in how it was handled? Walk me through what happened.</li>\n<li>If you've tried to withdraw your credits, how did that go?</li>\n<li>Is there anything you gave up trying to do in the app because it was too much hassle?</li>\n</ul>\n\n<h2>Questions about what would bring them back</h2>\n<ul>\n<li>How often do you find yourself thinking about checking the app, even if you don't always do it?</li>\n<li>What would make you want to open it every week, without needing a reminder?</li>\n<li>If we could add just one thing to the app, what would actually make a difference for you?</li>\n</ul>\n\n<h2>Wrapping up</h2>\n<ul>\n<li>Is there anyone else in your network you think should be part of this?</li>\n<li>Can we check in with you again in a few weeks as things change?</li>\n</ul>\n\n<h2>What to do with the notes afterward</h2>\n<p>Write up the raw notes under this partner's record in the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>. Anything that sounds like a bug or a feature request should go wherever Sarthy decides bugs get tracked, once they've told us.</p>\n<p>If the same theme comes up across several calls, make sure it makes its way into the <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">write-up of how things work today</a>, and from there into the <a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">list of problems and fixes</a>. Don't let a strong, repeated pattern sit unused.</p>\n"}, {"id": "current-state", "content_file": "current-state.html", "cat": "Reference Materials", "status": "done", "version": "1.3", "updated": "Fixed 6 instances of we", "type": "Both", "title": "Current-State Assessment", "desc": "A summary of how things work today, based on interviews and data", "html": "<p class=\"callout\">This is the honest picture of how things work today, based on real documents and the tracking sheet - not guesses. Organized around Sarthy's own way of measuring this work, so it's easy for them to relate to.</p>\n\n<h2>1. The path to today</h2>\n<p>The partner program has gone through three real stages. Today's reality is a mix of all three at once: old agreements still technically active, a redesign that was written but never fully built, and a very early version of the actual app.</p>\n<table class=\"dtable\">\n<tr><th>Stage</th><th>How it worked</th><th>Confirmed facts</th></tr>\n<tr><td>First version (Jan 2023 - Oct 2024)</td><td>Sarthy staff manually matched startups to partners by hand. Standard agreement: partners pay each other 10% of any business the referral leads to.</td><td>25+ signed agreements on file. Run by Amar Nath, who brought in roughly \u20b97 lakh in revenue during this period.</td></tr>\n<tr><td>Quiet period (late 2024 - early 2026)</td><td>No one owned this full-time after Amar Nath left. Sarthy itself says engagement and revenue both dropped. Two events were run to re-engage partners (one in July 2025, one in September 2025), but there was no ongoing routine.</td><td>Confirmed by Sarthy's own account. The tracking sheet shows several different team members handling this on and off, with no single owner.</td></tr>\n<tr><td>Early app version (mid-2026 onward)</td><td>A new self-serve model: partners send leads directly to each other, and the app automatically handles the credits and fees. Sarthy earns a 9% fee whenever someone withdraws money or credits.</td><td>Confirmed live, but Sarthy describes it as \"a skeletal Alpha version\" - fewer than 10 people are actively using it so far.</td></tr>\n</table>\n\n<h2>2. How many partners are actually engaged - the real starting point</h2>\n<p>By Sarthy's own account, the original agreement \"lacked a call to action,\" so out of everyone who signed up, fewer than <strong>15%</strong> ever became active. That's the number any new plan should be measured against - not zero, since something was already tried and mostly didn't stick.</p>\n<p>There's also a real, waiting group of roughly <strong>25 more partners</strong> - in India and abroad - already asking for access to Sarthy's startups but not yet signed up. That's a separate opportunity from re-engaging the old, inactive group.</p>\n\n<h2>3. Finding and signing up partners - today's reality</h2>\n<p>New partners come through LinkedIn, mass emails, a WhatsApp group, personal connections, and direct referrals - there's no single defined channel. Deciding whether someone's a good fit is an informal judgment call made during a conversation, not a written checklist. Once someone signs, the process today is: sign the agreement, upload a scanned copy to a shared drive, assign them a code, and add their offer to a shared spreadsheet. There's no step yet that actually gets a new partner set up and using the app.</p>\n\n<h2>4. Supporting startups - today's reality</h2>\n<p>Startups are tracked in a separate part of the same spreadsheet, using the same manual approach: mass emails, phone calls, and a short scoring exercise called the \"5-minute test.\" Everything is logged by hand, by whichever team member happens to be active. There's no system connecting a startup's actual need to which partners get suggested to them - it depends on someone remembering.</p>\n\n<h2>5. Matching partners to startups - today's reality</h2>\n<p>This is the least documented part of Sarthy's own scorecard. There's no written definition yet of what \"good matching\" actually looks like, or how to measure it. In practice, it happens because a team member happens to remember which partner suits which startup - it isn't tracked anywhere as a specific, countable action. This has been flagged as something to ask Sarthy directly, rather than guessed at.</p>\n\n<h2>6. Research and reporting - today's reality</h2>\n<p>Also thin. There's no regular research schedule or report format in use today. This part of Sarthy's scorecard seems to exist on paper more than in practice right now.</p>\n\n<h2>7. The biggest single gap - getting partners onto the app</h2>\n<p>The partner tracking sheet has a column literally called <strong>\"Part of Platform\"</strong> - and for almost every partner, it's blank. This is the clearest evidence available: the app exists, but almost nobody who signed up in the first phase has ever actually been moved onto it.</p>\n<p>Confirmed directly with the Lead: even among the small number who are on the platform, real usage is infrequent, not active. So this isn't just an onboarding gap - it's also an activation gap, once someone is already in. Whatever new onboarding process gets built, closing both is the main job.</p>\n\n<h2>8. Money arrangements - more variety than expected</h2>\n<p>Most agreements follow the standard 10% mutual referral fee, with a 12-month tail after either side leaves, and no exclusivity. But real signed exceptions exist. One partner has a reverse 60/40 profit-sharing deal for sales Sarthy brings in directly. Another gets a flat \u20b910,000 bonus per converted trial, capped at two years. A third has a tiered commission instead of a flat fee - 15% or 20%, depending on deal size. Any new onboarding process needs to work for these exceptions too, not just the standard case.</p>\n\n<h2>9. What's already decided, and what's still open</h2>\n<p>A few things are still open questions for Sarthy, not confirmed yet: how credits and currency convert, exactly how the 9% withdrawal fee applies, how disputes get resolved, and what it takes to move beyond the first small group of app users.</p>\n<p>One rule is already clear: a partner who breaks trust gets blocked, and if a lead gets rejected, the credit is automatically reversed. Beyond that single rule, there's no written process for handling disagreements.</p>\n\n<h2>10. What this means for the work ahead</h2>\n<p>See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> for how these findings translate into actual rules and sections.</p>\n<ul>\n<li><strong>Making onboarding and engagement work better:</strong> the bar to beat is under 15% engagement from the first phase - this is a fix, not a cold start.</li>\n<li><strong>Getting everything to run through the app:</strong> the empty \"Part of Platform\" column is the single clearest, most measurable target for this whole project.</li>\n<li><strong>Getting partners into the habit of using the app:</strong> there's no existing data on this yet, since almost no one uses it. What \"a good habit\" looks like here still needs defining, based directly on what the early-user interviews reveal.</li>\n</ul>\n"}, {"id": "brd", "content_file": "brd.html", "cat": "Technical Documents", "status": "draft", "version": "2.6", "updated": "Section 5 rewritten for the confirmed 3-direction, admin-mediated connection flow; retired the 7-day acknowledgment-window test case in Section 16.", "type": "Sarthy-facing", "title": "Business Requirements Document", "desc": "The To-Be system requirements - what the app should do, per the SOP's confirmed and drafted rules", "html": "<p class=\"callout\">This is the To-Be system - what the marketplace app should do, written from Partnership SOP v1.0's rules, not from what's already built. This is deliberately not scoped to today's Alpha build - it's the target state. Once there's real portal access, the existing app gets compared against this document for a proper gap analysis, module by module. Each section is now tagged <strong>MVP</strong> (needed for a real first launch) or <strong>Phase 2</strong> (can come after) - a few sections split, where the basic version is MVP but full automation can wait.</p>\n\n<h2>1. Purpose and how to use this</h2>\n<p>Every requirement below traces back to a specific Partnership SOP v1.0 section - if the rule changes there, this document needs to change too (see the dependency map on the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">Start Here</a> page). Anything still marked open in the SOP shows up here as an open requirement too - this document doesn't invent answers the SOP doesn't have yet.</p>\n\n<h2>2. Who uses the system</h2>\n<ul>\n<li><strong>Referring partner</strong> - submits leads, tracks their own credit balance, requests withdrawals</li>\n<li><strong>Receiving partner</strong> - gets matched leads, acknowledges or declines them, updates progress toward conversion</li>\n<li><strong>Startup / lead</strong> - the actual prospect being referred; may need to confirm engagement at points where trust needs verifying (see Section 8 below)</li>\n<li><strong>Admin (Sarthy)</strong> - validates leads, confirms conversions, resolves disputes, reviews flagged accounts, manages the whole system's integrity</li>\n</ul>\n\n<h2>3. Onboarding and fees <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 5</a></p>\n<ul>\n<li>The system must support two programme types (India, International), each with its own fixed fee (\u20b9999 + GST, or $49) and identical starting credit grant (999 credits)</li>\n<li>The system must lock a partner's programme choice permanently at sign-up - no switching later</li>\n<li>The system must support digital signature capture for the referral agreement as part of onboarding</li>\n<li>The system must let admin record onboarding evaluation notes (service relevance, client diversity, professional standing, Giver/Taker read) against a partner's profile</li>\n<li>The system must activate the credit wallet with 999 opening credits immediately on fee payment confirmation</li>\n</ul>\n\n<h2>4. The credit wallet <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 6</a></p>\n<ul>\n<li>The system must maintain a running credit ledger per partner - every add and deduction, with a timestamp and a reason (fee payment, lead received, conversion earned, withdrawal, top-up)</li>\n<li>The system must distinguish between credits a partner paid for (never expire) and credits Sarthy issued as goodwill (expire 30 days from issue) - and must actually enforce that expiry automatically, not rely on manual tracking</li>\n<li>The system must not cap total balance for now, consistent with Section 6</li>\n<li>The system must display a partner's current balance clearly, including how much of it is expiring soon</li>\n</ul>\n\n<h2>5. Lead submission and connection flow <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a>, folded in from the confirmed <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a>. This replaces the old two-path, self-service-acknowledgment model - the requirements below are the current, authoritative ones.</p>\n<ul>\n<li>The system must let any of the 3 initiating parties - a referring partner (direction A), a startup (direction B), or a receiving partner (direction C) - submit a connection request with enough detail for admin to run its sanity check</li>\n<li>The system must check every new submission against existing open requests and automatically flag likely duplicates <strong>at the point of upload</strong>, before it reaches admin - not after</li>\n<li>The system must show a partner a list of existing open requests, to reduce accidental duplicate submissions</li>\n<li>The system must let the initiating party cancel a request any time before it reaches Acknowledged</li>\n<li>The system must track a lead through defined stages: Submitted \u2192 Introduced (immediate, visible to all relevant parties, faded/FYI-only) \u2192 Validated (admin's sanity check) \u2192 Acknowledged \u2192 In Progress \u2192 Converted / Rejected</li>\n<li>The system must have admin - not the receiving partner directly - take consent from every required requested party before a request can reach Acknowledged: the receiving partner in all 3 directions, and the startup as well in directions A and C. Consent refusal at any point moves the request to Rejected, with no deduction ever having happened</li>\n<li>The system must not auto-finalize or auto-close a request on any timer. There is no equivalent of the old 7-day acknowledgment window any more - a request can sit at Introduced or Validated indefinitely; it only changes state when admin actively approves it or a required party refuses consent</li>\n<li>The system must deduct 999 credits from the receiving partner's wallet the moment admin approves (reaches Acknowledged) - not before, not after</li>\n<li>The system must let the admin manually reverse a deduction in disputed cases, based on the merits, at any point after Acknowledged - see Section 11 below for the evidence mechanism</li>\n<li>The system must flag any receiving partner with 4 or more consecutive consent refusals to admin for manual review</li>\n<li>The system must allow a lead to be re-requested an unlimited number of times after a refusal</li>\n<li>The system must show, not block, same-service-type overlap - flagging the receiving partner when a startup already has another open request or active engagement with a similar-type partner, rather than preventing the new request outright. <strong>Not yet answered:</strong> whether one request converting to Acknowledged should auto-close the startup's other open requests to similar-type partners - needs a decision before this is built, see the Connection Request Flow page</li>\n<li>The system must let a startup browse the list of vetted partners and request one directly (direction B), without requiring a specific partner to have referred them first</li>\n<li>The system must let a receiving partner browse the full startup list and propose a connection directly, with a business proposal (direction C)</li>\n<li>The system must track which partner (if any) originally brought a given startup into Sarthy's ecosystem (originating_partner_id), separately from which partner the startup ultimately engages with - these can be different partners in any of the 3 directions</li>\n<li>The system must route both the 999-credit lead-share reward and the 10% deal-closure referral fee to the originating partner, regardless of which of the 3 directions produced the eventual connection</li>\n<li>The system must treat Sarthy itself as the originating partner when a startup signs up with no partner having brought them in - every reward mechanic that applies to a normal partner applies to Sarthy the same way in this case</li>\n<li><strong>Not yet scoped for build:</strong> a backend matchmaking layer, still in early direction only - see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a> for the current thinking. Needs its own design pass before it's a real requirement.</li>\n</ul>\n\n<h2>6. Conversion and disputes <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 9</a></p>\n<ul>\n<li>The system must support the same conversion standard for every service category - proof of first payment plus a digitally signed agreement, captured in-platform</li>\n<li>The system must credit the referring partner 999 credits minus the 9% fee (about 909 net) the moment admin confirms conversion - see Section 7 below for the fee mechanic</li>\n<li>The system must let a partner formally dispute a conversion decision within 14 days of it being made, in writing, through the platform</li>\n<li>The system must notify admin immediately when a dispute is raised, with a target response time of 24 hours</li>\n<li>The system must let a partner remaining unsatisfied after admin's response escalate a dispute directly to Sarthy leadership. <strong>Resolved:</strong> there's no fixed deal-value threshold. Every escalation must trigger an automatic notification to admin - an in-product popup, plus an automated email - the moment it happens. Admin then decides how to proceed, including whether to loop in Sarthy leadership, based on the specifics of the case.</li>\n</ul>\n\n<h2>7. Withdrawal and the credit wallet's money mechanics <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 10</a></p>\n<ul>\n<li>The system must treat membership as ongoing - no cycle-end event, no forced settlement date</li>\n<li>The system must enforce a minimum reserve of 999 credits at all times - a partner cannot withdraw below that floor</li>\n<li>The system must support quarterly withdrawal requests for anything above the reserve</li>\n<li>The system must apply the 9% fee once, at the point credit transfers to a referring partner on conversion - not again at withdrawal, since it's already been taken at the source</li>\n<li>The system must convert credits to real currency using the live exchange rate on the day of withdrawal, not the rate from sign-up. <strong>Resolved:</strong> the official source is a government-approved, publicly available real-time rate chart - specifically the RBI reference rate.</li>\n<li><strong>Resolved:</strong> the 9% facilitation fee applies to every partner, including those still under Partner 1.0-era agreements. Where an existing agreement doesn't support this, it needs to be amended - see the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a> for the documentation task this creates.</li>\n</ul>\n\n<h2>8. Post-closure referral fee tracking <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 20</a></p>\n<ul>\n<li>The system must let a receiving partner record deal value and duration once a referred lead closes into a signed agreement</li>\n<li>The system must notify Sarthy and the original referring partner when this happens</li>\n<li>The system must apply a 12-month proration rule when deal_duration exceeds 12 months - the referral fee is calculated only on value invoiced during the first 12 months, not the full multi-year contract</li>\n<li>The system must calculate the referring partner's entitlement as 10% of the applicable (prorated, if needed) value, then deduct Sarthy's 9% cut of that 10%, crediting the referring partner the remaining 91%</li>\n<li>The system must treat a startup being referred to a different partner later as a completely separate deal, with its own independent 12-month entitlement clock - not linked to any prior engagement with a different partner</li>\n<li>The system must accumulate this amount in the referring partner's account separately from their 999-point credit wallet - this is a different pool, on a different payout schedule</li>\n<li>The system must pay out the accumulated referral-fee balance once annually, at financial year-end (March 31st)</li>\n<li>The system must track a 1-year expiry from the lead's first engagement date, after which no further referral-fee entitlement accrues to the original referring partner on that relationship</li>\n</ul>\n\n<h2>9. Partner activity requirement (dormancy) <span class=\"status-pill badge-draft\">MVP (tracking) / High priority (gamification)</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 21</a></p>\n<ul>\n<li>The system must track the date of a partner's last shared lead</li>\n<li>The system must automatically mark a partner dormant after 3 consecutive months with no lead shared</li>\n<li>The system must remove a dormant partner from the public portal listing and block them from receiving new leads until they resume activity</li>\n<li><strong>Resolved - high priority:</strong> gamification elements (leaderboards, streaks, recognition) to encourage consistent giving. This is to be designed and built alongside the rest of the MVP features, not deferred. The specific mechanics still need a real design pass.</li>\n</ul>\n\n<h2>10. Negative balances <span class=\"status-pill badge-done\">MVP</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a></p>\n<ul>\n<li>The system must allow a partner's balance to run negative down to -2,997 credits</li>\n<li>The system must automatically freeze a partner's ability to receive new leads once their balance hits -2,997</li>\n<li>The system must support a top-up payment (4x the entry fee - \u20b93,996 or $196) that adds 3,996 credits back to a frozen wallet, bringing the balance from -2,997 to exactly +999</li>\n</ul>\n\n<h2>11. Trust and evidence - the dispute-reversal mechanism <span class=\"status-pill badge-draft\">MVP - discretion confirmed, contact form still needs design</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a></p>\n<p>For disputed cases raised after Acknowledged, the system should reach out directly to the startup to confirm whether the receiving partner actually engaged with them, and use that as evidence for admin's manual reversal decision.</p>\n<ul>\n<li>The system needs a way to contact the startup lead directly (a short form or message) and capture their confirmation or denial. The exact form this takes still needs a design pass.</li>\n<li><strong>Resolved:</strong> the startup's confirmation is not mandatory. It's one input among several the admin weighs, entirely at admin's discretion.</li>\n<li><strong>Resolved:</strong> if the startup doesn't respond either, that's also handled at admin's discretion. There's no fixed default favoring either partner.</li>\n</ul>\n\n<h2>12. Guardrails and admin tools <span class=\"status-pill badge-draft\">MVP (basic) / Phase 2 (pattern detection)</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 13</a></p>\n<ul>\n<li>The system must give admin visibility into referral patterns across the whole network, to spot suspicious coordination between just one or two partners</li>\n<li>The system must flag partners with consistently low conversion rates for admin review</li>\n<li>The system must support admin manually freezing or exiting a partner's account in cases of confirmed abuse</li>\n</ul>\n\n<h2>13. Reporting <span class=\"status-pill badge-pending\">Phase 2</span></h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 19</a>, <a href=\"#\" onclick=\"showDoc('reporting-dashboard');return false;\" class=\"xlink\">Reporting Dashboard</a></p>\n<ul>\n<li>The system must be able to report, at minimum monthly, on all 4 of Sarthy's scorecard categories - not just Match-Making. See the Reporting Dashboard for the exact measures and data sources for each.</li>\n<li>The system must support recording written recommendations coming out of that reporting, and whether they were acted on</li>\n<li><strong>Not yet built anywhere:</strong> a startup-contact log (separate from the partner call queue) and a contact-date field on the Partner record - both needed before the \"Supporting startups\" and \"Finding & signing partners\" categories can actually report real numbers</li>\n</ul>\n\n<h2>14. Integration requirements <span class=\"status-pill badge-draft\">MVP (payments, e-sign) / Phase 2 (automation)</span></h2>\n<p>Every one of these is implied by the rules above but never named as an actual technical dependency until now. Selection status tracked on the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a>, not here - this section defines <em>what</em> needs to integrate, not which vendor.</p>\n<ul>\n<li>A payment gateway - for collecting the \u20b9999/$49 entry fee and processing withdrawal payouts. Selection pending.</li>\n<li>A digital-signature provider - for the referral agreement (Section 3) and conversion confirmation (Section 6). Selection pending.</li>\n<li>A notification channel (email and/or WhatsApp) - for every trigger in the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>. Specific provider not yet chosen.</li>\n<li>An exchange-rate data source - for converting credits to real currency at withdrawal (SOP Section 10). Which source counts as official is still open.</li>\n<li>An SSO provider - for the startup-facing self-service product (Section 5). Selection pending.</li>\n</ul>\n\n<h2>15. Non-functional requirements</h2>\n<p>A reasonable baseline, not a formal compliance commitment - can be revisited once real usage and Sarthy's own constraints are clearer.</p>\n<ul>\n<li>The system must encrypt financial and personal data both at rest and in transit - this handles partner bank/payout details and startup contact information, not just operational data</li>\n<li>The system should collect only the data fields already defined in the Data Dictionary - no speculative data collection beyond what a defined rule actually uses</li>\n<li>No formal uptime commitment for now - reasonable best-effort availability is sufficient at this stage, not a contracted SLA</li>\n</ul>\n\n<h2>16. How each requirement gets verified</h2>\n<p>A general principle, plus the specific cases most likely to be interpreted differently by different developers without an explicit test:</p>\n<ul>\n<li><strong>Duplicate lead detection:</strong> submitting the same contact's details twice within the system should be caught and flagged before the second submission reaches admin - test by submitting an intentional duplicate and confirming it's blocked at upload, not after.</li>\n<li><strong>No auto-finalization:</strong> a request left untouched at Introduced or Validated should still be sitting there, unchanged, no matter how much time passes - test by leaving a request deliberately untouched for well beyond the old 7-day window and confirming nothing about its state or the receiving partner's wallet changes on its own.</li>\n<li><strong>Negative balance freeze:</strong> a partner whose balance reaches exactly -2,997 should be blocked from receiving further leads immediately - test by driving a test account to exactly that balance and confirming the block fires at -2,997, not -2,998 or later.</li>\n<li><strong>12-month proration:</strong> a deal reported with a duration over 12 months should calculate the referral fee only on the portion attributable to the first 12 months - test with an 18-month deal and confirm months 13-18 don't affect the payout.</li>\n</ul>\n\n<h2>17. Open decisions log</h2>\n<p>Carried forward from Partnership SOP v1.0 and the Phase 0 Discussion Doc - nothing below should get quietly assumed by whoever eventually builds this:</p>\n<p><strong>Sign-off, resolved:</strong> this document requires written approval from a specifically named person or role at Sarthy before development begins - an informal conversation isn't sufficient. The drafting and iteration process itself stays informal - no need for a fresh Sarthy signature on every revision. The formal approval happens once, at whatever point the Lead judges the document ready. Who that named person is hasn't been designated yet - tracked on the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a>.</p>\n<ul>\n<li>The exact design of the startup-confirmation form or message for disputed reversals (the underlying process - non-mandatory, admin's discretion - is resolved; only the form itself still needs designing)</li>\n<li>Exact gamification mechanics for the dormancy/activity system (priority is resolved as high; the specific mechanics still need a design pass)</li>\n<li>The live feature inventory of what's actually built in the current Alpha - once portal access is confirmed, this document gets checked against that reality for a real gap analysis</li>\n</ul>\n"}, {"id": "gap-register", "content_file": "gap-register.html", "cat": "Reference Materials", "status": "draft", "version": "1.7", "updated": "Synced the Partner 1.0-era agreements finding with BRD Section 7 and the Action Tracker - the 9% fee question is resolved as policy; what remains open is execution (identifying and amending agreements), not the original open legal question.", "type": "Internal", "title": "Gap & Risk Register", "desc": "A list of problems we found, each with a suggested fix", "html": "<p class=\"callout\">Every gap below traces back to evidence in the <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Current-State Assessment</a>, or to something surfaced while building Partnership SOP v1.0. Ranked by how much it affects the core mandate: onboarding, engagement, and getting activity to actually run through the platform.</p>\n\n<table class=\"dtable\">\n<tr><th>Gap</th><th>Severity</th><th>Status</th><th>Fix / Note</th></tr>\n<tr><td>Almost no signed 1.0 partners were ever moved onto the platform (\"Part of Platform\" column empty)</td><td>High</td><td>Open</td><td>The core target for the whole engagement - addressed by the redesigned onboarding flow (SOP #7) and the migration wave plan</td></tr>\n<tr><td>Even the small number of current Alpha users show infrequent, not active, usage</td><td>High</td><td>Open</td><td>Not just an onboarding problem - an activation one. Feeds directly into the engagement cadence (SOP #15)</td></tr>\n<tr><td>No defined ongoing engagement cadence existed historically</td><td>High</td><td>Closed</td><td>SOP #15 now defines partner-controlled selection plus regular Sarthy team touch-base</td></tr>\n<tr><td>No reactivation process for dormant partners</td><td>Medium</td><td>Closed</td><td>Trigger rule is defined (SOP #21, 3-month dormancy), and the outreach script exists in the Communication Template Library, item 7</td></tr>\n<tr><td>Two separate reward systems existed with no single document connecting them</td><td>High</td><td>Closed</td><td>SOP #20 now documents the deal-closure referral fee alongside the credit system - a real historical documentation gap, not just a wording issue</td></tr>\n<tr><td>Negative-balance top-up math didn't actually reach the required floor</td><td>Medium</td><td>Closed</td><td>Caught during drafting, corrected with real numbers (SOP #8)</td></tr>\n<tr><td>Which exchange rate source counts as official for withdrawal conversion</td><td>Low-Medium</td><td>Closed</td><td>Resolved - a government-approved, publicly available real-time rate chart (the RBI reference rate), see SOP #10</td></tr>\n<tr><td>No escalation path defined beyond the admin for unresolved disputes</td><td>Medium</td><td>Closed</td><td>Resolved - the admin is final for routine disputes, any dispute can escalate to Sarthy leadership with no fixed value threshold, triggering an automatic admin notification (SOP #9)</td></tr>\n<tr><td>Real feature inventory of the current Alpha build is unknown</td><td>High</td><td>Blocked</td><td>Waiting on portal access - the BRD's To-Be spec exists and is ready for gap-mapping the moment access comes through</td></tr>\n<tr><td>Some existing Partner 1.0-era agreements may not support the now-confirmed rule that the 9% facilitation fee applies to every partner</td><td>Critical</td><td>Tracked</td><td>Resolved as policy - the fee applies universally, agreements that don't support it need amending (Partnership SOP v1.0 \u00a77). What's open now is execution: identifying which agreements fall short and amending them. See the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a>'s legal-review and agreement-documentation items - needs real legal work, not a documentation fix</td></tr>\n<tr><td>Credit wallet may trigger RBI/PPI or TDS obligations</td><td>Critical</td><td>Tracked</td><td>See the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a> - needs real regulatory/compliance review</td></tr>\n<tr><td>No plan for migrating real historical partner data into the eventual system</td><td>High</td><td>Tracked</td><td>Approach decided (bulk spreadsheet import, predefined format) - see the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a> and the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item Tracker</a></td></tr>\n<tr><td>Match-Making and Research & Reports KPIs were undefined in Sarthy's own framework</td><td>Medium</td><td>Proposed, awaiting sign-off</td><td>SOP #19 now has concrete proposed measures</td></tr>\n<tr><td>Duplicate lead detection and stall handling required real design, not just policy</td><td>Medium</td><td>Partially closed</td><td>Detection rule is defined. The startup-confirmation evidence mechanism for disputed reversals is still open (SOP #7, BRD #11)</td></tr>\n<tr><td>No formal criteria for moving from early testing to a wider rollout</td><td>High</td><td>Closed</td><td>SOP #18 now has Sarthy's real target - 10 active partners within 2 weeks of full launch</td></tr>\n<tr><td>Whether a Frozen partner can submit/refer a lead is never answered anywhere - Frozen is specifically about receiving, submitting was never addressed</td><td>Low</td><td>Open</td><td>Found while drafting the Low-Level Spec's state machine - worth a quick confirmation before building, not a blocker</td></tr>\n</table>\n\n<h2>What this means for sequencing</h2>\n<p>The remaining open items cluster into two groups: things that are genuinely fine to leave open a while longer (the exact form design for startup confirmations, gamification mechanics), and things that create real risk the longer they stay unresolved (the legal and regulatory reviews, the feature inventory). The Gap & Risk Register should be revisited whenever a new open item surfaces elsewhere in the hub - see the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">dependency map</a>.</p>\n"}, {"id": "segmentation", "content_file": "segmentation.html", "cat": "Process Documents", "status": "draft", "version": "3.0", "updated": "Restored the Migration Wave Plan bullet in Feeds Directly Into - un-decommissioned.", "type": "Internal", "title": "Partner Segmentation Framework", "desc": "A way to group partners so we know who to focus on first", "html": "<p class=\"callout\">This is the full version of the grouping logic <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> #11 only summarizes. Used to decide where the Associate's limited calling time goes first, and to sequence the migration wave plan.</p>\n\n<p>This document uses two separate fields with no overlapping words - <code>status</code> and <code>giving_pattern</code>, described below. For why it's structured this way instead of one combined field, see <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.</p>\n\n<h2>Field 1: Account status - unchanged from the Data Dictionary</h2>\n<p>This is the same <code>status</code> field defined there - Applicant, Active, At-Risk, Dormant, Frozen, Exited. It controls what the account can actually do on the platform. This document doesn't redefine it, just uses it.</p>\n<svg viewBox=\"0 0 700 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrow2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11.5\">\n    <rect x=\"270\" y=\"15\" width=\"160\" height=\"46\" rx=\"8\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"350\" y=\"43\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Active</text>\n\n    <line x1=\"350\" y1=\"61\" x2=\"350\" y2=\"90\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow2)\"/>\n    <text x=\"360\" y=\"80\" fill=\"var(--ink-faint)\" font-size=\"10\">wallet trending down</text>\n\n    <rect x=\"270\" y=\"92\" width=\"160\" height=\"46\" rx=\"8\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <text x=\"350\" y=\"120\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">At-Risk</text>\n\n    <line x1=\"290\" y1=\"138\" x2=\"150\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow2)\"/>\n    <text x=\"120\" y=\"160\" fill=\"var(--ink-faint)\" font-size=\"10\">3 months, no lead</text>\n\n    <line x1=\"410\" y1=\"61\" x2=\"560\" y2=\"175\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow2)\" stroke-dasharray=\"3,2\"/>\n    <text x=\"460\" y=\"120\" fill=\"var(--ink-faint)\" font-size=\"10\">balance hits -2,997</text>\n    <text x=\"460\" y=\"133\" fill=\"var(--ink-faint)\" font-size=\"10\">(independent trigger)</text>\n\n    <rect x=\"55\" y=\"178\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"130\" y=\"206\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Dormant</text>\n\n    <rect x=\"495\" y=\"178\" width=\"150\" height=\"46\" rx=\"8\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"570\" y=\"206\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\">Frozen</text>\n\n    <line x1=\"205\" y1=\"201\" x2=\"495\" y2=\"201\" stroke=\"var(--ink-faint)\" stroke-width=\"1.2\" stroke-dasharray=\"2,3\"/>\n    <text x=\"350\" y=\"196\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">can occur together</text>\n\n    <text x=\"130\" y=\"245\" text-anchor=\"middle\" fill=\"var(--green)\" font-size=\"10.5\">\u21ba send a lead \u2192 back to Active</text>\n    <text x=\"570\" y=\"245\" text-anchor=\"middle\" fill=\"var(--green)\" font-size=\"10.5\">\u21ba top up \u2192 back to Active</text>\n  </g>\n</svg>\n<p style=\"font-size:12.5px;color:var(--ink-faint);margin:-0.5rem 0 1.25rem;\">If both apply at once: pay the top-up first, then send a lead - see the Data Dictionary for the exact recovery rule.</p>\n\n<h2>Field 2: Giving pattern - new, only applies when status is Active</h2>\n<p>Not a fixed label - read from wallet trend over time:</p>\n<ul>\n<li><strong>Giver:</strong> wallet balance trending upward - referring more than receiving, leads converting, low decline rate</li>\n<li><strong>Balanced:</strong> wallet roughly stable - giving and receiving in reasonable proportion. This is the default state for most partners most of the time, not an edge case.</li>\n<li><strong>Taker:</strong> wallet balance trending downward over time - receiving regularly, referring rarely or never. This is a <em>pattern</em>, read from the trend over several transactions, not a specific number - deliberately different from the account status At-Risk, which fires at a specific balance (-1,500) or a specific decline count (4+), regardless of longer-term pattern.</li>\n</ul>\n<svg viewBox=\"0 0 660 165\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:600px;display:block;margin:0 auto 1.25rem;\">\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <rect x=\"10\" y=\"10\" width=\"195\" height=\"90\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <polyline points=\"35,80 75,66 115,52 155,38 185,26\" fill=\"none\" stroke=\"var(--green)\" stroke-width=\"2\"/>\n    <circle cx=\"185\" cy=\"26\" r=\"3\" fill=\"var(--green)\"/>\n    <text x=\"107\" y=\"122\" text-anchor=\"middle\" fill=\"var(--green)\" font-weight=\"600\" font-size=\"11\">Giver</text>\n    <text x=\"107\" y=\"137\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">wallet trending up over time</text>\n\n    <rect x=\"230\" y=\"10\" width=\"195\" height=\"90\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <polyline points=\"255,55 295,45 335,62 375,48 405,55\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/>\n    <circle cx=\"405\" cy=\"55\" r=\"3\" fill=\"var(--accent)\"/>\n    <text x=\"327\" y=\"122\" text-anchor=\"middle\" fill=\"var(--accent)\" font-weight=\"600\" font-size=\"11\">Balanced</text>\n    <text x=\"327\" y=\"137\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">roughly stable &#8212; the default for most</text>\n\n    <rect x=\"450\" y=\"10\" width=\"195\" height=\"90\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <polyline points=\"475,25 515,40 555,55 595,68 625,80\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"2\"/>\n    <circle cx=\"625\" cy=\"80\" r=\"3\" fill=\"var(--red)\"/>\n    <text x=\"547\" y=\"122\" text-anchor=\"middle\" fill=\"var(--red)\" font-weight=\"600\" font-size=\"11\">Taker</text>\n    <text x=\"547\" y=\"137\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">wallet trending down over time</text>\n\n    <text x=\"10\" y=\"158\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Illustrative shape of the trend, not real wallet data &#8212; the actual signal is read from several transactions, not a single dip or rise.</text>\n  </g>\n</svg>\n<p>Giving pattern only means something for an Active account. A Dormant or Frozen account doesn't get a giving pattern - its status already says everything that matters for how to handle it.</p>\n\n<div class=\"example-box\">\n<strong>Worked example - Taker and At-Risk don't always move together:</strong>\n<p style=\"margin:8px 0 0;\">Rohan starts with a healthy Giver pattern, referring regularly. Over three months, his referrals dry up while he keeps receiving leads - his giving_pattern quietly shifts to Taker as the ratio tips, even though his balance is still a comfortable <span class=\"amt-pos\">+2,200</span>, nowhere near -1,500. He's a Taker, but not At-Risk. Then, separately, a run of four leads he genuinely can't service comes in over two weeks - he declines all four. That decline count alone flags him At-Risk immediately, even though nothing about his underlying giving_pattern changed that week. Two different signals, two different moments, not the same trigger.</p>\n</div>\n\n<h2>Outreach priority - combining the two fields</h2>\n<table class=\"dtable\">\n<tr><th>Status</th><th>Giving pattern</th><th>Outreach priority</th></tr>\n<tr><td>At-Risk</td><td>(not relevant - status alone drives this)</td><td>Highest priority, high-touch direct intervention - this is where the Associate's calling time matters most, before someone drops to Frozen or Dormant</td></tr>\n<tr><td>Dormant</td><td>(not relevant)</td><td>Reactivation campaign, on a rotating weekly quota (see the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a>) - not routine calling</td></tr>\n<tr><td>Frozen</td><td>(not relevant)</td><td>A different queue entirely - a top-up prompt, not a relationship call. See SOP #8.</td></tr>\n<tr><td>Active</td><td>Taker</td><td>Medium-high touch - the group most likely to slide into At-Risk if left unattended</td></tr>\n<tr><td>Active</td><td>Balanced</td><td>Medium-touch, standard monthly rotation - the biggest group, nurture toward Giver</td></tr>\n<tr><td>Active</td><td>Giver</td><td>Low-touch, high-value - keep them happy, feature them (Partner of the Month), ask for referrals to new partners</td></tr>\n<tr><td>Applicant</td><td>-</td><td>Standard onboarding flow (SOP #5), not this framework</td></tr>\n<tr><td>Exited</td><td>-</td><td>No outreach</td></tr>\n</table>\n\n<h2>How this differs from the evaluation-stage Giver/Taker read</h2>\n<p>SOP #5 describes an initial, conversation-based Giver/Taker/Balanced judgment made during onboarding - useful, but subjective and only a snapshot. The <code>giving_pattern</code> field replaces that snapshot with an ongoing, data-driven signal once a partner has real wallet activity.</p>\n\n<h2>Feeds directly into</h2>\n<ul>\n<li>The <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Winning back inactive partners</a> process (SOP #17) - accounts with status Dormant are its target list</li>\n<li>The Associate's daily call queue, using this exact combined table - see the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a></li>\n<li>The <a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Migration Wave Plan</a> - Active/Giver and Active/Balanced partners are natural early-wave candidates once rollout expands. This applies identically whether a partner is brand-new or migrated from the old tracker. See the <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a> for why migration doesn't get special-cased status logic.</li>\n</ul>\n"}, {"id": "combined-journey", "content_file": "combined-journey.html", "cat": "Process Documents", "status": "draft", "version": "3.1", "updated": "Merged the retired Partner Journey Map in as two new sections (Referring Partner Lifecycle, Receiving Partner Lifecycle), added a new proposed Startup Lifecycle section, and renamed the document to User Journey Map. Now filed under Process Documents, following the hub-wide recategorization.", "type": "Internal", "title": "User Journey Map", "desc": "One document, four angles on the partner network: the Referral Timeline (startup, referring partner, and receiving partner on one shared timeline), the Referring and Receiving Partner account lifecycles, and a proposed Startup lifecycle. Absorbs the former Partner Journey Map.", "html": "<p class=\"callout\">This document used to be two separate pages - the Partner Journey Map and the Combined Journey Map. They're merged here as the <strong>User Journey Map</strong>, in four sections: (A) one referral, three parties, one shared timeline; (B) the referring partner's own account lifecycle; (C) the receiving partner's own account lifecycle; (D) a proposed startup lifecycle, since nothing in the hub tracks that today. See <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History &amp; Decisions</a> for why the merge happened and why B and C exist as separate sections even though they describe mostly the same mechanics.</p>\n\n<h2>A. The Referral Timeline</h2>\n<p>This section lines up the startup, the referring partner, and the receiving partner against the same shared timeline for one specific referral, so it's possible to see what each of them is experiencing at the exact same moment. Built to spot where engagement quietly breaks down, as the first step before designing any fix.</p>\n\n<div class=\"pending-box\" style=\"text-align:left;\">\nBefore this timeline starts, both partners have already been through their own account lifecycle - see Sections B and C below. This section picks up once a specific startup enters the picture, and follows that one lead through to conversion, deal closure, and whatever happens next.\n</div>\n\n<svg viewBox=\"0 0 980 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:900px;display:block;margin:0 auto 1.5rem;\">\n  <g font-family=\"Inter,sans-serif\" font-size=\"10.5\">\n    <text x=\"15\" y=\"30\" fill=\"var(--ink-faint)\" font-weight=\"600\" font-size=\"10\" text-transform=\"uppercase\">Stage</text>\n    <text x=\"222\" y=\"30\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">1. Origination</text>\n    <text x=\"362\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">2. Submitted &amp;</text>\n    <text x=\"362\" y=\"34\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Introduced</text>\n    <text x=\"502\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">3. Validate &amp;</text>\n    <text x=\"502\" y=\"34\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Acknowledge</text>\n    <text x=\"642\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">4. In Progress &amp;</text>\n    <text x=\"642\" y=\"34\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Converted</text>\n    <text x=\"782\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">5. Deal Closure</text>\n    <text x=\"782\" y=\"34\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">&amp; Referral Fee</text>\n    <text x=\"918\" y=\"22\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">6. Repeat or</text>\n    <text x=\"918\" y=\"34\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Dormancy</text>\n    <line x1=\"10\" y1=\"42\" x2=\"970\" y2=\"42\" stroke=\"var(--line-strong)\" stroke-width=\"1\"/>\n\n    <text x=\"15\" y=\"82\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Startup</text>\n    <rect x=\"155\" y=\"55\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"222\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Brought in (A), self-selects</text>\n    <text x=\"222\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">(B), or a partner proposes (C)</text>\n    <rect x=\"295\" y=\"55\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"362\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Sees a faded, FYI-only</text>\n    <text x=\"362\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">entry &#8212; nothing to act on yet</text>\n    <rect x=\"435\" y=\"55\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"502\" y=\"72\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"9\">See finding 1</text>\n    <text x=\"502\" y=\"84\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">still no defined update</text>\n    <text x=\"502\" y=\"95\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">once admin's talk concludes</text>\n    <rect x=\"575\" y=\"55\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"642\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Working directly with the</text>\n    <text x=\"642\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">receiving partner now</text>\n    <rect x=\"715\" y=\"55\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"782\" y=\"76\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Becomes the receiving</text>\n    <text x=\"782\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">partner's own client</text>\n    <rect x=\"855\" y=\"55\" width=\"115\" height=\"55\" rx=\"6\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"912\" y=\"72\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"9\">See finding 3</text>\n    <text x=\"912\" y=\"84\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">no tracked path back</text>\n    <text x=\"912\" y=\"95\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">into the ecosystem</text>\n\n    <text x=\"15\" y=\"162\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Referring</text>\n    <text x=\"15\" y=\"175\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Partner</text>\n    <rect x=\"155\" y=\"135\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"222\" y=\"156\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Chooses receiver (A) or brings</text>\n    <text x=\"222\" y=\"168\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">in startup for B; not in C</text>\n    <rect x=\"295\" y=\"135\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"362\" y=\"156\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">Can still cancel; sees the</text>\n    <text x=\"362\" y=\"168\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">same FYI entry as others</text>\n    <rect x=\"435\" y=\"135\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"502\" y=\"150\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"9\">See finding 1 (narrower)</text>\n    <text x=\"502\" y=\"162\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">still not told the outcome;</text>\n    <text x=\"502\" y=\"173\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">silent-timeout risk is gone</text>\n    <rect x=\"575\" y=\"135\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"642\" y=\"152\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"9\">See finding 2</text>\n    <text x=\"642\" y=\"164\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">no message exists for the</text>\n    <text x=\"642\" y=\"175\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">moment credit is earned</text>\n    <rect x=\"715\" y=\"135\" width=\"135\" height=\"55\" rx=\"6\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"782\" y=\"156\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">10% accrues; the one moment</text>\n    <text x=\"782\" y=\"168\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">that IS well covered</text>\
