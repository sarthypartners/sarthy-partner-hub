const CHANGELOG = [{"date": "v1.0", "title": "Hub created", "desc": "Consolidated 5 completed documents into one version-controlled reference: Roadmap, Master Execution Sequence, Partnership SOP v1.0 skeleton, Phase 0 Discussion Doc, Deliverables Register."}, {"date": "v1.1", "title": "Split into separate pages", "desc": "Converted from a single-page app into one HTML file per document, sharing one sidebar and style system, for easier navigation and sharing of individual documents."}, {"date": "v2.1", "title": "Alpha Partner Interview Guide drafted", "desc": "Item 3 in the Master Execution Sequence is now live - moved from queued to drafted, status green."}, {"date": "v2.2", "title": "Current-State Assessment drafted", "desc": "Item 4 in the Master Execution Sequence is now live. Per the dependency map, this feeds Gap & Risk Register, Segmentation Framework, and Journey Map - none of those are written yet, so no downstream edit needed this round, but flagged for when they are."}, {"date": "v3.0", "title": "Renamed and rewritten in plain English", "desc": "Hub renamed to 'Strategic Partners Playbook 3.0' (overarching name). The document formerly called 'Playbook 3.0' is now 'Partnership SOP v1.0', since it's one part of the Playbook, not the whole thing. Every page's content rewritten in simpler, everyday language - facts, figures, and named parties kept exactly as documented, only the phrasing changed."}, {"date": "v4.0", "title": "Merged Partnership SOP v1.0 with Process & SOPs; added real internal links", "desc": "The four planned 'Process & SOPs' documents (onboarding, engagement, reactivation, escalation) are no longer separate - they're written directly as Partnership SOP v1.0 sections, removing duplicate work. The 'Process & SOPs' category is retired since nothing separate lives there anymore. Sarthy's original Playbook 2.0 stays external and cited, not merged in, to preserve the line between what Sarthy proposed and what's actually confirmed. Journey Map and Segmentation Framework stay separate analytical documents by decision, feeding summarized conclusions into the SOP rather than being absorbed. Master Execution Sequence and Deliverables Register updated to match. Added real clickable links between documents (underlined text) in place of plain text mentions, in the guide, sequence, deliverables, current-state, playbook, and interview guide pages."}, {"date": "v5.0", "title": "Sarthy's Playbook 2.0 fully absorbed and retired", "desc": "Partnership SOP v1.0 expanded from 13 to 21 sections, pulling in the complete content of Sarthy's original Playbook 2.0 - the credit wallet system, the six credit rules, the full lead referral flow, conversion and dispute logic, partner responsibilities, abuse guardrails, the FAQ, and the closing note. That source document is now retired; nothing about the program's design lives outside this SOP anymore. Genuinely unresolved numbers (withdrawal deduction timing, cycle length, negative balance policy) are flagged inline and linked to the Phase 0 Discussion Doc rather than left ambiguous. Updated the guide's dependency map to match the new section numbers."}, {"date": "v6.0", "title": "Working assumptions recorded across most open questions", "desc": "Lead answered most of the open Phase 0 questions as working assumptions (explicitly not yet confirmed by Sarthy). Updated: fees/GST (Section 5), credit expiry and cap (Section 6), lead validation timing, cancellation, duplicates, repeated declines, re-referral limits (Section 7), negative balance policy (Section 8), conversion criteria (Section 9), and a full rework of withdrawal logic from a fixed-cycle model to ongoing membership with a minimum reserve and quarterly withdrawal (Section 10). Proposed concrete measures for the two undefined KPIs - Match-Making and Research & Reports (Section 19). Flagged one bigger structural idea (automatic lead-pool matching instead of partner-to-partner referral) as a separate future decision, not folded into the current rules. Phase 0 Discussion Doc updated to point to each recorded assumption rather than showing stale fully-open questions."}, {"date": "v6.1", "title": "Money mechanics tightened up", "desc": "Corrected the 9% fee to apply at credit-transfer time (on conversion), not at withdrawal - flows through Sections 6, 7, 8, and 10 consistently. Programme switching locked permanently at sign-up. Goodwill/coupon credits now expire at exactly 30 days. Negative balance can run to -3,000 before the account freezes, requiring replenishment to +999 to unfreeze. Credit count resolved as currency-neutral - 999 never reprices; real currency only enters at the point of withdrawal, using that day's live exchange rate."}, {"date": "v6.2", "title": "Lead-tracking windows, rollout target, and admin ownership confirmed", "desc": "Acknowledgment window set to 3 days, stall window to 1 week (Section 7) - what happens at a stall is still open, re-clarified with the Lead. Section 18 now has Sarthy's real rollout target: 10 active partners within 2 weeks of full launch. Current-State Assessment refined to note existing Alpha users are infrequent, not active. Phase 0 doc updated: dispute handling and bug/feature routing both go to admin, with follow-up detail still needed on each. Feature inventory (live vs. planned) deferred as an action item pending portal access, not guessed at."}, {"date": "v7.0", "title": "Business Requirements Document drafted; more money mechanics closed", "desc": "Pulled the BRD forward in the sequence and drafted its first version - a full To-Be requirements list built directly from Partnership SOP v1.0, organized by module, with an open-decisions log carried forward. Resolved: 9% fee charged once at transfer, not again at withdrawal. Negative-balance top-up priced at 3x entry fee (2,997 credits) - flagged a real numbers gap at the -3,000 floor rather than smoothing over it. Dispute SLA set to 24-hour admin response. Stall-handling recorded as an open proposal (admin discretion plus startup confirmation as evidence), not a final decision. Clarified the 9% fee's relationship to the older 10% direct referral-fee flow, left open. Broadened the dependency map so the BRD is checked against any SOP change, not just confirmations."}, {"date": "v8.0", "title": "Second reward track discovered and documented - deal-closure referral fee", "desc": "The Lead clarified there are two separate reward systems: the 999-point lead-share credit (Sections 5-10) and a previously-undocumented 10% deal-closure referral fee, paid annually, with a 1-year tail. Added as new Section 20 (referral fee) and Section 21 (dormancy rule - 3 months inactive), pushing FAQ to 22 and Closing to 23. This resolved the oldest open question in the project: the 9% facilitation fee applies to both tracks, on the 10% entitlement for referral fees. Fixed a real inconsistency: Sections 15 and 17 had empty placeholders while their actual content had been written into Section 7 - moved it to the right place. Corrected the negative-balance numbers (-2,997 floor, 4x999 top-up) which now land exactly on +999, fixing the math gap flagged two rounds ago. Simplified the acknowledgment/stall system from two separate windows (3 days, 1 week) to one unified 1-week window. Updated the BRD to match throughout, adding its own new Sections 8-9 for the same two topics."}, {"date": "v9.0", "title": "Five documents drafted in one push - Gap & Risk Register, Segmentation, Journey Map, Comms Library, Graduation Criteria", "desc": "Per the Lead's decision to keep building rather than wait on the Sarthy meeting. Fixed a real bookkeeping gap along the way: Partner Journey Map had been referenced throughout the hub since the very beginning but was never actually added to the queued list - added retroactively before drafting it. Partnership SOP v1.0 Sections 11, 14, 16, 17, and 18 all updated from pending placeholders or generic mentions to real links, now that the documents they were waiting on exist. 14 of 19 total documents now drafted."}, {"date": "v9.1", "title": "Data Dictionary drafted", "desc": "Defined every entity used across the SOP and BRD - Partner, Credit Wallet, Lead, Deal, Dispute - with precise status definitions (the difference between At-Risk, Dormant, and Frozen matters and wasn't spelled out clearly before). 15 of 19 documents now drafted. Pacing deliberately from here rather than drafting the remaining four in one push."}, {"date": "v10.0", "title": "Switched to a collapsible left sidebar", "desc": "Replaced the two-tier top navigation with a left sidebar where each category expands and collapses independently - handles the growing document count (19 total now) much better than wrapping tabs. The category containing whatever document is open stays expanded automatically; others start collapsed. Tooltips now appear to the side instead of below, to fit the narrower layout."}, {"date": "v10.1", "title": "Sidebar now hover-out, with a pin option", "desc": "The sidebar tucks away to a thin 14px edge strip by default and slides fully into view on hover - no longer takes up permanent screen width. Added a pin button (top of the sidebar) for anyone who wants it to stay open without holding the mouse there. On mobile/touch screens, where hover doesn't apply, it falls back to the normal static stacked layout instead."}, {"date": "v10.2", "title": "Sidebar back to static, always-visible", "desc": "Reverted from the hover-out drawer to a fixed-width sidebar sitting permanently alongside the content - no longer needs a hover or a pin button. Category expand/collapse behavior stays the same."}, {"date": "v10.4", "title": "Category document lists now permanently expanded", "desc": "Removed the click-to-expand/collapse behavior entirely - every category's document list stays visible at all times, no toggling."}, {"date": "v11.0", "title": "Content cleanup - redundancy and staleness pass", "desc": "Reviewed all 16 documents for redundant and stale content. Fixed: guide.html's navigation instructions described the old top-nav interface, not the current static sidebar. Phase 0 doc trimmed 59% (1011 to 416 words) - most of it was resolved items now fully duplicated in the SOP; also caught two genuinely stale items (currency conversion and programme switching were marked 'still open' but had actually been resolved rounds ago). Sequence page dropped its redundant status column (the sidebar's dots already show this) and fixed a stale entry claiming SOP sections were still queued when they'd been written. Deliverables Register trimmed a redundant intro explanation. BRD's matchmaking bullet trimmed to a link instead of re-explaining. Checked and ruled out: Current-State vs Playbook history tables looked duplicate but serve different purposes (evidence vs. rules comparison) - kept both. BRD's overall density was reviewed and found appropriately lean, not bloated as initially estimated from word count alone."}, {"date": "v12.0", "title": "Partnership SOP restructured for readability", "desc": "Applied all 5 simplification directions to the flagship document. Added a ~250-word Quick Summary block at the top. Removed repeated inline hedge phrases ('working assumption, pending Sarthy sign-off') throughout - the status pill already conveys this, so it no longer needed restating in nearly every paragraph. Consolidated scattered mid-section open items into one clear note at the end of each affected section, instead of interleaved with the rules themselves. Cut audit-trail commentary that had crept into reader-facing prose (e.g. 'unlike the earlier version of this rule', 'this resolves one of the oldest open questions') - that belongs in the changelog, not the rulebook. Added a hand-built SVG diagram for the Section 7 lead lifecycle. Net result: 4,461 words to 3,352 - a 25% reduction despite adding the new summary block and diagram."}, {"date": "v13.0", "title": "All 11 findings from the manual review report resolved", "desc": "Worked through a manually-written QA review of the hub, one finding at a time. Fixed: (1) navigation guide's dependency table moved to end, made self-explanatory. (2) Roadmap scorecard now links to how it's measured, with examples. (3) 'Balanced' now defined in SOP Section 11, not just referenced from Section 14. (4) A genuine contradiction fixed - SOP said disputes were final with no appeal, Phase 0 said the opposite; resolved as admin-final for routine disputes with escalation to Sarthy leadership for serious/high-value ones (exact threshold still open). (5) Added a worked example disambiguating the four different meanings of '999' in the wallet. (6) Made the suggest-vs-assign boundary for backend matchmaking explicit. (7) The biggest structural fix - Segmentation Framework's 5 tiers reused words already meaning something different in the Data Dictionary's status field; redesigned into two clean, non-overlapping fields (status + giving_pattern), with every cross-reference across the hub updated to match. (8) Defined the Dormant+Frozen combined recovery order (top-up first, then send a lead). (9) Defined the dormant-reactivation call batch as a rotating weekly quota. (10) Clarified deal_duration's actual purpose - a 12-month proration rule for multi-year deals, plus a fresh-cycle rule if a lead is later referred to a different partner. (11) Clarified Graduation Criteria's lighter 'full lead cycle' bar is intentional, distinct from the SOP's conversion-based cycle. Playbook v5.0 - marks this as the externally-reviewed and corrected version."}, {"date": "v13.1", "title": "Fixed 9 unlinked document mentions, caught by Claude Code", "desc": "Claude Code flagged that 'Interim Operating System' appeared as plain text in 3 spots instead of a real link - traced it to the guide.html mention predating that document's drafting, and two fresh mentions in segmentation.html's full rewrite that were never linked. Did a broader sweep and found 6 more of the same pattern (Current-State Assessment, Communication Template Library, Data Dictionary mentioned as plain text in gap-register.html, guide.html, playbook.html, interim-system.html, and segmentation.html) - all fixed."}, {"date": "v14.0", "title": "Readability improvements, phase 1 of 2", "desc": "Added a jump-to-section table of contents at the top of Partnership SOP (23 sections now have real anchor links). Introduced colour-coded amounts throughout - green for credits in, red for deductions, amber for Sarthy's fee - applied to the wallet table, the credit rules, and the referral-fee math. Added two new worked examples (hitting and recovering from the credit freeze; a real \u20b95L deal walked through the referral-fee split) using a new 'example' box style, visually distinct from the existing 'still open' and 'key context' boxes. Converted the six credit rules and the FAQ from lists/paragraphs into tables for faster scanning. Phase 2 (diagrams, glossary page, search, Gantt chart page) to follow as a separate checkpoint."}, {"date": "v15.0", "title": "Glossary added, search/filter added to sidebar", "desc": "New Glossary page under Start Here - defines the four meanings of 999, giving_pattern vs status, the two reward tracks, the 9% fee principle, status pill colours, and role definitions, each linking back to full detail. Added a live search box at the top of the sidebar - typing filters both category and document lists in real time, matching against title and description text. Search term persists as you navigate between documents."}, {"date": "v16.0", "title": "Readability improvements, phase 2 complete - diagrams and project plan", "desc": "Added two more hand-built SVG diagrams: the referral-fee split (Section 20 - a visual waterfall of the 10% entitlement splitting into Sarthy's 9% and the referrer's 91%), and a partner account-status state diagram (Segmentation Framework - showing how Active leads to At-Risk, Dormant, and Frozen, and the recovery paths back to Active, including the combined-state rule). Added a new Project Plan (Gantt View) page under Strategic Planning - a CSS-based horizontal timeline of all 6 roadmap phases, honestly distinguishing documentation-complete from real-world rollout-not-yet-started, using relative week numbers since real calendar dates were never tracked. This completes both phases of the readability improvement effort requested."}, {"date": "v17.0", "title": "Action Item & Blocker Tracker added, requirements-gathering gaps plugged", "desc": "Did a reviewer-style pass on requirements-gathering completeness before the BRD - found 12 real gaps, verified each against actual file content (dropped 3 initial suspicions that turned out to be false positives). New Action Item & Blocker Tracker page (Tracking & Governance) - a dependency-chain diagram plus full table showing what real-world action items (legal review, regulatory review, data migration, payment gateway selection) are blocking what, colour-coded by status. Data migration approach decided: bulk spreadsheet import with a predefined column format matching the Data Dictionary's Partner fields - documented in the Interim Operating System. Gap & Risk Register updated with the 3 critical findings, linked to the new tracker rather than duplicated."}, {"date": "v18.0", "title": "All 12 requirements-gathering gaps closed or properly tracked", "desc": "BRD now tags every section MVP or Phase 2 (12 sections tagged, a few split where the basic version is MVP but full automation can wait) - defines what's essential for a real first launch. Added a Non-Functional Requirements section (baseline security/privacy, no formal uptime SLA yet, per the Lead's decision). Added acceptance criteria for the four requirements most likely to be interpreted differently by different developers (duplicate detection, acknowledgment/stall timing, the -2,997 freeze boundary, 12-month proration). Formalized Integration Requirements as its own section. Sign-off process resolved - written approval from a specifically named Sarthy person/role is required; who that person is remains the one open item. Added an existing-partner transition message template to the Comms Library. This closes the reviewer-style requirements-gathering pass in full - 7 items genuinely resolved with real content, 5 properly tracked as action items that need real-world action, not a documentation fix."}, {"date": "v18.1", "title": "Dependency map rewritten - was significantly stale, not just missing 2 rows", "desc": "Claude Code flagged the Action Item Tracker was missing from meta/dependency-map.md and fixed it directly in the last commit - good catch. Checking further revealed the whole file had drifted badly: it still referenced old section names (\"\u00a74 Commercial Mechanics\", \"\u00a711 Escalation SOP\", \"\u00a713 KPI Framework\") and appendix labels (\"Appendix A/B/D\") that don't match the SOP's current 23-section structure, and still listed \"Escalation & Dispute SOP\" and \"Dormant-Partner Reactivation Process\" as separate documents even though those were merged into the SOP many rounds ago. Rewrote the file entirely against current reality. Also synced guide.html's hub-facing dependency table, which was mostly current but missing the same three new documents (Glossary, Gantt, Action Tracker) and one stale section title. This reflects a real process gap - the dependency-map protocol wasn't followed consistently across several rounds of adding new documents; worth treating as a standing commit-blocking check going forward, not a one-time fix."}, {"date": "v19.0", "title": "All 5 findings from the second manual review resolved", "desc": "Verified all 5 findings against actual file content before fixing - all confirmed real. Fixed: (1) Migration Wave Plan contradiction resolved by simplifying migration to follow identical rules as new-partner onboarding - no special 'migrated' status category means nothing to conflict with the Segmentation Framework's normal logic. (2) Section 19 was only explaining 2 of the 4 KPI categories it claimed to cover - added measures for 'finding and signing up partners' and 'supporting startups'. (3) At-Risk given a specific numeric threshold (-1,500) distinct from Taker's pattern-based definition, with a worked example showing they don't have to fire together. (4) Confirmed and made explicit that At-Risk is purely an outreach-priority flag - full Active privileges continue unchanged. (5) Glossary's status pill explanation fixed to clarify the accompanying text (not just colour) carries the real distinction between two same-coloured sections."}, {"date": "v19.1", "title": "Replaced \u00a7 with # for section references across the hub", "desc": "Style correction - every instance of \u00a7N (Gap & Risk Register, Data Dictionary, Journey Map, Segmentation Framework, Comms Library, Graduation Criteria, and meta/dependency-map.md - 80 instances total) now reads #N instead. Partnership SOP itself already spelled out 'Section N' in full, so this brings everything else in line with a single consistent convention rather than three different ways of referencing the same thing."}, {"date": "v20.0", "title": "Comprehensive self-review across all 19 documents", "desc": "Systematic integrity pass, same methodology as the two manual reviews, applied to the whole hub. Numbers audit: verified -2,997/-1,500/+3,996 math, KPI weights (20/40/30/10), the 1-week acknowledgment window, 4+ decline threshold, 30-day coupon expiry, 5-working-day validation, the 10%/91%/9.1% referral split, and the 10-partners/2-weeks rollout target - all consistent everywhere they're mentioned, no contradictions found. Ran a script checking every showDoc() link resolves to a real document - zero broken links. Ran a second script checking every document title for unlinked plain-text mentions across all other documents - found ~15 genuine misses (mostly opening callouts, the highest-value place to link) and fixed them; correctly identified ated context. Applied this refined process to a batch of 3 more pages: audited the History page fresh (0 disconnects found - a good sign the process works on new writing, not just retroactive fixes). Rewrote Roadmap under the new style. Rewrote Sequence, extracting 2 more As-Is/historical explanations to the History page and fixing 1 disconnect in the process."}, {"date": "v22.0", "title": "Partnership SOP fully rewritten under the new house style", "desc": "Applied the refined simplification process (short sentences, checked for hidden dependencies between them, To-Be content only) to all 23 sections. Section 2 was almost entirely an origin story - extracted the old-vs-new comparison table and evolution narrative to Design History & Decisions, leaving a brief statement of purpose in the main SOP. Section 10's brief historical aside about cycles moved to History too. Rewrote dense, multi-clause sentences throughout - the Quick Summary box, Section 7's dispute/matching paragraph, Section 9's conversion rules, Section 20's closing note, Section 21, and the Closing Note - splitting cramped sentences into short connected ones rather than short disconnected fragments. Verified every critical number (999, -2,997, 3,996, 9%, 91%, all the timing windows) survived the rewrite intact."}, {"date": "v22.1", "title": "House style batch A - 5 shorter documents", "desc": "Applied the same style process to Interview Guide, Graduation Criteria, Glossary, Gantt, and Deliverables. Caught two real bugs while reading closely: Graduation Criteria's 'Migration Wave Plan' link actually pointed to the Guide page (copy-paste error), and Interview Guide referenced 'our working system, once that's built' - stale, since the Interim Operating System has existed for many rounds. Both fixed. Also found and linked 2 more bare 'Interim Operating System' mentions, the same recurring pattern class caught earlier by Claude Code."}, {"date": "v22.2", "title": "House style batch B - 5 medium documents", "desc": "Applied the style process to Phase 0, Journey Map, Communication Template Library, Action Item Tracker, and Current-State Assessment. Made an explicit judgment call on Current-State Assessment: unlike the SOP, this document's entire purpose is historical evidence, so the To-Be/As-Is extraction principle doesn't apply - only sentence-level fixes were made, nothing moved to History. Caught and immediately fixed a self-inflicted mistake mid-edit: briefly dropped a real link to Partnership SOP while simplifying a sentence in Journey Map, caught before finalizing. Re-ran the full link-integrity check after this batch - zero broken links."}, {"date": "v22.3", "title": "Fixed missing dependency-map entry for Design History & Decisions", "desc": "Claude Code caught that the History page - added several rounds ago, now referenced by 4 places across Playbook and Sequence - was never added to meta/dependency-map.md or guide.html's hub-facing table. Same class of gap as the Action Item Tracker miss caught earlier. Checked the real dependency directions precisely before adding rows: confirmed Playbook links to History in 3 places (opening callout, Section 2, Section 10) and Sequence in 1 place - and confirmed Roadmap does NOT actually link to History at all, correcting an assumption from an earlier summary that had implied it did. Added accurate rows to both the meta file and guide.html's table, including the reverse dependency (if History itself is edited, check the pointer sentences in Playbook and Sequence still make sense)."}, {"date": "v23.0", "title": "Removed talking-document voice from Guide, Glossary, and Playbook", "desc": "User flagged that the Guide read like a personal assistant making promises ('I'll check the right column, I'll fix it, tell you...') rather than a business document describing a standing process. Real problem: a playbook should represent the process itself, not one specific person's commitments to one specific reader - it needs to work whether Claude, Claude Code, the Associate, or a future team member is the one maintaining it. Rewrote Guide entirely - 'What I'll do' and 'What you and your Associate should do' became 'Keeping the dependency table current' and 'Flagging changes made outside this process,' with every instance of I/we/you replaced by impersonal process language or the role names (Lead, Associate) already used consistently everywhere else in the hub. Found the same pattern in Glossary - 'Lead is the Project Lead (you)' assumed the reader IS the Lead, which breaks the moment Sarthy or the Associate reads it - fixed to a neutral role definition. Fixed one inconsistency in Playbook's Quick Summary ('you earn 999 credits') that broke from the third-person 'a partner earns' convention used everywhere else in the document. Left FAQ's first-person questions ('Do I lose my credits...') and Comms Library/Interview Guide's second-person language alone - both are legitimate, different patterns: an FAQ convention and real messages/scripts meant to speak directly to a partner."}, {"date": "v23.1", "title": "House style batch C - final 5 documents. Track 1 complete across all 20.", "desc": "Applied the full consolidated checklist (disconnects, dash-overuse, To-Be/As-Is separation, personal voice) to Gap Register, Segmentation, Data Dictionary, BRD, and Interim Operating System. Found the same real bug in 3 separate documents: Gap Register, Data Dictionary, and BRD (twice) all still said the dispute-escalation path was unresolved or non-appealable, contradicting the actual resolution from several rounds ago (serious/high-value disputes can escalate to Sarthy leadership). All fixed. Extracted Segmentation's vocabulary-collision history to the History page - the pending-box explaining 'why 2 fields instead of 5 tiers' was partly historical and partly redundant with content already stated in the sections right below it. Removed a spot in Interim Operating System that referenced 'the earlier contradiction' - meta-commentary about the hub's own editing history that a reader doesn't need. Fixed a mismatched link (Segmentation's 'Dormant-Partner Reactivation' didn't match the actual SOP section title anywhere else). Full-hub verification after this batch: build succeeds, zero broken links, zero remaining personal-voice instances anywhere in the hub. This completes Track 1 - the style overhaul is now applied consistently across all 20 documents."}, {"date": "v24.0", "title": "6 real open items resolved via direct Q&A on Sarthy's behalf", "desc": "Swept the entire hub for genuinely open items - deduplicated 34 raw markers down to 7 distinct questions, presented them directly for answering rather than waiting for a formal Sarthy meeting. Resolved 6: (1) dispute escalation has no fixed deal-value threshold - any escalation triggers an automatic admin notification (in-product popup + email), admin decides how to proceed. (2) Exchange rate source confirmed as the RBI reference rate. (3) The 9% facilitation fee applies to all partners including Partner 1.0-era agreements - existing agreements get amended where needed; added a new action item to document every partner under an old agreement. (4) Gamification for dormancy/activity elevated to high priority, built alongside the rest of the MVP rather than deferred. (5) The stall-reversal mechanism resolved - startup confirmation is not mandatory, purely one input at admin's discretion, with no fixed default if the startup doesn't respond. (6) BRD sign-off clarified - drafting stays informal, formal written approval from a named Sarthy person still required once, before development begins. Found 2 more stale status pills while updating (Sections 5 and 6 said 'one detail still open' with no actual open item left in the text) and 1 more stale cross-reference (BRD Section 5 pointed to 'Section 9' for the evidence mechanism, which actually lives in Section 11) - both fixed. One item (backend matchmaking) got a much bigger answer than the narrow question asked - a whole new startup-facing self-service product concept - flagged for follow-up with specific clarifying questions rather than documented incompletely."}, {"date": "v24.1", "title": "Startup self-service model fully documented - the 7th question, done right", "desc": "Rather than guess at the scale of #4's answer, asked 3 rounds of clarifying questions before documenting anything. Final model: a partner can bring a startup into Sarthy's ecosystem either by directly referring them to a specific partner (Path A, the existing flow) or by leaving it open for the startup to browse and pick a partner itself via a new SSO-based self-service product (Path B). Either way, the chosen partner's acknowledgment is mandatory and triggers the same 999-credit deduction. The partner who originally brought the startup in earns both the lead-share credit and the 10% deal-closure fee in either path - even in Path B, where they didn't personally choose the receiving partner. If a startup arrives with no originating partner at all, Sarthy itself is treated as the originating partner, reusing the exact same reward mechanics rather than a special case. Documented in Playbook Section 7 (new subsection), BRD Section 5 and Section 14 (new SSO integration requirement), and the Data Dictionary (new originating_partner_id field, clarified referring/receiving partner fields). Tagged as Phase 2 by assumption, not confirmed - added as a real tracked priority decision on the Action Tracker rather than silently assuming a priority level."}, {"date": "v24.2", "title": "Completed the personal-voice sweep - found a real gap in the original methodology", "desc": "Claude Code flagged one leftover 'We later established...' sentence in Phase 0. Checking why it survived the earlier voice-cleanup pass revealed the actual gap: that pass only searched for 'I'/'I'll', never checked for 'we'/'We' as a first-person plural marker. Ran a proper hub-wide sweep this time and found 27 real instances across 8 files (Phase 0, Playbook, Roadmap, Sequence, Deliverables, History, Current-State Assessment, Interview Guide) - all fixed, replaced with impersonal or passive phrasing consistent with the rest of the hub. Confirmed Comms Library's 11 instances and Interview Guide's 3 remaining instances are legitimate - they're inside message templates and call-script lines meant to be spoken as Sarthy/the Associate directly to a partner, the same correct pattern already established for 'you' in those two documents. Final verification: build succeeds, zero broken links, zero remaining personal-voice instances anywhere in the hub outside of intentional scripts and templates."}, {"date": "v25.0", "title": "Migration Wave Plan drafted - 21 of 23 documents now complete", "desc": "Drafted the Migration Wave Plan, built directly on the Segmentation Framework, Graduation Criteria, and the Interim Operating System's migration-equals-new-onboarding decision. Defines readiness gates before any wave starts (data migration template, legal review, portal access), then 4 waves: a small pilot, the core push toward Sarthy's 10-partner target, the 3 known special-agreement partners (held back until the 9%-fee interaction with their non-standard terms is worked out), and dormant-partner reactivation as an ongoing campaign rather than a one-time wave. Proposed a conservative pacing (a handful of partners at a time), explicitly flagged as a starting assumption to revisit once Wave 0 shows real timing. Updated every cross-reference that previously said 'once drafted' or 'still queued' - Action Tracker, Gantt, Graduation Criteria, Segmentation Framework, Sequence, and guide.html's dependency table (added 2 new rows to meta/dependency-map.md too). 2 documents remain: Low-Level System Specification and Reporting Dashboard."}, {"date": "v26.0", "title": "Low-Level System Specification and Replit Build Brief both drafted", "desc": "Per the Lead's decision to maintain both a technology-neutral spec and a Replit-specific one, rather than pick one. Low-Level Spec: full Lead and Partner state transition tables, 6 defined core operations with pre/postconditions, all formulas consolidated in one place (conversion math, freeze/top-up, referral fee split, 12-month proration), and explicit validation rules. Found and fixed a real inconsistency while building the state table - Data Dictionary's lead_status list was missing 'In Progress,' which BRD's pipeline already included. Also found a genuine gap never answered anywhere in the hub - whether a Frozen partner can submit/refer a lead - corrected an initially-wrong precondition rather than silently asserting an answer, and logged it as a new Gap Register item. Replit Build Brief: kept deliberately thin, referencing the Low-Level Spec and BRD rather than duplicating them - covers the two lock-in risks worth avoiding (Replit DB, Replit Auth) given this handles real financial data under regulatory review, a build order matching the BRD's MVP tags, and where human review of agent output is non-negotiable (financial calculations, state machine completeness). 23 of 24 planned documents now drafted - only Reporting Dashboard remains queued."}, {"date": "v27.0", "title": "Reporting Dashboard drafted - all 24 planned documents complete, 0 queued", "desc": "Built directly on SOP Section 19's already-defined KPI measures - a visual scorecard mockup of Sarthy's 20/40/30/10 weights, then a full table mapping every measure to its actual data source. Found a real gap while drafting: BRD Section 13's reporting requirement only ever covered Match-Making, despite SOP #19 defining measures for all 4 categories - fixed to cover all 4, and flagged that 2 of the 4 categories need something built before they can report real numbers (a startup-contact log, a contact-date field on the Partner record). This closes out the entire originally-planned document set - all 24 documents now drafted, nothing left queued."}, {"date": "v27.1", "title": "Added supporting diagrams across 6 documents", "desc": "New diagrams: the Journey Map's full partner lifecycle, the Low-Level Spec's complete Lead state machine, three new Playbook diagrams (wallet-threshold gauge in Section 8, Path A/B flow in Section 7, referral-fee timeline in Section 20), the Data Dictionary's entity-relationship map, and the Segmentation Framework's Giver/Balanced/Taker trend sparkline. The BRD and Interim Operating System each got a cross-link to the relevant new diagram instead of a duplicate copy. No facts or numbers changed - this round is visual support for what the text already said."}, {"date": "v27.2", "title": "Combined Journey Map drafted - startup and both partners lined up on one shared timeline", "desc": "New document, built as step one of a planned partner-engagement improvement effort. Lines up the startup, the referring partner, and the receiving partner against the same 6-stage timeline (Origination through Repeat or Dormancy) instead of documenting each lane separately, using only already-confirmed facts from the Lead state machine, Partnership SOP Section 7, the Data Dictionary, and the Communication Template Library - no new rules introduced. Surfaced 3 findings worth confirming with Sarthy: a lead that silently times out during acknowledgment triggers no message to anyone (checked directly against all 11 Communication Template Library triggers - confirmed the internal Associate nudge covers a different, later stall point, not this one); no message exists for the moment a referral actually converts and credits land, even though the annual payout notice and the pre-acknowledgment reminder both already exist; and a startup's own repeat engagement has no equivalent of the partner-side giving_pattern/dormancy tracking. Cross-links to the existing Partner Journey Map, Low-Level Spec, Playbook Section 7, Data Dictionary, and Communication Template Library. Explicitly diagnostic only - designing the actual engagement fixes is the next, separate step."}, {"date": "v27.3", "title": "Fixed a real inconsistency between Playbook Section 7 and the Low-Level Spec, and corrected the Combined Journey Map finding it affected", "desc": "Found while double-checking message-template audiences for the engagement work about to start: Playbook Section 7's simplified diagram showed Rejected and Unresolved both branching out from Acknowledged (after the 999-credit deduction), while the Low-Level Spec's authoritative Lead state machine has always had both branch directly from Introduced, before any deduction happens - accepting and declining/timing out are alternatives to each other, not sequential steps. Fixed Section 7's diagram to match the Low-Level Spec exactly, including its Rejected=red / Unresolved=amber coloring (Section 7's diagram had the two colors swapped). This also meant Finding 1 in the Combined Journey Map was wrong: it said an explicit decline sends the referring partner a message (template 3). Template 3 actually goes to the receiving partner, confirming they weren't charged for declining - it says nothing to the referring partner. Corrected: the referring partner gets no message at all, on either an explicit decline or a silent timeout - a bigger gap than originally described, not a smaller one. Did a full re-check of every other specific claim in the Combined Journey Map against its 5 source documents while in there; nothing else needed correcting."}];
const CATS_ORDER = ["Start Here", "Strategic Planning", "Partnership SOP v1.0", "Decision Records", "Evidence & Assessment", "Operational Tools", "Scripts & Templates", "Technical Handoff", "Tracking & Governance"];
const CAT_DESC = {"Start Here": "How to find your way around this hub, and how updates are meant to flow", "Strategic Planning": "The overall project plan and the order we're doing things in", "Partnership SOP v1.0": "The day-to-day rulebook - how partners are onboarded, supported, and managed", "Decision Records": "Questions we need Sarthy to answer before we can move forward", "Evidence & Assessment": "What we found by studying how things work today, and what's broken", "Operational Tools": "The internal tools and data setup we use to run day-to-day work", "Scripts & Templates": "Ready-to-use scripts for calls, messages, and interviews", "Technical Handoff": "Documents we hand to Sarthy's developers to build the marketplace", "Tracking & Governance": "How we track rollout progress and report results to Sarthy"};

let activeCat = "Strategic Planning";
let searchTerm = "";

function statusBadge(status){
  if(status==="done") return '<span class="badge badge-done">Confirmed</span>';
  if(status==="draft") return '<span class="badge badge-draft">Draft</span>';
  return '<span class="badge badge-pending">Pending</span>';
}
function dotClass(status){
  if(status==="done") return "dot-done";
  if(status==="draft") return "dot-draft";
  return "dot-pending";
}

function buildSidebar(activeId){
  const done = DOCS.length, total = DOCS.length + QUEUED.length;
  const pct = Math.round((done/total)*100);

  let html = `<div class="sidebar-header">
    <div class="brand" onclick="showDoc('guide')">Strategic Partners Playbook 3.0</div>
    <div class="progress-mini">${done} of ${total} drafted (${pct}%)</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <input type="text" class="search-box" id="searchBox" placeholder="Search documents..." value="${searchTerm}" oninput="filterDocs(this.value)" onclick="event.stopPropagation()">
  </div>`;

  let catNum = 0;
  CATS_ORDER.forEach(cat => {
    const docsInCat = DOCS.filter(d=>d.cat===cat);
    const queuedInCat = QUEUED.filter(q=>q.cat===cat);
    const total_in_cat = docsInCat.length + queuedInCat.length;
    if(total_in_cat===0) return;
    catNum++;
    const isActiveCat = cat===activeCat;
    const tip = (CAT_DESC[cat] || '').replace(/"/g, '&quot;');

    html += `<div class="cat-block">
      <div class="cat-header ${isActiveCat?'active-cat':''}" data-tip="${tip}">
        <span class="chevron">&#9656;</span>
        <span class="tab-num">${catNum}</span>
        <span>${cat}</span>
        <span class="cat-count">${docsInCat.length}/${total_in_cat}</span>
      </div>
      <div class="cat-body" data-cat="${cat}">`;

    let docNum = 0;
    docsInCat.forEach(d=>{
      docNum++;
      const cls = d.id===activeId ? 'doc-link active' : 'doc-link';
      const dtip = (d.desc || '').replace(/"/g, '&quot;');
      const search = (d.title + ' ' + (d.desc||'')).toLowerCase().replace(/"/g, '&quot;');
      html += `<div class="${cls}" data-tip="${dtip}" data-search="${search}" onclick="showDoc('${d.id}')"><span class="tab-num-sm">${docNum}</span><span class="dot ${dotClass(d.status)}"></span>${d.title}</div>`;
    });
    queuedInCat.forEach(q=>{
      docNum++;
      const dtip = (q.desc || '').replace(/"/g, '&quot;');
      const search = (q.title + ' ' + (q.desc||'')).toLowerCase().replace(/"/g, '&quot;');
      html += `<div class="doc-link disabled" data-tip="${dtip}" data-search="${search}"><span class="tab-num-sm">${docNum}</span><span class="dot dot-pending"></span>${q.title}</div>`;
    });

    html += `</div></div>`;
  });

  html += `<div class="changelog-link" onclick="showChangelog()">Version history</div>`;
  document.getElementById('sidebarContent').innerHTML = html;
  if(searchTerm) filterDocs(searchTerm, true);
}

function filterDocs(val, skipStore){
  if(!skipStore) searchTerm = val;
  const term = val.toLowerCase().trim();
  document.querySelectorAll('.cat-block').forEach(block => {
    let anyVisible = false;
    block.querySelectorAll('.doc-link').forEach(link => {
      const match = !term || (link.getAttribute('data-search')||'').includes(term);
      link.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
    });
    block.style.display = anyVisible ? '' : 'none';
  });
}

let currentDocId = null;

function renderEmpty(cat){
  document.getElementById('main').innerHTML = `<div class="crumb">${cat}</div><div class="doc-header"><h1 class="doc-title">Not yet drafted</h1></div><div class="pending-box">Everything in this category is still queued. Check Master Execution Sequence for build order.</div>`;
}

function showDoc(id){
  const d = DOCS.find(x=>x.id===id);
  if(!d) return;
  activeCat = d.cat;
  currentDocId = id;
  buildSidebar(id);
  document.getElementById('main').innerHTML = `
    <div class="crumb">${d.cat}</div>
    <div class="doc-header">
      <h1 class="doc-title">${d.title}</h1>
      <div class="meta-row">${statusBadge(d.status)}<span class="meta-text">v${d.version}</span><span class="meta-text">.</span><span class="meta-text">${d.type}</span><span class="meta-text">.</span><span class="meta-text">${d.updated}</span></div>
    </div>
    <div class="content">${d.html}</div>
  `;
  window.scrollTo(0,0);
}

function showChangelog(){
  currentDocId = null;
  buildSidebar(null);
  let items = CHANGELOG.map(c=>`<div class="cl-item"><div class="cl-date">${c.date}</div><div class="cl-body"><strong>${c.title}</strong><span>${c.desc}</span></div></div>`).join("");
  document.getElementById('main').innerHTML = `<div class="crumb">Project hub</div><div class="doc-header"><h1 class="doc-title">Version history</h1><div class="meta-row"><span class="meta-text">Every structural change to this hub, logged here</span></div></div><div class="content">${items}</div>`;
  window.scrollTo(0,0);
}

showDoc('guide');
</script>
