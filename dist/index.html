ated context. Applied this refined process to a batch of 3 more pages: audited the History page fresh (0 disconnects found - a good sign the process works on new writing, not just retroactive fixes). Rewrote Roadmap under the new style. Rewrote Sequence, extracting 2 more As-Is/historical explanations to the History page and fixing 1 disconnect in the process."}, {"date": "v22.0", "title": "Partnership SOP fully rewritten under the new house style", "desc": "Applied the refined simplification process (short sentences, checked for hidden dependencies between them, To-Be content only) to all 23 sections. Section 2 was almost entirely an origin story - extracted the old-vs-new comparison table and evolution narrative to Design History & Decisions, leaving a brief statement of purpose in the main SOP. Section 10's brief historical aside about cycles moved to History too. Rewrote dense, multi-clause sentences throughout - the Quick Summary box, Section 7's dispute/matching paragraph, Section 9's conversion rules, Section 20's closing note, Section 21, and the Closing Note - splitting cramped sentences into short connected ones rather than short disconnected fragments. Verified every critical number (999, -2,997, 3,996, 9%, 91%, all the timing windows) survived the rewrite intact."}, {"date": "v22.1", "title": "House style batch A - 5 shorter documents", "desc": "Applied the same style process to Interview Guide, Graduation Criteria, Glossary, Gantt, and Deliverables. Caught two real bugs while reading closely: Graduation Criteria's 'Migration Wave Plan' link actually pointed to the Guide page (copy-paste error), and Interview Guide referenced 'our working system, once that's built' - stale, since the Interim Operating System has existed for many rounds. Both fixed. Also found and linked 2 more bare 'Interim Operating System' mentions, the same recurring pattern class caught earlier by Claude Code."}, {"date": "v22.2", "title": "House style batch B - 5 medium documents", "desc": "Applied the style process to Phase 0, Journey Map, Communication Template Library, Action Item Tracker, and Current-State Assessment. Made an explicit judgment call on Current-State Assessment: unlike the SOP, this document's entire purpose is historical evidence, so the To-Be/As-Is extraction principle doesn't apply - only sentence-level fixes were made, nothing moved to History. Caught and immediately fixed a self-inflicted mistake mid-edit: briefly dropped a real link to Partnership SOP while simplifying a sentence in Journey Map, caught before finalizing. Re-ran the full link-integrity check after this batch - zero broken links."}, {"date": "v22.3", "title": "Fixed missing dependency-map entry for Design History & Decisions", "desc": "Claude Code caught that the History page - added several rounds ago, now referenced by 4 places across Playbook and Sequence - was never added to meta/dependency-map.md or guide.html's hub-facing table. Same class of gap as the Action Item Tracker miss caught earlier. Checked the real dependency directions precisely before adding rows: confirmed Playbook links to History in 3 places (opening callout, Section 2, Section 10) and Sequence in 1 place - and confirmed Roadmap does NOT actually link to History at all, correcting an assumption from an earlier summary that had implied it did. Added accurate rows to both the meta file and guide.html's table, including the reverse dependency (if History itself is edited, check the pointer sentences in Playbook and Sequence still make sense)."}, {"date": "v23.0", "title": "Removed talking-document voice from Guide, Glossary, and Playbook", "desc": "User flagged that the Guide read like a personal assistant making promises ('I'll check the right column, I'll fix it, tell you...') rather than a business document describing a standing process. Real problem: a playbook should represent the process itself, not one specific person's commitments to one specific reader - it needs to work whether Claude, Claude Code, the Associate, or a future team member is the one maintaining it. Rewrote Guide entirely - 'What I'll do' and 'What you and your Associate should do' became 'Keeping the dependency table current' and 'Flagging changes made outside this process,' with every instance of I/we/you replaced by impersonal process language or the role names (Lead, Associate) already used consistently everywhere else in the hub. Found the same pattern in Glossary - 'Lead is the Project Lead (you)' assumed the reader IS the Lead, which breaks the moment Sarthy or the Associate reads it - fixed to a neutral role definition. Fixed one inconsistency in Playbook's Quick Summary ('you earn 999 credits') that broke from the third-person 'a partner earns' convention used everywhere else in the document. Left FAQ's first-person questions ('Do I lose my credits...') and Comms Library/Interview Guide's second-person language alone - both are legitimate, different patterns: an FAQ convention and real messages/scripts meant to speak directly to a partner."}, {"date": "v23.1", "title": "House style batch C - final 5 documents. Track 1 complete across all 20.", "desc": "Applied the full consolidated checklist (disconnects, dash-overuse, To-Be/As-Is separation, personal voice) to Gap Register, Segmentation, Data Dictionary, BRD, and Interim Operating System. Found the same real bug in 3 separate documents: Gap Register, Data Dictionary, and BRD (twice) all still said the dispute-escalation path was unresolved or non-appealable, contradicting the actual resolution from several rounds ago (serious/high-value disputes can escalate to Sarthy leadership). All fixed. Extracted Segmentation's vocabulary-collision history to the History page - the pending-box explaining 'why 2 fields instead of 5 tiers' was partly historical and partly redundant with content already stated in the sections right below it. Removed a spot in Interim Operating System that referenced 'the earlier contradiction' - meta-commentary about the hub's own editing history that a reader doesn't need. Fixed a mismatched link (Segmentation's 'Dormant-Partner Reactivation' didn't match the actual SOP section title anywhere else). Full-hub verification after this batch: build succeeds, zero broken links, zero remaining personal-voice instances anywhere in the hub. This completes Track 1 - the style overhaul is now applied consistently across all 20 documents."}, {"date": "v24.0", "title": "6 real open items resolved via direct Q&A on Sarthy's behalf", "desc": "Swept the entire hub for genuinely open items - deduplicated 34 raw markers down to 7 distinct questions, presented them directly for answering rather than waiting for a formal Sarthy meeting. Resolved 6: (1) dispute escalation has no fixed deal-value threshold - any escalation triggers an automatic admin notification (in-product popup + email), admin decides how to proceed. (2) Exchange rate source confirmed as the RBI reference rate. (3) The 9% facilitation fee applies to all partners including Partner 1.0-era agreements - existing agreements get amended where needed; added a new action item to document every partner under an old agreement. (4) Gamification for dormancy/activity elevated to high priority, built alongside the rest of the MVP rather than deferred. (5) The stall-reversal mechanism resolved - startup confirmation is not mandatory, purely one input at admin's discretion, with no fixed default if the startup doesn't respond. (6) BRD sign-off clarified - drafting stays informal, formal written approval from a named Sarthy person still required once, before development begins. Found 2 more stale status pills while updating (Sections 5 and 6 said 'one detail still open' with no actual open item left in the text) and 1 more stale cross-reference (BRD Section 5 pointed to 'Section 9' for the evidence mechanism, which actually lives in Section 11) - both fixed. One item (backend matchmaking) got a much bigger answer than the narrow question asked - a whole new startup-facing self-service product concept - flagged for follow-up with specific clarifying questions rather than documented incompletely."}, {"date": "v24.1", "title": "Startup self-service model fully documented - the 7th question, done right", "desc": "Rather than guess at the scale of #4's answer, asked 3 rounds of clarifying questions before documenting anything. Final model: a partner can bring a startup into Sarthy's ecosystem either by directly referring them to a specific partner (Path A, the existing flow) or by leaving it open for the startup to browse and pick a partner itself via a new SSO-based self-service product (Path B). Either way, the chosen partner's acknowledgment is mandatory and triggers the same 999-credit deduction. The partner who originally brought the startup in earns both the lead-share credit and the 10% deal-closure fee in either path - even in Path B, where they didn't personally choose the receiving partner. If a startup arrives with no originating partner at all, Sarthy itself is treated as the originating partner, reusing the exact same reward mechanics rather than a special case. Documented in Playbook Section 7 (new subsection), BRD Section 5 and Section 14 (new SSO integration requirement), and the Data Dictionary (new originating_partner_id field, clarified referring/receiving partner fields). Tagged as Phase 2 by assumption, not confirmed - added as a real tracked priority decision on the Action Tracker rather than silently assuming a priority level."}, {"date": "v24.2", "title": "Completed the personal-voice sweep - found a real gap in the original methodology", "desc": "Claude Code flagged one leftover 'We later established...' sentence in Phase 0. Checking why it survived the earlier voice-cleanup pass revealed the actual gap: that pass only searched for 'I'/'I'll', never checked for 'we'/'We' as a first-person plural marker. Ran a proper hub-wide sweep this time and found 27 real instances across 8 files (Phase 0, Playbook, Roadmap, Sequence, Deliverables, History, Current-State Assessment, Interview Guide) - all fixed, replaced with impersonal or passive phrasing consistent with the rest of the hub. Confirmed Comms Library's 11 instances and Interview Guide's 3 remaining instances are legitimate - they're inside message templates and call-script lines meant to be spoken as Sarthy/the Associate directly to a partner, the same correct pattern already established for 'you' in those two documents. Final verification: build succeeds, zero broken links, zero remaining personal-voice instances anywhere in the hub outside of intentional scripts and templates."}, {"date": "v25.0", "title": "Migration Wave Plan drafted - 21 of 23 documents now complete", "desc": "Drafted the Migration Wave Plan, built directly on the Segmentation Framework, Graduation Criteria, and the Interim Operating System's migration-equals-new-onboarding decision. Defines readiness gates before any wave starts (data migration template, legal review, portal access), then 4 waves: a small pilot, the core push toward Sarthy's 10-partner target, the 3 known special-agreement partners (held back until the 9%-fee interaction with their non-standard terms is worked out), and dormant-partner reactivation as an ongoing campaign rather than a one-time wave. Proposed a conservative pacing (a handful of partners at a time), explicitly flagged as a starting assumption to revisit once Wave 0 shows real timing. Updated every cross-reference that previously said 'once drafted' or 'still queued' - Action Tracker, Gantt, Graduation Criteria, Segmentation Framework, Sequence, and guide.html's dependency table (added 2 new rows to meta/dependency-map.md too). 2 documents remain: Low-Level System Specification and Reporting Dashboard."}, {"date": "v26.0", "title": "Low-Level System Specification and Replit Build Brief both drafted", "desc": "Per the Lead's decision to maintain both a technology-neutral spec and a Replit-specific one, rather than pick one. Low-Level Spec: full Lead and Partner state transition tables, 6 defined core operations with pre/postconditions, all formulas consolidated in one place (conversion math, freeze/top-up, referral fee split, 12-month proration), and explicit validation rules. Found and fixed a real inconsistency while building the state table - Data Dictionary's lead_status list was missing 'In Progress,' which BRD's pipeline already included. Also found a genuine gap never answered anywhere in the hub - whether a Frozen partner can submit/refer a lead - corrected an initially-wrong precondition rather than silently asserting an answer, and logged it as a new Gap Register item. Replit Build Brief: kept deliberately thin, referencing the Low-Level Spec and BRD rather than duplicating them - covers the two lock-in risks worth avoiding (Replit DB, Replit Auth) given this handles real financial data under regulatory review, a build order matching the BRD's MVP tags, and where human review of agent output is non-negotiable (financial calculations, state machine completeness). 23 of 24 planned documents now drafted - only Reporting Dashboard remains queued."}, {"date": "v27.0", "title": "Reporting Dashboard drafted - all 24 planned documents complete, 0 queued", "desc": "Built directly on SOP Section 19's already-defined KPI measures - a visual scorecard mockup of Sarthy's 20/40/30/10 weights, then a full table mapping every measure to its actual data source. Found a real gap while drafting: BRD Section 13's reporting requirement only ever covered Match-Making, despite SOP #19 defining measures for all 4 categories - fixed to cover all 4, and flagged that 2 of the 4 categories need something built before they can report real numbers (a startup-contact log, a contact-date field on the Partner record). This closes out the entire originally-planned document set - all 24 documents now drafted, nothing left queued."}, {"date": "v27.1", "title": "Added supporting diagrams across 6 documents", "desc": "New diagrams: the Journey Map's full partner lifecycle, the Low-Level Spec's complete Lead state machine, three new Playbook diagrams (wallet-threshold gauge in Section 8, Path A/B flow in Section 7, referral-fee timeline in Section 20), the Data Dictionary's entity-relationship map, and the Segmentation Framework's Giver/Balanced/Taker trend sparkline. The BRD and Interim Operating System each got a cross-link to the relevant new diagram instead of a duplicate copy. No facts or numbers changed - this round is visual support for what the text already said."}, {"date": "v27.2", "title": "Combined Journey Map drafted - startup and both partners lined up on one shared timeline", "desc": "New document, built as step one of a planned partner-engagement improvement effort. Lines up the startup, the referring partner, and the receiving partner against the same 6-stage timeline (Origination through Repeat or Dormancy) instead of documenting each lane separately, using only already-confirmed facts from the Lead state machine, Partnership SOP Section 7, the Data Dictionary, and the Communication Template Library - no new rules introduced. Surfaced 3 findings worth confirming with Sarthy: a lead that silently times out during acknowledgment triggers no message to anyone (checked directly against all 11 Communication Template Library triggers - confirmed the internal Associate nudge covers a different, later stall point, not this one); no message exists for the moment a referral actually converts and credits land, even though the annual payout notice and the pre-acknowledgment reminder both already exist; and a startup's own repeat engagement has no equivalent of the partner-side giving_pattern/dormancy tracking. Cross-links to the existing Partner Journey Map, Low-Level Spec, Playbook Section 7, Data Dictionary, and Communication Template Library. Explicitly diagnostic only - designing the actual engagement fixes is the next, separate step."}, {"date": "v27.3", "title": "Fixed a real inconsistency between Playbook Section 7 and the Low-Level Spec, and corrected the Combined Journey Map finding it affected", "desc": "Found while double-checking message-template audiences for the engagement work about to start: Playbook Section 7's simplified diagram showed Rejected and Unresolved both branching out from Acknowledged (after the 999-credit deduction), while the Low-Level Spec's authoritative Lead state machine has always had both branch directly from Introduced, before any deduction happens - accepting and declining/timing out are alternatives to each other, not sequential steps. Fixed Section 7's diagram to match the Low-Level Spec exactly, including its Rejected=red / Unresolved=amber coloring (Section 7's diagram had the two colors swapped). This also meant Finding 1 in the Combined Journey Map was wrong: it said an explicit decline sends the referring partner a message (template 3). Template 3 actually goes to the receiving partner, confirming they weren't charged for declining - it says nothing to the referring partner. Corrected: the referring partner gets no message at all, on either an explicit decline or a silent timeout - a bigger gap than originally described, not a smaller one. Did a full re-check of every other specific claim in the Combined Journey Map against its 5 source documents while in there; nothing else needed correcting."}, {"date": "v28.0", "title": "Engagement Strategy Framework drafted - the reusable structure, not yet the specific fixes", "desc": "Built directly on the Combined Journey Map's 3 findings, as the first step toward a full partner and startup engagement strategy. Rather than write tactics just for today's 3 roles, structured it as a matrix - stage, role, engagement objective, channel, trigger, owner, status - explicitly designed so the Startup, Referring Partner, and Receiving Partner (who share the Lead's own 6-stage timeline) are just the first instance of the pattern. A future role like Investors would define its own separate timeline and fill in the same 5 columns, without needing any change to this document's structure - demonstrated with an explicitly illustrative, non-binding example. Populated the full matrix for today's 3 roles across all 6 stages against the real, verified message inventory in the Communication Template Library and the outreach logic in the Segmentation Framework - surfaced that every 'Proposed' row in the Startup column shares one root cause, not six: no startup-facing channel exists anywhere in the hub yet, a bigger structural decision than any single message. Mapped exactly which proposed rows close Findings 1 and 2, and confirmed Finding 3 can't be closed by a message alone - it needs a new Data Dictionary tracking field first. Deliberately left out of this round: actual message wording, the new tracking field definition, and any SOP changes - flagged as concrete, scoped next steps rather than open-ended ones."}, {"date": "v28.1", "title": "Resolved the Engagement Strategy Framework's open startup-channel question", "desc": "Checked the Data Dictionary before answering: the Lead table has no field anywhere for a startup's email, phone, or name - Section 7's 'a real point of contact' is a validation rule the referring partner must satisfy, not data the system stores. That means a Path A startup can't be messaged at all today without deliberately adding a new contact field - a real scope increase, not a messaging decision - while a Path B startup already has a logged-in identity in the self-service product, so a channel already exists there. Also weighed a relationship-ownership angle: Partnership SOP v1.0 Section 20 gives the receiving partner outright ownership of the client relationship once the referral-fee window closes, so Sarthy messaging a Path A startup directly could look like inserting itself into a relationship it's already agreed belongs to the partner. Resolved: proposed startup messages apply to Path B only, delivered inside the self-service product. Updated all 4 Startup-lane matrix rows, the Finding 3 discussion, and the round's remaining next-steps list to reflect this - Path A messaging is now explicitly out of scope, not an open question."}, {"date": "v29.0", "title": "Connection Request Flow drafted - a proposal, not yet part of the confirmed SOP", "desc": "A new admin-gated model for how a Startup, Referring Partner, or Receiving Partner can start a connection with each other, covering 3 directions instead of today's 2: a startup requesting a receiving partner (extends Path B), a referring partner recommending a specific receiving partner (extends Path A), and a genuinely new case - a receiving partner browsing the full startup list and proposing to work with one directly, something Section 7 has no equivalent for today. Common mechanic across all 3: nobody but admin knows a request exists until admin does a first sanity check and takes consent from the requested party; the referring partner (where one exists) is only ever informed, never given veto power, in any of the 3 flows; the existing same-service-type guardrail becomes a visible flag to the receiving partner instead of a hard block. Resolved through direct Q&A: the 999-credit deduction still applies and still lands on the receiving partner, but now fires at admin approval instead of the receiving partner's own acknowledgment - the same underlying moment, generalized to cover the new direction. The startup's original referring/originating partner keeps its lead-share credit and referral fee regardless of which of the 3 flows produced the connection, extending the exact principle Section 7 already established for Path B. Deliberately left as a standalone proposal - Partnership SOP v1.0 Section 7, the Low-Level Spec's Lead state machine, the Data Dictionary's Lead table, and the BRD are not edited this round. 4 open questions flagged for confirmation before that follow-up round: formal startup consent in the referring-partner flow, what the admin sanity check actually checks, whether an open request needs its own expiry window, and whether multiple open requests can exist on the same startup at once now that the same-service-type rule is advisory."}, {"date": "v29.1", "title": "Corrected the Connection Request Flow's visibility model", "desc": "The v29.0 draft said nobody but admin knows a request exists until admin decides to reveal it. Corrected per direct feedback: every party involved can see that a request exists from the moment it is made, but only as a faded, FYI-only entry with nothing to act on - not hidden, just inactive. Admin still runs the first sanity check and takes consent from the requested party before the request becomes real and actionable; that step is now relabeled \"Admin activates it\" rather than \"Admin reveals it\", and is colour-coded (solid accent) to contrast with the faded, dashed box that represents the initial FYI-only state. Updated the step-by-step diagram, the footnote on the referring partner's visibility, and the \"Visibility before approval\" and \"referring partner's role\" rows in the comparison table to match. The underlying mechanics - who can request whom, when the 999-credit deduction fires, and who keeps the referral fee - are unchanged; this was a visibility-timing correction only."}, {"date": "v29.2", "title": "Wrote down why the Connection Request Flow shows a faded request at all", "desc": "The v29.1 fix made requests visible to all parties as a faded, FYI-only entry, but the document did not say why - a reasonable reader could ask why show something nobody can act on. Added the actual design intent behind it: it nudges the visible parties toward being more responsive and engaged even before admin steps in, and it gives admin a shared reference point to open the sanity-check conversation with, rather than approaching the requested party cold. No mechanics changed - this is a rationale addition only, in the paragraph right after the \"three ways a connection can start\" table."}, {"date": "v30.0", "title": "Connection Request Flow confirmed - folded into the core Lead engine, replacing the old self-service model", "desc": "All 4 open questions from the Connection Request Flow proposal were resolved directly with Sarthy leadership: the startup now gives real, required consent in the referring-partner-initiated flow, and Sarthy confirmed this admin-gated consent process replaces the old self-service accept/decline for ALL 3 directions, including plain direct referrals - not only the new ones; the admin sanity check covers account standing, duplicates, and responsible, non-bulk use; open requests have no automatic expiry; multiple open requests on the same startup can coexist. That last point surfaced a real conflict with an existing, previously-tested rule: the Low-Level Spec had leads auto-finalizing at exactly hour 168 (7 days) if the receiving partner took no action, an SLA the BRD's own verification section was built around. Since admin-gating now replaces that self-service window entirely, Sarthy confirmed retiring the auto-finalize rule and the Unresolved status along with it - a Lead now only ever resolves when admin actively approves or a party refuses consent, never on a timer. Folded the confirmed model into 4 documents: Playbook Section 7 (rewritten - 3 directions replace the old Path A/B framing, with a plain flag that requiring startup consent on every direct referral is a real increase in admin workload worth watching), the Low-Level Spec (Lead state machine rewritten - Introduced now fires immediately as a faded/FYI-only entry, ahead of Validated, with Acknowledged reached via admin-mediated consent instead of receiving-partner self-service), the Data Dictionary (Lead table extended with request_direction, visibility_state, and per-party consent fields), and the BRD (Section 5 rewritten, Section 16's acknowledgment-window test case replaced with a no-auto-finalization test). One new open question surfaced and left unresolved on purpose: when one open request converts to Acknowledged, do the startup's other open requests to similar-type partners auto-close, or stay open? Flagged in all 4 documents for a follow-up decision before this reaches a developer as a build spec."}, {"date": "v30.1", "title": "Full content-integrity sweep - propagated the confirmed connection-flow rewrite across every document it touched, plus 8 unrelated defects found along the way", "desc": "Read all 27 hub documents end to end (directly, and via 4 parallel audit passes) looking for anything left over from the old Path A/B, 7-day-window, self-service-accept/decline model, plus any other internal inconsistency. Fixed: Communication Template Library - Templates 2 and 3 rewritten, since both were built around the retired 7-day acknowledgment window (Template 2 is now a no-fixed-deadline consent follow-up; Template 3 is a consent-refusal confirmation). Combined Journey Map - full rewrite of its SVG diagram, Finding 1, and Stage 1-3 of its stage-by-stage table; Finding 1 is now narrower, since the silent-timeout failure mode it described no longer exists, though the underlying gap (referring partner not told the outcome) is still real. Engagement Strategy Framework - startup-messaging scope widened from 'Path B only' to 'directions B and C' throughout, since direction C startups also have a portal login; matrix rows and the Finding-1-closing paragraph updated to match. Also fixed, unrelated to the connection-flow rewrite: Glossary's 'accepted' corrected to 'acknowledged' for consistency; Graduation Criteria's reference to 'acknowledgment-window mechanics' updated to 'admin-mediated consent mechanics'; History's stale '18 pages' corrected to '26' (27 total hub documents, minus itself); Gap & Risk Register's Partner-1.0-agreements finding brought in line with the BRD and Action Tracker - the 9% fee question is resolved as policy, what's open now is execution, not the original legal question; Deliverables Register was missing 5 documents from its inventory (Connection Request Flow, Combined Journey Map, Engagement Strategy Framework, History, Replit Build Brief) and had 2 unlinked bullets, all fixed; Action Item Tracker's critical-path diagram didn't match its own table (a blocking item with no outgoing arrow, and an arrow implying a dependency the table didn't support) - both fixed; Phase 0 Discussion Doc's 'still open' money-mechanics section was listing 2 items that already stated their own resolved answers - reclassified as resolved-but-kept-for-traceability; Segmentation Framework's Active-to-Frozen arrow had a stray, disconnected starting coordinate in its SVG - fixed. Added a missing dependency-map.md row for the Interview Guide, which routes its own output into 3 other documents but had no row recording that. Two clusters of findings were deliberately NOT silently resolved, since they need Sarthy's or the Lead's own factual judgment, not an editorial fix: (1) Gantt vs. Roadmap disagree on Phase 2/3/4 durations by a week each, and disagree on whether Phase 0 and Phase 4 are actually 'Done'; (2) Migration Wave Plan's Wave 2 gate doesn't reference Graduation Criteria's actual Wave 2 gate criteria, despite the dependency map asserting they're linked. Both are being raised directly rather than guessed at."}, {"date": "v30.2", "title": "Resolved 2 of 3 Tier-3 findings with Sarthy/Lead's own judgment call - Gantt status honesty and migration deferral", "desc": "Raised 3 findings from the integrity sweep that needed a real decision, not an editorial fix. Resolved: (1) Gantt's Phase 0 and Phase 4 were marked Done despite each having a real, tracked open item (the Sarthy meeting to confirm remaining decisions is unscheduled; the BRD is still status: draft) - both changed to In Progress, with a callout explaining why, so the chart doesn't overstate real-world progress. (2) The Migration Wave Plan vs. Graduation Criteria Wave 2 gate mismatch - decided that migration onto the platform is a separate activity, taken up only after the core build is complete, not a pre-build dependency. Migration Wave Plan is now explicitly out of scope for the Technical Build Specification; the Wave 2 gate disagreement between the two documents is flagged in both (and in the dependency map) but deliberately left unreconciled until migration planning actually resumes. Still open: the Gantt (3/3/4 weeks) vs. Roadmap (4/4/5 weeks) Phase 2/3/4 duration mismatch - the Lead referred to a duration guideline from an earlier chat not visible in this session's context; asked for it directly rather than guessing which set of numbers is correct."}, {"date": "v31.0", "title": "Decommissioned the Gantt view and Migration Wave Plan - down to 25 documents", "desc": "The Lead's call, made directly in response to the Gantt-vs-Roadmap duration mismatch and the Migration Wave Plan-vs-Graduation Criteria gate mismatch flagged in the integrity sweep: rather than reconcile two competing sources of the same information, remove the redundant one. Project Plan (Gantt View) is retired - it duplicated the Roadmap's own phase timeline, and its 'what's actually still ahead' list already substantially duplicated the Action Item & Blocker Tracker. The Roadmap absorbed its useful role: it now carries a Status column (Done / In Progress / Not started), the same 'what Done means' framing, and a pointer to the Action Tracker for real blockers - so nothing about honest progress reporting was lost, only the duplicate document. Migration Wave Plan is retired too, consistent with the earlier decision that real partner migration is a deferred, post-build activity - it isn't worth actively maintaining as a pre-build document, and its Wave 2 gate disagreement with the Graduation Criteria is now moot rather than needing reconciliation. Its two genuinely useful ideas survive elsewhere: wave-sequencing-by-engagement-history is still true of the Segmentation Framework's outreach-priority logic, and the unresolved 9%-fee-vs-60/40-split question for special-agreement partners is still tracked in the Action Tracker's legal-review item. Both retirements are explained in Design History & Decisions, in keeping with how every other retired design in this hub is handled - fully removed from active navigation, not memory-holed. Removed all cross-references from Guide, Deliverables Register, Action Item & Blocker Tracker, Partner Segmentation Framework, Graduation Criteria, Master Execution Sequence, and the dependency map. 27 documents down to 25."}, {"date": "v31.1", "title": "Un-decommissioned the Migration Wave Plan - Gantt stays retired, this one comes back", "desc": "On reflection, the Lead determined Migration Wave Plan held real data worth keeping for post-launch migration work - specific wave sequencing (pilot group, core rollout, special-agreement partners, reactivation), pacing guidance, and the special-agreement fee-math flag - that the earlier decommission decision cut too broadly. Restored the document exactly as it stood before removal, plus a note on its own page explaining the brief retirement and restoration. Restored all 7 cross-references removed in v31.0: Guide's dependency table, Deliverables Register, Segmentation Framework's Feeds Directly Into, Graduation Criteria's Feeds Into, Master Execution Sequence item 14, the Action Tracker's critical-path diagram and table row, and the dependency map. The document is still explicitly a deferred, post-build activity, not part of the Technical Build Specification, and its Wave 2-vs-Graduation-Criteria gate mismatch is still flagged rather than reconciled - restoring the document didn't resolve that open question, it just kept the reference material intact for whenever it does get resolved. The Gantt view's decommissioning is unaffected and stands - only Migration Wave Plan came back. 25 documents back up to 26."}, {"date": "v32.0", "title": "Merged Partner Journey Map into the renamed User Journey Map", "desc": "Retired the Partner Journey Map (down to 25 documents) and folded its lifecycle content into the former Combined Journey Map, renamed User Journey Map, as two new sections split by role (Referring Partner Lifecycle, Receiving Partner Lifecycle) at the Lead's explicit request. Added a new, clearly-flagged proposed Startup Lifecycle section - the first attempt anywhere in the hub at answering Finding 3 (a startup's repeat engagement isn't tracked). Updated all cross-references in the Playbook, Sequence, Deliverables Register, Guide, Engagement Strategy, Connection Request Flow, and the dependency map; added a retirement/merge note to Design History & Decisions."}, {"date": "v33.0", "title": "Reorganized the sidebar into 8 new categories, replacing the old 9", "desc": "Retired Start Here (folded to just the Guide), Strategic Planning, Partnership SOP v1.0, Decision Records, Evidence & Assessment, Operational Tools, Scripts & Templates, and Technical Handoff as category names. Replaced with: Start Here (Guide only), Business Documents, Process Documents, Technical Documents, Reference Materials, Tracking & Governance, Archives (History), and Glossary. The User Journey Map moved into Process Documents by explicit request, alongside Segmentation, Comms Library, Interview Guide, Interim Operating System, and Engagement Strategy - all now grouped as how the day-to-day work happens rather than as background evidence. No document content changed; this is a sidebar/navigation reorganization only. Reference Materials is now a smaller, tighter category (Current-State Assessment, Gap & Risk Register) as a direct consequence of moving the User Journey Map out of it."}, {"date": "v33.1", "title": "Fixed a stale note on User Journey Map", "desc": "Its manifest \"updated\" text still said it was queued to move into Process Documents once the recategorization finished - the recategorization (v33.0) already finished and moved it there. Cosmetic only; the cat field was already correct. Flagged by the Lead after pushing v33.0."}, {"date": "v34.0", "title": "Switched the hub to a white theme - light sidebar, white page background", "desc": "The sidebar was dark green/black with light text; it is now white with dark text, at the Lead's request for readability. Every sidebar color that was calibrated for a dark background was updated together, not just the background - text, hover states, the active-document highlight, the search box, the progress bar, and the category-number circles all got new light-theme colors, otherwise text would have gone invisible against the new white background. The whole page background also moved from a warm off-white to pure white. Two places kept a light gray tint on purpose rather than going fully white: the search box and the Reporting Dashboard's progress-bar tracks, both of which need a visible boundary to read correctly - a track with no border-fill contrast would look like a floating colored bar with no context. Content and document data are unchanged; this is a visual/theme change only."}];
const CATS_ORDER = ["Start Here", "Business Documents", "Process Documents", "Technical Documents", "Reference Materials", "Tracking & Governance", "Archives", "Glossary"];
const CAT_DESC = {"Start Here": "How to find your way around this hub, and how updates are meant to flow", "Business Documents": "The rules and decisions that shape the partner program itself - what it is, and what still needs Sarthy's sign-off", "Process Documents": "How the day-to-day work actually happens - onboarding, staying in touch, prioritizing outreach, and the referral journey itself", "Technical Documents": "What gets handed to developers to actually build the app - requirements, specs, and shared data definitions", "Reference Materials": "What we found by studying how things work today", "Tracking & Governance": "How we track rollout progress and report results to Sarthy", "Archives": "Why things changed, and what they used to look like before", "Glossary": "Quick definitions for terms used across the hub"};

let activeCat = "Start Here";
let searchTerm = "";

function statusBadge(status){
  if(status==="done") return '<span class="badge badge-done">Confirmed</span>';
  if(status==="draft") return '<span class="badge badge-draft">Draft</span>';
  return '<span class="badge badge-pending">Pending</span>';
}
function dotClass(status){
  if(status==="done") return "dot-done";
  if(status==="draft") return "dot-draft";
  return "dot-pending";
}

function buildSidebar(activeId){
  const done = DOCS.length, total = DOCS.length + QUEUED.length;
  const pct = Math.round((done/total)*100);

  let html = `<div class="sidebar-header">
    <div class="brand" onclick="showDoc('guide')">Strategic Partners Playbook 3.0</div>
    <div class="progress-mini">${done} of ${total} drafted (${pct}%)</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <input type="text" class="search-box" id="searchBox" placeholder="Search documents..." value="${searchTerm}" oninput="filterDocs(this.value)" onclick="event.stopPropagation()">
  </div>`;

  let catNum = 0;
  CATS_ORDER.forEach(cat => {
    const docsInCat = DOCS.filter(d=>d.cat===cat);
    const queuedInCat = QUEUED.filter(q=>q.cat===cat);
    const total_in_cat = docsInCat.length + queuedInCat.length;
    if(total_in_cat===0) return;
    catNum++;
    const isActiveCat = cat===activeCat;
    const tip = (CAT_DESC[cat] || '').replace(/"/g, '&quot;');

    html += `<div class="cat-block">
      <div class="cat-header ${isActiveCat?'active-cat':''}" data-tip="${tip}">
        <span class="chevron">&#9656;</span>
        <span class="tab-num">${catNum}</span>
        <span>${cat}</span>
        <span class="cat-count">${docsInCat.length}/${total_in_cat}</span>
      </div>
      <div class="cat-body" data-cat="${cat}">`;

    let docNum = 0;
    docsInCat.forEach(d=>{
      docNum++;
      const cls = d.id===activeId ? 'doc-link active' : 'doc-link';
      const dtip = (d.desc || '').replace(/"/g, '&quot;');
      const search = (d.title + ' ' + (d.desc||'')).toLowerCase().replace(/"/g, '&quot;');
      html += `<div class="${cls}" data-tip="${dtip}" data-search="${search}" onclick="showDoc('${d.id}')"><span class="tab-num-sm">${docNum}</span><span class="dot ${dotClass(d.status)}"></span>${d.title}</div>`;
    });
    queuedInCat.forEach(q=>{
      docNum++;
      const dtip = (q.desc || '').replace(/"/g, '&quot;');
      const search = (q.title + ' ' + (q.desc||'')).toLowerCase().replace(/"/g, '&quot;');
      html += `<div class="doc-link disabled" data-tip="${dtip}" data-search="${search}"><span class="tab-num-sm">${docNum}</span><span class="dot dot-pending"></span>${q.title}</div>`;
    });

    html += `</div></div>`;
  });

  html += `<div class="changelog-link" onclick="showChangelog()">Version history</div>`;
  document.getElementById('sidebarContent').innerHTML = html;
  if(searchTerm) filterDocs(searchTerm, true);
}

function filterDocs(val, skipStore){
  if(!skipStore) searchTerm = val;
  const term = val.toLowerCase().trim();
  document.querySelectorAll('.cat-block').forEach(block => {
    let anyVisible = false;
    block.querySelectorAll('.doc-link').forEach(link => {
      const match = !term || (link.getAttribute('data-search')||'').includes(term);
      link.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
    });
    block.style.display = anyVisible ? '' : 'none';
  });
}

let currentDocId = null;

function renderEmpty(cat){
  document.getElementById('main').innerHTML = `<div class="crumb">${cat}</div><div class="doc-header"><h1 class="doc-title">Not yet drafted</h1></div><div class="pending-box">Everything in this category is still queued. Check Master Execution Sequence for build order.</div>`;
}

function showDoc(id){
  const d = DOCS.find(x=>x.id===id);
  if(!d) return;
  activeCat = d.cat;
  currentDocId = id;
  buildSidebar(id);
  document.getElementById('main').innerHTML = `
    <div class="crumb">${d.cat}</div>
    <div class="doc-header">
      <h1 class="doc-title">${d.title}</h1>
      <div class="meta-row">${statusBadge(d.status)}<span class="meta-text">v${d.version}</span><span class="meta-text">.</span><span class="meta-text">${d.type}</span><span class="meta-text">.</span><span class="meta-text">${d.updated}</span></div>
    </div>
    <div class="content">${d.html}</div>
  `;
  window.scrollTo(0,0);
}

function showChangelog(){
  currentDocId = null;
  buildSidebar(null);
  let items = CHANGELOG.map(c=>`<div class="cl-item"><div class="cl-date">${c.date}</div><div class="cl-body"><strong>${c.title}</strong><span>${c.desc}</span></div></div>`).join("");
  document.getElementById('main').innerHTML = `<div class="crumb">Project hub</div><div class="doc-header"><h1 class="doc-title">Version history</h1><div class="meta-row"><span class="meta-text">Every structural change to this hub, logged here</span></div></div><div class="content">${items}</div>`;
  window.scrollTo(0,0);
}

showDoc('guide');
</script>
