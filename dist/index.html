cases, based on the merits - see Section 9 below for the evidence mechanism still being designed</li>\n<li>The system must flag any partner with 4 or more consecutive declines to admin for manual review</li>\n<li>The system must allow a lead to be re-referred an unlimited number of times, but must block simultaneous referral of the same lead to two partners offering the same type of service</li>\n<li>The system must always let the referring partner choose the receiving partner directly - matching is not automatic by default</li>\n<li><strong>Not yet scoped for build, flagged for later:</strong> a backend matchmaking layer that surfaces and promotes good potential matches to partners as a catalyst - not a replacement for partner choice, more like an active recommendation. Needs its own design pass before it's a real requirement.</li>\n</ul>\n\n<h2>6. Conversion and disputes</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 9</a></p>\n<ul>\n<li>The system must support the same conversion standard for every service category - proof of first payment plus a digitally signed agreement, captured in-platform</li>\n<li>The system must credit the referring partner 999 credits minus the 9% fee (about 909 net) the moment admin confirms conversion - see Section 7 below for the fee mechanic</li>\n<li>The system must let a partner formally dispute a conversion decision within 14 days of it being made, in writing, through the platform</li>\n<li>The system must notify admin immediately when a dispute is raised, with a target response time of 24 hours</li>\n<li><strong>Still open:</strong> whether there's any escalation path beyond the admin if a partner remains unsatisfied - see <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 Discussion Doc</a></li>\n</ul>\n\n<h2>7. Withdrawal and the credit wallet's money mechanics</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 10</a></p>\n<ul>\n<li>The system must treat membership as ongoing - no cycle-end event, no forced settlement date</li>\n<li>The system must enforce a minimum reserve of 999 credits at all times - a partner cannot withdraw below that floor</li>\n<li>The system must support quarterly withdrawal requests for anything above the reserve</li>\n<li>The system must apply the 9% fee once, at the point credit transfers to a referring partner on conversion - not again at withdrawal, since it's already been taken at the source</li>\n<li>The system must convert credits to real currency using the live exchange rate on the day of withdrawal, not the rate from sign-up - <strong>still open:</strong> which specific rate source counts as official</li>\n<li><strong>Still open, applies here too:</strong> whether the 9% fee also applies to the older, separate 10% direct referral-fee flow from Partner 1.0-era agreements - a genuinely different question from the credit system above, not yet answered</li>\n</ul>\n\n<h2>8. Post-closure referral fee tracking</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 20</a></p>\n<ul>\n<li>The system must let a receiving partner record deal value and duration once a referred lead closes into a signed agreement</li>\n<li>The system must notify Sarthy and the original referring partner when this happens</li>\n<li>The system must calculate the referring partner's entitlement as 10% of deal value, then deduct Sarthy's 9% cut of that 10%, crediting the referring partner the remaining 91% (9.1% of total deal value)</li>\n<li>The system must accumulate this amount in the referring partner's account separately from their 999-point credit wallet - this is a different pool, on a different payout schedule</li>\n<li>The system must pay out the accumulated referral-fee balance once annually, at financial year-end (March 31st)</li>\n<li>The system must track a 1-year expiry from the lead's first engagement date, after which no further referral-fee entitlement accrues to the original referring partner on that relationship</li>\n</ul>\n\n<h2>9. Partner activity requirement (dormancy)</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 21</a></p>\n<ul>\n<li>The system must track the date of a partner's last shared lead</li>\n<li>The system must automatically mark a partner dormant after 3 consecutive months with no lead shared</li>\n<li>The system must remove a dormant partner from the public portal listing and block them from receiving new leads until they resume activity</li>\n<li><strong>Not yet scoped for build, flagged for later:</strong> gamification elements (leaderboards, streaks, recognition) to encourage consistent giving - a real direction Sarthy wants to pursue, not yet designed</li>\n</ul>\n\n<h2>10. Negative balances</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 8</a></p>\n<ul>\n<li>The system must allow a partner's balance to run negative down to -2,997 credits</li>\n<li>The system must automatically freeze a partner's ability to receive new leads once their balance hits -2,997</li>\n<li>The system must support a top-up payment (4x the entry fee - \u20b93,996 or $196) that adds 3,996 credits back to a frozen wallet, bringing the balance from -2,997 to exactly +999</li>\n</ul>\n\n<h2>11. Trust and evidence - the dispute-reversal mechanism</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a></p>\n<p>This is flagged separately because it's a genuinely open design problem, not just an unconfirmed number. The Lead's proposal: for cases disputed past the standard 1-week window, the system should reach out directly to the startup to confirm whether the receiving partner actually engaged with them, and use that as evidence for admin's manual reversal decision.</p>\n<ul>\n<li><strong>Not yet a firm requirement, open for discussion:</strong> the system would need a way to contact the startup lead directly (a short form or message) and capture their confirmation or denial</li>\n<li><strong>Still open:</strong> whether that confirmation is mandatory before any reversal can happen, or just one input among several the admin weighs</li>\n<li><strong>Still open:</strong> what happens if the startup doesn't respond either - does the case default to favoring the receiving partner, the referring partner, or just stay open longer</li>\n</ul>\n\n<h2>12. Guardrails and admin tools</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 13</a></p>\n<ul>\n<li>The system must give admin visibility into referral patterns across the whole network, to spot suspicious coordination between just one or two partners</li>\n<li>The system must flag partners with consistently low conversion rates for admin review</li>\n<li>The system must support admin manually freezing or exiting a partner's account in cases of confirmed abuse</li>\n</ul>\n\n<h2>13. Reporting</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 19</a></p>\n<ul>\n<li>The system must be able to report, at minimum monthly: leads matched per month, average time from submission to match, percentage of leads validated versus rejected or stalled, and spread of matches across the partner base</li>\n<li>The system must support recording written recommendations coming out of that reporting, and whether they were acted on</li>\n</ul>\n\n<h2>14. Open decisions log</h2>\n<p>Carried forward from Partnership SOP v1.0 and the Phase 0 Discussion Doc - nothing below should get quietly assumed by whoever eventually builds this:</p>\n<ul>\n<li>Which exchange rate source counts as official for withdrawal conversion</li>\n<li>The full design of the startup-confirmation mechanism for disputed reversals</li>\n<li>Whether a partner can appeal beyond the admin on disputes</li>\n<li>Exact gamification mechanics for the dormancy/activity system</li>\n<li>The live feature inventory of what's actually built in the current Alpha - once portal access is confirmed, this document gets checked against that reality for a real gap analysis</li>\n</ul>\n"}, {"id": "gap-register", "content_file": "gap-register.html", "cat": "Evidence & Assessment", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Gap & Risk Register", "desc": "A list of problems we found, each with a suggested fix", "html": "<p class=\"callout\">Every gap below traces back to evidence in the Current-State Assessment, or to something surfaced while building Partnership SOP v1.0. Ranked by how much it affects the core mandate: onboarding, engagement, and getting activity to actually run through the platform.</p>\n\n<table class=\"dtable\">\n<tr><th>Gap</th><th>Severity</th><th>Status</th><th>Fix / Note</th></tr>\n<tr><td>Almost no signed 1.0 partners were ever moved onto the platform (\"Part of Platform\" column empty)</td><td>High</td><td>Open</td><td>The core target for the whole engagement - addressed by the redesigned onboarding flow (SOP \u00a77) and the migration wave plan</td></tr>\n<tr><td>Even the small number of current Alpha users show infrequent, not active, usage</td><td>High</td><td>Open</td><td>Not just an onboarding problem - an activation one. Feeds directly into the engagement cadence (SOP \u00a715)</td></tr>\n<tr><td>No defined ongoing engagement cadence existed historically</td><td>High</td><td>Closed</td><td>SOP \u00a715 now defines partner-controlled selection plus regular Sarthy team touch-base</td></tr>\n<tr><td>No reactivation process for dormant partners</td><td>Medium</td><td>Partially closed</td><td>Trigger rule is defined (SOP \u00a721, 3-month dormancy), but the actual outreach script and process (SOP \u00a717) still needs the Communication Template Library</td></tr>\n<tr><td>Two separate reward systems existed with no single document connecting them</td><td>High</td><td>Closed</td><td>SOP \u00a720 now documents the deal-closure referral fee alongside the credit system - a real historical documentation gap, not just a wording issue</td></tr>\n<tr><td>Negative-balance top-up math didn't actually reach the required floor</td><td>Medium</td><td>Closed</td><td>Caught during drafting, corrected with real numbers (SOP \u00a78)</td></tr>\n<tr><td>Which exchange rate source counts as official for withdrawal conversion</td><td>Low-Medium</td><td>Open</td><td>Deliberately deprioritized by the Lead - not a blocker, but needs an answer before real money changes hands</td></tr>\n<tr><td>No escalation path defined beyond the admin for unresolved disputes</td><td>Medium</td><td>Open</td><td>Could become a trust issue if partners feel the admin's word is unappealable with no further recourse</td></tr>\n<tr><td>Real feature inventory of the current Alpha build is unknown</td><td>High</td><td>Blocked</td><td>Waiting on portal access - the BRD's To-Be spec exists and is ready for gap-mapping the moment access comes through</td></tr>\n<tr><td>Match-Making and Research & Reports KPIs were undefined in Sarthy's own framework</td><td>Medium</td><td>Proposed, awaiting sign-off</td><td>SOP \u00a719 now has concrete proposed measures</td></tr>\n<tr><td>Duplicate lead detection and stall handling required real design, not just policy</td><td>Medium</td><td>Partially closed</td><td>Detection rule is defined; the startup-confirmation evidence mechanism for disputed reversals is still open (SOP \u00a77, BRD \u00a711)</td></tr>\n<tr><td>No formal criteria for moving from early testing to a wider rollout</td><td>High</td><td>Closed</td><td>SOP \u00a718 now has Sarthy's real target - 10 active partners within 2 weeks of full launch</td></tr>\n</table>\n\n<h2>What this means for sequencing</h2>\n<p>The remaining open items cluster into two groups: things that are genuinely fine to leave open a while longer (exchange rate source), and things that create real risk the longer they stay unresolved (dispute escalation, the feature inventory). The Gap & Risk Register should be revisited whenever a new open item surfaces elsewhere in the hub - see the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">dependency map</a>.</p>\n"}, {"id": "segmentation", "content_file": "segmentation.html", "cat": "Operational Tools", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Partner Segmentation Framework", "desc": "A way to group partners so we know who to focus on first", "html": "<p class=\"callout\">This is the full version of the grouping logic Partnership SOP v1.0 \u00a711 only summarizes. Used to decide where the Associate's limited calling time goes first, and to sequence the migration wave plan.</p>\n\n<h2>The core signal: wallet trend, not a one-time label</h2>\n<p>Giver vs. Taker isn't a fixed category assigned once - it's read from a partner's actual behavior over time, using the credit wallet as the evidence:</p>\n<ul>\n<li><strong>Giver pattern:</strong> wallet balance trending upward - referring more than receiving, leads converting, low decline rate</li>\n<li><strong>Balanced pattern:</strong> wallet roughly stable - giving and receiving in reasonable proportion</li>\n<li><strong>Taker pattern:</strong> wallet balance trending downward - receiving regularly, referring rarely or never</li>\n<li><strong>At-risk pattern:</strong> approaching the -2,997 freeze threshold, or 4+ consecutive declines flagged</li>\n</ul>\n\n<h2>Priority tiers for outreach</h2>\n<table class=\"dtable\">\n<tr><th>Tier</th><th>Who's in it</th><th>Outreach priority</th></tr>\n<tr><td>1 - Active Givers</td><td>Wallet trending up, regularly referring, low decline rate</td><td>Low-touch, high-value - keep them happy, feature them (Partner of the Month), ask for referrals to new partners</td></tr>\n<tr><td>2 - Balanced Participants</td><td>Roughly even give/receive pattern</td><td>Medium-touch - the biggest group to nurture toward Tier 1</td></tr>\n<tr><td>3 - At-Risk Takers</td><td>Wallet trending down, few or no referrals sent, nearing the freeze threshold</td><td>High-touch, direct intervention - this is where the Associate's calling time matters most before someone drops to Tier 4</td></tr>\n<tr><td>4 - Dormant</td><td>3+ months with no lead shared (SOP \u00a721)</td><td>Reactivation campaign, not routine calling - see the Communication Template Library</td></tr>\n<tr><td>5 - Unconverted Applicants</td><td>Applied, not yet onboarded</td><td>Standard onboarding flow (SOP \u00a75), not this framework</td></tr>\n</table>\n\n<h2>How this differs from the evaluation-stage Giver/Taker read</h2>\n<p>SOP \u00a75 describes an initial, conversation-based Giver/Taker judgment made during onboarding - useful, but subjective and only a snapshot. This framework replaces that snapshot with an ongoing, data-driven signal once a partner has real wallet activity - the onboarding read is a starting guess, this is the actual measurement.</p>\n\n<h2>Feeds directly into</h2>\n<ul>\n<li>The <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Dormant-Partner Reactivation</a> process (SOP \u00a717) - Tier 3 and 4 are its target list</li>\n<li>The Migration Wave Plan - Tier 1 and 2 partners are natural early-wave candidates once rollout expands</li>\n<li>The Associate's daily call queue, once the Interim Operating System exists</li>\n</ul>\n"}, {"id": "journey-map", "content_file": "journey-map.html", "cat": "Evidence & Assessment", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Partner Journey Map", "desc": "The full step-by-step partner experience, start to finish", "html": "<p class=\"callout\">The full partner lifecycle, start to finish. Partnership SOP v1.0 \u00a714 summarizes this; this document is where the detail actually lives.</p>\n\n<table class=\"dtable\">\n<tr><th>Stage</th><th>What happens</th><th>Where friction likely shows up</th></tr>\n<tr><td>1. Awareness</td><td>Partner hears about the program via LinkedIn, a mailer, the WhatsApp community, or a direct approach</td><td>No consistent inbound channel - depends entirely on who's reaching out that week</td></tr>\n<tr><td>2. Evaluation</td><td>Sarthy reviews the company profile, holds a discovery call, reads fit against service relevance, client diversity, professional standing, and a first Giver/Taker impression</td><td>Informal, conversation-based judgment - no written checklist yet</td></tr>\n<tr><td>3. Agreement & Payment</td><td>Referral agreement signed digitally, programme fee paid (\u20b9999+GST or $49), 999 opening credits granted</td><td>None currently identified - this step is well-defined</td></tr>\n<tr><td>4. First Activity</td><td>Partner either submits their first lead or receives one - this is the make-or-break moment for habit formation</td><td>The single biggest gap today - most partners never reach this stage in practice (\"Part of Platform\" is empty for most)</td></tr>\n<tr><td>5. Active Participation</td><td>Regular giving and receiving, wallet moving in both directions, Sarthy team checking in per SOP \u00a715</td><td>Even the few current users show infrequent activity, not sustained habit</td></tr>\n<tr><td>6. Steady State</td><td>Partner settles into a Giver, Balanced, or Taker pattern (see Segmentation Framework)</td><td>No current data on how long this takes or what triggers the split</td></tr>\n<tr><td>7. Risk Zone</td><td>Wallet trending negative, declines mounting, or activity slowing toward the 3-month dormancy line</td><td>This is exactly where Tier 3 outreach (Segmentation Framework) needs to intervene, before Stage 8</td></tr>\n<tr><td>8a. Reactivation</td><td>A partner who went quiet re-engages, usually after direct outreach</td><td>No process exists yet - this is SOP \u00a717's remaining open piece</td></tr>\n<tr><td>8b. Formal Dormancy</td><td>3 months with no shared lead - removed from public listing, blocked from receiving new leads (SOP \u00a721)</td><td>Whether this actually gets communicated clearly to the partner, or just happens silently, is untested</td></tr>\n</table>\n\n<h2>What the interview guide should validate</h2>\n<p>This map is built from documented rules, not direct partner testimony. The <a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">Alpha Partner Interview Guide</a> exists specifically to check whether Stage 4 and 5 actually feel this way to a real partner, or whether the friction sits somewhere this map hasn't captured yet.</p>\n"}, {"id": "comms-library", "content_file": "comms-library.html", "cat": "Scripts & Templates", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Communication Template Library", "desc": "Ready-made messages for WhatsApp, email, and phone calls", "html": "<p class=\"callout\">Ready-to-use messages, each tied to a specific trigger already defined in Partnership SOP v1.0. Keep them short and warm - these are meant to sound like a person checking in, not a system notification.</p>\n\n<h2>1. Welcome message (on wallet activation)</h2>\n<p><em>Trigger: SOP \u00a75, immediately after fee payment and credit grant</em></p>\n<blockquote>\"Welcome to the Sarthy partner network! Your account's live and you've got 999 credits to start. The easiest way to get value fast: send us your first lead, or let us know what kind of leads you're hoping to receive. We'll check in soon to help you get going.\"</blockquote>\n\n<h2>2. Acknowledgment reminder (day 5 of the 1-week window)</h2>\n<p><em>Trigger: SOP \u00a77, 2 days before the acknowledgment window closes</em></p>\n<blockquote>\"Quick nudge - you've got a lead waiting on your response, and the window closes in 2 days. Take a look when you get a chance, even if it's a pass.\"</blockquote>\n\n<h2>3. Lead declined confirmation</h2>\n<p><em>Trigger: SOP \u00a77, on decline within the window</em></p>\n<blockquote>\"No problem - we've noted that this one wasn't a fit. No credit deduction on your end. We'll keep sending relevant leads your way.\"</blockquote>\n\n<h2>4. Stall check-in (admin-facing, internal)</h2>\n<p><em>Trigger: SOP \u00a77, when a lead crosses the 1-week acknowledged-but-no-update line</em></p>\n<blockquote>Internal note template for the Associate: \"Lead [ID] acknowledged by [Partner] on [date], no update since. Reach out directly to confirm status before flagging as disputed.\"</blockquote>\n\n<h2>5. Dormancy warning (approaching 3 months)</h2>\n<p><em>Trigger: SOP \u00a721, roughly 2 weeks before the dormancy line</em></p>\n<blockquote>\"We noticed it's been a while since your last referral - just checking in before anything changes on your account. Is there anything blocking you from sending a lead, or can we help you find one worth referring?\"</blockquote>\n\n<h2>6. Dormant status notification</h2>\n<p><em>Trigger: SOP \u00a721, on crossing 3 months inactive</em></p>\n<blockquote>\"Your account's moved to inactive status after 3 months without a referral, so you're currently off the public partner listing and won't receive new leads. This isn't permanent - reach out any time and we'll get you reactivated.\"</blockquote>\n\n<h2>7. Reactivation outreach</h2>\n<p><em>Trigger: dormant-partner win-back campaign, SOP \u00a717</em></p>\n<blockquote>\"It's been a bit since we've connected - wanted to check in and see how things are going on your end. A lot has changed in the partner program since you were last active, including [specific update]. Worth a quick call to catch up?\"</blockquote>\n\n<h2>8. Monthly engagement check-in</h2>\n<p><em>Trigger: SOP \u00a715, ongoing cadence</em></p>\n<blockquote>\"Monthly check-in - how's the partner program working for you lately? Any leads you're sitting on that we could help move, or types of leads you'd like to see more of?\"</blockquote>\n\n<h2>9. Dispute acknowledgment</h2>\n<p><em>Trigger: SOP \u00a79, within 24 hours of a dispute being raised</em></p>\n<blockquote>\"We've received your dispute on [lead/conversion ID] and are looking into it now - you'll hear back from us within 24 hours with next steps.\"</blockquote>\n\n<h2>10. Annual referral fee payout notice</h2>\n<p><em>Trigger: SOP \u00a720, March 31st settlement</em></p>\n<blockquote>\"Your annual referral fee payout for [year] is ready - [amount] based on deals closed through your referrals this year. Details and payout timing below.\"</blockquote>\n"}, {"id": "graduation-criteria", "content_file": "graduation-criteria.html", "cat": "Tracking & Governance", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Alpha to Beta Graduation Criteria", "desc": "The targets we need to hit before opening the app to more partners", "html": "<p class=\"callout\">The targets to hit before opening the platform beyond the current small Alpha group. Anchored to the one real target Sarthy has already set (SOP \u00a718), plus a few supporting criteria to make sure \"10 active partners\" means genuinely active, not just signed up.</p>\n\n<h2>Sarthy's confirmed target</h2>\n<p><strong>At least 10 active partners within 2 weeks of the app being fully up and running</strong> - not the current early-testing state, once it's genuinely live.</p>\n\n<h2>Supporting criteria - proposed, to make \"active\" mean something real</h2>\n<ul>\n<li>Each of the 10 must have completed at least one full lead cycle - submitted or received a lead that reached acknowledgment, not just logged in once</li>\n<li>No partner among the 10 should be sitting at the -2,997 freeze threshold - a technically \"active\" account that's actually stuck doesn't count</li>\n<li>At least one dispute or edge case (a decline, a stall, a rejection) should have been handled through the real process, not just simulated - proof the guardrails actually work under real conditions</li>\n<li>The duplicate-lead detection and acknowledgment-window mechanics (BRD \u00a75) should be confirmed working, not just specified</li>\n</ul>\n\n<h2>What happens if the 2-week window is missed</h2>\n<p>Not currently defined by Sarthy - worth raising directly rather than assuming. Does the target simply extend, or does it trigger a review of what's not working in onboarding?</p>\n\n<h2>Feeds into</h2>\n<p>The <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">Migration Wave Plan</a>, once drafted - Wave 2 shouldn't begin until these criteria are genuinely met, not just when 2 weeks have passed on the calendar.</p>\n"}, {"id": "data-dictionary", "content_file": "data-dictionary.html", "cat": "Operational Tools", "status": "draft", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Data Dictionary / SSOT Schema", "desc": "One clear definition for every piece of partner data we track", "html": "<p class=\"callout\">One shared definition for every piece of partner data this program touches - so \"status,\" \"balance,\" or \"active\" means exactly the same thing whether it's in a conversation, a spreadsheet, or eventually the app itself. Every field traces back to a specific Partnership SOP v1.0 section.</p>\n\n<h2>Partner</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>partner_id</td><td>Text</td><td>Unique identifier, assigned at onboarding</td><td>SOP \u00a75</td></tr>\n<tr><td>programme</td><td>India / International</td><td>Locked permanently at sign-up, never changes</td><td>SOP \u00a75</td></tr>\n<tr><td>status</td><td>Applicant / Active / At-Risk / Dormant / Frozen / Exited</td><td>See the status definitions below - this is not the same as the Segmentation Framework's Giver/Taker tiers, which describe behavior, not account state</td><td>SOP \u00a75, \u00a78, \u00a721</td></tr>\n<tr><td>onboarding_notes</td><td>Free text</td><td>Discovery-call read on service relevance, client diversity, professional standing, initial Giver/Taker impression</td><td>SOP \u00a75, \u00a711</td></tr>\n<tr><td>segmentation_tier</td><td>1-5</td><td>Current priority tier from the Segmentation Framework, recalculated from wallet trend, not set manually</td><td>Segmentation Framework</td></tr>\n<tr><td>last_lead_shared_date</td><td>Date</td><td>Drives the 3-month dormancy calculation</td><td>SOP \u00a721</td></tr>\n</table>\n\n<h2>Status definitions - precise, not casual</h2>\n<table class=\"dtable\">\n<tr><th>Status</th><th>Means exactly this</th></tr>\n<tr><td>Applicant</td><td>Applied, not yet through evaluation or fee payment</td></tr>\n<tr><td>Active</td><td>Onboarded, wallet balance above -2,997, has shared at least one lead in the last 3 months</td></tr>\n<tr><td>At-Risk</td><td>Active, but balance trending toward -2,997 or 4+ consecutive declines flagged - a warning state, not a restriction</td></tr>\n<tr><td>Dormant</td><td>3+ months with no lead shared - removed from public listing, blocked from receiving new leads, but not frozen for balance reasons</td></tr>\n<tr><td>Frozen</td><td>Balance has hit -2,997 - blocked from receiving new leads until topped up to +999. Distinct from Dormant, and a partner could technically be both</td></tr>\n<tr><td>Exited</td><td>Account closed, by the partner's choice or Sarthy's, per the guardrails in SOP \u00a713</td></tr>\n</table>\n\n<h2>Credit Wallet</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>balance</td><td>Integer (can be negative)</td><td>Current credit balance, floor -2,997, no upper cap</td><td>SOP \u00a76, \u00a78</td></tr>\n<tr><td>paid_credits</td><td>Integer</td><td>Portion of balance that came from real payment - never expires</td><td>SOP \u00a76</td></tr>\n<tr><td>goodwill_credits</td><td>Integer, with expiry_date</td><td>Portion issued by Sarthy as a coupon - expires 30 days from issue</td><td>SOP \u00a76</td></tr>\n<tr><td>ledger_entry</td><td>Record: amount, reason, timestamp</td><td>Every single add or deduction, permanently logged - reasons: fee_payment, lead_received, conversion_earned, topup, withdrawal</td><td>SOP \u00a76, \u00a77</td></tr>\n</table>\n\n<h2>Lead</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>lead_id</td><td>Text</td><td>Unique identifier</td><td>SOP \u00a77</td></tr>\n<tr><td>referring_partner_id</td><td>Reference</td><td>Who submitted it</td><td>SOP \u00a77</td></tr>\n<tr><td>receiving_partner_id</td><td>Reference</td><td>Who it's introduced to - always partner-chosen, not system-assigned by default</td><td>SOP \u00a77</td></tr>\n<tr><td>lead_status</td><td>Submitted / Validated / Introduced / Acknowledged / Converted / Rejected / Unresolved</td><td>See stage definitions - matches the BRD \u00a75 pipeline exactly</td><td>SOP \u00a77, BRD \u00a75</td></tr>\n<tr><td>submitted_at, acknowledged_at, resolved_at</td><td>Timestamps</td><td>Used to calculate the 5-working-day validation window and the 1-week acknowledgment/rejection window</td><td>SOP \u00a77</td></tr>\n<tr><td>duplicate_flag</td><td>Boolean</td><td>Set automatically at upload if it matches an existing lead</td><td>SOP \u00a77, BRD \u00a75</td></tr>\n</table>\n\n<h2>Deal (post-closure)</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>deal_id</td><td>Text</td><td>Unique identifier, linked to the originating lead_id</td><td>SOP \u00a720</td></tr>\n<tr><td>deal_value, deal_duration</td><td>Currency, months</td><td>Reported by the receiving partner on closure</td><td>SOP \u00a720</td></tr>\n<tr><td>referral_fee_entitlement</td><td>Currency</td><td>10% of deal_value, before Sarthy's cut</td><td>SOP \u00a720</td></tr>\n<tr><td>referral_fee_net</td><td>Currency</td><td>91% of the entitlement - what the referring partner actually accrues</td><td>SOP \u00a720</td></tr>\n<tr><td>first_engagement_date</td><td>Date</td><td>Starts the 1-year entitlement window</td><td>SOP \u00a720</td></tr>\n<tr><td>payout_status</td><td>Accruing / Paid</td><td>Paid only at the annual March 31st settlement</td><td>SOP \u00a720</td></tr>\n</table>\n\n<h2>Dispute</h2>\n<table class=\"dtable\">\n<tr><th>Field</th><th>Type</th><th>Meaning</th><th>Source</th></tr>\n<tr><td>dispute_id</td><td>Text</td><td>Unique identifier, linked to a lead_id or deal_id</td><td>SOP \u00a79</td></tr>\n<tr><td>raised_at</td><td>Timestamp</td><td>Starts the 24-hour admin-response clock</td><td>SOP \u00a79</td></tr>\n<tr><td>evidence_notes</td><td>Free text</td><td>Includes startup-confirmation input where used - mechanism still being designed, see BRD \u00a711</td><td>SOP \u00a77, BRD \u00a711</td></tr>\n<tr><td>resolution</td><td>Upheld / Reversed</td><td>Admin's final call - not appealable further, per SOP \u00a79</td><td>SOP \u00a79</td></tr>\n</table>\n\n<h2>What this document deliberately doesn't cover yet</h2>\n<p>Gamification fields for the dormancy/activity system (SOP \u00a721) aren't defined here since that mechanic itself isn't designed yet. This dictionary gets extended, not rewritten, whenever a new SOP section resolves - see the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">dependency map</a>.</p>\n"}];
const QUEUED = [{"cat": "Operational Tools", "title": "Interim Operating System", "desc": "A simple working tool to manage partners until the platform is ready"}, {"cat": "Technical Handoff", "title": "Low-Level System Specification", "desc": "The detailed technical spec, built from the approved BRD"}, {"cat": "Tracking & Governance", "title": "Migration Wave Plan", "desc": "The order in which partner groups move onto the platform"}, {"cat": "Tracking & Governance", "title": "Reporting Dashboard", "desc": "A simple view of progress, measured against Sarthy's own KPIs"}];
const CHANGELOG = [{"date": "v1.0", "title": "Hub created", "desc": "Consolidated 5 completed documents into one version-controlled reference: Roadmap, Master Execution Sequence, Partnership SOP v1.0 skeleton, Phase 0 Discussion Doc, Deliverables Register."}, {"date": "v1.1", "title": "Split into separate pages", "desc": "Converted from a single-page app into one HTML file per document, sharing one sidebar and style system, for easier navigation and sharing of individual documents."}, {"date": "v2.1", "title": "Alpha Partner Interview Guide drafted", "desc": "Item 3 in the Master Execution Sequence is now live - moved from queued to drafted, status green."}, {"date": "v2.2", "title": "Current-State Assessment drafted", "desc": "Item 4 in the Master Execution Sequence is now live. Per the dependency map, this feeds Gap & Risk Register, Segmentation Framework, and Journey Map - none of those are written yet, so no downstream edit needed this round, but flagged for when they are."}, {"date": "v3.0", "title": "Renamed and rewritten in plain English", "desc": "Hub renamed to 'Strategic Partners Playbook 3.0' (overarching name). The document formerly called 'Playbook 3.0' is now 'Partnership SOP v1.0', since it's one part of the Playbook, not the whole thing. Every page's content rewritten in simpler, everyday language - facts, figures, and named parties kept exactly as documented, only the phrasing changed."}, {"date": "v4.0", "title": "Merged Partnership SOP v1.0 with Process & SOPs; added real internal links", "desc": "The four planned 'Process & SOPs' documents (onboarding, engagement, reactivation, escalation) are no longer separate - they're written directly as Partnership SOP v1.0 sections, removing duplicate work. The 'Process & SOPs' category is retired since nothing separate lives there anymore. Sarthy's original Playbook 2.0 stays external and cited, not merged in, to preserve the line between what Sarthy proposed and what's actually confirmed. Journey Map and Segmentation Framework stay separate analytical documents by decision, feeding summarized conclusions into the SOP rather than being absorbed. Master Execution Sequence and Deliverables Register updated to match. Added real clickable links between documents (underlined text) in place of plain text mentions, in the guide, sequence, deliverables, current-state, playbook, and interview guide pages."}, {"date": "v5.0", "title": "Sarthy's Playbook 2.0 fully absorbed and retired", "desc": "Partnership SOP v1.0 expanded from 13 to 21 sections, pulling in the complete content of Sarthy's original Playbook 2.0 - the credit wallet system, the six credit rules, the full lead referral flow, conversion and dispute logic, partner responsibilities, abuse guardrails, the FAQ, and the closing note. That source document is now retired; nothing about the program's design lives outside this SOP anymore. Genuinely unresolved numbers (withdrawal deduction timing, cycle length, negative balance policy) are flagged inline and linked to the Phase 0 Discussion Doc rather than left ambiguous. Updated the guide's dependency map to match the new section numbers."}, {"date": "v6.0", "title": "Working assumptions recorded across most open questions", "desc": "Lead answered most of the open Phase 0 questions as working assumptions (explicitly not yet confirmed by Sarthy). Updated: fees/GST (Section 5), credit expiry and cap (Section 6), lead validation timing, cancellation, duplicates, repeated declines, re-referral limits (Section 7), negative balance policy (Section 8), conversion criteria (Section 9), and a full rework of withdrawal logic from a fixed-cycle model to ongoing membership with a minimum reserve and quarterly withdrawal (Section 10). Proposed concrete measures for the two undefined KPIs - Match-Making and Research & Reports (Section 19). Flagged one bigger structural idea (automatic lead-pool matching instead of partner-to-partner referral) as a separate future decision, not folded into the current rules. Phase 0 Discussion Doc updated to point to each recorded assumption rather than showing stale fully-open questions."}, {"date": "v6.1", "title": "Money mechanics tightened up", "desc": "Corrected the 9% fee to apply at credit-transfer time (on conversion), not at withdrawal - flows through Sections 6, 7, 8, and 10 consistently. Programme switching locked permanently at sign-up. Goodwill/coupon credits now expire at exactly 30 days. Negative balance can run to -3,000 before the account freezes, requiring replenishment to +999 to unfreeze. Credit count resolved as currency-neutral - 999 never reprices; real currency only enters at the point of withdrawal, using that day's live exchange rate."}, {"date": "v6.2", "title": "Lead-tracking windows, rollout target, and admin ownership confirmed", "desc": "Acknowledgment window set to 3 days, stall window to 1 week (Section 7) - what happens at a stall is still open, re-clarified with the Lead. Section 18 now has Sarthy's real rollout target: 10 active partners within 2 weeks of full launch. Current-State Assessment refined to note existing Alpha users are infrequent, not active. Phase 0 doc updated: dispute handling and bug/feature routing both go to admin, with follow-up detail still needed on each. Feature inventory (live vs. planned) deferred as an action item pending portal access, not guessed at."}, {"date": "v7.0", "title": "Business Requirements Document drafted; more money mechanics closed", "desc": "Pulled the BRD forward in the sequence and drafted its first version - a full To-Be requirements list built directly from Partnership SOP v1.0, organized by module, with an open-decisions log carried forward. Resolved: 9% fee charged once at transfer, not again at withdrawal. Negative-balance top-up priced at 3x entry fee (2,997 credits) - flagged a real numbers gap at the -3,000 floor rather than smoothing over it. Dispute SLA set to 24-hour admin response. Stall-handling recorded as an open proposal (admin discretion plus startup confirmation as evidence), not a final decision. Clarified the 9% fee's relationship to the older 10% direct referral-fee flow, left open. Broadened the dependency map so the BRD is checked against any SOP change, not just confirmations."}, {"date": "v8.0", "title": "Second reward track discovered and documented - deal-closure referral fee", "desc": "The Lead clarified there are two separate reward systems: the 999-point lead-share credit (Sections 5-10) and a previously-undocumented 10% deal-closure referral fee, paid annually, with a 1-year tail. Added as new Section 20 (referral fee) and Section 21 (dormancy rule - 3 months inactive), pushing FAQ to 22 and Closing to 23. This resolved the oldest open question in the project: the 9% facilitation fee applies to both tracks, on the 10% entitlement for referral fees. Fixed a real inconsistency: Sections 15 and 17 had empty placeholders while their actual content had been written into Section 7 - moved it to the right place. Corrected the negative-balance numbers (-2,997 floor, 4x999 top-up) which now land exactly on +999, fixing the math gap flagged two rounds ago. Simplified the acknowledgment/stall system from two separate windows (3 days, 1 week) to one unified 1-week window. Updated the BRD to match throughout, adding its own new Sections 8-9 for the same two topics."}, {"date": "v9.0", "title": "Five documents drafted in one push - Gap & Risk Register, Segmentation, Journey Map, Comms Library, Graduation Criteria", "desc": "Per the Lead's decision to keep building rather than wait on the Sarthy meeting. Fixed a real bookkeeping gap along the way: Partner Journey Map had been referenced throughout the hub since the very beginning but was never actually added to the queued list - added retroactively before drafting it. Partnership SOP v1.0 Sections 11, 14, 16, 17, and 18 all updated from pending placeholders or generic mentions to real links, now that the documents they were waiting on exist. 14 of 19 total documents now drafted."}, {"date": "v9.1", "title": "Data Dictionary drafted", "desc": "Defined every entity used across the SOP and BRD - Partner, Credit Wallet, Lead, Deal, Dispute - with precise status definitions (the difference between At-Risk, Dormant, and Frozen matters and wasn't spelled out clearly before). 15 of 19 documents now drafted. Pacing deliberately from here rather than drafting the remaining four in one push."}, {"date": "v10.0", "title": "Switched to a collapsible left sidebar", "desc": "Replaced the two-tier top navigation with a left sidebar where each category expands and collapses independently - handles the growing document count (19 total now) much better than wrapping tabs. The category containing whatever document is open stays expanded automatically; others start collapsed. Tooltips now appear to the side instead of below, to fit the narrower layout."}, {"date": "v10.1", "title": "Sidebar now hover-out, with a pin option", "desc": "The sidebar tucks away to a thin 14px edge strip by default and slides fully into view on hover - no longer takes up permanent screen width. Added a pin button (top of the sidebar) for anyone who wants it to stay open without holding the mouse there. On mobile/touch screens, where hover doesn't apply, it falls back to the normal static stacked layout instead."}];
const CATS_ORDER = ["Start Here", "Strategic Planning", "Partnership SOP v1.0", "Decision Records", "Evidence & Assessment", "Operational Tools", "Scripts & Templates", "Technical Handoff", "Tracking & Governance"];
const CAT_DESC = {"Start Here": "How to find your way around this hub, and how updates are meant to flow", "Strategic Planning": "The overall project plan and the order we're doing things in", "Partnership SOP v1.0": "The day-to-day rulebook - how partners are onboarded, supported, and managed", "Decision Records": "Questions we need Sarthy to answer before we can move forward", "Evidence & Assessment": "What we found by studying how things work today, and what's broken", "Operational Tools": "The internal tools and data setup we use to run day-to-day work", "Scripts & Templates": "Ready-to-use scripts for calls, messages, and interviews", "Technical Handoff": "Documents we hand to Sarthy's developers to build the marketplace", "Tracking & Governance": "How we track rollout progress and report results to Sarthy"};

let activeCat = "Strategic Planning";
let expandedCats = new Set(["Strategic Planning"]);

function statusBadge(status){
  if(status==="done") return '<span class="badge badge-done">Confirmed</span>';
  if(status==="draft") return '<span class="badge badge-draft">Draft</span>';
  return '<span class="badge badge-pending">Pending</span>';
}
function dotClass(status){
  if(status==="done") return "dot-done";
  if(status==="draft") return "dot-draft";
  return "dot-pending";
}

function buildSidebar(activeId){
  const done = DOCS.length, total = DOCS.length + QUEUED.length;
  const pct = Math.round((done/total)*100);

  let html = `<div class="sidebar-header">
    <div class="brand" onclick="showDoc('guide')">Strategic Partners Playbook 3.0</div>
    <div class="progress-mini">${done} of ${total} drafted (${pct}%)</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;

  let catNum = 0;
  CATS_ORDER.forEach(cat => {
    const docsInCat = DOCS.filter(d=>d.cat===cat);
    const queuedInCat = QUEUED.filter(q=>q.cat===cat);
    const total_in_cat = docsInCat.length + queuedInCat.length;
    if(total_in_cat===0) return;
    catNum++;
    const isOpen = expandedCats.has(cat);
    const isActiveCat = cat===activeCat;
    const tip = (CAT_DESC[cat] || '').replace(/"/g, '&quot;');

    html += `<div class="cat-block">
      <div class="cat-header ${isActiveCat?'active-cat':''}" data-tip="${tip}" onclick="toggleCat('${cat}')">
        <span class="chevron ${isOpen?'open':''}">&#9656;</span>
        <span class="tab-num">${catNum}</span>
        <span>${cat}</span>
        <span class="cat-count">${docsInCat.length}/${total_in_cat}</span>
      </div>
      <div class="cat-body ${isOpen?'open':''}">`;

    let docNum = 0;
    docsInCat.forEach(d=>{
      docNum++;
      const cls = d.id===activeId ? 'doc-link active' : 'doc-link';
      const dtip = (d.desc || '').replace(/"/g, '&quot;');
      html += `<div class="${cls}" data-tip="${dtip}" onclick="showDoc('${d.id}')"><span class="tab-num-sm">${docNum}</span><span class="dot ${dotClass(d.status)}"></span>${d.title}</div>`;
    });
    queuedInCat.forEach(q=>{
      docNum++;
      const dtip = (q.desc || '').replace(/"/g, '&quot;');
      html += `<div class="doc-link disabled" data-tip="${dtip}"><span class="tab-num-sm">${docNum}</span><span class="dot dot-pending"></span>${q.title}</div>`;
    });

    html += `</div></div>`;
  });

  html += `<div class="changelog-link" onclick="showChangelog()">Version history</div>`;
  document.getElementById('sidebarContent').innerHTML = html;
}

function toggleCat(cat){
  if(expandedCats.has(cat)) expandedCats.delete(cat);
  else expandedCats.add(cat);
  activeCat = cat;
  buildSidebar(currentDocId);
}

let currentDocId = null;

function renderEmpty(cat){
  document.getElementById('main').innerHTML = `<div class="crumb">${cat}</div><div class="doc-header"><h1 class="doc-title">Not yet drafted</h1></div><div class="pending-box">Everything in this category is still queued. Check Master Execution Sequence for build order.</div>`;
}

function showDoc(id){
  const d = DOCS.find(x=>x.id===id);
  if(!d) return;
  activeCat = d.cat;
  currentDocId = id;
  expandedCats.add(d.cat);
  buildSidebar(id);
  document.getElementById('main').innerHTML = `
    <div class="crumb">${d.cat}</div>
    <div class="doc-header">
      <h1 class="doc-title">${d.title}</h1>
      <div class="meta-row">${statusBadge(d.status)}<span class="meta-text">v${d.version}</span><span class="meta-text">.</span><span class="meta-text">${d.type}</span><span class="meta-text">.</span><span class="meta-text">${d.updated}</span></div>
    </div>
    <div class="content">${d.html}</div>
  `;
  window.scrollTo(0,0);
}

function showChangelog(){
  currentDocId = null;
  buildSidebar(null);
  let items = CHANGELOG.map(c=>`<div class="cl-item"><div class="cl-date">${c.date}</div><div class="cl-body"><strong>${c.title}</strong><span>${c.desc}</span></div></div>`).join("");
  document.getElementById('main').innerHTML = `<div class="crumb">Project hub</div><div class="doc-header"><h1 class="doc-title">Version history</h1><div class="meta-row"><span class="meta-text">Every structural change to this hub, logged here</span></div></div><div class="content">${items}</div>`;
  window.scrollTo(0,0);
}

showDoc('guide');
</script>
