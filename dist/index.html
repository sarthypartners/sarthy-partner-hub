<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Partners Playbook 3.0 - Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#211f1c; --ink-soft:#5c5850; --ink-faint:#948e83;
  --paper:#FFFFFF; --panel:#FFFFFF; --line:#E4DFD6; --line-strong:#CFC8BA;
  --surface-tint:#F3F1EA;
  --sidebar:#FFFFFF; --sidebar-line:#E4DFD6; --sidebar-text:var(--ink); --sidebar-text-dim:var(--ink-soft);
  --accent:#5B6E4F; --accent-soft:#E7ECDF;
  --green:#3F7D4A; --green-bg:#E5F0E2;
  --amber:#A6740F; --amber-bg:#FAF0DB;
  --red:#B14A3E; --red-bg:#F8E5E1;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
.app{display:flex;min-height:100vh;}
.sidebar{width:290px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:1rem;}
.sidebar-header{padding:1.5rem 1.25rem 1rem;border-bottom:1px solid var(--sidebar-line);}
.search-box{width:100%;margin-top:12px;padding:7px 10px;background:var(--surface-tint);border:1px solid var(--line-strong);border-radius:7px;color:var(--ink);font-size:12.5px;font-family:'Inter',sans-serif;}
.search-box::placeholder{color:var(--sidebar-text-dim);}
.search-box:focus{outline:none;border-color:var(--accent);}
.no-match{padding:10px 1.25rem;font-size:12px;color:var(--sidebar-text-dim);font-style:italic;}
.brand{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.3;}
.progress-mini{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sidebar-text-dim);margin-top:4px;}
.progress-track{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;}
.cat-block{border-bottom:1px solid var(--line);}
.cat-header{display:flex;align-items:center;gap:9px;padding:11px 1.25rem;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);user-select:none;}
.cat-header:hover{background:var(--surface-tint);}
.cat-header.active-cat{background:var(--accent-soft);}
.chevron{font-size:9px;color:var(--sidebar-text-dim);width:10px;flex-shrink:0;transform:rotate(90deg);}
.tab-num{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--line);color:var(--ink-soft);width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header.active-cat .tab-num{background:var(--accent);color:#FFFFFF;}
.cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sidebar-text-dim);}
.doc-link{display:flex;align-items:center;gap:8px;padding:8px 1.25rem 8px 2.5rem;font-size:12.5px;color:var(--sidebar-text-dim);cursor:pointer;}
.doc-link:hover{background:var(--surface-tint);color:var(--sidebar-text);}
.doc-link.active{background:var(--accent-soft);color:var(--ink);font-weight:600;border-left:2px solid var(--accent);padding-left:calc(2.5rem - 2px);}
.doc-link.disabled{cursor:default;opacity:.55;}
.tab-num-sm{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--sidebar-text-dim);flex-shrink:0;}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-done{background:var(--green);}
.dot-draft{background:var(--amber);}
.dot-pending{background:var(--ink-faint);}
.changelog-link{display:flex;align-items:center;gap:8px;padding:11px 1.25rem;font-size:12.5px;color:var(--sidebar-text-dim);cursor:pointer;border-top:1px solid var(--sidebar-line);margin-top:6px;}
.changelog-link:hover{color:var(--ink);}
.main{flex:1;max-width:840px;padding:3rem 2rem 5rem;min-width:0;}
.crumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.doc-header{border-bottom:1px solid var(--line);padding-bottom:1.25rem;margin-bottom:1.75rem;}
.doc-title{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:0 0 8px;line-height:1.15;}
.meta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;}
.badge-done{background:var(--green-bg);color:var(--green);}
.badge-draft{background:var(--amber-bg);color:var(--amber);}
.badge-pending{background:var(--red-bg);color:var(--red);}
.meta-text{font-size:12px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.content{font-size:15px;line-height:1.75;color:var(--ink);}
.content h2{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:2rem 0 .75rem;padding-top:.5rem;}
.content h2:first-child{margin-top:0;}
.content p{margin:0 0 1rem;color:var(--ink-soft);}
.content ul,.content ol{margin:0 0 1rem;padding-left:1.3rem;color:var(--ink-soft);}
.content li{margin-bottom:5px;}
.content strong{font-weight:600;color:var(--ink);}
a.xlink{color:var(--accent);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px;cursor:pointer;font-weight:500;}
a.xlink:hover{text-decoration-color:var(--accent);}
table.dtable{width:100%;border-collapse:collapse;margin:0 0 1.5rem;font-size:13px;}
table.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);border-bottom:1px solid var(--line-strong);padding:7px 10px 7px 0;font-weight:500;}
table.dtable td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-soft);}
table.dtable td:first-child,table.dtable th:first-child{color:var(--ink);font-weight:500;}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin:0 0 1.25rem;font-size:13.5px;color:#3F4D36;}
.pending-box{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.example-box{background:#EDF2F7;border-left:3px solid #3E6B96;border-radius:0 8px 8px 0;padding:14px 16px;margin:0 0 1.25rem;font-size:13.5px;color:var(--ink-soft);}
.example-box strong:first-child{color:#3E6B96;}
.amt-pos{color:var(--green);font-weight:600;}
.amt-neg{color:var(--red);font-weight:600;}
.amt-fee{color:var(--amber);font-weight:600;}
.toc-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.5rem;margin:0 0 1.75rem;}
.toc-box h3{margin:0 0 .6rem;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:600;}
.toc-list{columns:2;column-gap:1.5rem;list-style:none;padding:0;margin:0;font-size:13px;}
.toc-list li{margin-bottom:5px;break-inside:avoid;}
.toc-list a{color:var(--ink-soft);text-decoration:none;}
.toc-list a:hover{color:var(--accent);text-decoration:underline;}
.gantt{margin:1rem 0 1.5rem;}
.gantt-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.gantt-label{width:170px;flex-shrink:0;font-size:12.5px;color:var(--ink);font-weight:500;}
.gantt-track{flex:1;height:26px;background:var(--surface-tint);border-radius:5px;position:relative;border:1px solid var(--line);}
.gantt-bar{position:absolute;top:0;height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;}
.gantt-done{background:var(--green);}
.gantt-progress{background:var(--amber);}
.gantt-todo{background:var(--line-strong);color:var(--ink-faint);}
.gantt-axis{display:flex;gap:12px;margin:0 0 6px;padding-left:182px;font-size:10px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.cl-item{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
.cl-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);width:100px;flex-shrink:0;padding-top:2px;}
.cl-body strong{display:block;margin-bottom:2px;}
.cl-body span{font-size:13px;color:var(--ink-soft);}
[data-tip]{position:relative;}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:50%;left:100%;transform:translateY(-50%);margin-left:10px;z-index:20;background:#12140F;color:#E9E7DD;font-family:'Inter',sans-serif;font-size:12px;font-weight:400;line-height:1.45;padding:8px 11px;border-radius:8px;width:max-content;max-width:220px;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;}
[data-tip]:hover::before{content:"";position:absolute;top:50%;left:100%;transform:translateY(-50%);margin-left:2px;border:5px solid transparent;border-right-color:#12140F;z-index:20;pointer-events:none;}
@media(max-width:900px){.app{flex-direction:column;}.sidebar{position:static;height:auto;width:100%;}.main{padding:2rem 1.25rem 4rem;max-width:none;}[data-tip]:hover::after,[data-tip]:hover::before{display:none;}}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div id="sidebarContent"></div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
const DOCS = [{"id": "guide", "content_file": "guide.html", "cat": "Start Here", "status": "done", "version": "3.5", "updated": "Restored Migration Wave Plan references in the dependency table - the document was un-decommissioned.", "type": "Both", "title": "How to use this hub", "desc": "Read this first - how to navigate, and how updates are meant to flow through the other pages", "html": "<p class=\"callout\">This page explains two things: how to move around this hub, and what to check whenever a change on one page affects another.</p>\n\n<h2>How to move around</h2>\n<ul>\n  <li>The left sidebar is split into categories, like \"Business Documents\" or \"Technical Documents.\"</li>\n  <li>Each category has a number, showing a suggested reading order. There's no need to follow it strictly - jump to whatever needs work right now.</li>\n  <li>Every document in a category is always visible. Nothing needs to be clicked open first.</li>\n  <li>Hovering over a category or document name pops up a short note on what's inside.</li>\n  <li>Each document has a colored dot. Green means finished and confirmed. Amber means drafted, but still needs sign-off. Grey means it hasn't been written yet.</li>\n  <li>Underlined text inside a document is a real link. Clicking it jumps straight to that document.</li>\n  <li>\"Version history,\" at the bottom of the sidebar, lists every change made to the hub.</li>\n</ul>\n\n<h2>A structural limit worth knowing</h2>\n<p>This hub is a single file, not a smart system. It can't notice on its own when a change in one document should also change another.</p>\n<p>The fix is a standing habit: whenever a document changes, check its row in the table below. Fix what needs fixing, in the same sitting.</p>\n\n<h2>How the Playbook is organized</h2>\n<p><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> is the main rulebook. It covers how partners join, stay engaged, get grouped, and get help when something goes wrong.</p>\n<p>A few documents stay separate on purpose:</p>\n<ul>\n  <li>The <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> holds ready-to-use scripts, not rules.</li>\n  <li>The User Journey Map and Segmentation Framework hold research and analysis. They feed into the SOP. They are not the SOP itself.</li>\n  <li>The technical documents are written for developers, not for partners or Sarthy staff.</li>\n</ul>\n<p>For why the Playbook is structured this way, or what it used to look like, see <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.</p>\n\n<h2>Keeping the dependency table current</h2>\n<ul>\n  <li>Whenever something in the left column of the table below changes, the right column needs checking too. Fix what needs fixing, or confirm nothing needed to change.</li>\n  <li>Every structural change gets a note in Version History.</li>\n  <li>Any new connection between documents that isn't in the table yet gets added.</li>\n</ul>\n\n<h2>Flagging changes made outside this process</h2>\n<ul>\n  <li>Any change made without going through this table should still be logged in Version History, so the table above stays accurate.</li>\n  <li>An amber or grey dot is a reminder that something else in the hub might still be waiting on it.</li>\n</ul>\n\n<h2>Which documents affect which others</h2>\n<p>How to read this: a change to the item in the left column means the item in the right column needs checking too, before the update is finished.</p>\n<table class=\"dtable\">\n  <tr><th>If this changes...</th><th>...check this too</th></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 Discussion Doc</a></td><td>Partnership SOP v1.0 - Sections 5-10, 13, 19, 20</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Current-State Assessment</a></td><td>Gap & Risk Register, Partner Segmentation Framework, User Journey Map</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">Gap & Risk Register</a></td><td>Partnership SOP v1.0's problem-related sections, Master Execution Sequence</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a></td><td>The <a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a> - it uses these exact field definitions</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a></td><td>Partnership SOP v1.0 Sections 11 and 17, <a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Migration Wave Plan</a>, Interim Operating System, <a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a> - its Stage 6 rows cite the outreach-priority table directly</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a></td><td>Partnership SOP v1.0 Sections 16 and 17, <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> - Findings 1 and 2 cite specific message triggers directly; <a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a> - its matrix cites the same 11 triggers directly</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Sections 20 or 21</td><td>Business Requirements Document Sections 8 and 9</td></tr>\n  <tr><td>Any section of <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a></td><td>Business Requirements Document - check it didn't go stale</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Business Requirements Document</a></td><td><a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a>, Action Item & Blocker Tracker</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a></td><td><a href=\"#\" onclick=\"showDoc('replit-build-brief');return false;\" class=\"xlink\">Replit Build Brief</a> - keep both in sync if the state machines or formulas change; <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> - its Lead state machine underpins every stage</td></tr>\n  <tr><td>Partnership SOP v1.0 Section 19, if the KPI measures change</td><td><a href=\"#\" onclick=\"showDoc('reporting-dashboard');return false;\" class=\"xlink\">Reporting Dashboard</a> and BRD Section 13 - both cite the measures directly</td></tr>\n  <tr><td>Partnership SOP v1.0 Section 8's wallet-threshold diagram</td><td>Data Dictionary and <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a> - both point to it instead of redrawing it</td></tr>\n  <tr><td>Partnership SOP v1.0 Section 7 (the 3-direction connection flow, formerly the Path A / Path B diagram)</td><td><a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Business Requirements Document</a> Section 5 and Data Dictionary - both point to it instead of redrawing it; <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a> Section A Stage 1, Finding 1, and the stage table have been updated to match; <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> describes the same confirmed rule in more detail - keep both in sync</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a></td><td>Section A is diagnostic only - once actual engagement fixes are designed, check them back against its three findings first; the <a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a> is built directly from it. Sections B/C feed Partnership SOP v1.0 Section 14 and the Communication Template Library (absorbed from the retired Partner Journey Map) - both were updated together for the confirmed 3-direction model</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('engagement-strategy');return false;\" class=\"xlink\">Engagement Strategy Framework</a></td><td>Nothing yet - framework only. Once specific message wording or a new tracking field is drafted from its \"Proposed\" rows, those go straight into Communication Template Library / Data Dictionary / Partnership SOP v1.0</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> (confirmed)</td><td>Partnership SOP v1.0 Section 7, <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a>'s Lead state machine, Data Dictionary's Lead table, Business Requirements Document, User Journey Map - all 5 already updated together when this was confirmed; re-check them if this page changes again</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">Interview Guide</a></td><td><a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a> (where raw call notes get logged), <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Current-State Assessment</a> and Gap & Risk Register (where a recurring theme across several interviews gets folded in)</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Alpha to Beta Graduation Criteria</a></td><td><a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Migration Wave Plan</a> (Wave 2 gate mismatch flagged, deliberately not reconciled - migration is deferred to post-build), Partnership SOP v1.0 Section 18</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Interim Operating System</a></td><td>Action Item & Blocker Tracker</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item & Blocker Tracker</a></td><td>Gap & Risk Register, Business Requirements Document</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('glossary');return false;\" class=\"xlink\">Glossary</a></td><td>Nothing depends on it, but it depends on everything - check it hasn't gone stale</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('sequence');return false;\" class=\"xlink\">Master Execution Sequence</a>, if reordered</td><td>This table</td></tr>\n  <tr><td>Partnership SOP v1.0 Section 2 or Section 10</td><td><a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a> - both sections point there for the full story</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>, if edited</td><td>Partnership SOP Sections 2 and 10, and the Sequence page - confirm their pointer links still make sense</td></tr>\n</table>\n"}, {"id": "roadmap", "content_file": "roadmap.html", "cat": "Tracking & Governance", "status": "done", "version": "1.5", "updated": "Absorbed the Gantt view's role as the single timeline - added a Status column (Done/In Progress/Not started) and the What Done Means note, following Gantt's decommissioning.", "type": "Internal", "title": "Project Roadmap", "desc": "The full project plan - each phase, who owns it, and rough timing", "html": "<p class=\"callout\">This is the big-picture plan - the phases of work, who's responsible for each, roughly how long each should take, and honestly where each one actually stands. This is now the single timeline view for the project - a separate Gantt-chart version used to exist alongside this table but was retired for duplicating it; see <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History &amp; Decisions</a>.</p>\n\n<div class=\"pending-box\" style=\"text-align:left;\">\n<strong>What \"Done\" means below:</strong> documentation and design work complete - the SOP is written, the requirements exist, the process is defined. It does <strong>not</strong> mean partners have actually been onboarded in the real world yet - that's Phase 5, and it's genuinely not started. For the specific real-world blockers behind why Phase 0 and Phase 4 are still In Progress, and why Phase 5 hasn't started, see the <a href=\"#\" onclick=\"showDoc('action-tracker');return false;\" class=\"xlink\">Action Item &amp; Blocker Tracker</a>.\n</div>\n\n<h2>The plan at a glance</h2>\n<table class=\"dtable\"><tr><th>Phase</th><th>What it covers</th><th>Who owns it</th><th>Rough timing</th><th>Status</th></tr>\n<tr><td>0</td><td>Getting the basics settled with Sarthy before any design work begins</td><td>Lead (needs Sarthy's input)</td><td>Weeks 1-2</td><td><span class=\"badge badge-draft\">In Progress</span> - real Sarthy meeting still unscheduled</td></tr>\n<tr><td>1</td><td>Writing down how things work and should work</td><td>Lead, Associate helps</td><td>Weeks 1-5</td><td><span class=\"badge badge-done\">Done</span></td></tr>\n<tr><td>2</td><td>Redesigning how partners are onboarded and kept engaged</td><td>Lead</td><td>Weeks 4-7</td><td><span class=\"badge badge-done\">Done</span></td></tr>\n<tr><td>3</td><td>Building a simple working system to use meanwhile</td><td>Lead + Associate</td><td>Weeks 3-6</td><td><span class=\"badge badge-done\">Done</span></td></tr>\n<tr><td>4</td><td>Writing the requirements document for the marketplace app</td><td>Lead</td><td>Weeks 6-10</td><td><span class=\"badge badge-draft\">In Progress</span> - BRD still needs gap-mapping against the real Alpha build</td></tr>\n<tr><td>5</td><td>Moving partners onto the platform, group by group</td><td>Lead + Associate</td><td>From week 8 onward</td><td><span class=\"badge badge-pending\">Not started</span></td></tr>\n<tr><td>6</td><td>The regular rhythm of running this program week to week</td><td>Lead + Associate</td><td>From week 1, ongoing</td><td><span class=\"badge badge-draft\">Ongoing</span></td></tr>\n</table>\n\n<h2>What has to happen before what</h2>\n<ul>\n  <li>The requirements document (Phase 4) can't be finished until Sarthy answers the open questions (Phase 0). Otherwise, requirements would be written around rules that might still change.</li>\n  <li>Moving the later groups of partners onto the platform (Phase 5) depends on Phase 2 actually being finished - not just written down, but ready to use.</li>\n  <li>The simple working system (Phase 3) is what lets two people run Phases 1, 2, and 5 without drowning in manual work.</li>\n  <li>Phase 6 is the weekly rhythm of running things. It should start from day one, even before Phase 0 wraps up.</li>\n</ul>\n\n<h2>How progress gets reported to Sarthy</h2>\n<p>This uses Sarthy's own scorecard, so updates match how they already think about this work.</p>\n<table class=\"dtable\"><tr><th>What Sarthy measures</th><th>How much it counts</th></tr>\n<tr><td>Finding and signing up partners</td><td>20%</td></tr>\n<tr><td>Talking to and supporting startups</td><td>40%</td></tr>\n<tr><td>Matching the right partner to the right startup</td><td>30%</td></tr>\n<tr><td>Research and reporting</td><td>10%</td></tr>\n</table>\n<p>How each one is actually measured lives in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 19</a>. Two examples: \"Talking to and supporting startups\" is measured by call volume and outcomes together, not just how many calls happened. \"Matching partners to startups\" is measured by how many leads get matched each month, and how evenly they spread across the partner base.</p>\n"}, {"id": "sequence", "content_file": "sequence.html", "cat": "Tracking & Governance", "status": "done", "version": "1.6", "updated": "Restored the item 14 link to Migration Wave Plan - un-decommissioned.", "type": "Internal", "title": "Master Execution Sequence", "desc": "The to-do list in order - what gets done next, and why", "html": "<p class=\"callout\">This is the working order - each item's output is used by the next, so the list is mostly worked top to bottom rather than jumped around. Status for each document lives on its tab in the sidebar (the colored dot) - this page is about the order and the reasoning, not restating what's already shown there.</p>\n<table class=\"dtable\">\n<tr><th>#</th><th>What's being built</th></tr>\n<tr><td>1</td><td><a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Questions to resolve with Sarthy</a></td></tr>\n<tr><td>1b</td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">First draft of Partnership SOP v1.0</a></td></tr>\n<tr><td>1c</td><td><a href=\"#\" onclick=\"showDoc('deliverables');return false;\" class=\"xlink\">List of every document in the project</a></td></tr>\n<tr><td>2</td><td>Getting access to Sarthy's systems - still waiting on this. Unlocks a real feature inventory once done - see <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 Discussion Doc</a>.</td></tr>\n<tr><td>3</td><td><a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">Guide for interviewing the first live partners</a></td></tr>\n<tr><td>4</td><td><a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Write-up of how things work today</a></td></tr>\n<tr><td>5</td><td><a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">List of problems found, with fixes</a></td></tr>\n<tr><td>6</td><td><a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Shared definition of what each piece of partner data means</a></td></tr>\n<tr><td>7</td><td><a href=\"#\" onclick=\"showDoc('interim-system');return false;\" class=\"xlink\">Simple working system for day-to-day use</a></td></tr>\n<tr><td>8</td><td><a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Way of grouping partners by priority</a></td></tr>\n<tr><td>9</td><td><a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">Map of the partner's journey, start to finish</a> - now part of the User Journey Map, alongside the multi-party referral timeline</td></tr>\n<tr><td>10</td><td><a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Ready-made messages for calls and follow-ups</a></td></tr>\n<tr><td>11</td><td>Filled in the remaining <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> sections directly - joining, staying in touch, winning back inactive partners, and handling disagreements</td></tr>\n<tr><td>12</td><td><a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Requirements document for the marketplace app</a></td></tr>\n<tr><td>13</td><td><a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Targets to hit before opening the app more widely</a></td></tr>\n<tr><td>14</td><td><a href=\"#\" onclick=\"showDoc('migration-wave-plan');return false;\" class=\"xlink\">Plan for which partners move onto the app first</a></td></tr>\n<tr><td>15</td><td><a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Detailed technical spec for developers</a></td></tr>\n<tr><td>15b</td><td><a href=\"#\" onclick=\"showDoc('replit-build-brief');return false;\" class=\"xlink\">Replit-specific build brief</a> - added once the build platform was confirmed</td></tr>\n<tr><td>16</td><td><a href=\"#\" onclick=\"showDoc('reporting-dashboard');return false;\" class=\"xlink\">Simple dashboard tracking progress</a></td></tr>\n</table>\n<h2>Why this order</h2>\n<p>The first several items (1-7) are about learning what's true today, instead of guessing. Items 8-11 turn what was learned into one clear rulebook: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a>. Each one was written directly into its own section, not as a separate document that gets summarized afterward. The last items (12-16) put that rulebook into action and measure whether it's working.</p>\n<p style=\"font-size:12.5px;color:var(--ink-faint);\">Curious why item 11 covers four different things, or why three documents in the hub don't have numbers here? See <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.</p>\n"}, {"id": "playbook", "content_file": "playbook.html", "cat": "Business Documents", "status": "draft", "version": "7.7", "updated": "Section 7 rewritten - the Connection Request Flow (3 directions, admin-mediated consent, no auto-expiry) is now the authoritative rule, replacing the old two-path/self-service-acknowledgment model.", "type": "Both", "title": "Partnership SOP v1.0", "desc": "The complete rulebook - fully absorbs Sarthy's original Playbook 2.0, nothing lives outside this anymore", "html": "<p class=\"callout\">This is the complete rulebook for how the partner program runs. Each section has a colored tag showing its status: green means confirmed, amber means drafted and still waiting on Sarthy's sign-off. If something is unresolved, it's in a short note at the end of that section - the <a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">Gap & Risk Register</a> and <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 Discussion Doc</a> hold the full list in one place. For the history behind this document, see <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.</p>\n\n<div class=\"pending-box\" style=\"text-align:left;border-style:solid;border-color:var(--accent);background:var(--accent-soft);\">\n<strong>Quick summary, if you only read one thing:</strong> Sarthy connects startups with vetted service partners across Marketing, Finance, Legal, Technology, and Strategy. A partner joins by paying a small fee (\u20b9999 in India, $49 internationally) and gets 999 starting credits.</p>\n<p>From there, two rewards exist side by side. First: a partner shares a lead with another partner. Once it converts, the referrer earns 999 credits, minus Sarthy's 9% fee. Second: if that lead becomes a real signed deal, the referrer also earns 10% of the deal's value, minus Sarthy's 9% cut of that, paid out once a year.</p>\n<p>Paid credits never expire. Receiving a lead always costs 999 credits. A balance can only run negative so far before the account freezes.</p>\n<p>Leads must be genuine. Disputes go through the admin within a day. Going quiet for 3 months puts an account to sleep until the partner comes back.</p>\n<p>A few smaller details are still open - the exact design of the startup-confirmation form for disputed reversals, and specific gamification mechanics for staying active. Each one is flagged where it comes up below.\n</div>\n\n<div class=\"toc-box\">\n<h3>Jump to a section</h3>\n<ul class=\"toc-list\">\n  <li><a href=\"#s1\">1. What this document is for</a></li>\n  <li><a href=\"#s2\">2. Where this program came from</a></li>\n  <li><a href=\"#s3\">3. Who does what</a></li>\n  <li><a href=\"#s4\">4. What partners get out of joining</a></li>\n  <li><a href=\"#s5\">5. Joining the program</a></li>\n  <li><a href=\"#s6\">6. The credit wallet</a></li>\n  <li><a href=\"#s7\">7. How a lead moves between partners</a></li>\n  <li><a href=\"#s8\">8. The six credit rules</a></li>\n  <li><a href=\"#s9\">9. Conversion & disputes</a></li>\n  <li><a href=\"#s10\">10. Withdrawing credits</a></li>\n  <li><a href=\"#s11\">11. Giver, Taker, or Balanced</a></li>\n  <li><a href=\"#s12\">12. What partners are expected to do</a></li>\n  <li><a href=\"#s13\">13. Guardrails against abuse</a></li>\n  <li><a href=\"#s14\">14. The partner's day-to-day experience</a></li>\n  <li><a href=\"#s15\">15. Staying engaged</a></li>\n  <li><a href=\"#s16\">16. Ready-made messages</a></li>\n  <li><a href=\"#s17\">17. Winning back inactive partners</a></li>\n  <li><a href=\"#s18\">18. Early testing to full rollout</a></li>\n  <li><a href=\"#s19\">19. How success is measured</a></li>\n  <li><a href=\"#s20\">20. After the deal closes - referral fee</a></li>\n  <li><a href=\"#s21\">21. Staying an active partner</a></li>\n  <li><a href=\"#s22\">22. Frequently asked questions</a></li>\n  <li><a href=\"#s23\">23. Closing note</a></li>\n</ul>\n</div>\n\n<h2 id=\"s1\">1. What this document is for <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>This document explains how partners join, how money and credits work, how partners stay engaged, how they're grouped, and what to do when something goes wrong. It does not cover building the marketplace app itself - that's the developers' job.</p>\n\n<h2 id=\"s2\">2. Where this program came from, and why it changed <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>Sarthy has worked closely with early-stage and growth-stage startups for years. They kept seeing the same problem. A startup's biggest obstacle usually isn't ambition - it's not knowing the right professional help at the right time. The partner program exists to close that gap.</p>\n<p>Any partner can refer business to any other partner, and Sarthy tracks the whole exchange. Full history on how this design came about is in <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.</p>\n\n<h2 id=\"s3\">3. Who does what <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p><strong>Lead</strong> handles the overall plan, writing things down, reporting to Sarthy, writing the technical requirements, and deciding how to handle problems. <strong>Associate</strong> makes calls, enters data, and does the first round of follow-up with partners. <strong>Sarthy</strong> decides the money rules, the app's roadmap, and how success is measured. Sarthy also stays involved as the programme's referee - every lead exchange runs through Sarthy's tracking, never directly between partners.</p>\n\n<h2 id=\"s4\">4. What partners actually get out of joining <span class=\"status-pill badge-done\">confirmed</span></h2>\n<ul>\n<li>Access to Sarthy's own base of early-stage and growth-stage startup clients</li>\n<li>The right to send qualified leads to any other partner and earn credits when those leads convert</li>\n<li>Incoming leads from other partners - a second source of new business beyond their own outreach</li>\n<li>Transparent tracking - leads, conversions, and credits are all managed by Sarthy, not left to informal trust</li>\n<li>A chance to be featured as Partner of the Month, a recognition program showcasing partner work to Sarthy's whole startup network</li>\n<li>A listing in Sarthy's partner directory, with their case study and profile visible to startups</li>\n</ul>\n<p>A partner who consistently sends leads that convert builds up real value. A partner who only ever receives, without referring back, will see their balance drop over time. The system rewards two-way participation, not one-sided use.</p>\n\n<h2 id=\"s5\">5. Joining the program - fees and what they cover <span class=\"status-pill badge-done\">confirmed</span></h2>\n<table class=\"dtable\">\n<tr><th>Programme</th><th>Fee</th><th>Credits received</th></tr>\n<tr><td>India</td><td>\u20b9999 + applicable GST</td><td>999 credits</td></tr>\n<tr><td>International</td><td>$49</td><td>999 credits</td></tr>\n</table>\n<p>Paying the fee activates a partner's account and their starting 999 credits immediately. It doesn't guarantee any leads - it buys entry and a starting balance, which the partner grows through actually participating.</p>\n<p>Both programmes grant 999 credits, regardless of the fee difference. The credit count never changes - 999 always stays 999, no matter what the INR/USD exchange rate does. A partner's programme choice is locked permanently at sign-up.</p>\n<p>Currency only enters the picture once: at the moment of withdrawal (see Section 10). Until then, the credit stays a neutral unit - even when it moves between an India-programme partner and an international one.</p>\n<p><strong>Joining steps:</strong> apply through LinkedIn, a mailer, the WhatsApp community, or a direct approach \u2192 discovery call \u2192 Sarthy evaluates fit (service relevance, affordability, client diversity, professional standing, Giver/Taker read - Section 11) \u2192 agreement signed and uploaded \u2192 case study and profile submitted \u2192 fee paid \u2192 wallet activates with 999 credits \u2192 officially listed.</p>\n\n<h2 id=\"s6\">6. The credit wallet <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>Every partner has a credit wallet Sarthy maintains, recording every credit added or taken away.</p>\n<table class=\"dtable\">\n<tr><th>Event</th><th>Effect on wallet</th></tr>\n<tr><td>Partner pays the programme fee and joins</td><td><span class=\"amt-pos\">+999</span> credits</td></tr>\n<tr><td>A referred lead converts</td><td><span class=\"amt-pos\">+999</span> credits, minus a <span class=\"amt-fee\">9% fee</span> taken at transfer - about <span class=\"amt-pos\">+909</span> land in the wallet</td></tr>\n<tr><td>Partner receives a lead from another partner</td><td><span class=\"amt-neg\">-999</span> credits</td></tr>\n<tr><td>Quarterly withdrawal, above the minimum reserve</td><td>See Section 10</td></tr>\n</table>\n<p>The credit amount is always 999, regardless of deal size or service category - simple and fair by design. Credits a partner paid real money for don't expire and roll over indefinitely. Credits Sarthy hands out as a goodwill gesture expire 30 days from issue. There's no cap on how large a balance can grow.</p>\n<div class=\"example-box\">\n<strong>Worked example, since \"999\" means four different things depending on context:</strong>\n<table class=\"dtable\" style=\"margin-top:10px;\">\n<tr><th>Month</th><th>Event</th><th>What kind of 999</th><th>Effect</th><th>Running balance</th></tr>\n<tr><td>1</td><td>Asha joins and pays the fee</td><td>Joining bonus</td><td><span class=\"amt-pos\">+999</span></td><td>999</td></tr>\n<tr><td>2</td><td>Asha receives a lead, acknowledges it</td><td>Cost to receive a lead</td><td><span class=\"amt-neg\">-999</span></td><td>0</td></tr>\n<tr><td>2</td><td>A lead Asha referred earlier converts</td><td>Conversion reward, minus the 9% fee</td><td><span class=\"amt-pos\">+909</span></td><td>909</td></tr>\n<tr><td>3</td><td>Asha receives another lead, acknowledges it</td><td>Cost to receive a lead</td><td><span class=\"amt-neg\">-999</span></td><td><span class=\"amt-neg\">-90</span></td></tr>\n</table>\n<p style=\"margin:10px 0 0;\">At the end of month 3, Asha's balance sits at -90 - negative, but nowhere near the -2,997 freeze floor (Section 8), so nothing else happens yet. Four different \"999\" events, four different meanings, one running number.</p>\n</div>\n\n<h2 id=\"s7\">7. How a connection forms between partners <span class=\"status-pill badge-draft\">confirmed design, matchmaking catalyst still undesigned</span></h2>\n<p><strong>This section was substantially rewritten</strong> once the <a href=\"#\" onclick=\"showDoc('connection-request-flow');return false;\" class=\"xlink\">Connection Request Flow</a> proposal was confirmed. What used to be \"two paths in, then a separate self-service accept/decline step\" is now one consistent, admin-gated process that every connection goes through, regardless of who starts it. The detailed walkthrough and the record of how each design question was resolved live on that page; this section is now the authoritative rule.</p>\n\n<h3 style=\"font-size:15px;margin:1.5rem 0 .75rem;\">The three ways a connection can start</h3>\n<table class=\"dtable\">\n<tr><th>Direction</th><th>What happens</th><th>Who must consent before it's active</th></tr>\n<tr><td><strong>A - Direct referral</strong> (the original path)</td><td>A referring partner, with a real point of contact at a startup, recommends a specific receiving partner</td><td>The receiving partner <em>and</em>, newly, the startup itself</td></tr>\n<tr><td><strong>B - Startup self-selection</strong></td><td>A startup with no partner-chosen destination browses the list of vetted partners itself and requests one directly</td><td>The receiving partner (the startup's own request already stands as its consent)</td></tr>\n<tr><td><strong>C - Receiving-partner-initiated</strong> (new)</td><td>A receiving partner browses the startup list and proposes to work with one directly, with a business proposal</td><td>The startup itself</td></tr>\n</table>\n<p><strong>Worth flagging plainly:</strong> requiring the startup's own consent in direction A is new. A direct referral used to only need the receiving partner's acknowledgment - the startup was never formally asked to approve anything, just expected to be \"a real point of contact.\" That's a real increase in what admin has to do on every single lead, not only the new direction C. Worth Sarthy weighing whether that operational cost is acceptable as lead volume grows, since most leads today still arrive via direction A.</p>\n\n<h3 style=\"font-size:15px;margin:1.5rem 0 .75rem;\">The common approval process, step by step</h3>\n<svg viewBox=\"0 0 830 300\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:760px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrow7\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--ink-faint)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"10.5\">\n    <rect x=\"10\" y=\"10\" width=\"125\" height=\"38\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"72\" y=\"33\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">A - Direct referral</text>\n\n    <rect x=\"10\" y=\"56\" width=\"125\" height=\"38\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"72\" y=\"79\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">B - Startup self-selects</text>\n\n    <rect x=\"10\" y=\"102\" width=\"125\" height=\"38\" rx=\"6\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"72\" y=\"125\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">C - Partner proposes</text>\n\n    <line x1=\"135\" y1=\"29\" x2=\"160\" y2=\"70\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"135\" y1=\"75\" x2=\"160\" y2=\"75\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\"/>\n    <line x1=\"135\" y1=\"121\" x2=\"160\" y2=\"80\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n    <line x1=\"160\" y1=\"70\" x2=\"160\" y2=\"80\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"165\" y=\"50\" width=\"110\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n    <text x=\"220\" y=\"70\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-weight=\"500\" font-size=\"10.5\">1. Introduced</text>\n    <text x=\"220\" y=\"85\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9\">visible to all, faded - FYI only</text>\n\n    <line x1=\"275\" y1=\"75\" x2=\"300\" y2=\"75\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"305\" y=\"50\" width=\"110\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"360\" y=\"70\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">2. Validated</text>\n    <text x=\"360\" y=\"85\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">admin sanity check</text>\n\n    <line x1=\"415\" y1=\"75\" x2=\"440\" y2=\"75\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"445\" y=\"42\" width=\"135\" height=\"66\" rx=\"7\" fill=\"var(--accent-soft)\" stroke=\"var(--accent)\"/>\n    <text x=\"512\" y=\"63\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">3. Acknowledged</text>\n    <text x=\"512\" y=\"78\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">consent taken, admin approves</text>\n    <text x=\"512\" y=\"91\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9\">999 credits deducted</text>\n\n    <line x1=\"580\" y1=\"75\" x2=\"605\" y2=\"75\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"610\" y=\"50\" width=\"105\" height=\"50\" rx=\"7\" fill=\"var(--panel)\" stroke=\"var(--line-strong)\"/>\n    <text x=\"662\" y=\"79\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">In Progress</text>\n\n    <line x1=\"715\" y1=\"75\" x2=\"740\" y2=\"75\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"745\" y=\"42\" width=\"80\" height=\"66\" rx=\"7\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"785\" y=\"65\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10.5\">Converted</text>\n    <text x=\"785\" y=\"80\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"8.5\">referrer +909</text>\n    <text x=\"785\" y=\"92\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"8.5\">(999 minus 9%)</text>\n\n    <line x1=\"512\" y1=\"108\" x2=\"512\" y2=\"150\" stroke=\"var(--ink-faint)\" stroke-width=\"1.5\" marker-end=\"url(#arrow7)\"/>\n\n    <rect x=\"425\" y=\"152\" width=\"200\" height=\"56\" rx=\"7\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <text x=\"525\" y=\"174\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">Consent refused (Rejected)</text>\n    <text x=\"525\" y=\"190\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">admin closes it - no deduction</text>\n    <text x=\"525\" y=\"202\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">to anyone, at any point</text>\n\n    <text x=\"10\" y=\"240\" fill=\"var(--ink-faint)\" font-size=\"10\">No automatic finalization or timeout anywhere in this chain - a request only ever resolves when admin actively approves</text>\n    <text x=\"10\" y=\"254\" fill=\"var(--ink-faint)\" font-size=\"10\">or refuses it. This retires the old 7-day self-service window and the \"Unresolved\" (silent-timeout) status entirely.</text>\n    <text x=\"10\" y=\"275\" fill=\"var(--ink-faint)\" font-size=\"10\">Full field-level detail, including the cancellation and late-dispute-reversal transitions, is in the <tspan fill=\"var(--ink)\">Low-Level System Specification</tspan>.</text>\n  </g>\n</svg>\n<p style=\"font-size:12.5px;color:var(--ink-faint);margin:-0.75rem 0 1.25rem;\">This shows the common path across all three directions. For every transition, see the full Lead state machine in the <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level System Specification</a>.</p>\n<p>All connections go through Sarthy. Two partners privately arranging one outside the system doesn't count, and won't be honoured at settlement.</p>\n<p>A valid lead is a real prospect with an actual need and a real point of contact. It also can't be a lead that's already been referred through the system, or one that's already working with that partner.</p>\n<ul>\n<li><strong>Cancelling a request:</strong> the initiating party can cancel any time before Acknowledged - since nothing is actually committed, and no deduction has happened, until admin approves it.</li>\n<li><strong>Duplicate requests:</strong> caught and flagged as invalid at the point of upload, before they go anywhere. Partners can also see a list of existing open requests to reduce accidental duplicates - the same check is now part of admin's sanity check at Validated.</li>\n<li><strong>Repeated consent refusals:</strong> four or more requests refused in a row for the same receiving partner gets flagged to admin, who steps in manually - not an automatic penalty, a prompt for a human to check.</li>\n<li><strong>Re-requesting after a refusal:</strong> no fixed limit on trying a different receiving partner. The same-service-type rule below still governs how many can be pursued at once.</li>\n<li><strong>Same-service-type overlap:</strong> loosened from a hard block to a flag. More than one open request can now exist on the same startup with similar-type receiving partners at once - the receiving partner sees the overlap and can still choose to proceed. <strong>Still open, not yet answered:</strong> once one of those requests converts into an actual live connection, do the startup's other open requests to similar-type partners close automatically, or stay open until someone acts on them too? Worth resolving before this reaches a developer as a build spec, since it decides what the system must do automatically the moment admin approves one.</li>\n</ul>\n<p>The partner who originally brought the startup into Sarthy's ecosystem is the one who earns the rewards - the 999-credit lead-share reward on conversion, and the 10% deal-closure referral fee (Section 20) if it becomes a real deal. This holds across all three directions, even C, where a different partner (not the originating one) is the one proposing the new connection.</p>\n<p><strong>If a startup signs up with no originating partner at all</strong> - arriving directly, not through any partner - Sarthy itself is treated as the originating partner for that startup. Every reward that would normally go to a partner (the lead-share credit, the deal-closure fee) applies to Sarthy the same way, tracked through the same mechanics as any other partner's activity.</p>\n<p><strong>Resolved:</strong> a disputed lead is handled at admin's discretion, backed by a direct check-in with the startup to confirm what actually happened. The startup's response is one input the admin weighs, not a mandatory requirement - and if the startup doesn't respond either, that's also left to admin's judgment, with no fixed default favoring either partner. Full detail in the <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">BRD, Section 11</a>.</p>\n<p>Separately, a backend \"catalyst\" that surfaces good matches to partners is a real direction - but it isn't designed yet. One thing is already clear: the system may <em>suggest</em> a match, but it can never <em>assign</em> one. The referring partner always makes the final choice, even when a suggestion is shown.</p>\n\n<h2 id=\"s8\">8. The six credit rules <span class=\"status-pill badge-draft\">drafted, all six specified</span></h2>\n<table class=\"dtable\">\n<tr><th>#</th><th>Rule</th><th>What it means</th></tr>\n<tr><td>1</td><td>Opening balance</td><td>Every partner starts with <span class=\"amt-pos\">+999</span> credits on payment. Not refundable.</td></tr>\n<tr><td>2</td><td>One credit per lead</td><td>Conversion confirmed by Sarthy based on proof from both partners - a signed agreement, an invoice, or similar.</td></tr>\n<tr><td>3</td><td>No double credits</td><td>One lead generates one deduction and one credit, ever.</td></tr>\n<tr><td>4</td><td>Credits can't be transferred between partners</td><td>Only earned through real referrals, only cashed out at settlement.</td></tr>\n<tr><td>5</td><td>Fixed value</td><td><span class=\"amt-pos\">999</span> credits per transaction, always, regardless of category or deal size.</td></tr>\n<tr><td>6</td><td>Negative balances</td><td>A balance can run down to <span class=\"amt-neg\">-2,997</span>. Beyond that, the account freezes until topped up back to <span class=\"amt-pos\">+999</span> - a top-up costs 4\u00d7 the entry fee (\u20b93,996 or $196) and adds <span class=\"amt-pos\">+3,996</span> credits, landing exactly at +999.</td></tr>\n</table>\n<div class=\"example-box\">\n<strong>Worked example - hitting the freeze and recovering:</strong>\n<p style=\"margin:8px 0 0;\">Vikram's balance is at <span class=\"amt-neg\">-1,998</span> after receiving two leads with no conversions yet. He receives a third lead and acknowledges it: <span class=\"amt-neg\">-999</span> credits takes him to exactly <span class=\"amt-neg\">-2,997</span> - the floor. His account is now frozen; he can't receive any further leads until he tops up. He pays \u20b93,996, adding <span class=\"amt-pos\">+3,996</span> credits: his balance moves from -2,997 to <span class=\"amt-pos\">+999</span>, clearing the freeze, and he's active again.</p>\n</div>\n<svg viewBox=\"0 0 700 205\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <defs>\n    <marker id=\"arrowW\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"var(--amber)\"/></marker>\n  </defs>\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <line x1=\"260\" y1=\"30\" x2=\"260\" y2=\"70\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"260\" y1=\"30\" x2=\"630\" y2=\"30\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\"/>\n    <line x1=\"630\" y1=\"30\" x2=\"630\" y2=\"70\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" marker-end=\"url(#arrowW)\"/>\n    <text x=\"335\" y=\"23\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"600\" font-size=\"10.5\">Top-up: pay 4&#215; entry fee (&#8377;3,996 / $196) &#8594; +3,996 credits, lands exactly on +999</text>\n\n    <rect x=\"40\" y=\"70\" width=\"220\" height=\"34\" fill=\"var(--red-bg)\" stroke=\"var(--red)\"/>\n    <rect x=\"260\" y=\"70\" width=\"200\" height=\"34\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <rect x=\"460\" y=\"70\" width=\"200\" height=\"34\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n\n    <line x1=\"260\" y1=\"65\" x2=\"260\" y2=\"109\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/>\n    <text x=\"260\" y=\"122\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">-2,997</text>\n\n    <line x1=\"460\" y1=\"65\" x2=\"460\" y2=\"109\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/>\n    <text x=\"460\" y=\"122\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">-1,500</text>\n\n    <line x1=\"560\" y1=\"70\" x2=\"560\" y2=\"104\" stroke=\"var(--ink-faint)\" stroke-width=\"1\"/>\n    <text x=\"560\" y=\"122\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">0</text>\n\n    <line x1=\"630\" y1=\"70\" x2=\"630\" y2=\"104\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/>\n    <text x=\"630\" y=\"140\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">+999</text>\n\n    <text x=\"150\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">Frozen</text>\n    <text x=\"150\" y=\"150\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">blocked from receiving leads</text>\n\n    <text x=\"360\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">At-Risk flag</text>\n    <text x=\"360\" y=\"150\" text-anchor=\"middle\" fill=\"var(--ink-soft)\" font-size=\"9.5\">still fully Active, just flagged</text>\n\n    <text x=\"545\" y=\"88\" text-anchor=\"middle\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"10\">Healthy Active range</text>\n\n    <text x=\"10\" y=\"172\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Not to scale &#8212; spacing is illustrative, not proportional to the credit values.</text>\n    <text x=\"10\" y=\"186\" fill=\"var(--ink-faint)\" font-size=\"9.5\">Dormant is a separate, time-based trigger, not part of this balance scale &#8212; see the status diagram in the Segmentation Framework.</text>\n  </g>\n</svg>\n\n<h2 id=\"s9\">9. How conversion gets confirmed, and what happens if someone disagrees <span class=\"status-pill badge-done\">confirmed for now</span></h2>\n<p>Sarthy has the final say on whether a lead converted. The same conversion standard applies across every service category for now: first payment, plus a digitally signed agreement completed through the platform. This means the platform needs real digital-signature capability - not just an uploaded PDF.</p>\n<p>If a partner disagrees, they can raise it in writing within 14 days. The admin responds within 24 hours, engaging both parties directly. This can happen offline, over email - no formal in-platform process is required.</p>\n<p>The admin's decision is final for routine disputes. Any partner can escalate a dispute beyond the admin to Sarthy leadership. <strong>Resolved:</strong> there's no fixed deal-value threshold - every escalation automatically notifies admin (an in-product popup and an automated email), and admin decides how to proceed from there, including whether to loop in Sarthy leadership.</p>\n\n<h2 id=\"s10\">10. Withdrawing credits and staying a member <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>There is no fixed programme cycle. Membership is ongoing - a partner joins once and stays a member indefinitely, with no end date forcing a settlement. (Why there's no cycle: see <a href=\"#\" onclick=\"showDoc('history');return false;\" class=\"xlink\">Design History & Decisions</a>.)</p>\n<ul>\n<li><strong>Minimum reserve:</strong> a partner must always keep at least their original entry amount (999 credits) in their wallet.</li>\n<li><strong>Withdrawing:</strong> anything above the reserve can be withdrawn quarterly. Credits convert to real currency at whatever the live exchange rate is on the day of withdrawal, not the rate from when the partner joined.</li>\n<li><strong>The <span class=\"amt-fee\">9% fee</span>:</strong> charged once, at the moment credit transfers to a referring partner on conversion (Section 6) - not a second time at withdrawal, since it's already been taken at the source.</li>\n<li><strong>Pausing or stepping away:</strong> no cycle to leave mid-way through means no forfeiture, no prorated payout. A quiet account just sits as-is until the partner returns.</li>\n</ul>\n<p>No partner should be told their credit balance is guaranteed cash before an actual withdrawal is processed.</p>\n<p><strong>Resolved:</strong> the official exchange rate source is a government-approved, publicly available real-time rate chart - specifically the RBI reference rate.</p>\n\n<h2 id=\"s11\">11. Grouping partners - Giver, Taker, or Balanced <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Three patterns, not two. Some partners actively contribute to the ecosystem (<strong>Givers</strong>), some mostly draw from it without reciprocating (<strong>Takers</strong>), and most sit somewhere in between (<strong>Balanced</strong>) - giving and receiving in roughly even measure. This shows up directly in the credit wallet: a steadily growing balance behaves like a Giver, a steadily shrinking one behaves like a Taker, and a balance that moves in both directions without a clear trend is Balanced. Sarthy uses this trend when reviewing partners periodically, and may deprioritize or exit partners who consistently show Taker behavior. Most partners are expected to sit in Balanced most of the time - it's the default, not an edge case.</p>\n<p>The same judgment applies earlier too, during onboarding - client base health, professional standing, and whether the partner seems collaborative rather than purely extractive. Not a hard checklist - a conversation-based read during the discovery call.</p>\n<p>See the full <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a> for the priority tiers this feeds into.</p>\n\n<h2 id=\"s12\">12. What partners are expected to do <span class=\"status-pill badge-done\">confirmed</span></h2>\n<ul>\n<li>Only submit real, qualified leads</li>\n<li>Actually pursue accepted leads in good faith</li>\n<li>Behave professionally with leads, other partners, and the Sarthy team</li>\n<li>Report conversions honestly</li>\n<li>Keep profile and service details current</li>\n<li>Respond to Sarthy's requests within reasonable time</li>\n</ul>\n<p>All formal lead exchanges go through Sarthy - private arrangements outside the system aren't recognized and won't be honoured at settlement.</p>\n\n<h2 id=\"s13\">13. Guardrails against abuse <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>These are not allowed, under any circumstance:</p>\n<ul>\n<li>Submitting fake or made-up leads to earn credits</li>\n<li>Submitting leads for contacts with no real interest in the receiving partner's services</li>\n<li>Two partners coordinating to exchange fake leads with each other</li>\n<li>Claiming a conversion when no paid work has actually started</li>\n<li>Accepting a lead with no intention of following up, purely to deny the referrer's credit</li>\n<li>Submitting a lead already engaged elsewhere in the network</li>\n</ul>\n<p>Sarthy periodically reviews referral patterns network-wide - consistently low conversion, or suspicious coordination between just one or two partners, gets flagged for review. Not automatically punitive, a health check. Serious fraud can be escalated to legal action.</p>\n\n<h2 id=\"s14\">14. The partner's day-to-day experience <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Full detail lives in the <a href=\"#\" onclick=\"showDoc('combined-journey');return false;\" class=\"xlink\">User Journey Map</a>, Sections B and C. In brief: awareness \u2192 discovery call \u2192 agreement and payment \u2192 first lead activity (the stage most partners currently drop off at) \u2192 active participation \u2192 a Giver, Balanced, or Taker pattern (Section 11) \u2192 continued activity or a slide toward the 3-month dormancy line (Section 21).</p>\n\n<h2 id=\"s15\">15. Staying engaged after joining <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Partner selection stays fully partner-controlled - Sarthy doesn't assign leads. Sarthy's role is relationship management: the team touches base with each partner regularly, encouraging both sending and requesting leads. See the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> for the actual check-in message, and the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a> for who gets prioritized.</p>\n\n<h2 id=\"s16\">16. Ready-made messages <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>Lives as its own toolkit - the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> - since it's copy-paste scripts, not narrative rules.</p>\n\n<h2 id=\"s17\">17. Winning back inactive partners <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>The trigger is defined in Section 21 - 3 months without a shared lead. In practice: partners with status At-Risk get proactive outreach before ever reaching status Dormant (see the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>); once dormant, the reactivation message from the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> goes out, following the rotating weekly quota. A standing part of the Associate's call queue, not a one-time campaign.</p>\n\n<h2 id=\"s18\">18. Moving from early testing to full rollout <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Sarthy's real target: <strong>at least 10 active partners within 2 weeks of the app being fully up and running.</strong> Today's baseline is a few real but infrequent users - so the gap is both getting to 10 partners and turning occasional users into consistently active ones. See the <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Alpha to Beta Graduation Criteria</a> for what \"active\" needs to mean beyond a headcount.</p>\n\n<h2 id=\"s19\">19. How success is measured <span class=\"status-pill badge-draft\">drafted, proposal awaiting confirmation</span></h2>\n<p>Sarthy's own scorecard: finding and signing up partners (20%), supporting startups (40%), matching partners to startups (30%), research and reporting (10%). None of these had clearly defined measures in Sarthy's own records - proposed measures below for all four, grounded in what this SOP actually tracks.</p>\n<p><strong>Finding and signing up partners (20%):</strong></p>\n<ul>\n<li>Number of new partners signed and onboarded each month</li>\n<li>Time from first contact to signed agreement</li>\n<li>Share of newly signed partners who actually reach real platform activity, not just a signature - directly targets the \"Part of Platform\" gap identified in the Current-State Assessment</li>\n</ul>\n<p><strong>Supporting startups (40%):</strong></p>\n<ul>\n<li>Call volume - number of startup calls and check-ins made each month</li>\n<li>Outcomes - startups actually matched with a relevant partner, not just contacted</li>\n<li>Startup feedback captured where available, not just call counts</li>\n</ul>\n<p><strong>Match-Making (30%):</strong></p>\n<ul>\n<li>Leads matched to at least one relevant partner each month</li>\n<li>Average time from submission to reaching a partner, against the 5-working-day target</li>\n<li>Share of leads validated and matched versus rejected or stalled</li>\n<li>Whether leads reach a healthy spread of partners, not just the same one or two</li>\n</ul>\n<p><strong>Research & Reports (10%):</strong></p>\n<ul>\n<li>A recurring report - monthly to start - on partner and lead activity trends</li>\n<li>Written recommendations from that report, and whether they get acted on</li>\n<li>Partner feedback gathered regularly and rolled into the same reporting</li>\n</ul>\n\n<h2 id=\"s20\">20. After the deal closes - the referral fee <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Everything in Sections 5-10 covers the 999-point credit exchanged when a lead is <em>shared</em>. This is a separate, second reward that only kicks in once a shared lead becomes a real signed deal - running in parallel, not replacing the credit system.</p>\n<ol>\n<li>The receiving partner closes the lead, signing an agreement directly with the startup.</li>\n<li>The deal's value and duration is shared with Sarthy and the referring partner.</li>\n<li>The referring partner is entitled to <strong><span class=\"amt-pos\">10%</span> of the value actually invoiced during the first 12 months</strong> of the engagement.</li>\n<li>This flows through Sarthy - Sarthy takes a <span class=\"amt-fee\">9% cut</span> <em>of that 10%</em>, the same 9% principle used everywhere in this document. The referring partner nets <span class=\"amt-pos\">91%</span> of the 10%, which works out to <span class=\"amt-pos\">9.1%</span> of what was invoiced in that first year.</li>\n<li>The amount accumulates over the year and pays out once annually, at financial year-end (March 31st).</li>\n<li>The entitlement lasts <strong>1 year from the lead's first engagement</strong> with the receiving partner. After that year, the two continue their relationship directly - no further obligation back to the referrer, and no further tri-party arrangement with Sarthy on that relationship.</li>\n</ol>\n<div class=\"example-box\">\n<strong>Worked example:</strong>\n<p style=\"margin:8px 0 0;\">Priya refers a startup to a legal partner. Over the first 12 months, the startup is invoiced <strong>\u20b95,00,000</strong> total for legal services. Priya's entitlement: <span class=\"amt-pos\">10%</span> of \u20b95,00,000 = \u20b950,000. Sarthy takes <span class=\"amt-fee\">9%</span> of that \u20b950,000 = \u20b94,500. Priya nets the remaining 91% = <strong><span class=\"amt-pos\">\u20b945,500</span></strong>, paid out the following March 31st. If the engagement had instead been an 18-month retainer, only the invoicing from the first 12 months would count toward this calculation - anything billed in months 13-18 wouldn't factor in at all.</p>\n</div>\n<p><strong>Why deal_duration matters:</strong> if an engagement runs longer than 12 months (say, an 18-month retainer), only what's actually invoiced in the first 12 months counts toward the referrer's entitlement - not the full multi-year contract value. deal_duration is what tells Sarthy whether a deal needs this year-one proration at all, or whether the full deal_value already falls within the 1-year window.</p>\n<svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <g font-family=\"Inter,sans-serif\" font-size=\"12\">\n    <text x=\"25\" y=\"20\" fill=\"var(--ink-soft)\" font-size=\"12\">Deal invoiced (year 1): <tspan font-weight=\"600\" fill=\"var(--ink)\">\u20b95,00,000</tspan> \u2192 referrer's 10% entitlement: <tspan font-weight=\"600\" fill=\"var(--ink)\">\u20b950,000</tspan></text>\n\n    <rect x=\"25\" y=\"40\" width=\"59\" height=\"50\" fill=\"var(--amber-bg)\" stroke=\"var(--amber)\"/>\n    <rect x=\"84\" y=\"40\" width=\"591\" height=\"50\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n\n    <text x=\"53\" y=\"105\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"600\" font-size=\"11.5\">9%</text>\n    <text x=\"53\" y=\"120\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">Sarthy's cut</text>\n    <text x=\"53\" y=\"133\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">\u20b94,500</text>\n\n    <text x=\"380\" y=\"105\" text-anchor=\"middle\" fill=\"var(--green)\" font-weight=\"600\" font-size=\"11.5\">91% - Priya's net payout</text>\n    <text x=\"380\" y=\"120\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"10\">\u20b945,500 - paid annually, March 31st</text>\n  </g>\n</svg>\n<svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-width:640px;display:block;margin:0 auto 1.5rem;\">\n  <g font-family=\"Inter,sans-serif\" font-size=\"11\">\n    <text x=\"40\" y=\"30\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">First engagement date</text>\n    <text x=\"600\" y=\"30\" text-anchor=\"end\" fill=\"var(--ink)\" font-weight=\"600\" font-size=\"11\">+12 months &#8212; window closes</text>\n\n    <rect x=\"40\" y=\"60\" width=\"560\" height=\"30\" fill=\"var(--green-bg)\" stroke=\"var(--green)\"/>\n    <text x=\"320\" y=\"80\" text-anchor=\"middle\" fill=\"var(--ink)\" font-size=\"10\">value invoiced in here counts toward the 10% fee</text>\n\n    <line x1=\"320\" y1=\"42\" x2=\"320\" y2=\"102\" stroke=\"var(--amber)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n    <text x=\"320\" y=\"118\" text-anchor=\"middle\" fill=\"var(--amber)\" font-weight=\"600\" font-size=\"10.5\">March 31</text>\n    <text x=\"320\" y=\"132\" text-anchor=\"middle\" fill=\"var(--ink-faint)\" font-size=\"9.5\">fixed annual payout date</text>\n\n    <text x=\"10\" y=\"152\" fill=\"var(--ink-faint)\" font-size=\"9.5\">The 12-month window floats with each deal's own start date. The payout date doesn't &#8212; it's always March 31, whatever point the window happens to be at.</text>\n  </g>\n</svg>\n<p>If the same startup later engages a different partner, that counts as a genuinely separate referral - not a continuation. It's a fresh, independent deal with its own 12-month entitlement clock, unrelated to any prior engagement.</p>\n\n<h2 id=\"s21\">21. Staying an active partner <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>A partner who doesn't share any lead for 3 consecutive months is marked dormant. They're removed from the public listing and blocked from receiving leads until they resume activity.</p>\n<p>The underlying principle: no partner gets to be purely a taker, permanently receiving without ever contributing. This connects directly to the Giver/Taker framing in Section 11.</p>\n<p>Gamifying this further - leaderboards, streaks, recognition - is now high priority, to be built alongside the rest of the platform rather than deferred. The specific mechanics still need a real design pass.</p>\n\n<h2 id=\"s22\">22. Frequently asked questions <span class=\"status-pill badge-done\">confirmed</span></h2>\n<table class=\"dtable\">\n<tr><th>Question</th><th>Answer</th></tr>\n<tr><td>Do I lose my starting 999 credits if none of my referrals convert?</td><td>No - opening credits aren't tied to referral performance. Receiving leads still deducts 999 credits regardless.</td></tr>\n<tr><td>What if I refer a lead and it doesn't convert?</td><td>No credit earned. The receiving partner's deduction stands either way.</td></tr>\n<tr><td>Can I decline a lead I don't think is relevant?</td><td>Yes - by refusing consent when admin reaches out, any time before the deduction happens. Outside your service area, refuse and nothing gets deducted.</td></tr>\n<tr><td>Can I refer more than one lead to the same partner?</td><td>Yes - each referral is its own separate transaction.</td></tr>\n<tr><td>What if a lead converts months later?</td><td>The credit is awarded whenever conversion is actually confirmed.</td></tr>\n</table>\n\n<h2 id=\"s23\">23. Closing note <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>This program is built on one belief: the strongest partner networks run on mutual accountability, not just shared access. Every partner who joins becomes a real stakeholder in a shared system - not a passive vendor waiting for the phone to ring.</p>\n<p>The credit model is simple on purpose. The rules are transparent on purpose. That way, a partner's balance is an honest reflection of what they've actually put into the ecosystem. This program works when every partner is both a generous contributor and a serious professional.</p>\n"}, {"id": "connection-request-flow", "content_file": "connection-request-flow.html", "cat": "Technical Documents", "status": "done", "version": "2.0", "updated": "All 4 open questions resolved directly with Sarthy leadership; confirmed as the authoritative model (not a proposal) and folded into Playbook Sec.7, Low-Level Spec, Data Dictionary, and BRD.", "type": "Sarthy-facing", "title": "Connection Request Flow", "desc": "The confirmed admin-gated model for how a Startup, Referring Partner, or Receiving Partner can start a connection, in any of 3 directions. All open questions resolved; folded into Partnership SOP v1.0 Section 7, the Low-Level Spec, the Data Dictionary, and the BRD.", "html": "<p class=\"callout\">A confirmed new way for a Startup, a Referring Partner, or a Receiving Partner to start a connection with each other - in any direction, not just the two the SOP recognized before this - with Sarthy admin gating every step. All open design questions have been resolved directly with Sarthy leadership, and this model is now folded into <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> Section 7, the <a href=\"#\" onclick=\"showDoc('low-level-spec');return false;\" class=\"xlink\">Low-Level Spec</a>'s Lead state machine, the <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a>'s Lead table, and the BRD. This page stays as the detailed walkthrough and the record of how each design decision was reached.</p>\n\n<h2>Why this exists</h2>\n<p>Today's SOP only recognizes two ways a startup and a receiving partner end up connected: a referring partner picks the receiving partner directly (Path A), or the startup picks one itself from a list (Path B). Both of those are one person choosing, and one person waiting. This proposal adds a third direction - a receiving partner browsing startups and proposing to work with one directly - and puts the same admin-gated approval process in front of all three, so every connection, regardless of who started it, goes through the same consent-and-sanity-check step before anyone's contact details are shared.</p>\n\n<h2>The three ways a connection can start</h2>\n<table class=\"dtable\">\n<tr><th>Who starts it</th><th>What they do</th><th>Requesting party</th><th>Requested party</th><th>Who else is kept in the loop</th></tr>\n<tr><td>Startup</td><td>Browses the list of vetted partners and requests one directly</td><td>Startup</td><td>Receiving partner</td><td>The startup's existing referring partner, if it has one on record</td></tr>\n<tr><td>Referring partner</td><td>Browses the partner list and recommends connecting a startup already under its belt with a specific receiving partner</td><td>Referring partner</td><td>Receiving partner <em>and</em> the startup</td><td>Admin only - the referring partner already consented by making the request</td></tr>\n<tr><td>Receiving partner</td><td>Browses the full startup list and proposes to work with one directly, with a business proposal</td><td>Receiving partner</td><td>Startup</td><td>The startup's existing referring partner, informed with no approval role - see below</td></tr>\n</table>\n<p>In every row, \"requestin
