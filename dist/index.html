<head>

<title>Strategic Partners Playbook 3.0 - Project Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#211f1c; --ink-soft:#5c5850; --ink-faint:#948e83;
  --paper:#FAF8F4; --panel:#FFFFFF; --line:#E4DFD6; --line-strong:#CFC8BA;
  --sidebar:#20241F; --sidebar-line:#343930; --sidebar-text:#C9CDBE; --sidebar-text-dim:#7C8072;
  --accent:#5B6E4F; --accent-soft:#E7ECDF;
  --green:#3F7D4A; --green-bg:#E5F0E2;
  --amber:#A6740F; --amber-bg:#FAF0DB;
  --red:#B14A3E; --red-bg:#F8E5E1;
  --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
.app{display:flex;min-height:100vh;}
.sidebar{position:sticky;top:0;height:100vh;width:290px;flex-shrink:0;background:var(--sidebar);overflow-y:auto;padding-bottom:1rem;}
.sidebar-header{padding:1.5rem 2rem 1rem 1.25rem;border-bottom:1px solid var(--sidebar-line);}
.brand{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:#F2F0E7;cursor:pointer;line-height:1.3;}
.progress-mini{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sidebar-text-dim);margin-top:4px;}
.progress-track{height:3px;background:#343930;border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:#8CA478;border-radius:3px;}
.cat-block{border-bottom:1px solid #2A2E26;}
.cat-header{display:flex;align-items:center;gap:9px;padding:11px 1.25rem;cursor:pointer;font-size:13px;font-weight:500;color:#E4E7D8;user-select:none;}
.cat-header:hover{background:#262B22;}
.cat-header.active-cat{background:#262B22;}
.chevron{font-size:9px;color:var(--sidebar-text-dim);transition:transform .15s ease;width:10px;flex-shrink:0;}
.chevron.open{transform:rotate(90deg);}
.tab-num{font-family:'JetBrains Mono',monospace;font-size:10px;background:#343930;color:#A8AC9B;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cat-header.active-cat .tab-num{background:#8CA478;color:#1B1F17;}
.cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sidebar-text-dim);}
.cat-body{overflow:hidden;max-height:0;transition:max-height .18s ease;}
.cat-body.open{max-height:600px;}
.doc-link{display:flex;align-items:center;gap:8px;padding:8px 1.25rem 8px 2.5rem;font-size:12.5px;color:var(--sidebar-text-dim);cursor:pointer;}
.doc-link:hover{background:#262B22;color:var(--sidebar-text);}
.doc-link.active{background:#262B22;color:#F2F0E7;border-left:2px solid #8CA478;padding-left:calc(2.5rem - 2px);}
.doc-link.disabled{cursor:default;opacity:.55;}
.tab-num-sm{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--sidebar-text-dim);flex-shrink:0;}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-done{background:#7BBE86;}
.dot-draft{background:#E0B04A;}
.dot-pending{background:#6B6F60;}
.changelog-link{display:flex;align-items:center;gap:8px;padding:11px 1.25rem;font-size:12.5px;color:var(--sidebar-text-dim);cursor:pointer;border-top:1px solid var(--sidebar-line);margin-top:6px;}
.changelog-link:hover{color:#F2F0E7;}
.main{flex:1;max-width:840px;padding:3rem 2rem 5rem;}
.crumb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.doc-header{border-bottom:1px solid var(--line);padding-bottom:1.25rem;margin-bottom:1.75rem;}
.doc-title{font-family:'Fraunces',serif;font-size:30px;font-weight:600;margin:0 0 8px;line-height:1.15;}
.meta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;}
.badge-done{background:var(--green-bg);color:var(--green);}
.badge-draft{background:var(--amber-bg);color:var(--amber);}
.badge-pending{background:var(--red-bg);color:var(--red);}
.meta-text{font-size:12px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.content{font-size:15px;line-height:1.75;color:var(--ink);}
.content h2{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:2rem 0 .75rem;padding-top:.5rem;}
.content h2:first-child{margin-top:0;}
.content p{margin:0 0 1rem;color:var(--ink-soft);}
.content ul,.content ol{margin:0 0 1rem;padding-left:1.3rem;color:var(--ink-soft);}
.content li{margin-bottom:5px;}
.content strong{font-weight:600;color:var(--ink);}
a.xlink{color:var(--accent);text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:2px;cursor:pointer;font-weight:500;}
a.xlink:hover{text-decoration-color:var(--accent);}
table.dtable{width:100%;border-collapse:collapse;margin:0 0 1.5rem;font-size:13px;}
table.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);border-bottom:1px solid var(--line-strong);padding:7px 10px 7px 0;font-weight:500;}
table.dtable td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-soft);}
table.dtable td:first-child,table.dtable th:first-child{color:var(--ink);font-weight:500;}
.callout{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 16px;margin:0 0 1.25rem;font-size:13.5px;color:#3F4D36;}
.pending-box{background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:1.5rem;text-align:center;color:var(--ink-faint);font-size:13.5px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle;}
.cl-item{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);}
.cl-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);width:100px;flex-shrink:0;padding-top:2px;}
.cl-body strong{display:block;margin-bottom:2px;}
.cl-body span{font-size:13px;color:var(--ink-soft);}
[data-tip]{position:relative;}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:50%;left:100%;transform:translateY(-50%);margin-left:10px;z-index:20;background:#12140F;color:#E9E7DD;font-family:'Inter',sans-serif;font-size:12px;font-weight:400;line-height:1.45;padding:8px 11px;border-radius:8px;width:max-content;max-width:220px;white-space:normal;box-shadow:0 4px 14px rgba(0,0,0,.28);pointer-events:none;}
[data-tip]:hover::before{content:"";position:absolute;top:50%;left:100%;transform:translateY(-50%);margin-left:2px;border:5px solid transparent;border-right-color:#12140F;z-index:20;pointer-events:none;}
@media(max-width:900px){.app{flex-direction:column;}.sidebar{position:static;height:auto;width:100%;}.main{padding:2rem 1.25rem 4rem;max-width:none;}[data-tip]:hover::after,[data-tip]:hover::before{display:none;}}
</style>
</head>

<script>
const DOCS = [{"id": "guide", "content_file": "guide.html", "cat": "Start Here", "status": "done", "version": "1.0", "updated": "Initial version", "type": "Both", "title": "How to use this hub", "desc": "Read this first - how to navigate, and how updates are meant to flow through the other pages", "html": "<p class=\"callout\">Read this page first, before opening any other tab. It explains how to move around this hub, and what to do whenever you or I change something on one page that might affect another.</p>\n\n<h2>How to move around</h2>\n<ul>\n  <li>The top row of tabs shows the <strong>type</strong> of document - things like \"Strategic Planning\" or \"Evidence & Assessment.\" The numbers show a rough order, but we often jump between them as work unblocks.</li>\n  <li>The second row shows the <strong>actual documents</strong> inside whichever type you clicked.</li>\n  <li>Hover over any tab and a short note pops up telling you what's inside, in plain words.</li>\n  <li>Each tab has a small colored dot: <strong>green</strong> means finished and confirmed, <strong>amber</strong> means drafted but still needs sign-off, <strong>grey</strong> means it hasn't been written yet.</li>\n  <li>Underlined text inside a document, like <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">this</a>, is a real link - click it and it jumps straight to that document.</li>\n  <li>\"Version history,\" at the end of the document row, is a running list of changes made to the hub itself.</li>\n</ul>\n\n<h2>A limit you should know about</h2>\n<p>This hub is one file. It does not automatically notice when a change in one document should also change another - nothing in the file itself is smart enough for that. The only thing that keeps everything accurate is a simple habit: <strong>whenever a document changes, check the table below to see what else it affects, and fix those too, in the same sitting.</strong></p>\n\n<h2>How the Playbook is organized - one rulebook, several supporting documents</h2>\n<p><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> is the single operating rulebook - how partners join, stay engaged, get grouped, and get helped when something goes wrong. Sarthy's original Playbook 2.0 - years of their own design work on the credit system, referral flow, and abuse rules - has been fully absorbed into it, section by section. That original document is now retired; nothing about the program lives there anymore that isn't also here. A few things still stay separate on purpose: the Communication Template Library (a toolkit of scripts, not narrative rules), the Journey Map and Segmentation Framework (analysis that feeds the SOP's conclusions, not the SOP itself), and the technical documents (a different audience entirely). Sarthy's much older Playbook 1.0 stays out too, but only because there's very little in it beyond what's already captured in the Current-State Assessment's history section.</p>\n\n<h2>Which documents affect which others</h2>\n<p>How to read this: if you change something in the left column, go check the item next to it in the right column before you consider the update finished.</p>\n<table class=\"dtable\">\n  <tr><th>If you change this...</th><th>...go check this too</th></tr>\n  <tr><td>Phase 0 Discussion Doc (after Sarthy answers our questions)</td><td>Partnership SOP v1.0 - Sections 5, 6, 7, 8, 9, 10 (money and credit mechanics), Section 13 (guardrails), Section 19 (reporting), Section 20 (referral fee)</td></tr>\n  <tr><td>Current-State Assessment</td><td>Gap & Risk Register, Partner Segmentation Framework, Partner Journey Map</td></tr>\n  <tr><td>Gap & Risk Register</td><td>Partnership SOP v1.0's problem-related sections, and the order of work in the Master Execution Sequence</td></tr>\n  <tr><td><a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Data Dictionary</a> (our shared list of what every piece of partner data means)</td><td>The Interim Operating System, once drafted - it should use these exact field definitions, not invent its own</td></tr>\n  <tr><td>Partner Segmentation Framework (kept separate - how we group partners)</td><td>Partnership SOP v1.0 Section 11 (summarize, don't copy in full), Section 17 (Dormant), Migration Wave Plan</td></tr>\n  <tr><td>Partner Journey Map (kept separate - the step-by-step partner experience)</td><td>Partnership SOP v1.0 Section 14 (summarize, don't copy in full), Communication Template Library</td></tr>\n  <tr><td>Communication Template Library (our ready-made messages)</td><td>Partnership SOP v1.0 Section 16 (the link, not the content), and Section 17 (Reactivation)</td></tr>\n  <tr><td>Partnership SOP v1.0 Section 20 (deal-closure referral fee) or Section 21 (dormancy)</td><td>The Business Requirements Document's Sections 8 and 9 - these were added together and need to move together</td></tr>\n  <tr><td>Any section of Partnership SOP v1.0 - any change, not just when it becomes confirmed</td><td>The Business Requirements Document now exists and cites specific SOP sections directly - check it didn't just go stale</td></tr>\n  <tr><td>Business Requirements Document</td><td>Low-Level System Specification</td></tr>\n  <tr><td>Alpha to Beta Graduation Criteria (the targets to hit before opening up more widely)</td><td>Migration Wave Plan, and Partnership SOP v1.0 Section 18</td></tr>\n  <tr><td>Master Execution Sequence, if we reorder it</td><td>This table - update it if the reorder changes which document depends on which</td></tr>\n</table>\n\n<h2>What I'll do without being asked</h2>\n<ul>\n  <li>Every time we update something in the left column of the table above, I will look at what's in the right column and either fix it or tell you clearly that nothing needed to change - not just move on silently.</li>\n  <li>Every bigger change gets a note in Version History, so there's always a record even without proper version control software.</li>\n  <li>If we find a connection between documents that isn't in this table yet, I'll add it, so the table keeps matching reality.</li>\n</ul>\n\n<h2>What you and your Associate should do</h2>\n<ul>\n  <li>If either of you changes a document without asking me first, tell me about it next time we talk - this table is only useful if it reflects what actually happened.</li>\n  <li>If you see an amber or grey dot on a document, treat it as a reminder that something else in the hub might be waiting on it - not just \"still pending.\"</li>\n</ul>\n"}, {"id": "roadmap", "content_file": "roadmap.html", "cat": "Strategic Planning", "status": "done", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Project Roadmap", "desc": "The full project plan - each phase, who owns it, and rough timing", "html": "<p class=\"callout\">This is the big-picture plan - the phases of work, who's responsible for each, and roughly how long each should take.</p>\n\n<h2>The plan at a glance</h2>\n<table class=\"dtable\"><tr><th>Phase</th><th>What it covers</th><th>Who owns it</th><th>Rough timing</th></tr>\n<tr><td>0</td><td>Getting the basics settled with Sarthy before we design anything</td><td>Lead (needs Sarthy's input)</td><td>Weeks 1-2</td></tr>\n<tr><td>1</td><td>Writing down how things work and should work</td><td>Lead, Associate helps</td><td>Weeks 1-5</td></tr>\n<tr><td>2</td><td>Redesigning how partners are onboarded and kept engaged</td><td>Lead</td><td>Weeks 4-7</td></tr>\n<tr><td>3</td><td>Building a simple working system to use meanwhile</td><td>Lead + Associate</td><td>Weeks 3-6</td></tr>\n<tr><td>4</td><td>Writing the requirements document for the marketplace app</td><td>Lead</td><td>Weeks 6-10</td></tr>\n<tr><td>5</td><td>Moving partners onto the platform, group by group</td><td>Lead + Associate</td><td>From week 8 onward</td></tr>\n<tr><td>6</td><td>The regular rhythm of running this program week to week</td><td>Lead + Associate</td><td>From week 1, ongoing</td></tr>\n</table>\n\n<h2>What has to happen before what</h2>\n<ul>\n  <li>We can't finish the requirements document (Phase 4) until Sarthy answers our open questions (Phase 0) - otherwise we'd be writing requirements around rules that might still change.</li>\n  <li>Moving the later groups of partners onto the platform (Phase 5) depends on us actually finishing the new sign-up and reconnection process (Phase 2) - not just writing it down, but having it ready to use.</li>\n  <li>The simple working system (Phase 3) is what lets two people actually run Phases 1, 2, and 5 without drowning in manual work.</li>\n  <li>Phase 6 - the weekly rhythm - should start from day one, even before Phase 0 wraps up.</li>\n</ul>\n\n<h2>How we'll report progress to Sarthy</h2>\n<p>We're using Sarthy's own scorecard, so our updates match how they already think about this work:</p>\n<table class=\"dtable\"><tr><th>What Sarthy measures</th><th>How much it counts</th></tr>\n<tr><td>Finding and signing up partners</td><td>20%</td></tr>\n<tr><td>Talking to and supporting startups</td><td>40%</td></tr>\n<tr><td>Matching the right partner to the right startup</td><td>30%</td></tr>\n<tr><td>Research and reporting</td><td>10%</td></tr>\n</table>\n"}, {"id": "sequence", "content_file": "sequence.html", "cat": "Strategic Planning", "status": "done", "version": "1.1", "updated": "Revised after Partnership SOP v1.0 restructure", "type": "Internal", "title": "Master Execution Sequence", "desc": "The to-do list in order - what gets done next, and why", "html": "<p class=\"callout\">This is our running to-do list, in order. Each item's output is used by the next item, so we mostly work down this list in order rather than jumping around.</p>\n<table class=\"dtable\">\n<tr><th>#</th><th>What we're building</th><th>Where it stands</th></tr>\n<tr><td>1</td><td><a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Questions to resolve with Sarthy</a></td><td>Done</td></tr>\n<tr><td>1b</td><td><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">First draft of Partnership SOP v1.0</a></td><td>Done</td></tr>\n<tr><td>1c</td><td><a href=\"#\" onclick=\"showDoc('deliverables');return false;\" class=\"xlink\">List of every document in the project</a></td><td>Done</td></tr>\n<tr><td>2</td><td>Getting access to Sarthy's systems (once done, also unlocks building a real list of what the app can and can't do today - see <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 Discussion Doc</a>)</td><td>Waiting on you</td></tr>\n<tr><td>3</td><td><a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">Guide for interviewing the first live partners</a></td><td>Done</td></tr>\n<tr><td>4</td><td><a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Write-up of how things work today</a></td><td>Done</td></tr>\n<tr><td>5</td><td><a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">List of problems found, with fixes</a></td><td>Done</td></tr>\n<tr><td>6</td><td><a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">Shared definition of what each piece of partner data means</a></td><td>Done</td></tr>\n<tr><td>7</td><td>Simple working system for day-to-day use</td><td>Next</td></tr>\n<tr><td>8</td><td><a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Way of grouping partners by priority</a></td><td>Done</td></tr>\n<tr><td>9</td><td><a href=\"#\" onclick=\"showDoc('journey-map');return false;\" class=\"xlink\">Map of the partner's journey, start to finish</a></td><td>Done</td></tr>\n<tr><td>10</td><td><a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Ready-made messages for calls and follow-ups</a></td><td>Done</td></tr>\n<tr><td>11</td><td>Write the remaining <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> sections directly - joining, staying in touch, winning back inactive partners, and handling disagreements</td><td>Queued</td></tr>\n<tr><td>12</td><td><a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">Requirements document for the marketplace app</a> - first draft done, ahead of its normal turn since the Lead asked for it directly</td><td>Drafted</td></tr>\n<tr><td>13</td><td><a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Targets to hit before opening the app more widely</a></td><td>Done</td></tr>\n<tr><td>14</td><td>Plan for which partners move onto the app first</td><td>Queued</td></tr>\n<tr><td>15</td><td>Detailed technical spec for developers</td><td>Queued</td></tr>\n<tr><td>16</td><td>Simple dashboard tracking progress</td><td>Queued</td></tr>\n</table>\n<h2>Why this order</h2>\n<p>The first several items (1-7) are about learning what's true today, instead of guessing. Items 8-11 turn what we learned into one clear rulebook - <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> - written directly into its own sections rather than as separate documents that get summarized afterward. The last items (12-16) put that rulebook into action and measure whether it's working.</p>\n<p class=\"callout\">Item 11 used to be four separate items (a new onboarding process, an engagement plan, a reactivation plan, and an escalation SOP). They've been merged into one item because all four were always meant to become sections inside Partnership SOP v1.0 - keeping them as separate to-do items was creating duplicate work.</p>\n"}, {"id": "playbook", "content_file": "playbook.html", "cat": "Partnership SOP v1.0", "status": "draft", "version": "3.1", "updated": "Sections 11, 14, 16, 17, 18 now link to real documents instead of pending placeholders", "type": "Both", "title": "Partnership SOP v1.0", "desc": "The complete rulebook - fully absorbs Sarthy's original Playbook 2.0, nothing lives outside this anymore", "html": "<p class=\"callout\">This is the complete rulebook for how the partner program runs - the operational heart of Strategic Partners Playbook 3.0. It fully absorbs Sarthy's original Playbook 2.0: nothing from that document lives anywhere else anymore, and it should be treated as retired. Where a number or rule below is still genuinely unconfirmed, that's flagged clearly and linked to the open question - the rest is Sarthy's own design, carried forward in full.</p>\n\n<h2>1. What this document is for <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>One place that explains how partners join, how money and credits work, how we keep them engaged, how we group them, and what to do when something goes wrong. Building the marketplace app itself is not covered here - that's the developers' job, not ours.</p>\n\n<h2>2. Where this program came from, and why it changed <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>Sarthy spent over three years working closely with early-stage and growth-stage startups, and kept seeing the same problem: a startup's biggest obstacle usually isn't ambition, it's not knowing the right professional help at the right time. The partner program exists to close that gap, connecting startups with vetted providers across Marketing, Finance, Legal, Technology, and Strategy.</p>\n<p>The first version of the program (2023-24) worked, but it only flowed in one direction: Sarthy referred startups to partners, and partners never referred business to each other. A marketing partner working closely with a startup is often the first to know that startup also needs a lawyer or a CFO - but the first version of the program had no way to reward that kind of cross-referral, so it never happened in practice. The redesign - what Sarthy called Playbook 2.0 - turns the partner network from a one-way list of vendors into a system where any partner can refer to, and receive from, any other partner, with Sarthy tracking it all and keeping things fair.</p>\n<table class=\"dtable\">\n<tr><th>What changed</th><th>First version</th><th>Current design</th></tr>\n<tr><td>Structure</td><td>Sarthy to partner only</td><td>Any partner to any partner, with Sarthy tracking everything</td></tr>\n<tr><td>Cost to join</td><td>Free</td><td>\u20b9999 (India) or $49 (international)</td></tr>\n<tr><td>Credit wallet</td><td>None</td><td>Starts with 999 credits, earned and spent through referrals</td></tr>\n<tr><td>How partners earn</td><td>Only from their own client work</td><td>Credits for every referral that converts, plus their own client work</td></tr>\n<tr><td>Cost of receiving a lead</td><td>None</td><td>999 credits deducted per lead received</td></tr>\n<tr><td>Accountability</td><td>Signed agreement only</td><td>Signed agreement plus a tracked credit wallet and conversion record</td></tr>\n</table>\n<p>The idea in one line: in the old model, a partner was a vendor. In the current design, a partner is a node in a shared network where everyone has something to gain and something to manage.</p>\n\n<h2>3. Who does what <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p><strong>Lead</strong> handles the overall plan, writing things down, reporting to Sarthy, writing the technical requirements, and deciding how to handle problems. <strong>Associate</strong> makes calls, enters data, and does the first round of follow-up with partners. <strong>Sarthy</strong> decides the money rules, the app's roadmap, and how success is measured. Sarthy also stays involved as the programme's referee - every lead exchange runs through Sarthy's tracking, not directly between partners.</p>\n\n<h2>4. What partners actually get out of joining <span class=\"status-pill badge-done\">confirmed</span></h2>\n<ul>\n<li>Access to Sarthy's own base of early-stage and growth-stage startup clients</li>\n<li>The right to send qualified leads to any other partner and earn credits when those leads convert</li>\n<li>Incoming leads from other partners - a second source of new business beyond their own outreach</li>\n<li>Sarthy's oversight - leads are tracked, conversions are confirmed, and credits are managed transparently, so partners aren't relying on informal trust alone</li>\n<li>A chance to be featured as Partner of the Month, a recognition program running since April 2024 that showcases partner work to Sarthy's whole startup network</li>\n<li>A listing in Sarthy's partner directory, with their case study and company profile visible to startups</li>\n</ul>\n<p>The credit a partner earns isn't just a point score - it can be used to receive leads from other partners, or withdrawn once it's above the minimum reserve (see Section 10). A partner who consistently sends leads that convert builds up real value; a partner who only ever receives leads without referring any back will draw their balance down over time. The system is built to reward two-way participation, not one-sided use.</p>\n\n<h2>5. Joining the program - fees and what they cover <span class=\"status-pill badge-draft\">drafted, one question still open</span></h2>\n<table class=\"dtable\">\n<tr><th>Programme</th><th>Fee</th><th>Credits received</th></tr>\n<tr><td>India</td><td>\u20b9999 + applicable GST</td><td>999 credits</td></tr>\n<tr><td>International</td><td>$49</td><td>999 credits</td></tr>\n</table>\n<p>Paying the fee activates a partner's account and gives them their starting 999 credits immediately. The fee does not guarantee any leads and does not obligate Sarthy to send a partner a specific number of referrals - it buys entry and a starting balance, which the partner then grows through actually participating.</p>\n<p><em>Working assumption, pending Sarthy sign-off:</em> both programmes grant 999 credits regardless of the fee difference. The credit count itself never changes or reprices - 999 stays 999, no matter what happens to the INR/USD exchange rate in the meantime. GST applies on top of the \u20b9999 India fee. A partner's programme choice is locked permanently at sign-up - no switching between India and international later. Currency only enters the picture once, at the moment a partner actually withdraws to real money (see Section 10) - the credit itself stays a neutral unit the whole time in between, including when it moves between an India-programme partner and an international one.</p>\n<p><strong>Joining steps:</strong> apply through LinkedIn, a mailer, the WhatsApp community, or a direct approach \u2192 Sarthy reviews the company profile and holds a discovery call with the founder or key contact \u2192 Sarthy evaluates fit (service relevance, affordability for early and growth-stage startups, how varied their client base is, professional standing, and whether they lean toward being a Giver or a Taker - see Section 11) \u2192 if both sides agree, the referral agreement is signed and uploaded to Sarthy's partner drive \u2192 the partner submits a case study and company profile \u2192 the partner pays the programme fee \u2192 their credit wallet activates with 999 opening credits \u2192 they're officially listed in the ecosystem.</p>\n\n<h2>6. The credit wallet <span class=\"status-pill badge-draft\">drafted, one calculation basis still open</span></h2>\n<p>Every partner has a credit wallet that Sarthy maintains. It records every credit added or taken away as the partner participates.</p>\n<table class=\"dtable\">\n<tr><th>Event</th><th>Effect on wallet</th></tr>\n<tr><td>Partner pays the programme fee and joins</td><td>+999 credits</td></tr>\n<tr><td>A lead this partner referred converts with the receiving partner</td><td>+999 credits, minus a 9% fee taken at the point of transfer - about 909 credits actually land in the wallet (India programme; see the open question below for how this applies internationally)</td></tr>\n<tr><td>This partner receives a lead from another partner</td><td>-999 credits</td></tr>\n<tr><td>Quarterly withdrawal of the cash-equivalent value, above the minimum reserve</td><td>See Section 10</td></tr>\n</table>\n<p>The credit amount (999) is the same for every transaction, no matter the size of the deal or which service category it's in - this keeps the system simple and fair.</p>\n<p><em>Working assumption, pending Sarthy sign-off:</em> credits a partner paid real money for don't expire - they roll over indefinitely. Credits Sarthy hands out as a goodwill gesture or coupon expire 1 month (30 days) from the date they're received. There's no cap on how large a partner's balance can grow, consistent with letting paid credits roll over freely - worth revisiting only if hoarding becomes a real pattern (see Section 13's guardrails).</p>\n\n<h2>7. How a lead moves from one partner to another <span class=\"status-pill badge-draft\">drafted, one mechanism still needs design</span></h2>\n<ol>\n<li>A partner identifies a startup or contact that would benefit from another partner's services, and submits it to Sarthy.</li>\n<li>Sarthy checks the lead is genuine, fits the receiving partner's actual services, and isn't a duplicate - <em>working assumption:</em> Sarthy validates and passes a lead on within 5 working days, maximum.</li>\n<li>Sarthy introduces the lead to the receiving partner, along with context from whoever referred it.</li>\n<li>The receiving partner acknowledges the lead - at this point, 999 credits are deducted from their wallet, whether or not the lead eventually converts.</li>\n<li>The receiving partner works the lead.</li>\n<li>If it converts into a paid engagement, Sarthy confirms this and credits the referring partner - 999 credits, minus the 9% fee taken at the point of transfer (see Section 6). If it doesn't convert, the referring partner earns nothing - but the receiving partner's deduction stands either way.</li>\n</ol>\n<p>All referrals have to go through Sarthy - two partners privately agreeing to swap leads outside the system doesn't count and won't be honoured at settlement. A valid lead is a real prospect with an actual near-term need, a real point of contact, and one that hasn't already been referred through the system or already engaged with that receiving partner before.</p>\n<p><em>Working assumption, pending Sarthy sign-off:</em></p>\n<ul>\n<li><strong>Cancelling a submission:</strong> yes, a referring partner can cancel a lead before it reaches the receiving partner.</li>\n<li><strong>Duplicate leads:</strong> when a partner tries to submit a lead that's already in the system, the platform should catch it at the point of upload and flag it as invalid before it goes anywhere - not after. Alongside this, showing partners a list of existing leads would add transparency and cut down on accidental duplicates. Both of these are platform behaviors, not just policy - they need to be built, so they're carried forward into the eventual requirements document, not just written here as a rule.</li>\n<li><strong>Repeated declines:</strong> four or more leads declined in a row gets flagged to the admin, who steps in manually to understand what's actually going on and resolve it - not an automatic penalty, a prompt for a human to check.</li>\n<li><strong>Re-referring an unconverted lead:</strong> no fixed limit on how many times a lead can be re-referred - but never to two partners offering the <em>same type</em> of service at the same time, since that creates confusion and competing outreach to the same prospect. Referring the same lead to different types of service providers at once is fine, since the lead may genuinely need more than one kind of help.</li>\n<li><strong>Acknowledgment and rejection window:</strong> a receiving partner has 1 week to acknowledge a new lead. If they explicitly reject it within that week, the 999-credit deduction reverses in full. If the week passes with no resolution either way - no conversion, no explicit rejection - the deduction is final and won't be refunded.</li>\n<li><strong>At a stall past the 1-week window - proposed mechanism, open for discussion, not decided:</strong> the admin should still have discretion to manually reverse a deduction in genuinely disputed cases, even past the 1-week cutoff, based on the merit of the case. To make that judgment fairly, admin needs real evidence, not just the receiving partner's word. One workable approach: prompt the <em>startup</em> directly - a short check-in asking whether the partner actually reached out and engaged with them. That confirmation (or denial) becomes real evidence for the admin's decision. This still leaves open exactly how mandatory that startup confirmation should be, and what happens if the startup itself doesn't respond either. Flagged for further discussion, not resolved.</li>\n<li><strong>Who picks the receiving partner:</strong> this stays fully in the referring partner's hands, not Sarthy's - see Section 15 for how Sarthy's team supports and encourages this activity.</li>\n</ul>\n<div class=\"pending-box\"><strong>Refined, still not fully decided:</strong> the backend should include some form of matchmaking that acts as a <em>catalyst</em> - surfacing and promoting good potential matches to partners - rather than a separate anonymous pool that bypasses partner choice entirely. Partner selection stays the primary mechanism; the system's job is to actively nudge activity, similar to how Sarthy's own team is expected to touch base regularly and encourage sending and receiving leads (see above). This still needs real design work on what the backend actually surfaces and how, and isn't something to build into the current Alpha yet.</div>\n\n<h2>8. The six credit rules <span class=\"status-pill badge-draft\">drafted, all six rules specified</span></h2>\n<ol>\n<li><strong>Opening balance:</strong> every partner starts with 999 credits on payment. This isn't refundable.</li>\n<li><strong>One credit per lead:</strong> conversion is confirmed by Sarthy based on input from both partners - proof like a signed agreement, an invoice, or another clear confirmation that paid work has actually started.</li>\n<li><strong>No double credits:</strong> one lead can only generate one deduction and one credit, ever - a deal expanding later doesn't create extra credits unless it's genuinely a new, separate referral.</li>\n<li><strong>Credits can't be transferred between partners</strong> - they're only earned through real referrals and only cashed out at settlement. No partner can gift, sell, or hand off their credits to someone else.</li>\n<li><strong>Fixed value:</strong> 999 credits per transaction, always, regardless of category or deal size.</li>\n<li><strong>Negative balances - corrected:</strong> <em>working assumption, pending Sarthy sign-off</em> - a partner's balance can run negative down to -2,997 credits. Beyond that, their account freezes - they can't receive further leads until they've topped up back to +999 credits (their original entry balance, not just back to zero). A top-up costs 4 times the original entry fee (\u20b93,996 or $196) and adds 3,996 credits - which lands a partner frozen at the exact floor precisely at +999. The numbers now actually work in one payment, unlike the earlier version of this rule.</li>\n</ol>\n\n<h2>9. How conversion gets confirmed, and what happens if someone disagrees <span class=\"status-pill badge-done\">confirmed for now</span></h2>\n<p>Sarthy has the final say on whether a lead converted. <em>Working assumption, pending Sarthy sign-off:</em> the same conversion standard applies across every service category for now, rather than defining separate rules per category - first payment plus a digitally signed agreement completed through the platform. This means the platform needs real digital-signature capability, not just an upload of a scanned PDF - worth carrying into the eventual requirements document.</p>\n<p>If a partner disagrees with Sarthy's conversion decision, they can raise it in writing within 14 days. <em>Working assumption, pending Sarthy sign-off:</em> the admin responds within 24 hours, engaging both parties directly to understand the concern - this can happen offline, over email, it doesn't need to be a formal in-platform process. Sarthy reviews the evidence and gives a final answer - Sarthy's decision on conversion disputes is final, not open to further appeal.</p>\n\n<h2>10. Withdrawing credits and staying a member <span class=\"status-pill badge-draft\">drafted, exchange rate source still open</span></h2>\n<p><em>Working assumption, pending Sarthy sign-off:</em> there is no fixed programme cycle. Membership is ongoing - a partner joins once and stays a member indefinitely, with no end date forcing a settlement. This is a real change from Sarthy's original Playbook 2.0 design, which was built around cycles ending in a settlement event; that cycle concept is intentionally dropped here in favor of continuous membership.</p>\n<ul>\n<li><strong>Minimum reserve:</strong> a partner must always keep at least their original entry amount (999 credits, whichever programme) sitting in their wallet.</li>\n<li><strong>Withdrawing:</strong> anything above that reserve can be withdrawn quarterly. Credits convert to real currency at whatever the live exchange rate is on the day of withdrawal, not the rate from whenever the partner originally joined - so the same credit balance can be worth slightly more or less in cash depending on when someone chooses to cash out. <strong>Still open:</strong> which specific exchange rate source we use as the official reference (a bank's published rate, a live market rate, something Sarthy sets internally) - a small detail, but one that needs a specific answer so there's no ambiguity at the moment of payout.</li>\n<li><strong>Where the 9% fee applies - resolved:</strong> it's charged once, at the moment credit transfers to a referring partner on conversion (see Section 6) - not a second time when they later withdraw their accumulated balance to real money. It's already taken at the source, so there's nothing left to deduct at withdrawal itself.</li>\n<li><strong>Pausing or stepping away:</strong> since there's no cycle to leave mid-way through, there's no forfeiture and no prorated payout to work out. A partner who goes quiet simply has their account and balance sit as they are - they can pick the relationship back up any time.</li>\n</ul>\n<p>No partner should be told their credit balance is guaranteed cash before an actual withdrawal is processed.</p>\n\n<h2>11. How we group partners - Giver vs. Taker <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>This framing goes back to the very first version of the program: some partners actively contribute to the ecosystem (Givers), others mostly draw from it without reciprocating (Takers). In the current design, this shows up directly in the credit wallet - a partner whose balance keeps growing is behaving like a Giver; a partner whose balance keeps shrinking is behaving like a Taker. Sarthy uses this trend as one input when reviewing partners periodically, and may deprioritize or exit partners who consistently show Taker behavior.</p>\n<p>The same judgment gets applied earlier too, during onboarding: does the partner have a healthy, varied client base, are they established in their field, and do they seem collaborative rather than purely extractive. This isn't a hard checklist - it's a conversation-based read, made during the discovery call.</p>\n<p>See the full <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a> for the priority tiers this feeds into, and how it drives who the Associate reaches out to first.</p>\n\n<h2>12. What we expect from partners <span class=\"status-pill badge-done\">confirmed</span></h2>\n<ul>\n<li>Only submit real, qualified leads - not padding or guesses</li>\n<li>Actually pursue leads they accept, in good faith, once the credit deduction has happened</li>\n<li>Behave professionally with leads, other partners, and the Sarthy team</li>\n<li>Report conversions honestly - not overstating or hiding what's actually happened</li>\n<li>Keep their profile, case study, and service details current in the partner directory</li>\n<li>Respond to Sarthy's requests for updates or documentation in reasonable time</li>\n</ul>\n<p>All formal lead exchanges go through Sarthy - partners privately agreeing on referral arrangements or promising each other credits outside the system isn't recognized and won't be honoured at settlement.</p>\n\n<h2>13. Guardrails against abuse <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>A system built on financial credits needs clear rules against manipulation. These are not allowed, under any circumstance:</p>\n<ul>\n<li>Submitting fake or made-up leads to earn credits</li>\n<li>Submitting leads for contacts who have no real interest in or need for the receiving partner's services</li>\n<li>Two partners coordinating to exchange fake leads with each other just to earn credits</li>\n<li>Claiming a conversion happened when no paid work has actually started</li>\n<li>Accepting a lead with no intention of following up, purely to deny the referring partner their credit</li>\n<li>Submitting a lead for a startup that's already a client of the receiving partner, or already referred to them elsewhere</li>\n</ul>\n<p>Sarthy also periodically reviews referral patterns across the whole network - a partner with consistently low conversion rates, or one who seems to be coordinating suspiciously with just one or two other partners, gets flagged for review. This isn't automatically punitive, it's a health check on the system. In cases of serious fraud that cause real financial harm, Sarthy reserves the right to escalate to legal action.</p>\n\n<h2>14. The partner's day-to-day experience <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Full detail lives in the <a href=\"#\" onclick=\"showDoc('journey-map');return false;\" class=\"xlink\">Partner Journey Map</a>. In brief: awareness \u2192 evaluation and discovery call \u2192 agreement and fee payment \u2192 first lead activity (the make-or-break stage, where most partners currently drop off) \u2192 active participation \u2192 a steady Giver, Balanced, or Taker pattern (see Section 11) \u2192 either continued activity or a slide toward the 3-month dormancy line (Section 21).</p>\n\n<h2>15. Staying engaged after joining <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p><em>Working assumption, pending Sarthy sign-off:</em> partner selection stays fully partner-controlled - Sarthy doesn't assign leads, partners choose who to send them to (see Section 7). Sarthy's role in engagement is relationship management: the team is expected to touch base with each partner regularly, actively encouraging them to both send and request leads, rather than leaving activity purely to partner initiative. See the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> for the actual monthly check-in message, and the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a> for who gets prioritized for outreach.</p>\n\n<h2>16. Ready-made messages <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>Lives as its own toolkit - the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a> - since it's a set of copy-paste scripts, not narrative rules.</p>\n\n<h2>17. Winning back inactive partners <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>The trigger is defined in Section 21 - 3 months without a shared lead. The actual process: the <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Segmentation Framework</a>'s Tier 3 (At-Risk) partners get proactive outreach before they ever reach Tier 4 (Dormant); once dormant, the <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">Communication Template Library</a>'s reactivation message goes out. This isn't a one-time campaign - it's a standing part of the Associate's regular call queue.</p>\n\n<h2>18. Moving from early testing to full rollout <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Sarthy has already set a real target for this: <strong>at least 10 active partners within 2 weeks of the app being fully up and running</strong> (not the current early-testing state - once it's genuinely live). Today's baseline: a few real users exist, but usage among them is infrequent, not active - so the gap isn't just \"get to 10 partners,\" it's also \"turn today's occasional users into consistently active ones.\" See the full <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">Alpha to Beta Graduation Criteria</a> for what \"active\" actually needs to mean beyond just a headcount. The detailed order in which new partner groups join still needs to be worked out - see the separate Migration Wave Plan, once drafted.</p>\n\n<h2>19. How we measure success <span class=\"status-pill badge-draft\">drafted, proposal awaiting Sarthy confirmation</span></h2>\n<p>We're using Sarthy's own scorecard: finding and signing up partners (20%), talking to and supporting startups (40%), matching the right partner to the right startup (30%), and research and reporting (10%). The last two categories weren't clearly defined in Sarthy's own records, so here's a proposed definition for each - grounded in what this SOP now actually measures, not guesswork. This needs Sarthy's confirmation before it's treated as final, the same as everything else marked as a working assumption in this document.</p>\n<p><strong>Match-Making (30%) - proposed measures:</strong></p>\n<ul>\n<li>How many submitted leads get matched to at least one relevant partner each month</li>\n<li>Average time from a lead being submitted to it actually reaching a partner - measured against the 5-working-day target in Section 7</li>\n<li>What share of submitted leads get validated and matched, versus rejected or left stalled</li>\n<li>Whether leads are reaching a healthy spread of partners over time, not just the same one or two every time</li>\n</ul>\n<p><strong>Research & Reports (10%) - proposed measures:</strong></p>\n<ul>\n<li>A recurring report - monthly is a reasonable starting cadence - summarizing partner and lead activity trends</li>\n<li>Specific, written recommendations coming out of that report, and whether they actually get acted on</li>\n<li>Partner feedback gathered on a regular basis (via the Alpha Partner Interview Guide process) and rolled into the same reporting</li>\n</ul>\n\n<h2>20. After the deal closes - the referral fee <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>Everything in Sections 5-10 covers the 999-point credit exchanged when a lead is <em>shared</em>. This section covers a separate, second reward that only kicks in once a shared lead actually turns into a real, signed deal - a genuinely different track, running in parallel, not a replacement for the credit system.</p>\n<ol>\n<li>The receiving partner closes the lead - they sign an agreement directly with the startup.</li>\n<li>The value and duration of that agreement gets shared with Sarthy and with the referring partner who originally sent the lead.</li>\n<li>The referring partner is entitled to <strong>10% of the total deal value</strong>.</li>\n<li>This flows through Sarthy, not directly between the two partners. Sarthy takes a 9% cut <em>of that 10%</em> as its facilitation fee - the same 9% principle used everywhere else in this document, just applied to a different base. The referring partner nets the remaining 91% of the 10% - which works out to 9.1% of the total deal value actually landing with them, not the full 10%.</li>\n<li>This amount accumulates in the referring partner's account with Sarthy over the year and gets paid out once annually, at the end of the financial year (March 31st).</li>\n<li>This entitlement only lasts <strong>1 year from the lead's first engagement</strong> with the receiving partner. After that year, the receiving partner and the startup are free to continue their relationship without any ongoing obligation back to the original referring partner.</li>\n</ol>\n<p><em>Working assumption, pending Sarthy sign-off:</em> this resolves one of the oldest open questions in this whole document - whether the 9% facilitation fee also applies to this older-style referral-fee flow, separate from lead-gen credits. It does, at the same 9% rate, just calculated on the 10% entitlement rather than on a flat 999-credit transfer.</p>\n\n<h2>21. Staying an active partner <span class=\"status-pill badge-draft\">drafted</span></h2>\n<p>This is the actual content for what was previously an empty section on winning back inactive partners - it turns out Sarthy's own design already has a real rule here, not just a gap to fill later.</p>\n<p><em>Working assumption, pending Sarthy sign-off:</em> a partner who doesn't share any lead for 3 consecutive months is marked dormant. A dormant partner is removed from the public portal listing and stops receiving leads from others, until they resume actively sharing again. The underlying principle: no partner gets to be purely a taker, permanently receiving without ever contributing - this connects directly to the Giver/Taker framing in Section 11. There's an explicit intent to gamify this further as the platform matures (leaderboards, streaks, recognition for consistent Givers) - not designed yet, flagged as a real direction rather than a vague aspiration.</p>\n\n<h2>22. Frequently asked questions <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p><strong>Do I lose my starting 999 credits if none of my referrals convert?</strong> No - the opening credits aren't tied to referral performance. But if you receive leads, each one still deducts 999 credits from your balance regardless.</p>\n<p><strong>What if I refer a lead and it doesn't convert?</strong> You don't earn credits for it. The receiving partner's deduction still stands either way - they accepted the lead.</p>\n<p><strong>Can I decline a lead I don't think is relevant?</strong> Yes - before the deduction happens, you'll see the context for the lead. If it's outside your service area, you can decline and no credit gets deducted.</p>\n<p><strong>Can I refer more than one lead to the same partner?</strong> Yes - each referral is its own separate transaction with its own credit or deduction.</p>\n<p><strong>What if a lead converts months later?</strong> The credit is awarded whenever conversion is actually confirmed, regardless of how much time has passed.</p>\n\n<h2>23. Closing note <span class=\"status-pill badge-done\">confirmed</span></h2>\n<p>This program is built on the belief that the strongest partner networks run on mutual accountability, not just shared access. Every partner who joins becomes a real stakeholder in a shared system - not a passive vendor waiting for the phone to ring. The credit model is deliberately simple and the rules are deliberately transparent, so that a partner's balance is an honest reflection of what they've actually put into the ecosystem. This program works when every partner is both a generous contributor and a serious professional - that's the standard we're building toward.</p>\n"}, {"id": "phase0", "content_file": "phase0.html", "cat": "Decision Records", "status": "done", "version": "1.4", "updated": "Resolved the 9%-vs-10% referral fee question - open since the very first draft", "type": "Sarthy-facing", "title": "Phase 0 Discussion Doc", "desc": "Questions to go through with Sarthy before we start building anything", "html": "<p class=\"callout\">These are the open questions we still need Sarthy to officially answer. Several now have a working assumption recorded in Partnership SOP v1.0 (marked below) so we could keep moving - bring this list into the actual Sarthy meeting to get their real sign-off, and update the SOP if their answer differs from ours.</p>\n\n<h2>How credits and money work</h2>\n<ul>\n  <li><strong>Still fully open:</strong> how do credits convert between the India program (\u20b9999) and the international program ($49) over time, as exchange rates move? If a partner in one program refers someone in the other, what's the exchange? <em>Working assumption recorded:</em> for now, both programs simply grant 999 credits with no forced conversion - see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 5</a>.</li>\n  <li><strong>Working assumption recorded:</strong> paid credits roll over indefinitely; goodwill/coupon credits expire (exact expiry window still needs a number) - see SOP Section 6.</li>\n  <li><strong>Working assumption recorded:</strong> no cap on wallet size for now - see SOP Section 6.</li>\n  <li><strong>Working assumption recorded:</strong> a negative balance must be topped up by the partner to continue receiving leads; exact top-up pricing still open - see SOP Section 8.</li>\n  <li><strong>Working assumption recorded:</strong> yes, GST applies on top of the \u20b9999 India fee - see SOP Section 5.</li>\n  <li><strong>Still fully open:</strong> can a partner switch between the India and international program after joining, or is that locked in at sign-up?</li>\n</ul>\n\n<h2>The 9% withdrawal fee</h2>\n<ul>\n  <li><strong>Working assumption recorded:</strong> there's no fixed programme cycle at all - membership is ongoing, with a minimum reserve balance always kept in the wallet and withdrawals (above that reserve) happening quarterly - see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 10</a>. This is a real departure from Sarthy's original cycle-based design, worth specifically confirming since it changes more than just a number.</li>\n  <li><strong>Working assumption recorded:</strong> the 9% fee applies to both - it's one consistent principle, not two different rules. On lead-gen credits, it's 9% of the 999-credit transfer at conversion (see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 6</a>). On the separate deal-closure referral fee, it's 9% of the 10% entitlement, not 9% of the full deal value (see SOP Section 20). Resolved - and it took a real Sarthy design detail to close, not a guess.</li>\n  <li>Is the 9% calculated before or after other deductions?</li>\n  <li>Is it charged when a partner asks to withdraw money, or later when the withdrawal is actually processed?</li>\n</ul>\n\n<h2>How leads get passed between partners, and what happens when there's a dispute</h2>\n<ul>\n  <li><strong>Working assumption recorded:</strong> Sarthy validates and passes on a lead within 5 working days, maximum - see SOP Section 7.</li>\n  <li><strong>Working assumption recorded:</strong> yes, a referring partner can cancel a submission before it reaches the receiving partner - see SOP Section 7.</li>\n  <li><strong>Working assumption recorded:</strong> duplicate leads should be caught and flagged automatically at the point of upload - this is a platform feature to carry into the requirements document, not just a policy - see SOP Section 7.</li>\n  <li><strong>Working assumption recorded:</strong> four or more declined leads in a row gets flagged to the admin for manual review - see SOP Section 7.</li>\n  <li><strong>Working assumption recorded:</strong> no limit on re-referring an unconverted lead, except never to two partners of the same service type at once - see SOP Section 7.</li>\n  <li><strong>Still genuinely open, flagged for dedicated follow-up:</strong> the exact mechanism for tracking a lead through to conversion, including what happens if a receiving partner goes silent after accepting - see SOP Section 7.</li>\n  <li><strong>Working assumption recorded:</strong> the admin responds to disputes within 24 hours, engaging both parties directly - can be offline, over email, doesn't need a formal in-platform flow. See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 9</a>. <strong>Still open:</strong> what happens if a partner is still unsatisfied after the admin's review - is there any escalation path beyond the admin, or is the admin's word genuinely final at every stage?</li>\n</ul>\n\n<h2>What the early version of the app can and can't do right now</h2>\n<ul>\n  <li><strong>Action item, not yet done:</strong> which features actually work today, and which are only planned for later - the Lead has agreed to build this list once there's portal access (see the access checklist below), rather than guess at it now.</li>\n  <li><strong>Working assumption recorded:</strong> a few real users exist on the platform, but usage among them is infrequent, not active - see <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">Current-State Assessment</a>.</li>\n  <li><strong>Working assumption recorded:</strong> yes - Sarthy's target is at least 10 active partners within 2 weeks of the app being fully up and running - see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 18</a>.</li>\n  <li><strong>Working assumption recorded:</strong> bug reports and feature requests go to the admin, who decides where to route them from there - still fairly high-level; the actual routing destinations (engineering, product, elsewhere) aren't yet mapped out.</li>\n</ul>\n\n<h2>Making sure everyone agrees on scope and how we'll report progress</h2>\n<ul>\n  <li>Confirming: the Lead's job is running the day-to-day program - not building the app itself. Any exceptions to that?</li>\n  <li>Confirming we'll report progress using Sarthy's existing scorecard (the four categories and their weights).</li>\n  <li><strong>Proposal recorded, awaiting confirmation:</strong> a concrete definition for \"matching the right partner to a startup\" and \"research and reporting\" as measurable work - see <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 19</a>.</li>\n</ul>\n\n<h2>A bigger question, not urgent but worth raising</h2>\n<ul>\n  <li>Whether the backend matchmaking layer should be a \"catalyst\" that surfaces good matches to partners, or something more automated - partner-controlled selection stays the primary mechanism either way, per the Lead's decision - flagged in <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">SOP Section 7</a> as a real direction, not decided here.</li>\n</ul>\n\n<h2>Things we need access to</h2>\n<ul>\n  <li>A login to sarthy.vip, both as an admin and as a regular partner, so we can see how it actually works</li>\n  <li>The shared folder with all the signed partner agreements</li>\n  <li>Edit access to the partner tracking spreadsheet</li>\n  <li>Access to whatever email or WhatsApp Business account is used to reach out to partners</li>\n  <li>A list of the current early users, with contact details</li>\n</ul>\n"}, {"id": "deliverables", "content_file": "deliverables.html", "cat": "Tracking & Governance", "status": "done", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Deliverables Register", "desc": "A list of every document in this project and what each one is for", "html": "<p class=\"callout\">A simple list of every document in this project - who it's for, and where it's meant to live. Four documents that used to be listed here separately (a new onboarding process, an engagement plan, a reactivation plan, and an escalation SOP) are no longer separate - they're sections inside <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> instead.</p>\n\n<h2>Documents that will eventually go to Sarthy</h2>\n<ul>\n  <li><a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a>, once every section is finished - this is now the primary document Sarthy would review</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('phase0');return false;\" class=\"xlink\">Phase 0 questions</a>, once Sarthy has answered them</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('gap-register');return false;\" class=\"xlink\">list of problems we found</a>, with suggested fixes</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('brd');return false;\" class=\"xlink\">requirements document</a> for the marketplace app, written for their developers - first draft done, still needs gap-mapping against the real Alpha build</li>\n  <li>The detailed technical spec that follows from that requirements document</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('graduation-criteria');return false;\" class=\"xlink\">targets for moving from early testing to a full launch</a></li>\n  <li>The plan for which partner groups move onto the app, and in what order</li>\n</ul>\n\n<h2>Documents that stay just between the Lead and Associate</h2>\n<ul>\n  <li>The overall <a href=\"#\" onclick=\"showDoc('roadmap');return false;\" class=\"xlink\">project plan</a> and the <a href=\"#\" onclick=\"showDoc('sequence');return false;\" class=\"xlink\">working to-do list</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('interview-guide');return false;\" class=\"xlink\">guide for interviewing early app users</a></li>\n  <li>The <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">write-up of how things work today</a> (Sarthy could see this if they want, but it's mainly our own reference)</li>\n  <li>The shared <a href=\"#\" onclick=\"showDoc('data-dictionary');return false;\" class=\"xlink\">definition of what each piece of partner data means</a></li>\n  <li>The simple working system we use day to day</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('journey-map');return false;\" class=\"xlink\">Partner Journey Map</a> and <a href=\"#\" onclick=\"showDoc('segmentation');return false;\" class=\"xlink\">Partner Segmentation Framework</a> - kept as their own analytical documents, feeding conclusions into Partnership SOP v1.0 rather than being folded in</li>\n  <li>The <a href=\"#\" onclick=\"showDoc('comms-library');return false;\" class=\"xlink\">ready-made messages</a> for calls and follow-ups</li>\n  <li>The simple dashboard we use to track our own progress</li>\n</ul>\n"}, {"id": "interview-guide", "content_file": "interview-guide.html", "cat": "Scripts & Templates", "status": "done", "version": "1.0", "updated": "Initial version", "type": "Internal", "title": "Alpha Partner Interview Guide", "desc": "Questions to ask the first live partners, to learn what's working", "html": "<p class=\"callout\">Use this every time you talk to one of the current early app users. Keep it like a real conversation, not a form you're reading out loud - we want honest detail, not fast answers.</p>\n\n<h2>Before you call</h2>\n<ul>\n<li>If you can, check what they've actually done in the app - when they last logged in, how many leads they've sent or received.</li>\n<li>Know which program they're in (India or international) and how long they've been signed up, so you're not asking them to repeat things they've already told us.</li>\n</ul>\n\n<h2>How to open the call</h2>\n<p>\"We're improving how the partner app works, and you're one of the few people actually using it right now - so what you tell us matters more than most feedback we get. Nothing you say changes your standing with Sarthy. We just want the honest picture of what's working and what isn't.\"</p>\n\n<h2>Questions about how they use it</h2>\n<ul>\n<li>Tell me about the last time you opened the app. What were you trying to do?</li>\n<li>What do you actually use it for today - checking leads, sending referrals, checking your balance, something else?</li>\n<li>Is there anything you'd expect to be able to do in the app that you're still doing over WhatsApp, email, or a phone call instead?</li>\n</ul>\n\n<h2>Questions about what's frustrating</h2>\n<ul>\n<li>Tell me about a time something in the app confused you or didn't work how you expected.</li>\n<li>Has a lead or referral ever felt unclear or unfair in how it was handled? Walk me through what happened.</li>\n<li>If you've tried to withdraw your credits, how did that go?</li>\n<li>Is there anything you gave up trying to do in the app because it was too much hassle?</li>\n</ul>\n\n<h2>Questions about what would bring them back</h2>\n<ul>\n<li>How often do you find yourself thinking about checking the app, even if you don't always do it?</li>\n<li>What would make you want to open it every week, without needing a reminder?</li>\n<li>If we could add just one thing to the app, what would actually make a difference for you?</li>\n</ul>\n\n<h2>Wrapping up</h2>\n<ul>\n<li>Is there anyone else in your network you think should be part of this?</li>\n<li>Can we check in with you again in a few weeks as things change?</li>\n</ul>\n\n<h2>What to do with the notes afterward</h2>\n<p>Write up the raw notes under this partner's record in our working system, once that's built. Anything that sounds like a bug or a feature request should go wherever Sarthy decides bugs get tracked, once they've told us. If the same theme comes up across several calls, make sure it makes its way into the <a href=\"#\" onclick=\"showDoc('current-state');return false;\" class=\"xlink\">write-up of how things work today</a>, and from there into the list of problems and fixes - don't let a strong, repeated pattern sit unused.</p>\n"}, {"id": "current-state", "content_file": "current-state.html", "cat": "Evidence & Assessment", "status": "done", "version": "1.1", "updated": "Added activity nuance for existing Alpha users", "type": "Both", "title": "Current-State Assessment", "desc": "A summary of how things work today, based on interviews and data", "html": "<p class=\"callout\">This is the honest picture of how things work today, based on real documents and the tracking sheet - not guesses. Organized around Sarthy's own way of measuring this work, so it's easy for them to relate to.</p>\n\n<h2>1. How we got here</h2>\n<p>The partner program has gone through three real stages, and today's reality is a mix of all three at once - old agreements still technically active, a redesign that was written but never fully built, and a very early version of the actual app.</p>\n<table class=\"dtable\">\n<tr><th>Stage</th><th>How it worked</th><th>What we know for sure</th></tr>\n<tr><td>First version (Jan 2023 - Oct 2024)</td><td>Sarthy staff manually matched startups to partners by hand. Standard agreement: partners pay each other 10% of any business the referral leads to.</td><td>25+ signed agreements on file. Run by Amar Nath, who brought in roughly \u20b97 lakh in revenue during this period.</td></tr>\n<tr><td>Quiet period (late 2024 - early 2026)</td><td>No one owned this full-time after Amar Nath left. Sarthy itself says engagement and revenue both dropped. Two events were run to re-engage partners (one in July 2025, one in September 2025), but there was no ongoing routine.</td><td>Confirmed by Sarthy's own account. The tracking sheet shows several different team members handling this on and off, with no single owner.</td></tr>\n<tr><td>Early app version (mid-2026 onward)</td><td>A new self-serve model: partners send leads directly to each other, and the app automatically handles the credits and fees. Sarthy earns a 9% fee whenever someone withdraws money or credits.</td><td>Confirmed live, but Sarthy describes it as \"a skeletal Alpha version\" - fewer than 10 people are actively using it so far.</td></tr>\n</table>\n\n<h2>2. How many partners are actually engaged - the real starting point</h2>\n<p>By Sarthy's own account, the original agreement \"lacked a call to action,\" so out of everyone who signed up, fewer than <strong>15%</strong> ever became active. That's the number any new plan should be measured against - not zero, since something was already tried and mostly didn't stick.</p>\n<p>There's also a real, waiting group of roughly <strong>25 more partners</strong> - in India and abroad - already asking for access to Sarthy's startups but not yet signed up. That's a separate opportunity from re-engaging the old, inactive group.</p>\n\n<h2>3. Finding and signing up partners - today's reality</h2>\n<p>New partners come through LinkedIn, mass emails, a WhatsApp group, personal connections, and direct referrals - there's no single defined channel. Deciding whether someone's a good fit is an informal judgment call made during a conversation, not a written checklist. Once someone signs, the process today is: sign the agreement, upload a scanned copy to a shared drive, assign them a code, and add their offer to a shared spreadsheet. There's no step yet that actually gets a new partner set up and using the app.</p>\n\n<h2>4. Supporting startups - today's reality</h2>\n<p>Startups are tracked in a separate part of the same spreadsheet, using the same manual approach - mass emails, phone calls, and a short scoring exercise called the \"5-minute test\" - all logged by hand by whichever team member happens to be active. There's no system connecting a startup's actual need to which partners get suggested to them; it depends on someone remembering.</p>\n\n<h2>5. Matching partners to startups - today's reality</h2>\n<p>This is the least documented part of Sarthy's own scorecard. There's no written definition yet of what \"good matching\" actually looks like, or how to measure it. In practice, it happens because a team member happens to remember which partner suits which startup - it isn't tracked anywhere as a specific, countable action. We've flagged this as something to ask Sarthy directly, rather than guess.</p>\n\n<h2>6. Research and reporting - today's reality</h2>\n<p>Also thin. There's no regular research schedule or report format in use today. This part of Sarthy's scorecard seems to exist on paper more than in practice right now.</p>\n\n<h2>7. The biggest single gap - getting partners onto the app</h2>\n<p>The partner tracking sheet has a column literally called <strong>\"Part of Platform\"</strong> - and for almost every partner, it's blank. This is the clearest evidence we have: the app exists, but almost nobody who signed up in the first phase has ever actually been moved onto it. Confirmed directly with the Lead: even among the small number who are on the platform, real usage is infrequent, not active - so this isn't just an onboarding gap, it's also an activation gap once someone is already in. Whatever new onboarding process we build, closing both is the main job.</p>\n\n<h2>8. Money arrangements - more variety than expected</h2>\n<p>Most agreements follow the standard 10% mutual referral fee, with a 12-month tail after either side leaves, and no exclusivity. But real signed exceptions exist: one partner has a reverse 60/40 profit-sharing deal for sales Sarthy brings in directly; another gets a flat \u20b910,000 bonus per converted trial, capped at two years; another has a tiered commission - 15% or 20% depending on deal size, rather than a flat referral fee. Any new onboarding process needs to work for these exceptions too, not just the standard case.</p>\n\n<h2>9. What's already decided, and what's still open</h2>\n<p>How credits and currency convert, exactly how the 9% withdrawal fee applies, how disputes get resolved, and what it takes to move beyond the first small group of app users - none of this is confirmed yet; it's all part of the open questions for Sarthy. One rule is already clear: a partner who breaks trust gets blocked, and if a lead gets rejected, the credit is automatically reversed. Beyond that single rule, there's no written process for handling disagreements.</p>\n\n<h2>10. What this means for the work ahead</h2>\n<p>See <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0</a> for how these findings translate into actual rules and sections.</p>\n<ul>\n<li><strong>Making onboarding and engagement work better:</strong> the bar to beat is under 15% engagement from the first phase - this is a fix, not a cold start.</li>\n<li><strong>Getting everything to run through the app:</strong> the empty \"Part of Platform\" column is the single clearest, most measurable target for this whole project.</li>\n<li><strong>Getting partners into the habit of using the app:</strong> there's no existing data on this yet, since almost no one uses it. We'll need to define what \"a good habit\" even looks like here, based directly on what we learn from the early-user interviews.</li>\n</ul>\n"}, {"id": "brd", "content_file": "brd.html", "cat": "Technical Handoff", "status": "draft", "version": "1.1", "updated": "Two new sections added to match the SOP; acknowledgment window and negative-balance numbers corrected", "type": "Sarthy-facing", "title": "Business Requirements Document", "desc": "The To-Be system requirements - what the app should do, per the SOP's confirmed and drafted rules", "html": "<p class=\"callout\">This is the To-Be system - what the marketplace app should do, written from Partnership SOP v1.0's rules, not from what's already built. This is deliberately not scoped to today's Alpha build - it's the target state. Once there's real portal access, the existing app gets compared against this document for a proper gap analysis, module by module.</p>\n\n<h2>1. Purpose and how to use this</h2>\n<p>Every requirement below traces back to a specific Partnership SOP v1.0 section - if the rule changes there, this document needs to change too (see the dependency map on the <a href=\"#\" onclick=\"showDoc('guide');return false;\" class=\"xlink\">Start Here</a> page). Anything still marked open in the SOP shows up here as an open requirement too - this document doesn't invent answers the SOP doesn't have yet.</p>\n\n<h2>2. Who uses the system</h2>\n<ul>\n<li><strong>Referring partner</strong> - submits leads, tracks their own credit balance, requests withdrawals</li>\n<li><strong>Receiving partner</strong> - gets matched leads, acknowledges or declines them, updates progress toward conversion</li>\n<li><strong>Startup / lead</strong> - the actual prospect being referred; may need to confirm engagement at points where trust needs verifying (see Section 8 below)</li>\n<li><strong>Admin (Sarthy)</strong> - validates leads, confirms conversions, resolves disputes, reviews flagged accounts, manages the whole system's integrity</li>\n</ul>\n\n<h2>3. Onboarding and fees</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 5</a></p>\n<ul>\n<li>The system must support two programme types (India, International), each with its own fixed fee (\u20b9999 + GST, or $49) and identical starting credit grant (999 credits)</li>\n<li>The system must lock a partner's programme choice permanently at sign-up - no switching later</li>\n<li>The system must support digital signature capture for the referral agreement as part of onboarding</li>\n<li>The system must let admin record onboarding evaluation notes (service relevance, client diversity, professional standing, Giver/Taker read) against a partner's profile</li>\n<li>The system must activate the credit wallet with 999 opening credits immediately on fee payment confirmation</li>\n</ul>\n\n<h2>4. The credit wallet</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 6</a></p>\n<ul>\n<li>The system must maintain a running credit ledger per partner - every add and deduction, with a timestamp and a reason (fee payment, lead received, conversion earned, withdrawal, top-up)</li>\n<li>The system must distinguish between credits a partner paid for (never expire) and credits Sarthy issued as goodwill (expire 30 days from issue) - and must actually enforce that expiry automatically, not rely on manual tracking</li>\n<li>The system must not cap total balance for now, consistent with Section 6</li>\n<li>The system must display a partner's current balance clearly, including how much of it is expiring soon</li>\n</ul>\n\n<h2>5. Lead submission and referral flow</h2>\n<p>Source: <a href=\"#\" onclick=\"showDoc('playbook');return false;\" class=\"xlink\">Partnership SOP v1.0, Section 7</a></p>\n<ul>\n<li>The system must let a partner submit a lead with enough detail for admin to validate it - contact info, service need, urgency</li>\n<li>The system must check every new submission against existing leads and automatically flag likely duplicates <strong>at the point of upload</strong>, before it reaches admin - not after</li>\n<li>The system must show a partner a list of existing open leads, to reduce accidental duplicate submissions</li>\n<li>The system must let a referring partner cancel a submission any time before the receiving partner acknowledges it</li>\n<li>The system must track a lead through defined stages: Submitted \u2192 Validated (admin, within 5 working days) \u2192 Introduced \u2192 Acknowledged \u2192 In Progress \u2192 Converted / Rejected / Unresolved</li>\n<li>The system must give a receiving partner 1 week to acknowledge and either accept or explicitly reject a new lead. Explicit rejection within that week fully reverses the 999-credit deduction. No resolution by the end of the week makes the deduction final - no refund.</li>\n<li>The system must deduct 999 credits from the receiving partner's wallet the moment they acknowledge a lead - not before, not after</li>\n<li>The system must let the admin manually reverse a deduction past the 1-week window in disputed
